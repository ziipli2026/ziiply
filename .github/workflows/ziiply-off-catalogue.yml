name: Ziiply OFF Finnish catalogue dump
on:
  workflow_dispatch:
    inputs:
      max_matches:
        description: 'Maximum Finnish products with nutrition to save (0 = entire dump)'
        required: true
        default: '0'
        type: choice
        options: ['0', '1000', '5000', '20000']
concurrency:
  group: ziiply-off-catalogue-dump
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Validate dump importer
        run: python -m py_compile scripts/import-off-dump.py
      - name: Stream official OFF database export into isolated Neon staging
        env:
          DATABASE_URL: ${{ secrets.ZIIPLY_DATABASE_URL }}
          OFF_MAX_MATCHES: ${{ inputs.max_matches || '0' }}
        run: python -u scripts/import-off-dump.py
