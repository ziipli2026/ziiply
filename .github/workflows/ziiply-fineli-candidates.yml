name: Fineli EAN candidate discovery
on:
  workflow_dispatch:
    inputs:
      confirm_mass_discovery:
        description: 'Run database-wide discovery after review is approved'
        required: true
        type: boolean
        default: false
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify candidate guards
        run: node scripts/test-fineli-candidate-guards.cjs
      - name: Require explicit mass discovery approval
        if: ${{ inputs.confirm_mass_discovery != true }}
        run: |
          echo 'Mass discovery blocked pending Fineli quality review.'
          exit 1
      - name: Install dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Discover review-only matches
        env:
          DATABASE_URL: ${{ secrets.ZIIPLY_DATABASE_URL }}
        run: npx tsx scripts/ziiply-fineli-discover-candidates.mts
