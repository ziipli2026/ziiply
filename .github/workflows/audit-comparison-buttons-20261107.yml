name: Verify fixed desktop and mobile comparison buttons
on:
  push:
    branches: [audit/comparison-buttons-20261107]
    paths: ['.github/workflows/audit-comparison-buttons-20261107.yml']
permissions:
  contents: read
jobs:
  button-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c80ec8723882dd3060a4240a74317dcec59ef6e4
          path: desktop
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 2c29d141c04646b299ad6cb3c4f835e197be111f
          path: mobile
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix "$RUNNER_TEMP/ziiply-audit" --no-save --ignore-scripts --no-audit --no-fund typescript@5
      - name: Run comparison handlers with controlled store responses
        run: |
          export NODE_PATH="$RUNNER_TEMP/ziiply-audit/node_modules"
          export DESKTOP_ROOT="$GITHUB_WORKSPACE/desktop" MOBILE_ROOT="$GITHUB_WORKSPACE/mobile"
          node <<'AUDIT'
          const fs=require('node:fs');
          const {posix:path}=require('node:path');
          const vm=require('node:vm');
          const assert=require('node:assert/strict');
          const ts=require('typescript');
          const desk='5f76cc2513b39f452acc117b56865c5e7485dc68',mob='84a855619d129facfa99226859227ae3db8f0a0a';
          const corePath='src/app/components/ziiply/ziiplyCore.ts';
          const read=(ref,file)=>fs.readFileSync((ref===desk ? process.env.DESKTOP_ROOT : process.env.MOBILE_ROOT)+'/'+file,'utf8');
          const compile=s=>ts.transpileModule(s,{compilerOptions:{target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.CommonJS}}).outputText;
          function load(ref,file,modules=new Map()){
           if(modules.has(file))return modules.get(file).exports;
           const m={exports:{}};modules.set(file,m);
           Function('require','module','exports',compile(read(ref,file)))(id=>id==='posthog-js'?{}:load(ref,path.join(path.dirname(file),id+'.ts'),modules),m,m.exports);
           return m.exports;
          }
          function functions(ref,file,names,ctx){
           const source=ts.createSourceFile(file,read(ref,file),ts.ScriptTarget.Latest,true,ts.ScriptKind.TSX);
           const found=new Map();
           function visit(node){
            if(ts.isFunctionDeclaration(node)&&names.includes(node.name?.text))found.set(node.name.text,node.getText(source));
            ts.forEachChild(node,visit);
           }
           visit(source);
           for(const name of names)assert(found.has(name),name);
           vm.runInContext(compile([...found.values()].join('\n')),ctx);
          }
          const desktopNames=['desktopChangeCompareMatchMode','desktopFindCompareCandidates','desktopCheapestPack','desktopCheapestCompatible','desktopIsFilterCoffee','desktopCheapestSearchQueries','desktopCompareCategoryCompatible','desktopPickCompareCandidate','desktopReliableComparePrice','desktopHasExplicitPackage','desktopVerifiedKgPriceCents','storeKind'];
          const p=(name,price,ean,extra={})=>({id:ean,name,ean,price,...extra});
          const spaghetti=p('De Cecco Spaghetti n.12 500g',295,'8001250120129',{brandName:'De Cecco'});
          const ownS=p('Coop Spaghetti 500g',105,'6410000000001',{brandName:'Coop'});
          const ownK=p('K-Menu Spaghetti 500g',110,'6410000000002',{brandName:'K-Menu'});
          const milk=p('Valio rasvaton maito 1 l',125,'6408430100001',{brandName:'Valio'});
          const ownMilk=p('Kotimaista rasvaton maito 1 l',95,'6410000000003',{brandName:'Kotimaista'});
          const out=[];
          async function desktop(label,{item=spaghetti,visible=item,kind='K',mode='own_brands',exact=false,pool=[],manualPool=false,neutralOnly=false,cents=visible.price}={}){
           const requests=[],notices=[],replaced=[];
           const store={id:kind==='K'?'123':'292',name:kind==='K'?'K-Citymarket Hyvinkää':'Prisma Hyvinkää'};
           const cartItem={id:'row',name:item.name,ean:item.ean,quantity:1,category:item.category};
           const ctx=vm.createContext({...load(desk,corePath),...load(desk,corePath.replace("ziiplyCore","comparisonBrand")),URLSearchParams,AbortController,setTimeout,clearTimeout,
            desktopProductSearchCache:new Map(),desktopCompareResults:{shop:{store}},cartItems:[cartItem],
            flashCartNotice:s=>notices.push(s),logCompareAudit:()=>{},
            desktopSelectCompareAlternative:async(_id,_match,a)=>replaced.push(a.name),
            fetch:async url=>{
             const term=new URL(url,'https://fixture.invalid').searchParams.get('search');
             requests.push(term);
             const items=term===item.ean?(exact?[item]:[]):neutralOnly && !/^(?:(?:coop|xtra|kotimaista|rainbow|pirkka|k-menu) )?spagetti$/i.test(term)?[]:pool;
             return {ok:true,json:async()=>({items})};
            }});
           functions(desk,'src/app/desktop-preview/DesktopPreviewClient.tsx',desktopNames,ctx);
           if(manualPool)ctx.desktopFindCompareCandidates=async()=>pool;
           const found=await ctx.desktopChangeCompareMatchMode('shop',{id:'row',name:visible.name,sourceProductName:item.name,price:cents,quantity:1},mode);
           const row={label,requests,found:Array.from(found,x=>x.name),replaced,notices};out.push(row);return row;
          }
          async function mobile(label,mode,source,visible,pool,requireNeutral=false,chain='s'){
           const requests=[],replaced=[];
           const ctx=vm.createContext({...load(mob,corePath),...load(mob,corePath.replace("ziiplyCore","comparisonBrand")),activeStores:{sStoreId:'292',kStoreId:'123'},foundStores:[],
            cart:[{id:'row',name:source.name,product:source}],
            setMatchQualityMode:()=>{},replaceMatchProduct:(_chain,_match,p)=>replaced.push(p.name),
            showCartToast:s=>{throw Error(s)},console,
            fetchSProducts:async term=>{requests.push(term);return requireNeutral&&term.includes('cecco')?[]:pool;},
            fetchKProducts:async term=>{requests.push(term);return requireNeutral&&term.includes('cecco')?[]:pool;}
           });
           const file='src/app/page.tsx';
           functions(mob,file,['getAlternativeSearchTerm','getAlternativeSearchTerms','isCheapestAttributeCompatible','fetchAlternativesForMatch'],ctx);
           const sourceFile=ts.createSourceFile(file,read(mob,file),ts.ScriptTarget.Latest,true,ts.ScriptKind.TSX);
           let handler;
           function visit(n){
            if(ts.isJsxAttribute(n)&&n.name.getText(sourceFile)==='onChangeMatchMode'&&n.initializer?.expression?.getText(sourceFile).includes('fetchAlternativesForMatch'))handler=n.initializer.expression.getText(sourceFile);
            ts.forEachChild(n,visit);
           }
           visit(sourceFile);
           assert(handler,'Mobile comparison handler missing');
           vm.runInContext(compile('var handle = '+handler),ctx);
           const found=await ctx.handle(chain,{cartItemId:'row',product:visible,price:visible.price},mode);
           const row={label,requests,found:Array.from(found||[],x=>x.name),replaced};out.push(row);return row;
          }
          (async()=>{
           const pirkka=p('Pirkka spagetti 500g',135,'6410000000002',{brandName:'Pirkka',category:'Pasta'});
           const big=p('Xtra Spaghetti 1kg',75,'6410000000010',{brandName:'Xtra'});
           const penne=p('Coop Penne 500g',60,'6410000000011',{brandName:'Coop'});
           const frozen=p('Coop Spaghetti Bolognese 500g pakaste',55,'6410000000012',{brandName:'Coop'});
           const glutenFree=p('Coop Spaghetti 500g gluteeniton',85,'6410000000013',{brandName:'Coop'});
           const organic=p('Coop Spaghetti pasta luomu 500 g',90,'6410000000014',{brandName:'Coop'});
           const liguori=p('Liguori Spaghetti 500g',159,'6410000000006',{brandName:'Liguori'});
           const same=p('Pastificio Liguori Spaghetti n.3 500g',450,'6410000000007',{brandName:'Pastificio Liguori'});
           const de=p('De Cecco Spaghetti n.3 500g',450,'6410000000018',{brandName:'De Cecco'});
           const other=p('Delverde Spaghetti 500g',500,'6410000000008',{brandName:'Delverde'});
           const equal=p('Barilla Spaghetti 500g',295,'6410000000015',{brandName:'Barilla'});
           const unpriced=p('Coop Spaghetti 500g',0,'6410000000016',{brandName:'Coop'});
           const milkWrong=p('Kotimaista kevytmaito 1 l',65,'6410000000017',{brandName:'Kotimaista'});
           const milkEqual=p('Pirkka rasvaton maito 1 l',125,'6410000000019',{brandName:'Pirkka'});
           const milkOwnK=p('K-Menu rasvaton maito 1 l',95,'6410000000020',{brandName:'K-Menu'});
           const sPool=[big,penne,frozen,glutenFree,organic,unpriced,ownS];
           const kPool=[big,penne,frozen,glutenFree,unpriced,pirkka];
           const dK=await desktop('Desktop K own brand with exact EAN and Finnish neutral query',{item:{...spaghetti,category:'Dry pasta'},exact:true,neutralOnly:true,pool:kPool});
           assert(dK.requests.includes('spagetti')&&dK.requests.includes('K-Menu spagetti'));
           assert.deepEqual(dK.found,[pirkka.name]);
           assert.deepEqual((await desktop('Desktop S own brand excludes wrong size, type, attribute and price',{kind:'S',exact:true,neutralOnly:true,pool:sPool})).found,[ownS.name]);
           assert.deepEqual((await desktop('Desktop S milk exact EAN own brand',{kind:'S',item:milk,exact:true,pool:[ownMilk,milkWrong]})).found,[ownMilk.name]);
           assert.deepEqual((await desktop('Desktop visible Liguori brand',{kind:'S',visible:liguori,mode:'same_brand',pool:[same,de,other]})).found,[same.name]);
           assert.deepEqual((await desktop('Desktop De Cecco not Delverde',{mode:'same_brand',pool:[de,other]})).found,[de.name]);
           assert.deepEqual((await desktop('Desktop cheapest is cheaper',{mode:'cheapest',pool:[other,equal,pirkka]})).replaced,[pirkka.name]);
           for(const [label,pool] of [['expensive',[other]],['equal',[equal]],['invalid',[unpriced,frozen,big]]]){
            assert.deepEqual((await desktop('Desktop cheapest '+label,{mode:'cheapest',pool})).replaced,[]);
           }
           assert.deepEqual((await desktop('Desktop cheapest unknown price',{mode:'cheapest',pool:[pirkka],cents:0})).replaced,[]);
           assert.deepEqual((await desktop('Desktop own-brand 10 eggs',{
            kind:'S',item:p('Valio kananmunat 10 kpl',300,'6410000000021'),
            pool:[p('Kotimaista kananmunat 10 kpl',200,'6410000000022'),p('Coop kananmunat 6 kpl',100,'6410000000023')]
           })).found,['Kotimaista kananmunat 10 kpl']);
           const mS=await mobile('Mobile S own brands neutral query','own_brands',spaghetti,spaghetti,sPool,true);
           assert(mS.requests.includes('spagetti')&&mS.requests.includes('Xtra spagetti'));
           assert.deepEqual(mS.found,[ownS.name]);
           assert.deepEqual((await mobile('Mobile K own brands neutral query','own_brands',spaghetti,spaghetti,kPool,true,'k')).found,[pirkka.name]);
           assert.deepEqual((await mobile('Mobile S milk own brands','own_brands',milk,milk,[ownMilk,milkWrong,milkEqual])).found,[ownMilk.name]);
           assert.deepEqual((await mobile('Mobile K milk own brands','own_brands',milk,milk,[milkOwnK,milkEqual,ownMilk],false,'k')).found,[milkOwnK.name,milkEqual.name]);
           assert.deepEqual((await mobile('Mobile De Cecco not Delverde','same_brand',spaghetti,spaghetti,[de,other])).found,[de.name]);
           assert.deepEqual((await mobile('Mobile visible Liguori brand','same_brand',spaghetti,liguori,[same,de,other])).found,[same.name]);
           assert.deepEqual((await mobile('Mobile cheapest is cheaper','cheapest',spaghetti,spaghetti,[other,equal,ownS])).replaced,[ownS.name]);
           for(const [label,pool] of [['expensive',[other]],['equal',[equal]],['invalid',[unpriced,frozen,big]]]){
            assert.deepEqual((await mobile('Mobile cheapest '+label,'cheapest',spaghetti,spaghetti,pool)).replaced,[]);
           }
           assert.deepEqual((await mobile('Mobile cheapest unknown price','cheapest',spaghetti,{...spaghetti,price:0},[ownS])).replaced,[]);
           for(const row of out)console.log(JSON.stringify(row));
           console.log('PASS '+out.length+' desktop and mobile button scenarios with controlled store responses');
          })().catch(e=>{console.error(out.at(-1));console.error(e);process.exitCode=1});
          AUDIT
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: desktop
            ref: c80ec8723882dd3060a4240a74317dcec59ef6e4
          - variant: mobile
            ref: 2c29d141c04646b299ad6cb3c4f835e197be111f
    name: Typecheck ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsc --noEmit --pretty false
