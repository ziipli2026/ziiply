name: Normal search targeted diagnostic (four queries)
on:
  workflow_dispatch:
  push:
    branches: [test/normal-search-full-audit-20261117]
    paths:
      - '.github/workflows/normal-search-targeted-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --no-package-lock @playwright/test
      - run: npx playwright install chromium
      - name: Diagnose four searches on mobile and desktop
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          ZIIPLY_LIVE_URL: https://ziiply-ck3lowgp3-ziipli2026s-projects.vercel.app
        run: |
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET" || exit 1
          npx playwright test tests/normal-search-targeted-diagnostic.spec.cjs --browser=chromium --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: normal-search-targeted-evidence
          path: normal-search-evidence/
          if-no-files-found: ignore
