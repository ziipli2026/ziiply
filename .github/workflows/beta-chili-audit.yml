name: Beta Chili con carne audit
on:
  workflow_dispatch:
  push:
    branches: [test/beta-chili-con-carne-20261128]
    paths:
      - '.github/workflows/beta-chili-audit.yml'
permissions:
  contents: read
jobs:
  mobile:
    name: Chili recipe mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Chili recipe mobile search and matching
        run: node scripts/test-beta-chili-con-carne.cjs mobile
        env:
          RECIPE_AUDIT_BASE: https://beta.ziiply.fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chili-mobile
          path: chili-audit-output/
          if-no-files-found: warn
  desktop:
    name: Chili recipe desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Existing desktop recipe parity regression
        run: node scripts/test-mobile-recipe-desktop-parity.cjs
      - name: Chili recipe desktop search and matching
        run: node scripts/test-beta-chili-con-carne.cjs desktop
        env:
          RECIPE_AUDIT_BASE: https://beta.ziiply.fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chili-desktop
          path: chili-audit-output/
          if-no-files-found: warn
