name: Security hardening patch build

on:
  push:
    branches:
      - security-hardening-patch-simulation-20260927
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: node scripts/security-hardening-patch-behavior.mjs
      - run: npm run build
