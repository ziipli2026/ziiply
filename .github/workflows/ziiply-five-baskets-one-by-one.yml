name: Ziiply five baskets - one at a time
on:
  workflow_dispatch:
    inputs:
      basket:
        description: 'Which eight-product basket?'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
jobs:
  basket:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Compile shared comparison rules
        run: npx tsc src/app/components/ziiply/ziiplyCore.ts --target ES2021 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck --outDir .tmp-five-baskets
      - name: Run selected eight-product basket against live S and K product searches
        env:
          BASKET: ${{ inputs.basket }}
        run: node scripts/ziiply-five-baskets-live.cjs
      - name: Upload eight-product comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eight-product-basket-${{ inputs.basket }}
          path: basket-reports/
          if-no-files-found: warn
