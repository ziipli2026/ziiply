name: Lidl Finland store/offers audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lidl-finland-store-offers-audit.yml'
      - 'src/app/api/offers/search/**'
      - 'src/app/components/ziiply/offerSearch/lidlPublicationConfig.ts'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Audit every Finnish Lidl through Ziiply production
        shell: bash
        run: |
          node <<'NODE'
          const base='https://ziiply.vercel.app';
          const headers={accept:'application/json','accept-language':'fi-FI,fi;q=0.9','user-agent':'Ziiply-Lidl-Finland-Audit/2.0'};
          const sr=await fetch('https://stores.lidlplus.com/api/v4/FI',{headers});
          if(!sr.ok) throw new Error('Lidl stores '+sr.status);
          const stores=await sr.json();
          if(!Array.isArray(stores)||stores.length<100) throw new Error('Unexpected Finnish Lidl store count '+(stores?.length||0));
          const results=[];
          for(const s of stores){
            const key=String(s.storeKey||'').trim();
            const city=String(s.locality||'').trim();
            const name=String(s.name||('Lidl '+city)).trim();
            const url=base+'/api/offers/search?q=__ziiply_all_offers__&provider=lidl&lidlStoreKey='+encodeURIComponent(key)+'&lidlStoreName='+encodeURIComponent(name);
            let p=null,status=0,error='';
            try{
              const r=await fetch(url,{headers}); status=r.status;
              p=await r.json();
            }catch(e){error=String(e)}
            const rows=Array.isArray(p?.results)?p.results:[];
            results.push({
              key,city,name,status,error,ok:p?.ok===true,
              results:rows.length,
              staged:Number(p?.lidlSourceAudit?.staged||0),
              structured:Number(p?.lidlSourceAudit?.structuredAndManual||0),
              combined:Number(p?.lidlSourceAudit?.combined||0),
              campaigns:Number(p?.lidlSourceAudit?.campaigns||0)
            });
          }
          const stagedCounts=[...new Set(results.map(x=>x.staged))];
          const failures=results.filter(x=>x.status!==200||!x.ok||x.results===0||x.staged===0);
          const stagedMismatch=stagedCounts.length!==1;
          console.log('FINLAND_LIDL_AUDIT',JSON.stringify({
            stores:results.length,passed:results.length-failures.length,failed:failures.length,
            stagedCounts,stagedMismatch,
            minResults:Math.min(...results.map(x=>x.results)),
            maxResults:Math.max(...results.map(x=>x.results))
          }));
          for(const x of failures) console.log('FAIL',JSON.stringify(x));
          for(const x of results.filter(x=>['Varkaus','Hyvinkää','Helsinki','Savonlinna','Uusikaupunki','Sodankylä','Oulu','Turku'].includes(x.city)).slice(0,30))
            console.log('SAMPLE',JSON.stringify(x));
          if(failures.length||stagedMismatch) process.exit(1);
          NODE
