name: Ruoanhinta pagination contract probe
on:
  push:
    branches:
      - test/normal-search-main-isolated-20261119
    paths:
      - '.github/workflows/ruoanhinta-pagination-contract.yml'
      - 'scripts/ruoanhinta-pagination-contract.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe upstream ordering and page-size limits (read only)
        run: node scripts/ruoanhinta-pagination-contract.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ruoanhinta-pagination-contract
          path: ruoanhinta-pagination-contract.json
          if-no-files-found: ignore
