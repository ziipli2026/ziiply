name: Lidl SPAR combined TypeScript and build (PR 227)
on:
  workflow_dispatch:
  push:
    branches:
      - test/lidl-spar-integration-current2
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/lidl-spar-integration-current
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clean dependency install (required)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: Next production build
        run: npm run build
