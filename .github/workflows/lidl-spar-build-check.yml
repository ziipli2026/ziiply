name: Lidl SPAR combined TypeScript and build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/lidl-spar-integration
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install without modifying tracked lockfile
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: Next production build
        run: npm run build
