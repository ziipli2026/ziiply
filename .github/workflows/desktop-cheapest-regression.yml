name: Desktop cheapest regression
on:
  push:
    branches:
      - preview/legacy-desktop-ui
    paths:
      - src/app/desktop-preview/page.tsx
      - tests/desktop-cheapest-regression.test.cjs
      - .github/workflows/desktop-cheapest-regression.yml
      - src/app/api/**
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts --legacy-peer-deps typescript@5
      - run: node --test tests/desktop-cheapest-regression.test.cjs
