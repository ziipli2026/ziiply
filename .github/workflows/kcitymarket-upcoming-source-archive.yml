name: K-Citymarket advance raw archive
on:
  workflow_dispatch:
  push:
    branches: [main, fix/citymarket-preflight]
    paths:
      - .github/workflows/kcitymarket-upcoming-source-archive.yml
      - scripts/citymarket/capture-preflight.mjs
  schedule:
    # One scheduled collection on each release day. Follow-up retries are manual
    # after an actual failure; do not run empty checks every day.
    # UTC 12:20 (summer 15:20) / UTC 13:20 (winter 15:20).
    - cron: '20 12,13 * * 0,3'
permissions:
  contents: write
concurrency:
  group: kcitymarket-advance-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install database client
        run: npm install --prefix /tmp/kcm-audit-deps --no-package-lock --ignore-scripts --no-audit --no-fund @neondatabase/serverless@1.0.2
      - name: Link isolated database client
        run: ln -s /tmp/kcm-audit-deps/node_modules node_modules
      - name: Fetch and validate upcoming publication
        id: capture
        env:
          DATABASE_URL: ${{ secrets.ZIIPLY_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          DAY=$(TZ=Europe/Helsinki date +%u)
          HOUR=$(TZ=Europe/Helsinki date +%H)
          EVENT="${{ github.event_name }}"
          # GitHub may start cron jobs late: never require the exact minute.
          # UTC 12:20 is valid only in Finnish summer time; UTC 13:20 in winter.
          # The other UTC slot is skipped without downloading anything.
          if [ "$EVENT" = schedule ]; then
            UTC_HOUR=$(date -u +%H)
            if [ "$HOUR" != 15 ] || { [ "$UTC_HOUR" != 12 ] && [ "$UTC_HOUR" != 13 ]; }; then
              echo "Outside Helsinki 15:00 release hour; skip"
              exit 0
            fi
          fi
          # Choose the latest released Sunday/Wednesday 15:00 Helsinki issue.
          # Mon/Tue retry Sunday's AV; Thu/Fri/Sat retry Wednesday's LV.
          if [ "$DAY" -eq 3 ] && [ "$HOUR" -ge 15 ] || [ "$DAY" -ge 4 ] && [ "$DAY" -le 6 ]; then
            KIND=LV
          elif [ "$DAY" -eq 7 ] && [ "$HOUR" -ge 15 ] || [ "$DAY" -le 2 ]; then
            KIND=AV
          else
            echo "No newly released publication in this window"
            exit 0
          fi
          # Resolve the issue from its original release day, not from retry day.
          if [ "$KIND" = AV ]; then
            if [ "$DAY" -eq 7 ]; then OFFSET=0; else OFFSET=$DAY; fi
            RELEASE=$(TZ=Europe/Helsinki date -d "$OFFSET days ago" +%F)
            START=$(date -d "$RELEASE + 1 day" +%F)
            WEEK=$(date -d "$START" +%V)
          else
            if [ "$DAY" -eq 3 ]; then OFFSET=0; else OFFSET=$((DAY-3)); fi
            RELEASE=$(TZ=Europe/Helsinki date -d "$OFFSET days ago" +%F)
            START=$(date -d "$RELEASE + 1 day" +%F)
            WEEK=$(date -d "$START" +%V)
          fi
          ID="${WEEK}${KIND}"
          PERIOD="${START}-W$((10#$WEEK))-${KIND}"
          # Idempotency: skip the network/database capture if this issue is archived.
          git fetch --quiet origin archive/citymarket-publications
          if git cat-file -e "origin/archive/citymarket-publications:publications/$ID/archive-manifest.json" 2>/dev/null; then
            echo "Issue $ID already archived; no redundant capture"
            exit 0
          fi
          set +e
          node scripts/citymarket/capture-preflight.mjs "$PERIOD" "/tmp/kcm-archive/$ID"
          RESULT=$?
          set -e
          echo "audit_exit=$RESULT" >> "$GITHUB_OUTPUT"
          # Audit failure is NOT a collection failure: preserve the source and
          # report review-needed rather than re-downloading an archived issue.
          node --input-type=module -e '
            import fs from "node:fs";
            const report=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            if(report.sourceVerified!==true)throw Error("Source identity/checksum not verified; do not archive under requested issue");
          ' "/tmp/kcm-archive/$ID/preflight-report.json"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Save immutable source to archive branch
        if: steps.capture.outputs.ready == 'true'
        env:
          LEAFLET_ID: ${{ steps.capture.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin archive/citymarket-publications
          git worktree add --detach /tmp/kcm-archive-branch origin/archive/citymarket-publications
          cd /tmp/kcm-archive-branch
          if [ -e "publications/$LEAFLET_ID/archive-manifest.json" ]; then
            echo "Already archived; original retained"
            exit 0
          fi
          mkdir -p "publications/$LEAFLET_ID"
          cp -a "/tmp/kcm-archive/$LEAFLET_ID/." "publications/$LEAFLET_ID/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "publications/$LEAFLET_ID"
          git commit -m "Archive original K-Citymarket $LEAFLET_ID publication"
          git push origin HEAD:archive/citymarket-publications
      - name: Retain run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citymarket-preflight-${{ github.run_id }}
          path: /tmp/kcm-archive/
          if-no-files-found: warn
      - name: Report parser audit result
        if: always() && steps.capture.outputs.audit_exit != ''
        run: |
          if [ "${{ steps.capture.outputs.audit_exit }}" != 0 ]; then
            echo "::warning::Source archived but parser audit needs review. Inspect preflight-report.json; do not repeat the successful source download."
          fi
