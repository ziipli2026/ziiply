name: Ziiply GPS arrival simulation
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/app/components/ziiply/location/ziiplyArrivalSequence.ts'
      - 'scripts/test-ziiply-arrival-sequence.cjs'
      - 'src/app/components/ziiplyWakePolicy.ts'
      - 'src/app/components/ZiiplyWakeUp.tsx'
      - 'scripts/test-ziiply-wake-policy.cjs'
      - 'scripts/test-ziiply-wake-stalled-requests.cjs'
      - 'src/app/components/ziiplyRequestRecovery.ts'
      - 'scripts/test-ziiply-request-recovery.cjs'
      - 'src/app/components/ziiply/ziiplyRecoverableOfferFetch.ts'
      - 'src/app/components/ziiply/offerSearch/ziiplyOfferSearchCore.ts'
      - 'src/app/page.tsx'
      - 'scripts/test-ziiply-recoverable-offer-fetch.cjs'
      - 'scripts/test-ziiply-visible-search-recovery.cjs'
      - 'scripts/test-ziiply-wake-lifecycle.cjs'
      - '.github/workflows/ziiply-gps-arrival-simulation.yml'
jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: Check TypeScript compilation
        run: npx tsc --noEmit
      - name: Simulate GPS and time progression
        run: node scripts/test-ziiply-arrival-sequence.cjs
      - name: Simulate browser wake-up after idle
        run: node scripts/test-ziiply-wake-policy.cjs
      - name: Simulate stalled request recovery contract
        run: node scripts/test-ziiply-wake-stalled-requests.cjs
      - name: Simulate registered stalled search recovery
        run: node scripts/test-ziiply-request-recovery.cjs
      - name: Simulate real offer fetch wake cancellation
        run: node scripts/test-ziiply-recoverable-offer-fetch.cjs
      - name: Simulate visible Gosta and Justiina loading recovery
        run: node scripts/test-ziiply-visible-search-recovery.cjs
      - name: Simulate actual browser wake event lifecycle
        run: node scripts/test-ziiply-wake-lifecycle.cjs
