                      return card.children[1].firstElementChild.innerText.trim();
                    }), desktop);
                    if (chain === 'LIDL') assert.equal(results.length, 0, 'Lidl research has no checkout price');
                    if (chain === 'SPAR' || chain === 'TOKMANNI' || extra) {
                      await search.getByText('Tokmanni / SPAR verkkovalikoima', {exact:true}).filter({visible:true}).first().waitFor({timeout:10000});
                    }
                    const resultKey = JSON.stringify([chain, extra, liveTerm]);
                    const visible = {results, research};
                    if (!desktop) liveResults.set(resultKey, visible);
                    else {
                      const phone = liveResults.get(resultKey);
                      if (JSON.stringify(visible) !== JSON.stringify(phone)) {
                        const index = results.findIndex((row, i) => JSON.stringify(row) !== JSON.stringify(phone.results[i]));
                        liveFailures.push({liveTerm, phoneCount:phone.results.length, desktopCount:results.length,
                          index, phone:phone.results[index], research, phoneResearch:phone.research, desktop:results[index]});
                      }
                    }
                    console.log('Retailer rows', name, chain, extra, results.length, research);
                    await searchContext.close();
                    continue;
                  }
                  const cheap = search.getByText('Kotimaista kevytmaito 1 l', { exact: true }).filter({ visible: true }).first();
                  const expensive = search.getByText('Valio täysmaito 1 l', { exact: true }).filter({ visible: true }).first();
                  try {
                    if (!desktop) {
                      const openResults = search.getByRole('button', { name: /Avaa löytöluettelo/ }).filter({ visible: true });
                      await cheap.or(openResults).first().waitFor({ timeout: 20000 });
                      if (!(await cheap.isVisible()) && await openResults.count() === 1) await openResults.click();
                    }
                    await cheap.waitFor({ timeout: 10000 });
                  } catch (error) {
                    console.log('Search state', name, 'store queries:', queries, 'API requests:', searchRequests, (await search.locator('body').innerText()).slice(0, 2500));
                    throw error;
                  }
                  if (chain !== 'LIDL') await expensive.waitFor();
                  if (extra) await search.getByText('Milbona kevytmaito 1 l', {exact:true}).filter({visible:true}).first().waitFor({timeout:10000});
                  assert.equal(await search.getByText('Kotimaista kevytmaito 1 l', { exact: true }).filter({ visible: true }).count(), 1);
                  assert.ok(queries > 0, 'selected store must receive a maito search');
                  const storeQueries = Array.from(new Set(searchRequests.flatMap(value => {
                    const prefix = 'GET ' + endpoint + '?';
