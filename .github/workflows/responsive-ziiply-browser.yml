                  await search.route('**/api/eurospar-stores?*', route => route.fulfill({json:{items:fixtures.slice(1)}}));
                  const searchEndpoints = many ? [endpoint, '/api/k-products', ...(extra ? ['/api/lidl/products', '/api/tokmanni/products'] : [])] : [endpoint];
                  const liveCounts = new Map();
                  if (liveTerm) {
                    for (const api of (searchEndpoints.some(api => /[sk]-products/.test(api)) ? [...searchEndpoints, '/api/neon-first-search'] : searchEndpoints)) {
                      await search.route('**' + api + '?*', async route => {
                        const local = new URL(route.request().url());
                        if (api === '/api/neon-first-search') {
                          const json = liveTerm === 'sokeri' ? sugarCatalog : catalogSnapshots[local.searchParams.get('q')];
                          liveCounts.set(api, {status:200, count:json.products.length});
                          return route.fulfill({json});
                        }
                        if (api === '/api/lidl/products' || api === '/api/tokmanni/products') {
                          const term = local.searchParams.get('search');
                          const source = api === '/api/lidl/products' ? 'lidl' : 'tokmanni';
                          const json = liveTerm === 'sokeri' && term === 'sokeri' ? sugarRetailers[source] : retailerSnapshots[term]?.[source];
