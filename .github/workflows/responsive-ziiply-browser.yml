                    const params = new URLSearchParams(value.slice(prefix.length));
                    return [params.get('search')];
                  })));
                  assert.ok(storeQueries.includes('maito') && storeQueries.includes('kevytmaito'),
                    'normal search must send both the original query and a milk-family variant');
                  if (within) {
                    const stores = searchRequests.filter(value => value.startsWith('GET ' + endpoint + '?'))
                      .map(value => new URLSearchParams(value.split('?')[1]).get('store'));
                    assert.deepEqual([...new Set(stores)].sort(), [storeId, chain.toLowerCase() + '-local-test'].sort());
                  }
                  const scenario = many ? (extra ? 'S + K + Lidl + ' + extra : 'S + K Monta') : within ? chain + ' within-chain' : chain;
                  if (name === 'phone') phoneStoreQueries.set(scenario, storeQueries);
                  if (desktop && !within) assert.deepEqual(storeQueries, phoneStoreQueries.get(scenario),
                    'phone and desktop must request the same store query variants in order');
                  const maitoApiCalls = searchRequests.filter(value => /[?&]search=maito(?:&|$)/i.test(value));
                  for (const api of searchEndpoints) {
                    assert.ok(maitoApiCalls.some(value => value.includes(api + '?')));
                    if (many) assert.ok(searchRequests.some(value => value.includes(api + '?') && /[?&]search=kevytmaito(?:&|$)/i.test(value)),
                      'each selected chain must receive expanded search queries');
                  }
                  assert.equal(maitoApiCalls.filter(value => ['/api/s-products', '/api/k-products', '/api/store-search', '/api/lidl/products', '/api/tokmanni/products']
                    .some(other => !searchEndpoints.includes(other) && value.includes(other + '?'))).length, 0,
