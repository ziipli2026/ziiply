                    console.log(name, 'cart-to-comparison passed');
                  }
                  await searchContext.close();
                }
                console.log(name + ' passed');
                await context.close();
              }
              assert.deepEqual(liveFailures, [], JSON.stringify(liveFailures));
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
