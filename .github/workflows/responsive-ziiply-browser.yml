                    for (const [store, price] of [['Prisma Hyvinkää','1,59'],['K-Citymarket Hyvinkää','1,49']]) {
                      const shop = desktop ? search.getByText(store, {exact:true}) : search.getByRole('button', {name:'Avaa '+store, exact:true});
