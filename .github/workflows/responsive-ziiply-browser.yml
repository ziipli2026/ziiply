name: Responsive Ziiply browser smoke test
# Isolated chain-scope regression validation
on:
  push:
    branches: [test/desktop-mobile-unification, test/search-parity-audit-20261113, test/search-chain-scope-validation-20261113]
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/responsive-ziiply-browser.yml'
      - 'src/app/components/ziiply/ziiplyCore.ts'
      - 'src/app/components/ziiply/search/desktopNormalRelevance.ts'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Check the same address on phone, tablet and desktop
        run: |
          npm run start -- -H 127.0.0.1 -p 3100 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3100/ > /dev/null; then break; fi
            sleep 1
          done
          node <<'NODE'
          const { chromium, devices } = require('playwright');
          const assert = require('node:assert/strict');
          const url = 'http://127.0.0.1:3100/';
          (async () => {
            const browser = await chromium.launch();
            try {
              const phoneStoreQueries = new Map();
              for (const [name, options, desktop] of [
                ['phone', devices['iPhone 13'], false],
                ['touch tablet', { viewport: { width: 1024, height: 1366 }, hasTouch: true, isMobile: true }, false],
                ['narrow window', { viewport: { width: 800, height: 900 } }, false],
                ['desktop', { viewport: { width: 1440, height: 900 } }, true],
              ]) {
                const context = await browser.newContext(options);
                await context.grantPermissions(['geolocation']);
                await context.setGeolocation({ latitude: 60.63, longitude: 24.86 });
                await context.addInitScript(() => {
                  const store = { id: '634976534', name: 'Prisma Hyvinkää', chain: 'S', latitude: 60.63, longitude: 24.86 };
                  if (!localStorage.getItem('ziiply-desktop-store-choices-v1')) {
                    localStorage.setItem('ziiply-desktop-store-choices-v1', JSON.stringify({
                      storeMode: 'hyper', storeModeChosen: true, selectedChain: 'S',
                      betweenMode: 'one', storeCompareScope: 'between_chains',
                      allStoreSelections: { hyper: { [store.id]: store }, local: {} }
                    }));
                  }
                  if (!localStorage.getItem('ziiply-store-selection-v536')) {
                    localStorage.setItem('ziiply-store-selection-v536', JSON.stringify({
                      version: 1, savedAt: Date.now(),
                      activeArea: { label: 'Hyvinkää', sStoreId: store.id, sStoreName: store.name,
                        kStoreId: '', kStoreName: '', sLocalStoreId: '', sLocalStoreName: '',
                        kLocalStoreId: '', kLocalStoreName: '' },
                      storeMode: 'hyper', storeModeChosenV299: true,
                      storeCompareScope: 'between_chains', betweenChainSelectionModeV749: 'one',
                      withinChain: null,
                      selectedChains: { s: true, k: false, lidl: false, tokmanni: false },
                      selectedLidlStoreV750: null, selectedEurosparStoreV751: null,
                      selectedTokmanniStoreV756: null, gpsCoordsV320: null, usingOwnLocation: false
                    }));
                  }
                  localStorage.setItem('ziiply-gosta-offer-watches-v1', JSON.stringify(['kahvi']));
                });
                const page = await context.newPage();
                await page.route('**/api/offers/watch?*', route => route.fulfill({ json: {
                  ok: true, partial: false, results: [{
                    id: '6411001000110', ean: '6411001000110', title: 'Testikahvi 500 g',
                    name: 'Testikahvi 500 g', chain: 'S', storeName: 'Prisma Hyvinkää',
                    offerPrice: 4.99, price: 4.99, source: 'fixture', watchQueries: ['kahvi'],
                    validFrom: new Date(Date.now() - 86400000).toISOString().slice(0, 10),
                    validUntil: new Date(Date.now() + 86400000).toISOString().slice(0, 10)
                  }]
                }}));
                const errors = [];
                page.on('pageerror', error => errors.push(error.message));
                const response = await page.goto(url);
                assert.equal(response.status(), 200);
                const mobileHome = page.getByRole('region', { name: 'Ziiplyn avustajat' });
                const desktopHome = page.locator('[data-desktop-layout]');
                await (desktop ? desktopHome : mobileHome).waitFor({ timeout: 25000 });
                assert.equal(await (desktop ? mobileHome : desktopHome).count(), 0);
                assert.equal(page.url(), url);
                await page.getByRole('button', { name: 'Avaa tarjousvahdin 1 osumaa' }).click({ timeout: 30000 });
                if (desktop) await page.getByRole('button', { name: /Tavaratalot · 1 tarjousta/ }).click();
                await page.getByText('Testikahvi 500 g', { exact: true }).first().waitFor({ timeout: 10000 });
                await page.getByRole('button', { name: 'Lisää ostoskoriin', exact: true }).first().click();
                await page.waitForFunction(({ desktop, ean }) => {
                  const saved = desktop
                    ? JSON.parse(sessionStorage.getItem('ziiply-desktop-current-cart-v1') || '[]')
                    : JSON.parse(localStorage.getItem('ziiply-cart-v1') || '{}').items || [];
                  return saved.some(item => String(item.ean ?? item.product?.ean) === ean);
                }, { desktop, ean: '6411001000110' }, { timeout: 10000 });
                assert.deepEqual(errors, []);
                for (const [chain, storeId, storeName] of [
                  ['S', '634976534', 'Prisma Hyvinkää'],
                  ['K', 'C130', 'K-Citymarket Hyvinkää'],
                  ['LIDL', 'lidl-test', 'Lidl Hyvinkää'],
                  ['SPAR', 'spar-test', 'EUROSPAR Hyvinkää'],
                  ['TOKMANNI', 'tokmanni-test', 'Tokmanni Hyvinkää'],
                ]) {
                  if (chain !== 'S' && name !== 'phone' && !desktop) continue;
                  const endpoint = { S: '/api/s-products', K: '/api/k-products', LIDL: '/api/lidl/products', SPAR: '/api/tokmanni/products', TOKMANNI: '/api/tokmanni/products' }[chain];
                  const searchContext = await browser.newContext(options);
                  await searchContext.grantPermissions(['geolocation']);
                  await searchContext.setGeolocation({ latitude: 60.63, longitude: 24.86 });
                  const search = await searchContext.newPage();
                  await search.addInitScript(({ chain, storeId, storeName }) => {
                    const store = { id: storeId, name: storeName, chain, latitude: 60.63, longitude: 24.86 };
                    localStorage.setItem('ziiply-desktop-store-choices-v1', JSON.stringify({
                      storeMode: 'hyper', storeModeChosen: true, selectedChain: chain === 'TOKMANNI' ? 'SPAR' : chain,
                      betweenMode: 'one', storeCompareScope: 'between_chains',
                      allStoreSelections: { hyper: { [store.id]: store }, local: {} }
                    }));
                    localStorage.setItem('ziiply-store-selection-v536', JSON.stringify({
                      version: 1, savedAt: Date.now(),
                      activeArea: { label: 'Hyvinkää', sStoreId: chain === 'S' ? storeId : '', sStoreName: chain === 'S' ? storeName : '',
                        kStoreId: chain === 'K' ? storeId : '', kStoreName: chain === 'K' ? storeName : '',
                        sLocalStoreId: '', sLocalStoreName: '', kLocalStoreId: '', kLocalStoreName: '' },
                      storeMode: 'hyper', storeModeChosenV299: true,
                      storeCompareScope: 'between_chains', betweenChainSelectionModeV749: 'one',
                      withinChain: null, selectedChains: { s: chain === 'S', k: chain === 'K', lidl: chain === 'LIDL', tokmanni: chain === 'SPAR' || chain === 'TOKMANNI' },
                      selectedLidlStoreV750: chain === 'LIDL' ? store : null, selectedEurosparStoreV751: chain === 'SPAR' ? store : null,
                      selectedTokmanniStoreV756: chain === 'TOKMANNI' ? store : null, gpsCoordsV320: null, usingOwnLocation: false
                    }));
                  }, { chain, storeId, storeName });
                  let queries = 0;
                  const searchRequests = [];
                  search.on('request', request => {
                    if (request.url().includes('/api/')) searchRequests.push(request.method() + ' ' + new URL(request.url()).pathname + new URL(request.url()).search);
                  });
                  search.on('response', response => {
                    if (response.url().includes('/api/')) console.log(name, 'API response', response.status(), response.url());
                  });
                  const fixtures = [
                    {id:'lidl-test',name:'Lidl Hyvinkää',chain:'Lidl',type:'Lidl',city:'Hyvinkää',latitude:60.63,longitude:24.86},
                    {id:'spar-test',name:'EUROSPAR Hyvinkää',chain:'EUROSPAR',city:'Hyvinkää',latitude:60.63,longitude:24.86},
                    {id:'tokmanni-test',name:'Tokmanni Hyvinkää',chain:'TOKMANNI',city:'Hyvinkää',latitude:60.63,longitude:24.86},
                  ];
                  await search.route('**/api/lidl/store-search?*', route => route.fulfill({json:{items:fixtures.slice(0,1)}}));
                  await search.route('**/api/eurospar-stores?*', route => route.fulfill({json:{items:fixtures.slice(1)}}));
                  await search.route('**'+endpoint+'?*', route => {
                    const params = new URL(route.request().url()).searchParams;
                    if (/maito/i.test(params.get('search') || '')) {
                      if (chain === 'S' || chain === 'K') assert.equal(params.get('store'), storeId);
                      if (chain === 'LIDL') assert.equal(params.get('mode'), 'research');
                      if (chain === 'SPAR' || chain === 'TOKMANNI') assert.equal(params.get('intent'), 'maito');
                      queries++;
                    }
                    if (chain === 'LIDL') return route.fulfill({json:{items:[
                      {id: 22, name: 'Kotimaista kevytmaito 1 l', priceVerified: false, source: 'lidl.fi-public-research'},
                      {id: 23, name: 'Maitokolmio ruisleipä', priceVerified: false, source: 'lidl.fi-public-research'}
                    ]}});
                    return route.fulfill({ json: { [chain === 'S' ? 'products' : 'items']: [
                      { id: 1, name: 'Valio täysmaito 1 l', ean: '6408430106443', price: 179 },
                      { id: 2, name: 'Kotimaista kevytmaito 1 l', ean: '6438460292804', storeItem: { price: 95 } },
                      { id: 5, name: 'Kotimaista kevytmaito 1 l', ean: '6438460292804', price: 189 },
                      { id: 3, name: 'Maitokolmio ruisleipä', ean: '6411001000111', price: 49 },
                      { id: 4, name: 'Arla rasvaton maito 1 l', ean: '6413300101713', price: 0 }
                    ] } });
                  });
                  await search.route('**/api/neon-first-search?*', route => route.fulfill({ json: { products: [] } }));
                  await search.goto(url);
                  // The mobile app can reset persisted selections on startup in a fresh CI
                  // browser. Seed the realistic S-store selection after hydration too.
                  if (!desktop) {
                    await search.getByRole('region', { name: 'Ziiplyn avustajat' }).waitFor({ timeout: 25000 });
                    await search.reload();
                    await search.getByRole('region', { name: 'Ziiplyn avustajat' }).waitFor({ timeout: 25000 });
                  }
                  if (desktop) await search.getByRole('button', { name: 'Avaa Justiina', exact: true }).click();
                  else await search.getByRole('button', { name: 'Justiina: Tuotehaku', exact: true }).click();
                  const input = desktop ? search.getByRole('textbox', { name: 'Hae tuotteita' })
                    : search.getByPlaceholder(/Kirjoita yksi tuote|maito, kahvi/).filter({ visible: true });
                  await input.fill('maito');
                  if (!desktop) {
                    console.log('Mobile store configuration', await search.evaluate(() => ({
                      mobile: localStorage.getItem('ziiply-store-selection-v536'),
                      desktop: localStorage.getItem('ziiply-desktop-store-choices-v1')
                    })));
                    console.log('Mobile search button', await search.getByRole('button', { name: 'Justiina', exact: true }).filter({ visible: true }).evaluate(el => ({
                      disabled: el.disabled, ariaDisabled: el.getAttribute('aria-disabled'), title: el.getAttribute('title')
                    })));
                  }
                  if (name === 'phone') {
                    // A real user types a term and waits. Verify the normal 2-second
                    // automatic Justiina search, not only manual button submission.
                    const startedAt = Date.now();
                    await search.waitForRequest(request => {
                      const parsed = new URL(request.url());
                      return parsed.pathname === endpoint
                        && parsed.searchParams.get('search') === 'maito';
                    }, { timeout: 10000 });
                    const elapsedMs = Date.now() - startedAt;
                    console.log('phone automatic search delay ms', elapsedMs);
                    assert.ok(elapsedMs >= 700 && elapsedMs <= 5000,
                      'mobile automatic search should start after its 1-3 second configured delay');
                  } else if (!desktop) {
                    // Tablet/narrow window verify immediate Justiina button submission.
                    await search.getByRole('button', { name: 'Justiina', exact: true }).filter({ visible: true }).click();
                  } else {
                    await input.press('Enter');
                  }
                  const cheap = search.getByText('Kotimaista kevytmaito 1 l', { exact: true }).filter({ visible: true }).first();
                  const expensive = search.getByText('Valio täysmaito 1 l', { exact: true }).filter({ visible: true }).first();
                  try {
                    if (!desktop) {
                      const openResults = search.getByRole('button', { name: /Avaa löytöluettelo/ }).filter({ visible: true });
                      await cheap.or(openResults).first().waitFor({ timeout: 20000 });
                      if (!(await cheap.isVisible()) && await openResults.count() === 1) await openResults.click();
                    }
                    await cheap.waitFor({ timeout: 10000 });
                  } catch (error) {
                    console.log('Search state', name, 'store queries:', queries, 'API requests:', searchRequests, (await search.locator('body').innerText()).slice(0, 2500));
                    throw error;
                  }
                  if (chain !== 'LIDL') await expensive.waitFor();
                  assert.equal(await search.getByText('Kotimaista kevytmaito 1 l', { exact: true }).filter({ visible: true }).count(), 1);
                  assert.ok(queries > 0, 'selected store must receive a maito search');
                  const storeQueries = Array.from(new Set(searchRequests.flatMap(value => {
                    const prefix = 'GET ' + endpoint + '?';
                    if (!value.startsWith(prefix)) return [];
                    const params = new URLSearchParams(value.slice(prefix.length));
                    return [params.get('search')];
                  })));
                  assert.ok(storeQueries.includes('maito') && storeQueries.includes('kevytmaito'),
                    'normal search must send both the original query and a milk-family variant');
                  if (name === 'phone') phoneStoreQueries.set(chain, storeQueries);
                  if (desktop) assert.deepEqual(storeQueries, phoneStoreQueries.get(chain),
                    'phone and desktop must request the same store query variants in order');
                  const maitoApiCalls = searchRequests.filter(value => /[?&]search=maito(?:&|$)/i.test(value));
                  assert.ok(maitoApiCalls.some(value => value.includes(endpoint + '?')));
                  assert.equal(maitoApiCalls.filter(value => ['/api/s-products', '/api/k-products', '/api/store-search', '/api/lidl/products', '/api/tokmanni/products']
                    .some(other => other !== endpoint && value.includes(other + '?'))).length, 0,
                    'single-chain search must stay within the selected chain');
                  if (chain !== 'LIDL') assert.ok((await cheap.boundingBox()).y <= (await expensive.boundingBox()).y);
                  else await search.getByText(/hinta (ei vahvistettu|vahvistamatta)/i).first().waitFor();
                  assert.equal(await search.getByText('Maitokolmio ruisleipä', { exact: true }).count(), 0);
                  assert.equal(await search.getByText('Arla rasvaton maito 1 l', { exact: true }).count(), 0);
                  console.log(name, chain, 'search passed', storeQueries);
                  await searchContext.close();
                }
                console.log(name + ' passed');
                await context.close();
              }
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
