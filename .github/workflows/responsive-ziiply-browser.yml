                    else if (extra) assert.equal(await lidlNotice.count(), 0, 'sugar-free products are not sugar matches');
                    if (chain !== 'LIDL') await prices.first().waitFor({timeout:90000});
                    const results = await prices.evaluateAll((buttons, desktop) => buttons.map(button => {
                      const card = desktop ? button.parentElement.parentElement : button.closest('article');
                      const label = button.innerText;
