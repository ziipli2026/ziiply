                  } else {
                    await input.press('Enter');
                  }
                  if (liveTerm) {
                    const prices = desktop
                      ? search.getByRole('button', {name:/\d[,.]\d{2}.*Lisää koriin/})
                      : search.locator('article button[aria-label^="Lisää koriin:"]').filter({hasText:/\d[,.]\d{2}/});
                    if (!desktop) {
                      const openResults = search.getByRole('button', {name:/Avaa löytöluettelo/}).filter({visible:true});
                      const opened = search.locator('article').filter({has:search.getByRole('button', {name:/^Lisää koriin:/})}).first();
                      await opened.or(openResults).first().waitFor({timeout:90000});
                      if (!(await opened.isVisible()) && await openResults.count() === 1) {
                        await opened.waitFor({timeout:1500}).catch(() => {});
