                          }
                          return {status:502, json:{items:[]}};
                        })());
                        try {
                          const {status, json} = await liveResponses.get(key);
                          const items = json.products ?? json.items;
                          const term = local.searchParams.get(api === '/api/neon-first-search' ? 'q' : 'search');
                          if (term === liveTerm && (api !== '/api/s-products' || local.searchParams.has('storeType'))) {
                            liveCounts.set(api, {status, count:Array.isArray(items) ? items.length : 0});
                          }
                          await route.fulfill({status, json});
                        } catch (error) {
                          console.log('Live provider failure', key, String(error));
                          await route.fulfill({status:502, json:{items:[]}});
                        }
                      });
                    }
                  } else {
                  for (const api of searchEndpoints) await search.route('**'+api+'?*', route => {
