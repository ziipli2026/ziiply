                          const origins = ['https://ziiply.vercel.app'];
                          for (const origin of origins) {
                            const response = await fetch(new URL(local.pathname + local.search, origin), {
                              signal: AbortSignal.timeout(15000), headers:{accept:'application/json'}
                            });
                            const kind = response.headers.get('content-type') || '';
                            console.log('Live upstream', origin, api, response.status, kind);
