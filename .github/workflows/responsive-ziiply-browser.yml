                      const ean = card.innerText.match(/EAN\s+(\d+)/)?.[1] ?? null;
                      const name = card.children[1].firstElementChild.innerText;
                      return {name:name.replace(/\s+/g, ' ').trim(), price, ean};
                    }), desktop);
                    console.log('Live Chromium', name, liveTerm, JSON.stringify([...liveCounts]), JSON.stringify(results.slice(0,10)));
                    for (const api of (searchEndpoints.some(api => /[sk]-products/.test(api)) ? [...searchEndpoints, '/api/neon-first-search'] : searchEndpoints)) {
                      assert.equal(liveCounts.get(api)?.status, 200, 'live ' + api + ' for ' + liveTerm);
                      if (liveTerm === 'maito') assert.ok(liveCounts.get(api).count > 0, 'nonempty live ' + api);
                    }
                    assert.ok(results.every((row,index) => row.price > 0 && (!index || row.price >= results[index-1].price)));
                    const eans = results.map(row => row.ean).filter(Boolean);
                    if (chain === 'S' || chain === 'K') assert.ok(eans.length > 0);
                    assert.equal(new Set(eans).size, eans.length);
                    if (chain !== 'LIDL') assert.ok(results.some(row => liveTerm === 'maito' ? /maito/i.test(row.name) : liveTerm === 'sokeri' ? /sokeri/i.test(row.name) : /kirjolohi/i.test(row.name)));
                    const irrelevant = results.filter(row => liveTerm === 'maito'
                      ? /leipä|suklaa/i.test(row.name)
                      : /kirjolohiöljy|koirille/i.test(row.name));
                    if (irrelevant.length) liveFailures.push({name, liveTerm, irrelevant});
                    const research = await lidlNotice.evaluateAll((notes, desktop) => notes.map(note => {
