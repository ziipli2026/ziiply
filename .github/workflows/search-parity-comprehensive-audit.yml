name: Search parity comprehensive audit
on:
  push:
    branches: [test/search-parity-audit-20261113, test/search-chain-scope-validation-20261113]
    paths:
      - 'scripts/search-parity-comprehensive-audit.mts'
      - '.github/workflows/search-parity-comprehensive-audit.yml'
      - 'src/app/components/ziiply/search/desktopNormalRelevance.ts'
      - 'src/app/components/ziiply/ziiplyCore.ts'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/search-parity-comprehensive-audit.mts'
      - '.github/workflows/search-parity-comprehensive-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Execute mobile and desktop search parity audit
        shell: bash
        run: |
          set -o pipefail
          npx --yes tsx scripts/search-parity-comprehensive-audit.mts 2>&1 | tee search-parity-audit.log
          echo '### Mobile / desktop search parity audit' >> "$GITHUB_STEP_SUMMARY"
          echo 'The full report is available in the search-parity-audit-log artifact.' >> "$GITHUB_STEP_SUMMARY"
      - name: Live S/K response relevance audit using real shared search code
        env:
          ZIIPLY_TEST_URL: https://ziiply-9y3fsg8m1-ziipli2026s-projects.vercel.app
        shell: bash
        run: |
          set -o pipefail
          npx --yes tsx scripts/search-live-chain-relevance-audit.mts 2>&1 | tee search-live-chain-audit.log
      - name: Upload search parity audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-parity-audit-log
          path: |\n            search-parity-audit.log\n            search-live-chain-audit.log
          if-no-files-found: warn
