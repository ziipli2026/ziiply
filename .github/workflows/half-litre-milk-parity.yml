name: Half-litre milk mobile and desktop parity
on:
  push:
    branches: [test/half-litre-milk-parity]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --prefix "$RUNNER_TEMP/progressive" --no-save --package-lock=false playwright@1.56.1
      - name: Verify the displayed price per kilogram and litre
        run: |
          npm run dev -- -H 127.0.0.1 -p 3100 >/tmp/progressive-next.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS --max-time 30 http://127.0.0.1:3100/ >/dev/null; then break; fi
            sleep 1
          done
          NODE_PATH="$RUNNER_TEMP/progressive/node_modules" node <<'NODE'
          const {chromium,devices}=require('playwright');
          const assert=require('node:assert/strict');
          const store={id:'292',name:'Prisma Hyvinkää',chain:'S',latitude:60.63,longitude:24.86};
          const other={id:'3221',name:'K-Citymarket Hyvinkää',chain:'K',latitude:60.63,longitude:24.86};
          const query='maito 0,5l';
          const product={id:1,name:'Pirkka kevytmaito 5dl',ean:'6410405267825',price:85,priceAmountUnit:'cent'};
          const rejected=[
            {id:2,name:'Kotimaista rasvaton maito 1l',ean:'6415712506032',price:85,priceAmountUnit:'cent'},
            {id:3,name:'Voelkel Luomuporkkanamehu maitohappokäytetty 0,5l',ean:'4015533014512',price:499,priceAmountUnit:'cent'}
          ];
          (async()=>{
            const browser=await chromium.launch();
            try{
              const results=[];
              const requests=[];
              for(const desktop of [false,true]){
                const context=await browser.newContext(desktop?{viewport:{width:1440,height:900}}:devices['iPhone 13']);
                await context.addInitScript(({store,other})=>{
                  localStorage.setItem('ziiply-desktop-store-choices-v1',JSON.stringify({
                    storeMode:'hyper',storeModeChosen:true,selectedChain:'S',betweenMode:'many',
                    storeCompareScope:'between_chains',allStoreSelections:{hyper:{[store.id]:store,[other.id]:other},local:{}}
                  }));
                  localStorage.setItem('ziiply-store-selection-v536',JSON.stringify({
                    version:1,savedAt:Date.now(),activeArea:{label:'Hyvinkää',sStoreId:store.id,sStoreName:store.name,kStoreId:other.id,kStoreName:other.name},
                    storeMode:'hyper',storeModeChosenV299:true,storeCompareScope:'between_chains',betweenChainSelectionModeV749:'many',
                    withinChain:null,selectedChains:{s:true,k:true,lidl:false,tokmanni:false},usingOwnLocation:false
                  }));
                },{store,other});
                const page=await context.newPage();
                await page.route('**/api/store-search?*',route=>route.fulfill({json:{items:[store,other]}}));
                await page.route('**/api/neon-first-search?*',route=>route.fulfill({json:{products:[]}}));
                await page.route('**/api/ean-bank?*',route=>route.fulfill({json:{}}));
                const urls=[];
                for(const chain of ['s','k']) await page.route('**/api/'+chain+'-products?*',route=>{
                  const path=new URL(route.request().url());
                  urls.push([chain,path.searchParams.get('store'),path.searchParams.get('search')]);
                  return route.fulfill({json:{products:chain==='s'?rejected:[product,...rejected],source:'ruoanhinta-'+chain}});
                });
                try{
                  await page.goto('http://127.0.0.1:3100/');
                  if(!desktop){
                    const home=page.getByRole('region',{name:'Ziiplyn avustajat'});
                    await home.waitFor();
                    await page.reload();
                    await home.waitFor();
                  }
                  await page.getByRole('button',{name:desktop?'Avaa Justiina':'Justiina: Tuotehaku',exact:true}).click();
                  const input=desktop?page.getByRole('textbox',{name:'Hae tuotteita'}):page.getByPlaceholder(/Kirjoita yksi tuote|maito, kahvi/).filter({visible:true});
                  await input.fill(query);
                  if(desktop) await input.press('Enter');
                  else await page.getByRole('button',{name:'Justiina',exact:true}).filter({visible:true}).click();
                  await page.getByText(product.name,{exact:true}).first().waitFor();
                  await page.getByText(/Haetaan lisää tuotteita/).waitFor({state:'hidden'});
                  const cards=await page.getByText(/EAN \d{13}/).allTextContents();
                  assert.deepEqual(cards,['EAN '+product.ean]);
                  assert.ok(urls.some(([chain,id,term])=>chain==='s'&&id==='292'&&term===query));
                  assert.ok(urls.some(([chain,id,term])=>chain==='k'&&id==='3221'&&term===query));
                  assert.ok(!urls.some(([, ,term])=>term?.includes('0 5l')));
                  requests.push(urls.map(parts=>parts.join('|')).sort());
                  results.push(cards);
                  console.log('PASS',desktop?'desktop':'mobile',JSON.stringify({cards,urls}));
                }finally{await context.close();}
              }
              assert.deepEqual(results[0],results[1]);
              assert.deepEqual(requests[0],requests[1]);
            }finally{await browser.close();}
          })().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
      - if: failure()
        run: tail -100 /tmp/progressive-next.log
