name: Validate K-market audit workflow syntax
on:
  push:
    branches: [fix/k-market-supermarket-audit-workflow]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate embedded audit JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/k-market-supermarket-mass-audit.yml').read_text()
          start=text.index("          node --input-type=module <<'NODE'")+len("          node --input-type=module <<'NODE'")
          end=text.index("\n          NODE",start)
          Path('/tmp/k-market-audit.mjs').write_text("\n".join(line[10:] for line in text[start:end].splitlines())+"\n")
          PY
          node --check /tmp/k-market-audit.mjs
      - name: Smoke-test K-market and K-Supermarket discovery (read-only)
        timeout-minutes: 2
        run: |
          node --input-type=module <<'NODE'
          const base='https://api.ruoanhinta.fi/api/stores?search=';
          for(const chain of ['K-Market','K-Supermarket']){
            const c=new AbortController();const t=setTimeout(()=>c.abort(),15000);
            try{
              const r=await fetch(base+encodeURIComponent(chain),{signal:c.signal,headers:{accept:'application/json'}});
              console.log(chain,'HTTP',r.status);
              if(!r.ok)throw Error(chain+' discovery HTTP '+r.status);
              const d=await r.json();
              console.log(chain,'returned',Array.isArray(d)?d.length:(d.items||[]).length,'stores');
            }finally{clearTimeout(t);}
          }
          NODE
      - name: Verify no duplicated YAML tail
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/k-market-supermarket-mass-audit.yml').read_text()
          assert s.count("name: Upload audit report")==1
          assert s.count("const ean=priced.filter")==1
          assert s.count("NODE")==2
          print("K-market workflow structural checks passed")
          PY
