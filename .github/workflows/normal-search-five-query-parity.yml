name: Bounded isolated normal search parity
on:
  push:
    branches:
      - test/normal-search-main-isolated-20261119
    paths:
      - '.github/workflows/normal-search-five-query-parity.yml'
      - 'tests/normal-search-targeted-diagnostic.spec.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 46
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --no-package-lock @playwright/test
      - run: npx playwright install chromium
      - name: Repeat parity with per-query provider request evidence
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          ZIIPLY_LIVE_URL: https://ziiply-da8zti1ts-ziipli2026s-projects.vercel.app
          NORMAL_SEARCH_SELECTED_QUERIES: mustikka,vadelma,suklaa,muro,pakastevihannes,mansikka,cola,kahvi,kananmunat,banaani,pasta,jauheliha,jogurtti,oliiviöljy,rypsiöljy,peruna,porkkana,sipuli,tomaatti,paprika,makkara,kala
        run: |
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET" || exit 1
          npx playwright test tests/normal-search-targeted-diagnostic.spec.cjs --browser=chromium --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-parity-evidence
          path: normal-search-evidence/
          if-no-files-found: ignore
