name: Citymarket store offers research
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-hyvinkaa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public canonical Hyvinkaa store page
        shell: bash
        run: |
          node <<'NODE'
          const url = "https://www.k-ruoka.fi/kauppa/k-citymarket-hyvinkaa";
          (async () => {
            const response = await fetch(url, { redirect: "follow", signal: AbortSignal.timeout(15000) });
            const html = response.ok ? await response.text() : "";
            const title = html.match(/<title[^>]*>([^<]*)/i)?.[1] || "";
            const links = [...html.matchAll(/<a\b[^>]*href=["']([^"'<>]+)["'][^>]*>/gi)]
              .map(m => m[1].replace(/&amp;/g, "&"))
              .filter(href => /tarjous|edut|etuja/i.test(href))
              .map(href => { try { return new URL(href, response.url).href; } catch { return ""; } })
              .filter(href => href.startsWith("https://www.k-ruoka.fi/"))
              .filter((href, i, all) => all.indexOf(href) === i);
            const result = { requestedStore: "k-citymarket-hyvinkaa", status: response.status,
              finalUrl: response.url, title, offerLinks: links.slice(0, 30),
              blocked: response.status === 403,
              note: response.status === 403 ? "K-Ruoka refused GitHub runner; no offer absence inferred." : "Public navigation only; no session-based offer data or inferred prices." };
            console.log(JSON.stringify(result, null, 2));
            if (response.status === 403) { console.log("Research blocked upstream (HTTP 403); no parsing attempted."); return; }
            if (!response.ok || new URL(response.url).pathname !== "/kauppa/k-citymarket-hyvinkaa") process.exitCode = 1;
          })().catch(e => { console.error(String(e)); process.exitCode = 1; });
          NODE

      - name: Probe separately hosted leaflet navigation
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const entry = "https://kcm-lehdet.k-ruoka.fi/tarjouslehti";
          (async () => {
            const response = await fetch(entry, { redirect: "follow", signal: AbortSignal.timeout(15000) });
            const final = new URL(response.url);
            const allowed = ["kcm-lehdet.k-ruoka.fi", "kcm-tarjouslehdet.k-ruoka.fi"];
            console.log(JSON.stringify({
              source: "separately hosted K-Citymarket leaflet navigation",
              entry, status: response.status, finalUrl: response.url,
              trustedLeafletHost: final.protocol === "https:" && allowed.includes(final.hostname),
              storeScopedOfferFeedVerified: false,
              note: "Navigation research only; no prices, products, or selected-store identity inferred."
            }, null, 2));
            if (!response.ok || final.protocol !== "https:" || !allowed.includes(final.hostname)) process.exitCode = 1;
          })().catch(error => { console.error(String(error)); process.exitCode = 1; });
          NODE

      - name: Inspect leaflet HTML publication metadata
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const entry = "https://kcm-lehdet.k-ruoka.fi/tarjouslehti";
          const allowed = new Set(["kcm-lehdet.k-ruoka.fi", "kcm-tarjouslehdet.k-ruoka.fi"]);
          async function read(url) {
            const response = await fetch(url, { redirect: "follow", signal: AbortSignal.timeout(12000) });
            const final = new URL(response.url);
            if (final.protocol !== "https:" || !allowed.has(final.hostname)) throw Error("Unexpected leaflet host");
            return { response, html: response.ok ? (await response.text()).slice(0, 300000) : "" };
          }
          (async () => {
            const first = await read(entry);
            const links = [...first.html.matchAll(/href\s*=\s*["']([^"'<>]+)["']/gi)]
              .map(m => m[1].replace(/&amp;/g, "&"))
              .map(href => { try { return new URL(href, first.response.url); } catch { return null; } })
              .filter(url => url && url.protocol === "https:" && allowed.has(url.hostname));
            const publication = links.find(url => /\/index\.html$/i.test(url.pathname));
            const result = { entryStatus: first.response.status,
              discoveredLeafletLinks: links.map(url => url.href).slice(0, 10),
              publicationUrl: publication?.href ?? null,
              publicationStatus: null, basicHtmlStatus: null, issueMarker: null,
              pageLinks: [], note: "Metadata only. No products/prices or store identity inferred." };
            if (publication) {
              const pub = await read(publication.href);
              result.publicationStatus = pub.response.status;
              const basic = new URL("files/basic-html/index.html", pub.response.url);
              const page = await read(basic.href);
              result.basicHtmlStatus = page.response.status;
              result.issueMarker = page.html.match(/\b\d{1,2}(?:AV|LV)\/26\b/i)?.[0] ?? null;
              result.pageLinks = [...page.html.matchAll(/href=["']([^"'<>]+\.html)["']/gi)]
                .map(m => m[1]).filter(x => !x.startsWith("http")).slice(0, 25);
            }
            console.log(JSON.stringify(result, null, 2));
          })().catch(error => { console.error("Leaflet metadata research:", String(error)); process.exitCode = 1; });
          NODE
