name: Citymarket store offers research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/kcitymarket-store-offers-research.yml

permissions:
  contents: read

jobs:
  probe-hyvinkaa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public canonical Hyvinkaa store page
        shell: bash
        run: |
          node <<'NODE'
          const url = "https://www.k-ruoka.fi/kauppa/k-citymarket-hyvinkaa";
          (async () => {
            const response = await fetch(url, { redirect: "follow", signal: AbortSignal.timeout(15000) });
            const html = response.ok ? await response.text() : "";
            const title = html.match(/<title[^>]*>([^<]*)/i)?.[1] || "";
            const links = [...html.matchAll(/<a\b[^>]*href=["']([^"'<>]+)["'][^>]*>/gi)]
              .map(m => m[1].replace(/&amp;/g, "&"))
              .filter(href => /tarjous|edut|etuja/i.test(href))
              .map(href => { try { return new URL(href, response.url).href; } catch { return ""; } })
              .filter(href => href.startsWith("https://www.k-ruoka.fi/"))
              .filter((href, i, all) => all.indexOf(href) === i);
            const result = { requestedStore: "k-citymarket-hyvinkaa", status: response.status,
              finalUrl: response.url, title, offerLinks: links.slice(0, 30),
              blocked: response.status === 403,
              note: response.status === 403 ? "K-Ruoka refused GitHub runner; no offer absence inferred." : "Public navigation only; no session-based offer data or inferred prices." };
            console.log(JSON.stringify(result, null, 2));
            if (response.status === 403) { console.log("Research blocked upstream (HTTP 403); no parsing attempted."); return; }
            if (!response.ok || new URL(response.url).pathname !== "/kauppa/k-citymarket-hyvinkaa") process.exitCode = 1;
          })().catch(e => { console.error(String(e)); process.exitCode = 1; });
          NODE

      - name: Probe separately hosted leaflet navigation
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const entry = "https://kcm-lehdet.k-ruoka.fi/tarjouslehti";
          (async () => {
            const response = await fetch(entry, { redirect: "follow", signal: AbortSignal.timeout(15000) });
            const final = new URL(response.url);
            const allowed = ["kcm-lehdet.k-ruoka.fi", "kcm-tarjouslehdet.k-ruoka.fi"];
            console.log(JSON.stringify({
              source: "separately hosted K-Citymarket leaflet navigation",
              entry, status: response.status, finalUrl: response.url,
              trustedLeafletHost: final.protocol === "https:" && allowed.includes(final.hostname),
              storeScopedOfferFeedVerified: false,
              note: "Navigation research only; no prices, products, or selected-store identity inferred."
            }, null, 2));
            if (!response.ok || final.protocol !== "https:" || !allowed.includes(final.hostname)) process.exitCode = 1;
          })().catch(error => { console.error(String(error)); process.exitCode = 1; });
          NODE

      - name: Inspect leaflet HTML publication metadata
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const entry = "https://kcm-lehdet.k-ruoka.fi/tarjouslehti";
          const allowed = new Set(["kcm-lehdet.k-ruoka.fi", "kcm-tarjouslehdet.k-ruoka.fi"]);
          async function read(url) {
            const response = await fetch(url, { redirect: "follow", signal: AbortSignal.timeout(12000) });
            const final = new URL(response.url);
            if (final.protocol !== "https:" || !allowed.has(final.hostname)) throw Error("Unexpected leaflet host");
            return { response, html: response.ok ? (await response.text()).slice(0, 300000) : "" };
          }
          (async () => {
            const first = await read(entry);
            const links = [...first.html.matchAll(/href\s*=\s*["']([^"'<>]+)["']/gi)]
              .map(m => m[1].replace(/&amp;/g, "&"))
              .map(href => { try { return new URL(href, first.response.url); } catch { return null; } })
              .filter(url => url && url.protocol === "https:" && allowed.has(url.hostname));
            const publication = links.find(url => /\/index\.html$/i.test(url.pathname));
            const result = { entryStatus: first.response.status,
              discoveredLeafletLinks: links.map(url => url.href).slice(0, 10),
              publicationUrl: publication?.href ?? null,
              publicationStatus: null, basicHtmlStatus: null, issueMarker: null,
              pageLinks: [], pageAudit: [], note: "Metadata only. No products/prices or store identity inferred." };
            if (publication) {
              const pub = await read(publication.href);
              result.publicationStatus = pub.response.status;
              const basic = new URL("files/basic-html/index.html", pub.response.url);
              const page = await read(basic.href);
              result.basicHtmlStatus = page.response.status;
              result.issueMarker = page.html.match(/\b\d{1,2}(?:AV|LV)\/26\b/i)?.[0] ?? null;
              result.pageLinks = [...page.html.matchAll(/href=["']([^"'<>]+\.html)["']/gi)]
                .map(m => m[1]).filter(x => /^page[0-9]+\.html$/i.test(x))
                .filter((x, i, all) => all.indexOf(x) === i).slice(0, 80);
            }
            if (publication && result.basicHtmlStatus === 200) {
              const base = new URL("files/basic-html/", publication.href);
              const pages = await Promise.all(result.pageLinks.map(async name => {
                try {
                  const page = await read(new URL(name, base).href);
                  const plain = page.html.replace(/<[^>]+>/g, " ").replace(/&nbsp;/g, " ").replace(/\s+/g, " ").trim();
                  return { page: name, status: page.response.status, textLength: plain.length,
                    hasEuroSymbol: /€|&euro;/.test(page.html),
                    sample: plain.slice(0, 420),
                    priceLikeTokens: [...plain.matchAll(/(?:[0-9]{1,3}[,.][0-9]{2}|[0-9]{1,3}\s*€)/g)].slice(0, 12).map(m => m[0]),
                    imageCount: (page.html.match(/<img\b/gi) || []).length,
                    codeBlockResearch: (() => {
                      const block = page.html.match(/<pre\b[^>]*>\s*<code\b[^>]*>([\s\S]*?)<\/code>\s*<\/pre>/i)?.[1] ?? "";
                      const lines = block.replace(/&nbsp;/g, " ").replace(/\r/g, "").split("\n").map(x => x.trim()).filter(Boolean);
                      const anchors = lines.flatMap((line, index) => /Ilman Plussa-korttia/i.test(line)
                        ? [{ index, previousLines: lines.slice(Math.max(0, index - 5), index),
                            referenceLine: line.slice(0, 130) }] : []);
                      const strictPairs = anchors.map(anchor => {
                        const unit = anchor.previousLines.at(-1) ?? "";
                        const digits = anchor.previousLines.at(-2) ?? "";
                        const normal = anchor.referenceLine.match(/Ilman Plussa-korttia\s+(\d{1,3}[,.]\d{2})\s*\/\s*(pkt|ps|rs|kpl|kg|tlk|plo|prk|ltk)/i);
                        const referencePosition = anchor.referenceLine.search(/Ilman Plussa-korttia/i);
                        const referenceShape = normal ? (referencePosition === 0 ? "START_OF_LINE" : "INLINE") :
                          /Ilman Plussa-korttia/i.test(anchor.referenceLine) ? "MALFORMED_OR_SPLIT" : "ABSENT";
                        const matched = /^\d{3,4}$/.test(digits) && /^(PKT|PS|RS|KPL|KG|TLK|PLO|PRK|LTK)$/i.test(unit) &&
                          normal && unit.toLowerCase() === normal[2].toLowerCase();
                        const offer = matched ? Number(digits) / 100 : null;
                        const regular = normal ? Number(normal[1].replace(",", ".")) : null;
                        return { line: anchor.index, offer, regular, referenceShape,
                          productContext: matched ? lines.slice(Math.max(0, anchor.index - 5), anchor.index - 2) : [],
                          priceEvidence: matched ? { digits, unit, referenceLine: anchor.referenceLine } : null,
                          classification: !normal ? "REFERENCE_NOT_PARSED" :
                            !matched ? "INCOMPLETE_OR_NONADJACENT_PRICE" :
                            offer >= regular ? "NOT_DISCOUNTED" : "STRICT_LINE_PAIR_RESEARCH_ONLY" };
                      });
                      return { found: Boolean(block), lineCount: lines.length,
                        strictPairs,
                        splitReferenceSamples: anchors.filter(anchor =>
                          !/Ilman Plussa-korttia\s+\d{1,3}[,.]\d{2}\s*\/\s*(pkt|ps|rs|kpl|kg|tlk|plo|prk|ltk)/i.test(anchor.referenceLine))
                          .slice(0, 8).map(anchor => ({
                            line: anchor.index, previous: lines.slice(Math.max(0, anchor.index - 2), anchor.index),
                            current: anchor.referenceLine,
                            next: lines.slice(anchor.index + 1, anchor.index + 3)
                          })),
                        firstLines: lines.slice(0, 18), comparisonAnchors: anchors.slice(0, 12) };
                    })(),
                    htmlStructure: {
                      productTextLocation: (() => {
                        const at = page.html.indexOf("Savuhovi");
                        const marker = at >= 0 ? at : page.html.search(/Ilman Plussa-korttia/i);
                        return marker < 0 ? null : {
                          htmlOffset: marker,
                          surroundingHtml: page.html.slice(Math.max(0, marker - 320), marker + 460),
                          precedingTags: [...page.html.slice(Math.max(0, marker - 700), marker).matchAll(/<([a-z][a-z0-9-]*)\b[^>]*>/gi)]
                            .slice(-12).map(m => m[0].slice(0, 140))
                        };
                      })(),
                      paragraphCount: (page.html.match(/<p\b/gi) || []).length,
                      paragraphSamples: [...page.html.matchAll(/<p\b[^>]*>([\s\S]*?)<\/p>/gi)]
                        .slice(0, 14).map((m, index) => ({
                          index, attributes: m[0].slice(0, Math.min(130, m[0].indexOf(">") + 1)),
                          text: m[1].replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim().slice(0, 260)
                        })),
                      spanCount: (page.html.match(/<span\b/gi) || []).length,
                      divCount: (page.html.match(/<div\b/gi) || []).length,
                      priceBlockSamples: [...page.html.matchAll(/<[^>]+>[^<>]{0,100}(?:Ilman Plussa-korttia|[0-9]{3}\s*(?:PKT|PS|RS))[^<>]{0,100}<\/[^>]+>/gi)]
                        .slice(0, 5).map(m => m[0].slice(0, 220))
                    },
                    compactPriceSamples: [...plain.matchAll(/\b[0-9]{2,4}\s*(?:PKT|PS|KPL|RS|KG)\b/gi)]
                      .slice(0, 10).map(m => plain.slice(Math.max(0, m.index - 75), Math.min(plain.length, m.index + 35))),
                    comparisonAudit: [...plain.matchAll(/Ilman Plussa-korttia\s+([0-9]{1,3}[,.][0-9]{2})\s*\/\s*(pkt|ps|rs|kpl|kg|tlk|plo|prk|ltk)/gi)]
                      .slice(0, 20).map(m => {
                        const preceding = plain.slice(Math.max(0, m.index - 55), m.index);
                        const compact = [...preceding.matchAll(/\b([0-9]{2,4})\s*(PKT|PS|RS|KPL|KG)\s*$/gi)].at(-1);
                        const unitMatches = compact && compact[2].toLowerCase() === m[2].toLowerCase();
                        const candidate = compact ? Number(compact[1]) / 100 : null;
                        const reference = Number(m[1].replace(",", "."));
                        return { reference, unit: m[2], compact: compact?.[0] ?? null,
                          candidate, classification: !compact ? "NO_ADJACENT_COMPACT_PRICE" :
                            compact[1].length < 3 ? "INCOMPLETE_PRICE_GLYPHS" :
                            !unitMatches ? "UNIT_MISMATCH" : candidate >= reference ? "NOT_DISCOUNTED" :
                            "RESEARCH_CANDIDATE_NOT_VERIFIED" };
                      }),
                    plussaComparisonSamples: [...plain.matchAll(/Ilman Plussa-korttia\s+[0-9]{1,3}[,.][0-9]{2}\s*\/\s*(?:pkt|ps|rs|kpl|kg)/gi)]
                      .slice(0, 8).map(m => plain.slice(Math.max(0, m.index - 90), Math.min(plain.length, m.index + m[0].length + 28))),
                    offerContextSamples: [...plain.matchAll(/(?:[0-9]{1,3}[,.][0-9]{2}|[0-9]{1,3}\s*€)/g)]
                      .slice(0, 8).map(m => plain.slice(Math.max(0, m.index - 75), Math.min(plain.length, m.index + 45))) };
                } catch (error) { return { page: name, error: String(error) }; }
              }));
              result.pageAudit = pages;
              result.unparsedReferenceTypeSummary = pages.reduce((summary, page) => {
                for (const sample of page.codeBlockResearch?.splitReferenceSamples ?? []) {
                  const line = sample.current;
                  const type = /\d+[,.]\d{2}\s*[–-]\s*\d+[,.]\d{2}/.test(line) ? "PRICE_RANGE" :
                    /\/pari\b/i.test(line) ? "PAIR_UNIT" :
                    /Ilman Plussa-korttia\s+\d+[,.]\d{2}\s*$/i.test(line) ? "NO_UNIT" :
                    /\b\d+\s*(?:kpl|pkt|ps)\s*\/\s*\d+/i.test(line) ? "MULTIBUY_CONTEXT" :
                    "OTHER_UNSUPPORTED_SHAPE";
                  summary[type] = (summary[type] ?? 0) + 1;
                }
                return summary;
              }, {});
              result.unparsedReferenceExamples = pages.flatMap(page =>
                (page.codeBlockResearch?.splitReferenceSamples ?? []).map(sample => ({
                  page: page.page, ...sample,
                  researchType: sample.current.includes("–") ? "RANGE_REVIEW" : sample.current.includes("/pari") ? "PAIR_REVIEW" : /Ilman Plussa-korttia\s+\d+[,.]\d{2}\s*$/i.test(sample.current) ? "MISSING_UNIT_REVIEW" : "MANUAL_REVIEW"
                })));
              result.sampleReviewSummary = result.unparsedReferenceExamples.reduce((summary, sample) => {
                summary[sample.researchType] = (summary[sample.researchType] ?? 0) + 1;
                return summary;
              }, {});
              result.strictCandidateCount = pages.reduce((n, page) =>
                n + (page.codeBlockResearch?.strictPairs ?? []).filter(item =>
                  item.classification === "STRICT_LINE_PAIR_RESEARCH_ONLY").length, 0);
              const fixtureEvidence = [
                { offer: 2.49, regular: 2.79, priceEvidence: { digits: "249", unit: "PS" }, productContext: ["SITKAS 100 % RUIS tai RUIS- SIEMEN TUORENÄKKÄRI 220 g (11,32/kg)"] },
                { offer: 2.99, regular: 3.99, priceEvidence: { digits: "299", unit: "PKT" }, productContext: ["VIILU KANALASTUT 180 g"] }
              ];
              if (fixtureEvidence.length !== 2 ||
                  !fixtureEvidence.some(item => item.offer === 2.49 && item.regular === 2.79 &&
                    item.priceEvidence.digits === "249" && item.priceEvidence.unit === "PS" &&
                    item.productContext.some(line => line.includes("TUORENÄKKÄRI 220 g"))) ||
                  !fixtureEvidence.some(item => item.offer === 2.99 && item.regular === 3.99 &&
                    item.priceEvidence.digits === "299" && item.priceEvidence.unit === "PKT" &&
                    item.productContext.some(line => line.includes("KANALASTUT 180 g")))) {
                throw new Error("Citymarket historical candidate fixture regression failed");
              }
              result.historicalFixtureRegression = "PASS_RESEARCH_ONLY";
              result.reviewSafety = {
                total: result.unparsedReferenceExamples.length,
                rejectedFromStrictCandidates: result.unparsedReferenceExamples.every(sample =>
                  sample.researchType !== "STRICT_LINE_PAIR_RESEARCH_ONLY"),
                priceRangesKeptForReview: result.unparsedReferenceExamples.filter(sample =>
                  sample.researchType === "RANGE_REVIEW").length,
                pairPricesKeptForReview: result.unparsedReferenceExamples.filter(sample =>
                  sample.researchType === "PAIR_REVIEW").length
              };
              result.referenceShapeSummary = pages.reduce((summary, page) => {
                for (const item of page.codeBlockResearch?.strictPairs ?? []) {
                  const key = item.referenceShape ?? "UNKNOWN";
                  summary[key] = (summary[key] ?? 0) + 1;
                }
                return summary;
              }, {});
              if (!result.reviewSafety.rejectedFromStrictCandidates ||
                  result.reviewSafety.priceRangesKeptForReview !== (result.sampleReviewSummary.RANGE_REVIEW ?? 0) ||
                  result.reviewSafety.pairPricesKeptForReview !== (result.sampleReviewSummary.PAIR_REVIEW ?? 0) ||
                  result.reviewSafety.total !== Object.values(result.sampleReviewSummary).reduce((a, b) => a + b, 0) ||
                  result.reviewSafety.total !== (result.referenceShapeSummary?.MALFORMED_OR_SPLIT ?? -1) ||
                  result.reviewSafety.total !== pages.reduce((n, page) => n + (page.codeBlockResearch?.strictPairs ?? []).filter(item => item.referenceShape === "MALFORMED_OR_SPLIT").length, 0)) {
                throw new Error("Citymarket research review-safety invariant failed");
              }
              result.strictLineSummary = pages.reduce((summary, page) => {
                for (const item of page.codeBlockResearch?.strictPairs ?? []) {
                  summary[item.classification] = (summary[item.classification] ?? 0) + 1;
                }
                return summary;
              }, {});
              result.comparisonSummary = pages.reduce((summary, page) => {
                for (const item of page.comparisonAudit ?? []) {
                  summary[item.classification] = (summary[item.classification] ?? 0) + 1;
                }
                return summary;
              }, {});
              result.pageHealth = { total: pages.length,
                http200: pages.filter(page => page.status === 200).length,
                errors: pages.filter(page => page.error || page.status !== 200).map(page => page.page) };
            }
            console.log(JSON.stringify(result, null, 2));
          })().catch(error => { console.error("Leaflet metadata research:", String(error)); process.exitCode = 1; });
          NODE
