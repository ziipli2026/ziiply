name: Arvo iPhone build and tests
on:
  push:
    branches: [feature/arvo-health-consent-foundation]
    paths: ['native/ios/**', '.github/workflows/arvo-ios-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: native/ios
        run: xcodegen generate
      - name: Build and test on available iPhone simulator
        working-directory: native/ios
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if "iPhone" in x["name"]))')
          xcodebuild test -project ZiiplyArvoTest.xcodeproj -scheme ZiiplyArvoTest -destination "platform=iOS Simulator,id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO -resultBundlePath ArvoTests.xcresult
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Arvo-iPhone-test-results
          path: native/ios/ArvoTests.xcresult
