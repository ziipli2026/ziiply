name: Lidl leaflet parser history
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lidl-leaflet-parser-history.yml"
      - "scripts/lidl/**"
      - "scripts/test-lidl-campaign-separation-20261005.mjs"
      - "src/app/api/offers/search/route.ts"
      - "src/app/components/ziiply/cards/ZiiplyMobileOfferSearchCard.tsx"
      - "src/app/components/ziiply/offerSearch/ziiplyOfferSearchCore.ts"
      - "data/lidl/parser-regression/**"
      - "data/lidl/source-captures/**"
      - "src/app/components/ziiply/offerSearch/providers/lidlPublicLeafletProvider.ts"
  schedule:
    # Publication-day checks. Helsinki clock guard keeps DST behaviour stable.
    - cron: '15 12,13,14,15 * * 0,3'
permissions:
  contents: read
concurrency:
  group: lidl-leaflet-parser-history
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Helsinki publication clock
        id: clock
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != schedule ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            hour=$(TZ=Europe/Helsinki date +%H)
            if [ "$hour" = 15 ] || [ "$hour" = 17 ]; then
              echo 'run=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/setup-node@v4
        if: steps.clock.outputs.run == 'true'
        with:
          node-version: '24'
      - name: Install dependencies for production parser replay
        if: steps.clock.outputs.run == 'true'
        run: npm ci --ignore-scripts
      - name: Simulate Lidl publication date gates
        if: steps.clock.outputs.run == 'true'
        run: node scripts/lidl/verify-publication-lifecycle.mjs
      - name: Verify Lidl offer and campaign separation
        if: steps.clock.outputs.run == 'true'
        run: node scripts/test-lidl-campaign-separation-20261005.mjs
      - name: Capture current official Lidl.fi category HTML
        if: steps.clock.outputs.run == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          mkdir -p data/lidl/source-captures
          stamp=$(TZ=Europe/Helsinki date +%Y-%m-%dT%H-%M-%S)
          while IFS='|' read -r slug url; do
            curl --fail --location --retry 3 --user-agent 'ZiiplyLidlLeaflet/1.0' "$url" \
              -o "data/lidl/source-captures/${stamp}-${slug}.html"
            printf '%s\n' "$url" > "data/lidl/source-captures/${stamp}-${slug}.source-url.txt"
          done <<'URLS'
          vihannekset|https://www.lidl.fi/h/vihannekset/h10095593
          lihat|https://www.lidl.fi/h/lihat-ja-makkarat/h10071016
          juustot-maitotuotteet-kananmunat|https://www.lidl.fi/h/juustot-maitotuotteet-ja-kananmunat/h10095761
          kuivatuotteet|https://www.lidl.fi/h/kuivatuotteet/h10096095
          valmisateriat|https://www.lidl.fi/h/valmisateriat/h10097147
          paistopiste|https://www.lidl.fi/h/paistopiste-leivaet-ja-leivonnaiset/h10096086
          URLS
      - name: Verify every archived Lidl parser edition
        if: steps.clock.outputs.run == 'true'
        run: node scripts/lidl/verify-parser-history.mjs verify
      - name: Stage official Lidl candidates
        id: stage
        if: steps.clock.outputs.run == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ZIIPLY_BASE_URL: ${{ secrets.ZIIPLY_BASE_URL }}
        run: |
          test -n "$CRON_SECRET"
          test -n "$ZIIPLY_BASE_URL"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$ZIIPLY_BASE_URL/api/cron/lidl-publications" > /tmp/lidl-stage.json
          node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("/tmp/lidl-stage.json","utf8")); if(!j.ok) process.exit(1); const ids=(j.staged||[]).filter(x=>x.outcome==="stored"||x.outcome==="unchanged").map(x=>x.publicationId).filter(Boolean); fs.appendFileSync(process.env.GITHUB_OUTPUT,"publication_ids="+ids.join(",")+"\n");'
      - name: Promote only regression-verified Lidl candidates
        if: steps.clock.outputs.run == 'true' && steps.stage.outputs.publication_ids != ''
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ZIIPLY_BASE_URL: ${{ secrets.ZIIPLY_BASE_URL }}
          PUBLICATION_IDS: ${{ steps.stage.outputs.publication_ids }}
        run: |
          IFS=',' read -ra ids <<< "$PUBLICATION_IDS"
          for id in "${ids[@]}"; do
            payload=$(node -e 'process.stdout.write(JSON.stringify({publicationId:process.argv[1],regressionPassed:true,regressionCommit:process.env.GITHUB_SHA}))' "$id")
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "$ZIIPLY_BASE_URL/api/cron/lidl-publications/promote"
          done
      - name: Verify production publication diagnostics
        if: steps.clock.outputs.run == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ZIIPLY_BASE_URL: ${{ secrets.ZIIPLY_BASE_URL }}
        run: |
          test -n "$CRON_SECRET"
          test -n "$ZIIPLY_BASE_URL"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$ZIIPLY_BASE_URL/api/internal/publication-diagnostics?chain=LIDL:FI0218" > /tmp/lidl-diagnostics.json
          node -e '
            const fs=require("fs");
            const j=JSON.parse(fs.readFileSync("/tmp/lidl-diagnostics.json","utf8"));
            if(!j.ok) { console.error("Diagnostics endpoint failed", j); process.exit(1); }
            const s=j.summary||{};
            console.log(JSON.stringify({
              status:s.status,
              currentEditionCount:s.currentEditionCount,
              upcomingEditionCount:s.upcomingEditionCount,
              currentValidUntil:s.currentValidUntil,
              nextValidFrom:s.nextValidFrom,
              daysUntilCurrentEnd:s.daysUntilCurrentEnd,
              currentOfferCount:s.currentOfferCount,
              issueCodes:s.issueCodes
            }, null, 2));
            if(s.status==="error" || Number(s.errorCount||0)>0) process.exit(1);
          '
      - name: Upload Lidl source captures for review
        if: steps.clock.outputs.run == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: lidl-official-source-captures
          path: data/lidl/source-captures/*
          if-no-files-found: error
          retention-days: 30
