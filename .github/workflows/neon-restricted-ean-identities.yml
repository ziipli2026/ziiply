name: Desktop Neon - five store-specific identity checks
on:
  push:
    branches: [preview/legacy-desktop-ui]
    paths: ['.github/workflows/neon-restricted-ean-identities.yml', 'scripts/audit-restricted-ean-identities.cjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compare exact restricted EANs separately in Prisma and K-Citymarket
        env:
          DATABASE_URL: ${{ secrets.ZIIPLY_DATABASE_URL }}
        run: node scripts/audit-restricted-ean-identities.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neon-restricted-ean-identities
          path: neon-restricted-ean-identities.json
          if-no-files-found: error
