name: Citymarket 45AV branch verification (manual)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: citymarket-45av-branch-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/citymarket-45av-review
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF image audit dependencies
        run: |
          python -m pip install 'PyMuPDF==1.26.6' 'Pillow>=10,<13'
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr
      - name: Replay corrected parser against frozen 45AV publisher responses
        run: node scripts/citymarket/replay-frozen-parser.mjs diagnostics/45AV diagnostics/45AV/printed-transaction-fixture.json src/app/components/ziiply/offerSearch/providers/kCitymarketSpatialParserCurrent.js
      - name: Extract publisher-verified 45AV product images
        run: |
          python scripts/citymarket/build-images.py diagnostics/45AV --manifest src/app/components/ziiply/offerSearch/providers/data/kCitymarketLeafletImages.json --public public/citymarket-leaflets --reviewed scripts/citymarket/reviewed-selections.json
          node scripts/citymarket/verify-images.mjs
      - name: Run source-backed parser and preflight regressions
        run: node --test tests/citymarket-45av-review.test.cjs tests/citymarket-preflight.test.cjs
      - name: Publish generated image assets to the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/45AV public/citymarket-leaflets src/app/components/ziiply/offerSearch/providers/data/kCitymarketLeafletImages.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish reviewed 45AV image assets [skip ci]'
            git push origin HEAD:refs/heads/fix/citymarket-45av-review
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: citymarket-45av-branch-verification
          path: |
            diagnostics/45AV
            public/citymarket-leaflets
          retention-days: 14
