name: Citymarket price audit regression
on:
  push:
    branches:
      - preview/mobile-citymarket-41lv
    paths:
      - 'scripts/audit-citymarket-prices.cjs'
      - 'scripts/test-citymarket-price-audit.cjs'
      - '.github/workflows/citymarket-price-audit-regression.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/audit-citymarket-prices.cjs'
      - 'scripts/test-citymarket-price-audit.cjs'
      - '.github/workflows/citymarket-price-audit-regression.yml'
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check script syntax
        run: |
          node --check scripts/audit-citymarket-prices.cjs
          node --check scripts/test-citymarket-price-audit.cjs
      - name: Run price audit regression fixtures
        run: node scripts/test-citymarket-price-audit.cjs
