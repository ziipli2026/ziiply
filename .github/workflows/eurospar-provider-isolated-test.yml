name: EUROSPAR provider isolated test

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/app/components/ziiply/offerSearch/providers/eurosparProvider.ts'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated provider guards
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const provider=fs.readFileSync('src/app/components/ziiply/offerSearch/providers/eurosparProvider.ts','utf8');
          const route=fs.readFileSync('src/app/api/offers/search/route.ts','utf8');
          const fail=(m)=>{throw new Error(m)};
          if(!provider.includes('process.env.ZIIPLY_EUROSPAR_ENABLED === "1"')) fail('feature flag is not default-off');
          if(!provider.includes('schemaVersion !== 1')) fail('schema v1 guard missing');
          if(!provider.includes('today < from || today > to')) fail('validity gate missing');
          if(!provider.includes('priceBasis === "multi-buy-total"')) fail('multi-buy semantics missing');
          if(!route.includes('requestedProvider === "eurospar" && Boolean(eurosparStoreName)')) fail('explicit EUROSPAR request gate missing');
          if(!route.includes('if (!isEurosparEnabled())')) fail('route feature flag gate missing');
          if(!route.includes('const rawSStoreId = getParam(searchParams, "sStoreId")')) fail('existing S/K route missing');
          console.log('EUROSPAR route feature-flag guards OK');
          NODE
