name: EUROSPAR provider isolated test

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/app/components/ziiply/offerSearch/providers/eurosparProvider.ts'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck EUROSPAR provider
        run: npx tsc --noEmit
      - name: Verify provider stays disconnected
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const route=fs.readFileSync('src/app/api/offers/search/route.ts','utf8');
          if(route.includes('eurosparProvider')||route.includes('fetchEurosparOffers')) {
            throw new Error('EUROSPAR provider is wired into production route');
          }
          console.log('EUROSPAR provider remains isolated');
          NODE
