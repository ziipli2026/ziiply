name: Citymarket 45AV correction review
on:
  push:
    branches: [fix/citymarket-45av-review]
    paths: ['.github/workflows/citymarket-45av-review.yml', 'scripts/citymarket/review-45av.mjs', 'scripts/citymarket/build-images.py', 'scripts/citymarket/reviewed-selections.json', 'diagnostics/45AV/printed-transaction-fixture.json', 'src/app/components/ziiply/offerSearch/providers/**', 'tests/citymarket-45av-review.test.cjs', 'tests/citymarket-preflight.test.cjs']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node.js dependencies for parser and preflight tests
        run: npm ci --include=dev
      - name: Capture immutable 45AV source once
        run: |
          if [ ! -f diagnostics/45AV/archive-manifest.json ]; then
            node scripts/citymarket/export-leaflet.mjs https://kcm-tarjouslehdet.k-ruoka.fi/89d635q_tarjouslehti_45AV_KCM/index.html diagnostics/45AV src/app/components/ziiply/offerSearch/providers/kCitymarketSpatialParserCurrent.js
          fi
      - name: Replay corrected parser against frozen 45AV publisher responses
        run: node scripts/citymarket/replay-frozen-parser.mjs diagnostics/45AV diagnostics/45AV/printed-transaction-fixture.json src/app/components/ziiply/offerSearch/providers/kCitymarketSpatialParserCurrent.js
      - name: Install PDF image audit dependencies
        run: |
          python -m pip install 'PyMuPDF==1.26.6' 'Pillow>=10,<13'
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr
      - name: Extract only publisher-verified 45AV product images
        run: |
          python scripts/citymarket/build-images.py diagnostics/45AV --manifest src/app/components/ziiply/offerSearch/providers/data/kCitymarketLeafletImages.json --public public/citymarket-leaflets --reviewed scripts/citymarket/reviewed-selections.json
      - name: Verify 45AV image manifest and report unresolved image cards
        run: |
          node scripts/citymarket/verify-images.mjs
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("diagnostics/45AV/image-report.json"));const offers=r.filter(x=>Object.hasOwn(x,"images"));const missing=offers.filter(x=>x.images===0);console.log(JSON.stringify({matched:offers.length-missing.length,total:offers.length,unresolved:missing.length,unresolvedTitles:missing.map(x=>x.title)},null,2));'
      - name: Run 45AV source-backed parser regression tests
        if: always()
        run: node --test tests/citymarket-45av-review.test.cjs tests/citymarket-preflight.test.cjs
      - name: Preserve source and parser evidence for correction review
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/45AV public/citymarket-leaflets src/app/components/ziiply/offerSearch/providers/data/kCitymarketLeafletImages.json
          git diff --cached --quiet || git commit -m 'Freeze 45AV original source for correction review [skip ci]'
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: citymarket-45av-correction-evidence
          path: |
            diagnostics/45AV
            public/citymarket-leaflets
