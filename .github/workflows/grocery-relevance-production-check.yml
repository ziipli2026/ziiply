name: Grocery relevance production check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check live search ordering
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const stores = [["S","s-products","292"],["K","k-products","3221"]];
          const terms = ["kahvi","jogurtti","lohi","banaani","maito","peruna","porkkana","tomaatti","leipä","broileri"];
          let failures=0;
          for(const [chain,route,store] of stores){
            for(const term of terms){
              try{
                const url = "https://ziiply.vercel.app/api/"+route+"?store="+store+"&search="+encodeURIComponent(term);
                const response=await fetch(url,{signal:AbortSignal.timeout(25000)});
                if(!response.ok)throw new Error("HTTP "+response.status);
                const body=await response.json();
                const names=(body.items||[]).slice(0,5).map(x=>x.name);
                console.log(JSON.stringify({chain,term,count:(body.items||[]).length,top:names}));
                if(!names.length){failures++;console.error("EMPTY",chain,term);}
                if(term==="kahvi"&&names.every(n=>/skyr|jogurtti|patukka/i.test(n))){failures++;console.error("COFFEE_ORDER",chain);}
                if(term==="lohi"&&names.every(n=>/koira|kissa|lemmik/i.test(n))){failures++;console.error("FISH_ORDER",chain);}
                const prepared={
                  jogurtti:/patukka|mysli|kastike|salaatti|muro/i,
                  banaani:/smoothie|patukka|puuro|jogurtti|rahka|välipala/i,
                  peruna:/salaatti|sekoitus|pakaste|pihvi|leipä|sämpylä/i,
                  porkkana:/leipä|sämpylä|tikku|pihvi|patukka/i,
                  tomaatti:/pesto|keitto|pasta|mauste|seos|paseerattu|kuivattu/i,
                  leipä:/wiener|kakku|pulla|leivos|leipäjuusto|leipävuoka|leipäsiirappi|leipämallas|leipälastu|leipätikku|leipäveitsi|leipämauste|leipäkassi/i,
                  broileri:/kolmari|wrap|pizza|salaatti|patonki/i
                };
                if(term==="leipä"&&names.slice(0,5).some(n=>/leipäjuusto|leipävuoka|leipäsiirappi|leipämallas|leipätikku|leipäveitsi|leipämauste|leipäkassi/i.test(n))){failures++;console.error("BREAD_FALSE_POSITIVE",chain,names);}
                if(["lohi","broileri"].includes(term)&&names.slice(0,5).some(n=>/latz|polar pet|primadog|pedigree|whiskas|koiranruoka|kissanruoka/i.test(n))){failures++;console.error("PET_FOOD_TOP5",chain,term,names);}
                const bad=prepared[term];
                if(bad&&names.length>=3&&names.slice(0,3).every(n=>bad.test(n))){
                  failures++;console.error("RELEVANCE_ORDER",chain,term,names.slice(0,3));
                }
              }catch(e){failures++;console.error("ERROR",chain,term,String(e));}
            }
          }
          console.log("SUMMARY",JSON.stringify({checks:stores.length*terms.length,failures}));
          if(failures)process.exitCode=1;
          NODE
