name: Security Tjek env

on:
  push:
    branches:
      - security-tjek-env-20260929

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: node scripts/security-hardening-patch-behavior.mjs
      - run: npm run build

