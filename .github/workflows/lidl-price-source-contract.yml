name: Lidl price source contract
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/test-lidl-price-source-contract-v69.mjs'
      - 'scripts/test-lidl-price-record-mapping-v70.mjs'
      - 'scripts/lib/lidl-price-source-contract.mjs'
      - 'scripts/audit-lidl-research-coverage-v71.mjs'
      - 'data/lidl/official-product-image-price-audit-2026-10-04.json'
      - 'data/lidl/official-product-images.generated.json'
      - 'data/lidl/verified-previous-price-observations-2026-10-04.json'
      - 'data/lidl/verified-previous-price-observations-extra-2026-10-04.json'
      - '.github/workflows/lidl-price-source-contract.yml'
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: node --check scripts/test-lidl-price-source-contract-v69.mjs
      - name: Run price provenance fixtures
        run: node scripts/test-lidl-price-source-contract-v69.mjs
      - name: Verify nullable product mapping
        run: node scripts/test-lidl-price-record-mapping-v70.mjs
      - name: Audit real Lidl research data coverage
        run: node scripts/audit-lidl-research-coverage-v71.mjs
