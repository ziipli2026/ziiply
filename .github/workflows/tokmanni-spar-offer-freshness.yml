name: Tokmanni SPAR offer freshness audit
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
    - cron: "17 10 * * *"
    - cron: "17 16 * * *"
    - cron: "10 15 * * 0"
    - cron: "20 15 * * 0"
  push:
    branches: [main, "fix/tokmanni-spar-offer-freshness"]
    paths:
      - "src/app/components/ziiply/offerSearch/providers/tokmanniProvider.ts"
      - "src/app/components/ziiply/offerSearch/providers/eurosparProvider.ts"
      - "src/app/components/ziiply/offerSearch/providers/eurospar-feed.json"
      - "scripts/tokmanni-leaflet-discovery.mjs"
      - "scripts/eurospar-feed-refresh.mjs"
      - "scripts/tokmanni-spar-offer-freshness-audit.mjs"
      - ".github/workflows/tokmanni-spar-offer-freshness.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/app/components/ziiply/offerSearch/providers/tokmanniProvider.ts"
      - "src/app/components/ziiply/offerSearch/providers/eurosparProvider.ts"
      - "src/app/components/ziiply/offerSearch/providers/eurospar-feed.json"
      - "scripts/tokmanni-leaflet-discovery.mjs"
      - "scripts/eurospar-feed-refresh.mjs"
      - "scripts/tokmanni-spar-offer-freshness-audit.mjs"
      - ".github/workflows/tokmanni-spar-offer-freshness.yml"
permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check scripts/eurospar-feed-refresh.mjs
      - run: node scripts/tokmanni-leaflet-discovery.mjs
      - run: node scripts/eurospar-feed-refresh.mjs
      - name: Promote validated EUROSPAR feed
        run: |
          if [ -f eurospar-feed.generated.json ]; then
            cp eurospar-feed.generated.json src/app/components/ziiply/offerSearch/providers/eurospar-feed.json
          fi
      - run: node scripts/tokmanni-spar-offer-freshness-audit.mjs
      - name: Commit refreshed EUROSPAR feed
        if: always()
        run: |
          if git diff --quiet -- src/app/components/ziiply/offerSearch/providers/eurospar-feed.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/components/ziiply/offerSearch/providers/eurospar-feed.json
          git commit -m "Refresh EUROSPAR offer feed"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tokmanni-spar-offer-freshness
          path: |
            tokmanni-spar-offer-freshness.json
            tokmanni-leaflet-discovery.json
            eurospar-feed-candidate.json
            eurospar-feed.generated.json
          if-no-files-found: ignore
