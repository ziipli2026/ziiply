name: Validate 900-query manual audit setup
on:
  push:
    branches: [preview/legacy-desktop-ui]
    paths:
      - 'scripts/fixtures/neon-900-queries.json'
      - 'scripts/validate-neon-900-fixtures.cjs'
      - 'scripts/prepare-neon-live-target.cjs'
      - '.github/workflows/ziiply-live-relevance-audit.yml'
      - '.github/workflows/neon-900-fixture-check.yml'
permissions:
  contents: read
jobs:
  fixtures-and-target:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/test-neon-100-live.cjs
      - run: node --check scripts/prepare-neon-live-target.cjs
      - run: node --check scripts/summarize-neon-900-live.cjs
      - run: node scripts/validate-neon-900-fixtures.cjs
      - run: npm install --global vercel@65.9.0
      - name: Validate protected deployment resolution for manual runs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/prepare-neon-live-target.cjs
