name: Mobile speed limit onscreen debug
on:
  push:
    branches: [fix/mobile-speed-limit-onscreen-debug-20261102]
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python3 scripts/patch-mobile-speed-limit-onscreen-debug.py
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Commit tested mobile debug
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git diff --cached --quiet || (git commit -m "Display mobile speed limit lookup diagnostics on screen" && git push)
