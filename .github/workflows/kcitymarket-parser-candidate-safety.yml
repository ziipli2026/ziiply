name: Citymarket parser candidate safety
on:
  push:
    branches:
      - fix/citymarket-42lv-regression-safe
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/citymarket/test-publisher-transaction-repair.mjs
  historical-41av:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch immutable historical sources
        run: |
          git fetch origin archive/citymarket-publications
          git worktree add --detach /tmp/kcm-frozen origin/archive/citymarket-publications
      - name: Replay approved 41AV
        run: |
          node scripts/citymarket/replay-frozen-parser.mjs /tmp/kcm-frozen/publications/41AV tests/fixtures/citymarket/41AV.approved.json

  image-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate publisher image fragments and 42LV coverage
        env:
          KCM_IMAGE_COVERAGE_REPORT: artifacts/citymarket-images/coverage.json
        run: node scripts/citymarket/verify-images.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kcitymarket-image-coverage
          path: artifacts/citymarket-images/coverage.json
          retention-days: 30

  frozen-42lv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch frozen 42LV publication
        run: |
          git fetch origin archive/citymarket-publications
          git worktree add --detach /tmp/kcm-frozen origin/archive/citymarket-publications
      - name: Install PDF inspection utilities
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Verify original 42LV PDF integrity and page count
        run: |
          echo 'd4ed93636535e2d5aa929ce5f4e41ea6640ea9316857e97d6abfe791c3a1c3cd  /tmp/kcm-frozen/publications/42LV/leaflet.pdf' | sha256sum --check
          test "$(pdfinfo /tmp/kcm-frozen/publications/42LV/leaflet.pdf | awk '/^Pages:/ {print $2}')" = '20'
      - name: Extract original PDF text for suspicious offer pages
        run: |
          for page in 6 20; do
            echo "===== ORIGINAL 42LV PDF PAGE $page ====="
            pdftotext -f "$page" -l "$page" -layout /tmp/kcm-frozen/publications/42LV/leaflet.pdf - | head -c 14000
            echo
          done
      - name: Extract complete original 42LV PDF for page-by-page audit
        run: |
          mkdir -p /tmp/kcm-42lv-pdf-text
          for page in $(seq 1 20); do
            pdftotext -f "$page" -l "$page" -layout /tmp/kcm-frozen/publications/42LV/leaflet.pdf "/tmp/kcm-42lv-pdf-text/page-$(printf '%02d' "$page").txt"
            test -s "/tmp/kcm-42lv-pdf-text/page-$(printf '%02d' "$page").txt"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: kcitymarket-42lv-original-pdf-text
          path: /tmp/kcm-42lv-pdf-text/
          retention-days: 30
      - name: Check archived publication metadata and missing image queue
        env:
          KCM_42LV_MISSING_IMAGES_REPORT: artifacts/citymarket-images/42lv-missing-images.json
        run: |
          node scripts/citymarket/verify-42lv-frozen.mjs /tmp/kcm-frozen/publications/42LV
      - name: Prepare read-only image discovery tasks
        run: node scripts/citymarket/prepare-image-lookups.mjs artifacts/citymarket-images/42lv-missing-images-lookup-only.json artifacts/citymarket-images/42lv-image-discovery-plan.json
      - name: Mock-test Open Food Facts image discovery and EAN provenance
        run: node scripts/citymarket/test-openfoodfacts-discovery.mjs
      - name: Syntax-check opt-in Open Food Facts image discovery
        run: node --check scripts/citymarket/discover-openfoodfacts-images.mjs
      - name: Reject unsafe image candidates in negative tests
        run: node scripts/citymarket/test-image-candidate-review.mjs
      - name: Search real Open Food Facts image candidates for full 42LV queue
        continue-on-error: true
        timeout-minutes: 18
        run: |
          node scripts/citymarket/discover-openfoodfacts-images.mjs artifacts/citymarket-images/42lv-image-discovery-plan.json artifacts/citymarket-images/42lv-real-image-candidates.json 94
          node scripts/citymarket/review-image-candidates.mjs artifacts/citymarket-images/42lv-image-discovery-plan.json artifacts/citymarket-images/42lv-real-image-candidates.json artifacts/citymarket-images/42lv-real-image-review.json
      - name: Validate empty image candidate review
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('artifacts/citymarket-images/42lv-image-discovery-plan.json'));fs.writeFileSync('/tmp/kcm-empty-candidates.json',JSON.stringify({schemaVersion:1,pdfSha256:p.pdfSha256,publication:p.publication,items:[]}))"
          node scripts/citymarket/review-image-candidates.mjs artifacts/citymarket-images/42lv-image-discovery-plan.json /tmp/kcm-empty-candidates.json artifacts/citymarket-images/42lv-image-candidate-review.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kcitymarket-42lv-missing-images
          path: |
            artifacts/citymarket-images/42lv-missing-images.json
            artifacts/citymarket-images/42lv-missing-images-lookup-only.json
            artifacts/citymarket-images/42lv-image-discovery-plan.json
            artifacts/citymarket-images/42lv-image-candidate-review.json
            artifacts/citymarket-images/42lv-real-image-candidates.json
            artifacts/citymarket-images/42lv-real-image-review.json
          retention-days: 30
