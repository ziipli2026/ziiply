name: K-Citymarket - kuvien paivitys
on:
  workflow_dispatch:
  schedule:
    - cron: '40 * * * *'
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Enrich approved Cittari publication images directly in Neon
        env:
          DATABASE_URL: ${{ secrets.ZIIPLY_DATABASE_URL }}
        run: npx --yes tsx scripts/ziiply-kcitymarket-image-refresh.mts
