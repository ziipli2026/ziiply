name: Gosta mixed weight basket regression
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit-gosta-weight-mixed-basket-20261002.cjs'
      - '.github/workflows/gosta-weight-mixed-basket.yml'
      - 'src/app/page.tsx'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/audit-gosta-weight-mixed-basket-20261002.cjs
