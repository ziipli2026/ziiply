name: SPAR live provider read-only audit
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/tokmanni-spar-live-provider-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spar-live-audit
          path: spar-live-audit.json
          if-no-files-found: ignore
