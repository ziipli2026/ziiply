name: Desktop offer categories and debug
on:
  push:
    branches: [preview/legacy-desktop-ui]
    paths:
      - src/app/desktop-preview/page.tsx
      - src/app/components/ziiply/offerSearch/ziiplyOfferSearchCore.ts
      - tests/desktop-offer-category-debug.test.cjs
      - .github/workflows/desktop-offer-category-debug.yml
permissions:
  contents: read
jobs:
  categories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund
      - run: npx tsc src/app/components/ziiply/offerSearch/ziiplyOfferSearchCore.ts --target ES2021 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck --outDir /tmp/ziiply-offer-core
      - run: ZIIPLY_OFFER_CORE_DIR=/tmp/ziiply-offer-core node --test tests/desktop-offer-category-debug.test.cjs
      - run: npm run build
