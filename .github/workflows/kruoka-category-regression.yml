name: K-ruoka diagnostics
# ZIIPLY_KRUOKA_DIAGNOSTIC_TRIGGER_20260927

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kruoka-category-regression.yml'

jobs:
  category-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Run 300-case category simulation
        shell: bash
        run: |
          node <<'NODE'
          const normalize = (v) => String(v ?? "").toLowerCase()
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
            .replace(/[^a-z0-9åäö\s-]/g, " ").replace(/\s+/g, " ").trim();

          function current(name, department="") {
            const productText=normalize(name), dep=normalize(department);
            if (/\b(mikroateria|valmisateria|valmisruoka|keitto|keitot|lasagne|laatikko|risotto|wrap|wrapit|cesarsalaatti|caesarsalaatti|taco-salaattisekoitus)\b/.test(productText)) return "Valmisruoka";
            if (/\b(lohi|kirjolohi|silakka|muikku|tonnikala|katkarapu|seiti|turska)\b/.test(productText)) return "Kala";
            if (/\b(jauheliha|makkara|makkarat|lenkkimakkara|nakki|nakit|broileri|kana|nauta|porsas|possu|pekoni|kinkku|leikkele|leikkeleet|palvileikkele|palvileikkeleet)\b/.test(productText)) return "Liha & makkarat";
            if (/\b(jogurtti|jugurtti|maito|piima|rahka|juusto|juustoraaste|juustoraasteet|kerma|kananmuna|vanukas|vanukkaat|mousse)\b/.test(productText)) return "Maitotuotteet";
            if (/\b(mehu|mehut|limu|limsat|virvoitusjuoma|virvoitusjuomat|cola|vichy|vesi|energiajuoma|energiajuomat|smoothie|palautusjuoma|palautusjuomat|seltzer)\b/.test(productText)) return "Juomat";
            if (/\b(jaatelo|jaatelot|pakaste|pakastettu|nugget|nuggetit|ranskalaiset|wokvihannes|pakastevihannes|pakastemarja)\b/.test(productText)) return "Pakasteet";
            if (/\b(kissan|koiran|kissanhiekka|lemmikki|sheba)\b/.test(productText)) return "Lemmikit";
            if (/\b(hammastahna|hammastahnat|shampoo|deodorantti|colgate|elmex|suuvesi|suuvedet|hammasharja|hammasharjat)\b/.test(productText)) return "Hygienia & kosmetiikka";
            if (/\b(wc-paperi|talouspaperi|pesuaine|pesuaineet|astianpesu)\b/.test(productText)) return "Kodinhoito";
            if (/\b(calluna|paristo|paristot)\b/.test(productText)) return "Koti & vapaa-aika";
            if (/\b(vehnatortilla|vehnatortillat|granola|granolat|mysli|myslit|salsa|salsat|ananakset|ananas)\b/.test(productText)) return "Kuivatuotteet";
            if (/\b(perunalastu|perunalastut|lastu|lastut|chips|suklaa|suklaat|karkki|karkit|makeinen|makeiset|keksi|keksit|purukumi|purukumit)\b/.test(productText)) return "Makeiset & keksit";
            if (/\b(salaatti|salaatit|tomaatti|tomaatit|kurkku|kurkut|suolakurkku|suolakurkut|maustekurkku|maustekurkut|omena|omenat|banaani|banaanit|appelsiini|appelsiinit|satsuma|satsumat|sipuli|sipulit|porkkana|porkkanat|paprika|paprikat|kaali|hedelma|hedelmat|vihannes|vihannekset|marja|marjat|mustikka|mustikat|mango|mangot|rucola)\b/.test(productText)) return "Hevi";
            if (/\b(leipa|leivat|sampyla|sampylat|patonki|patongit|pulla|pullat|munkki|munkit|donitsi|donitsit)\b/.test(productText)) return "Leipomo";
            if (dep.includes("fish")||dep.includes("seafood")) return "Kala";
            if (dep.includes("meat")) return "Liha & makkarat";
            if (dep.includes("pet")) return "Lemmikit";
            return "Muut";
          }

          function proposed(name, department="") {
            const t=normalize(name), dep=normalize(department);
            // Strong context guards before food-name inference.
            if (/\b(koiran|kissan|dog|cat|puppy|kitten|lemmikki|lemmikin|lemmikkien|sheba)\b/.test(t) || dep.includes("pet")) return "Lemmikit";
            if (/\b(mikroateria|valmisateria|valmisruoka|keitto|keitot|lasagne|laatikko|risotto|wrap|wrapit|cesarsalaatti|caesarsalaatti|taco-salaattisekoitus)\b/.test(t)) return "Valmisruoka";
            if (/\b(lohi|lohta|lohen|kirjolohi|kirjolohta|kirjolohen|nieria|nierian|silakka|silakat|muikku|muikut|tonnikala|katkarapu|katkaravut|seiti|turska)\b/.test(t)) return "Kala";
            if (/(?:^|\s|-)(?:jauheliha\w*|siskonmakkara\w*|grillimakkara\w*|lenkkimakkara\w*|makkara\w*|nakki\w*|broileri\w*|kananpoja\w*|kanan(?:\s|$)|kalkkuna\w*|naudan\w*|nauta\w*|viljaporsaan\w*|porsaan\w*|porsas\w*|possu\w*|pekoni\w*|palvikinkku\w*|saunapalvikinkku\w*|uunikinkku\w*|korppukinkku\w*|kinkku\w*|leikkele\w*|karjalanpaisti-liha\w*|lihasuikale\w*|ulkofilee\w*|sisafilee\w*|fileepihvi\w*|minuuttifilee\w*)/.test(t)) return "Liha & makkarat";
            return current(name, department);
          }

          const fixed=[
            ["TUORE KOKONAINEN NIERIÄ","fish","Kala"],
            ["Wursti SISKONMAKKARA","fish","Liha & makkarat"],
            ["Atria KANAN MINUUTTIFILEET","fish","Liha & makkarat"],
            ["Atria VILJAPORSAAN ULKOFILEE","fish","Liha & makkarat"],
            ["Ruokamestarin PAREMMAT KARJALANPAISTI-LIHAT","fish","Liha & makkarat"],
            ["Taste of the Wild Dog Pacific Stream Lohi 2 kg","pet","Lemmikit"],
            ["Sheba lohi annospussi","pet","Lemmikit"],
            ["Pirkka kanaliemikuutio","","Muut"],
            ["Knorr lihaliemikuutio","","Muut"],
            ["Knorr kalaliemikuutio","","Muut"],
            ["Atria makkarakeitto 300g","","Valmisruoka"],
            ["Pirkka lohikeitto 300g","","Valmisruoka"],
            ["Savuhovi saunapalvikinkku 180g","","Liha & makkarat"],
            ["Atria kananpojan fileepihvi","","Liha & makkarat"],
            ["HK naudan paistisuikale","","Liha & makkarat"],
            ["Pirkka kalkkunaleikkele","","Liha & makkarat"],
            ["Pirkka kananmuna 10kpl","","Maitotuotteet"],
            ["Pirkka kirjolohifilee","","Kala"],
          ];

          const meatBases=["siskonmakkara","grillimakkara","lenkkimakkara","kanan minuuttifilee","kananpojan fileepihvi","broilerin fileesuikale","viljaporsaan ulkofilee","porsaan kassler","naudan paistisuikale","kalkkunaleikkele","saunapalvikinkku","uunikinkku","korppukinkku","pekoni","jauheliha"];
          const brands=["Atria","HK","Pirkka","Wursti"];
          const fish=["lohi","kirjolohi","nieriä","silakka","muikku","tonnikala","katkarapu","seiti","turska"];
          const pets=["koiran lohi kuivaruoka","kissan tonnikala annospussi","Dog Pacific Stream Lohi","Puppy kirjolohi ruoka"];
          const traps=["kanaliemikuutio","lihaliemikuutio","kalaliemikuutio","makkarakeitto","lohikeitto","kananmuna","kananmakuinen nuudeli","lihanmakuinen kastike"];
          const cases=[...fixed];
          for(const b of brands) for(const x of meatBases) cases.push([b+" "+x+" 300g","fish","Liha & makkarat"]);
          for(const b of brands) for(const x of fish) cases.push([b+" "+x+" 400g","fish","Kala"]);
          for(const b of brands) for(const x of pets) cases.push([b+" "+x+" 2kg","pet","Lemmikit"]);
          for(const b of brands) for(const x of traps) cases.push([b+" "+x,"", x.includes("keitto")?"Valmisruoka":x==="kananmuna"?"Maitotuotteet":"Muut"]);
          let n=1;
          while(cases.length<300){cases.push(["Testibrändi "+n+" vehnätortilla 320g","colonial","Muut"]);n++;}
          let curWrong=0,newWrong=0,regressions=[],fixes=[];
          for(const [name,dep,expected] of cases){
            const c=current(name,dep), p=proposed(name,dep);
            if(c!==expected) curWrong++;
            if(p!==expected) newWrong++;
            if(c===expected && p!==expected) regressions.push({name,dep,expected,current:c,proposed:p});
            if(c!==expected && p===expected) fixes.push({name,dep,expected,current:c,proposed:p});
          }
          console.log(JSON.stringify({total:cases.length,currentWrong:curWrong,proposedWrong:newWrong,regressions:regressions.length,fixes:fixes.length,regressionSamples:regressions.slice(0,30),fixSamples:fixes.slice(0,50)},null,2));
          if(regressions.length) process.exitCode=2;
          NODE

      - name: Verify K multi-buy price semantics
        shell: bash
        run: |
          node <<'NODE'
          const num=v=>{const n=Number(v);return Number.isFinite(n)?n:null};
          const priceText=v=>{const n=num(v);return n==null?"":n.toFixed(2).replace(".",",")};
          function mappedPrice(o){
            const effective=num(o.appPrice)??num(o.membershipPrice)??num(o.price)??num(o.fromPrice);
            if(effective==null||effective<=0) return null;
            const from=num(o.pieceCountFrom), to=num(o.pieceCountTo);
            const quantity=from!=null&&from>1&&to===from?from:null;
            return {price:effective,priceText:quantity==null?priceText(effective):`${priceText(effective)} € / ${quantity} kpl`,quantity};
          }
          const multi=mappedPrice({membershipPrice:5,pieceCountFrom:2,pieceCountTo:2});
          const single=mappedPrice({membershipPrice:5,pieceCountFrom:1,pieceCountTo:1});
          console.log(JSON.stringify({multi,single},null,2));
          if(multi?.price!==5||multi?.priceText!=="5,00 € / 2 kpl"||multi?.quantity!==2) process.exitCode=2;
          if(single?.price!==5||single?.priceText!=="5,00"||single?.quantity!==null) process.exitCode=3;
          NODE

      - name: Audit Keski- ja Ita-Suomi publication stores
        shell: bash
        run: |
          node <<'NODE'
          const ORIGIN="https://etarjouslehdet.fi", BUSINESS="f305U8", PUBLICATION="VgNLpUyJ";
          const stableBase64=value=>Buffer.from(JSON.stringify(value,(_k,v)=>Object.prototype.toString.call(v)==="[object Object]"?Object.keys(v).sort().reduce((o,k)=>(o[k]=v[k],o),{}):v),"utf8").toString("base64");
          async function data(name,params){
            const key=stableBase64([name,params]);
            const r=await fetch(ORIGIN+"/",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json, text/plain, */*",Referer:ORIGIN+"/K-Supermarket"},body:JSON.stringify({data:[key]})});
            if(!r.ok) throw new Error(name+" HTTP "+r.status);
            for(const line of (await r.text()).split(/\r?\n/).filter(Boolean)){try{const row=JSON.parse(line);if(row.key===key)return row.value;}catch{}}
            throw new Error(name+" key missing");
          }
          const arr=v=>Array.isArray(v?.data)?v.data.filter(x=>x&&typeof x==="object"):[];
          const stores=arr(await data("stores",{publicationId:PUBLICATION,businessId:BUSINESS,pagination:{offset:0,limit:1000}}));
          const safe=stores.map(s=>({id:s.id??null,name:s.name??null,city:s.city??s.address?.city??null}));
          console.log(JSON.stringify({publicationId:PUBLICATION,count:safe.length,stores:safe},null,2));
          if(!safe.length) process.exitCode=2;
          NODE

      - name: Audit regional K-Supermarket production pipeline
        shell: bash
        run: |
          node <<'NODE'
          const ORIGIN="https://etarjouslehdet.fi", BUSINESS="f305U8", PUBLICATION="VgNLpUyJ";
          const stableBase64=value=>Buffer.from(JSON.stringify(value,(_k,v)=>Object.prototype.toString.call(v)==="[object Object]"?Object.keys(v).sort().reduce((o,k)=>(o[k]=v[k],o),{}):v),"utf8").toString("base64");
          async function data(name,params){
            const key=stableBase64([name,params]);
            const r=await fetch(ORIGIN+"/",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json, text/plain, */*",Referer:ORIGIN+"/K-Supermarket"},body:JSON.stringify({data:[key]})});
            if(!r.ok) throw new Error(name+" HTTP "+r.status);
            for(const line of (await r.text()).split(/\r?\n/).filter(Boolean)){try{const row=JSON.parse(line);if(row.key===key)return row.value;}catch{}}
            throw new Error(name+" key missing");
          }
          const arr=v=>Array.isArray(v?.data)?v.data.filter(x=>x&&typeof x==="object"):[];
          const num=v=>{const n=Number(v);return Number.isFinite(n)?n:null};
          const offers=arr(await data("offers",{businessIds:[BUSINESS],sources:["publication","business_product"],pagination:{limit:1000,offset:0},sort:["score_desc"]}));
          const regional=offers.filter(o=>String(o.publicationPublicId??"")===PUBLICATION);
          const mapped=[], dropped=[];
          for(const o of regional){
            const membership=num(o.membershipPrice), app=num(o.appPrice), regular=num(o.price), from=num(o.fromPrice);
            const effective=app??membership??regular??from;
            const row={id:o.publicId??null,name:o.name??o.title??null,membershipPrice:membership,appPrice:app,price:regular,fromPrice:from,pieceCountFrom:num(o.pieceCountFrom),pieceCountTo:num(o.pieceCountTo)};
            if(effective==null||effective<=0) dropped.push({...row,reason:"no-positive-effective-price"});
            else mapped.push({...row,effective});
          }
          console.log(JSON.stringify({publicationId:PUBLICATION,allBusinessOffers:offers.length,regionalOffers:regional.length,mapped:mapped.length,dropped:dropped.length,droppedRows:dropped},null,2));
          if(!regional.length) console.log("KNOWN_GAP: business-scoped offers query omits regional publication");
          NODE

      - name: Probe regional K-Supermarket offer query shapes
        shell: bash
        run: |
          node <<'NODE'
          const ORIGIN="https://etarjouslehdet.fi", BUSINESS="f305U8", PUBLICATION="VgNLpUyJ";
          const stableBase64=value=>Buffer.from(JSON.stringify(value,(_k,v)=>Object.prototype.toString.call(v)==="[object Object]"?Object.keys(v).sort().reduce((o,k)=>(o[k]=v[k],o),{}):v),"utf8").toString("base64");
          async function data(name,params){
            const key=stableBase64([name,params]);
            const r=await fetch(ORIGIN+"/",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json, text/plain, */*",Referer:ORIGIN+"/K-Supermarket"},body:JSON.stringify({data:[key]})});
            const txt=await r.text(); if(!r.ok)return {error:"HTTP "+r.status};
            for(const line of txt.split(/\r?\n/).filter(Boolean)){try{const row=JSON.parse(line);if(row.key===key)return row.value;}catch{}}
            return {error:"key missing"};
          }
          const arr=v=>Array.isArray(v?.data)?v.data.filter(x=>x&&typeof x==="object"):[];
          const queries=[
            ["publicationId",{publicationId:PUBLICATION,pagination:{limit:1000,offset:0}}],
            ["publicationIds",{publicationIds:[PUBLICATION],pagination:{limit:1000,offset:0}}],
            ["publicationId+sources",{publicationId:PUBLICATION,sources:["publication"],pagination:{limit:1000,offset:0}}],
            ["publicationIds+sources",{publicationIds:[PUBLICATION],sources:["publication"],pagination:{limit:1000,offset:0}}],
            ["business+publicationId",{businessIds:[BUSINESS],publicationId:PUBLICATION,sources:["publication","business_product"],pagination:{limit:1000,offset:0},sort:["score_desc"]}],
            ["business+publicationIds",{businessIds:[BUSINESS],publicationIds:[PUBLICATION],sources:["publication","business_product"],pagination:{limit:1000,offset:0},sort:["score_desc"]}]
          ];
          const out=[];
          for(const [label,params] of queries){
            const v=await data("offers",params), rows=arr(v);
            out.push({label,error:v?.error??null,count:rows.length,publicationMatches:rows.filter(o=>String(o.publicationPublicId??"")===PUBLICATION).length,sample:rows.slice(0,3).map(o=>({id:o.publicId??null,name:o.name??null,publicationId:o.publicationPublicId??null}))});
          }
          console.log(JSON.stringify(out,null,2));
          if(!out.some(x=>x.publicationMatches>0)) console.log("KNOWN_GAP: offers query shapes do not expose the regional publication");
          NODE

      - name: Discover active regional publication for selected K-Supermarket
        shell: bash
        run: |
          node <<'NODE'
          const ORIGIN="https://etarjouslehdet.fi", BUSINESS="f305U8", TARGET="K-Supermarket Eväskontti";
          const stableBase64=value=>Buffer.from(JSON.stringify(value,(_k,v)=>Object.prototype.toString.call(v)==="[object Object]"?Object.keys(v).sort().reduce((o,k)=>(o[k]=v[k],o),{}):v),"utf8").toString("base64");
          async function data(name,params){
            const key=stableBase64([name,params]);
            const r=await fetch(ORIGIN+"/",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json, text/plain, */*",Referer:ORIGIN+"/K-Supermarket"},body:JSON.stringify({data:[key]})});
            if(!r.ok) throw new Error(name+" HTTP "+r.status);
            for(const line of (await r.text()).split(/\r?\n/).filter(Boolean)){try{const row=JSON.parse(line);if(row.key===key)return row.value;}catch{}}
            throw new Error(name+" key missing");
          }
          const arr=v=>Array.isArray(v?.data)?v.data.filter(x=>x&&typeof x==="object"):[];
          const norm=s=>String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
          const stores=arr(await data("stores",{businessId:BUSINESS,pagination:{offset:0,limit:1000}}));
          const selected=stores.find(s=>norm(s.name)===norm(TARGET)); if(!selected) throw new Error("target store missing");
          const candidates=[
            "ecbpeytj","WTcTbNSm","wsonqubf","VgNLpUyJ","7VJyII7Q","5brdfQ15","Lfu5WbgE","FanAklUL","EdyJW2k4"
          ];
          const matches=[];
          for(const publicationId of candidates){
            const publicationStores=arr(await data("stores",{publicationId,businessId:BUSINESS,pagination:{offset:0,limit:1000}}));
            if(publicationStores.some(s=>String(s.id??"")===String(selected.id??""))) matches.push({publicationId,storeCount:publicationStores.length});
          }
          console.log(JSON.stringify({target:{id:selected.id,name:selected.name,city:selected.city??null},matches},null,2));
          if(matches.length!==1) process.exitCode=2;
          NODE

      - name: Verify regional K-Supermarket end-to-end offer load
        shell: bash
        run: |
          node <<'NODE'
          const ORIGIN="https://etarjouslehdet.fi", VIEWER="https://publication-viewer.tjek.com", BUSINESS="f305U8", PUBLICATION="VgNLpUyJ";
          const stableBase64=value=>Buffer.from(JSON.stringify(value,(_k,v)=>Object.prototype.toString.call(v)==="[object Object]"?Object.keys(v).sort().reduce((o,k)=>(o[k]=v[k],o),{}):v),"utf8").toString("base64");
          async function data(name,params){
            const key=stableBase64([name,params]);
            const r=await fetch(ORIGIN+"/",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json, text/plain, */*",Referer:ORIGIN+"/K-Supermarket"},body:JSON.stringify({data:[key]})});
            if(!r.ok) throw new Error(name+" HTTP "+r.status);
            for(const line of (await r.text()).split(/\r?\n/).filter(Boolean)){try{const row=JSON.parse(line);if(row.key===key)return row.value;}catch{}}
            throw new Error(name+" key missing");
          }
          const ids=[];
          for(let page=1;page<=20;page++){
            const r=await fetch(`${VIEWER}/api/paged-publications/${PUBLICATION}/${page}`,{headers:{Accept:"application/json"}});
            if(!r.ok){if(page>1&&(r.status===400||r.status===404))break;throw new Error("page "+page+" HTTP "+r.status);}
            const p=await r.json();
            for(const h of p?.hotspots??[]){const id=String(h?.offer?.id??"");if(id&&!ids.includes(id))ids.push(id);}
          }
          const offers=[];
          for(const publicId of ids){const o=await data("offer",{publicId});if(o&&typeof o==="object")offers.push(o);}
          const num=v=>{if(v==null||v==="")return null;const n=Number(v);return Number.isFinite(n)?n:null};
          const mapped=offers.map(o=>{
            const membership=num(o.membershipPrice),app=num(o.appPrice),regular=num(o.price),from=num(o.fromPrice);
            const effective=app??membership??regular??from;
            const qf=num(o.pieceCountFrom),qt=num(o.pieceCountTo);
            const quantity=qf!=null&&qf>1&&qt===qf?qf:null;
            return {id:o.publicId,name:o.name,publicationId:o.publicationPublicId,effective,quantity,priceText:effective==null?null:(quantity?`${effective.toFixed(2).replace(".",",")} € / ${quantity} kpl`:effective.toFixed(2).replace(".",","))};
          }).filter(x=>x.effective!=null&&x.effective>0);
          const atria=mapped.find(x=>x.id==="hvXKgK6Pr_zW8-p74D1yh");
          const mappedIds=new Set(mapped.map(x=>String(x.id)));
          const dropped=offers.filter(o=>!mappedIds.has(String(o.publicId??""))).map(o=>({id:o.publicId??null,name:o.name??null,publicationId:o.publicationPublicId??null,membershipPrice:o.membershipPrice??null,appPrice:o.appPrice??null,price:o.price??null,fromPrice:o.fromPrice??null,pieceCountFrom:o.pieceCountFrom??null,pieceCountTo:o.pieceCountTo??null}));
          console.log(JSON.stringify({hotspotIds:ids.length,structuredOffers:offers.length,mappedOffers:mapped.length,dropped,atria},null,2));
          if(ids.length!==45||offers.length!==45||!atria||atria.effective!==5||atria.quantity!==2||atria.priceText!=="5,00 € / 2 kpl") process.exitCode=2;
          NODE

      - name: Verify regional K-Supermarket merge isolation
        shell: bash
        run: |
          node <<'NODE'
          const ORIGIN="https://etarjouslehdet.fi", BUSINESS="f305U8", TARGET="K-Supermarket Eväskontti";
          const PUBLICATIONS=["ecbpeytj","WTcTbNSm","wsonqubf","VgNLpUyJ","7VJyII7Q","5brdfQ15","Lfu5WbgE","FanAklUL","EdyJW2k4"];
          const stableBase64=value=>Buffer.from(JSON.stringify(value,(_k,v)=>Object.prototype.toString.call(v)==="[object Object]"?Object.keys(v).sort().reduce((o,k)=>(o[k]=v[k],o),{}):v),"utf8").toString("base64");
          async function data(name,params){const key=stableBase64([name,params]);const r=await fetch(ORIGIN+"/",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json, text/plain, */*",Referer:ORIGIN+"/K-Supermarket"},body:JSON.stringify({data:[key]})});if(!r.ok)throw new Error(name+" HTTP "+r.status);for(const line of (await r.text()).split(/\r?\n/).filter(Boolean)){try{const row=JSON.parse(line);if(row.key===key)return row.value;}catch{}}throw new Error(name+" key missing");}
          const arr=v=>Array.isArray(v?.data)?v.data.filter(x=>x&&typeof x==="object"):[];
          const norm=s=>String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
          const stores=arr(await data("stores",{businessId:BUSINESS,pagination:{offset:0,limit:1000}}));
          const selected=stores.find(s=>norm(s.name)===norm(TARGET));if(!selected)throw new Error("selected store missing");
          const allowed=[];
          for(const publicationId of PUBLICATIONS){const ps=arr(await data("stores",{publicationId,businessId:BUSINESS,pagination:{offset:0,limit:1000}}));if(ps.some(s=>String(s.id??"")===String(selected.id??"")))allowed.push(publicationId);}
          const base=arr(await data("offers",{businessIds:[BUSINESS],sources:["publication","business_product"],pagination:{limit:1000,offset:0},sort:["score_desc"]}));
          const regionalIds=[];
          for(const publicationId of allowed){for(let page=1;page<=20;page++){const r=await fetch(`https://publication-viewer.tjek.com/api/paged-publications/${publicationId}/${page}`);if(!r.ok){if(page>1&&(r.status===400||r.status===404))break;throw new Error("page HTTP "+r.status);}const p=await r.json();for(const h of p?.hotspots??[]){const id=String(h?.offer?.id??"");if(id&&!regionalIds.includes(id))regionalIds.push(id);}}}
          const baseIds=new Set(base.map(o=>String(o.publicId??"")).filter(Boolean));
          const overlap=regionalIds.filter(id=>baseIds.has(id));
          console.log(JSON.stringify({selected:{id:selected.id,name:selected.name},allowedPublications:allowed,baseOffers:base.length,regionalIds:regionalIds.length,overlapCount:overlap.length,overlap},null,2));
          if(allowed.length!==1||allowed[0]!=="VgNLpUyJ"||regionalIds.length!==45)process.exitCode=2;
          NODE

      - name: Verify regional K-Supermarket offerIds batch
        shell: bash
        run: |
          node <<'NODE'
          const ORIGIN="https://etarjouslehdet.fi", VIEWER="https://publication-viewer.tjek.com", PUBLICATION="VgNLpUyJ";
          const stableBase64=value=>Buffer.from(JSON.stringify(value,(_k,v)=>Object.prototype.toString.call(v)==="[object Object]"?Object.keys(v).sort().reduce((o,k)=>(o[k]=v[k],o),{}):v),"utf8").toString("base64");
          async function data(name,params){const key=stableBase64([name,params]);const r=await fetch(ORIGIN+"/",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json, text/plain, */*",Referer:ORIGIN+"/K-Supermarket"},body:JSON.stringify({data:[key]})});if(!r.ok)throw new Error(name+" HTTP "+r.status);for(const line of (await r.text()).split(/\r?\n/).filter(Boolean)){try{const row=JSON.parse(line);if(row.key===key)return row.value;}catch{}}throw new Error(name+" key missing");}
          const arr=v=>Array.isArray(v?.data)?v.data.filter(x=>x&&typeof x==="object"):[];
          const ids=[];
          for(let page=1;page<=20;page++){const r=await fetch(`${VIEWER}/api/paged-publications/${PUBLICATION}/${page}`);if(!r.ok){if(page>1&&(r.status===400||r.status===404))break;throw new Error("page HTTP "+r.status);}const p=await r.json();for(const h of p?.hotspots??[]){const id=String(h?.offer?.id??"");if(id&&!ids.includes(id))ids.push(id);}}
          const shapes=[
            ["offerIds+source",{offerIds:ids,sources:["publication"]}],
            ["offerIds+source+pagination",{offerIds:ids,sources:["publication"],pagination:{limit:1000,offset:0}}],
            ["offerIds",{offerIds:ids}]
          ];
          const out=[];
          for(const [label,params] of shapes){try{const rows=arr(await data("offers",params));const got=new Set(rows.map(o=>String(o.publicId??"")));out.push({label,count:rows.length,matched:ids.filter(id=>got.has(id)).length,atria:rows.find(o=>o.publicId==="hvXKgK6Pr_zW8-p74D1yh")?{membershipPrice:rows.find(o=>o.publicId==="hvXKgK6Pr_zW8-p74D1yh").membershipPrice,pieceCountFrom:rows.find(o=>o.publicId==="hvXKgK6Pr_zW8-p74D1yh").pieceCountFrom,pieceCountTo:rows.find(o=>o.publicId==="hvXKgK6Pr_zW8-p74D1yh").pieceCountTo}:null});}catch(e){out.push({label,error:String(e)});}}
          console.log(JSON.stringify({ids:ids.length,out},null,2));
          if(!out.some(x=>x.matched===ids.length)) process.exitCode=2;
          NODE

      # Live-data audit is intentionally kept in this same workflow so there is only one K-ruoka diagnostic flow.
      - name: Fetch live K-Supermarket Jokela offers and classify
        shell: bash
        run: |
          node <<'NODE'
          const ORIGIN="https://etarjouslehdet.fi";
          const BUSINESS="f305U8";
          const normalize=v=>String(v??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()
            .replace(/[‐-‒–—−]/g,"-").replace(/&/g," ja ").replace(/[^a-z0-9åäö]+/gi," ").replace(/\s+/g," ").trim();
          const stableBase64=value=>Buffer.from(JSON.stringify(value,(_k,v)=>Object.prototype.toString.call(v)==="[object Object]"?Object.keys(v).sort().reduce((o,k)=>(o[k]=v[k],o),{}):v),"utf8").toString("base64");
          async function data(name,params){
            const key=stableBase64([name,params]);
            const r=await fetch(ORIGIN+"/",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json, text/plain, */*",Referer:ORIGIN+"/K-Supermarket"},body:JSON.stringify({data:[key]})});
            if(!r.ok) throw new Error(name+" HTTP "+r.status);
            const txt=await r.text();
            for(const line of txt.split(/\r?\n/).filter(Boolean)){try{const row=JSON.parse(line);if(row.key===key)return row.value;}catch{}}
            throw new Error(name+" key missing");
          }
          const arr=v=>Array.isArray(v?.data)?v.data.filter(x=>x&&typeof x==="object"):[];
          function category(o){
            const department=normalize(o.departmentSlug??o.department??"");
            const t=normalize([o.name,o.title,o.description].filter(Boolean).join(" "));
            if (/\b(koiran|kissan|dog|cat|puppy|kitten|lemmikki|lemmikin|lemmikkien|sheba)\b/.test(t)||department.includes("pet")) return "Lemmikit";
            if (/\b(mikroateria|valmisateria|valmisruoka|keitto|keitot|lasagne|laatikko|risotto|wrap|wrapit|cesarsalaatti|caesarsalaatti|taco salaattisekoitus)\b/.test(t)) return "Valmisruoka";
            if (/\b(lohi|lohta|lohen|kirjolohi|kirjolohta|kirjolohen|nieria|nierian|silakka|silakat|muikku|muikut|tonnikala|katkarapu|katkaravut|seiti|turska)\b/.test(t)) return "Kala";
            if (/(?:^|\s|-)(?:jauheliha\w*|siskonmakkara\w*|grillimakkara\w*|lenkkimakkara\w*|makkara\w*|nakki\w*|broileri\w*|kananpoja\w*|kanan(?:\s|$)|kalkkuna\w*|naudan\w*|nauta\w*|viljaporsaan\w*|porsaan\w*|porsas\w*|possu\w*|pekoni\w*|palvikinkku\w*|saunapalvikinkku\w*|uunikinkku\w*|korppukinkku\w*|kinkku\w*|leikkele\w*|karjalanpaisti liha\w*|lihasuikale\w*|ulkofilee\w*|sisafilee\w*|fileepihvi\w*|minuuttifilee\w*)/.test(t)) return "Liha & makkarat";
            if (/\b(jogurtti|jugurtti|maito|piima|rahka|juusto|juustoraaste|juustoraasteet|kerma|kananmuna|vanukas|vanukkaat|mousse)\b/.test(t)) return "Maitotuotteet";
            if (/\b(mehu|mehut|limu|limsat|virvoitusjuoma|virvoitusjuomat|cola|vichy|vesi|energiajuoma|energiajuomat|smoothie|palautusjuoma|palautusjuomat|seltzer)\b/.test(t)) return "Juomat";
            if (/\b(jaatelo|jaatelot|pakaste|pakastettu|nugget|nuggetit|ranskalaiset|wokvihannes|pakastevihannes|pakastemarja)\b/.test(t)) return "Pakasteet";
            if (/\b(kissan|koiran|kissanhiekka|lemmikki|sheba)\b/.test(t)) return "Lemmikit";
            if (/\b(hammastahna|hammastahnat|shampoo|deodorantti|colgate|elmex|suuvesi|suuvedet|hammasharja|hammasharjat)\b/.test(t)) return "Hygienia & kosmetiikka";
            if (/\b(wc paperi|talouspaperi|pesuaine|pesuaineet|astianpesu)\b/.test(t)) return "Kodinhoito";
            if (/\b(calluna|paristo|paristot)\b/.test(t)) return "Koti & vapaa-aika";
            if (/\b(vehnatortilla|vehnatortillat|granola|granolat|mysli|myslit|salsa|salsat|ananakset|ananas)\b/.test(t)) return "Kuivatuotteet";
            if (/\b(perunalastu|perunalastut|lastu|lastut|chips|suklaa|suklaat|karkki|karkit|makeinen|makeiset|keksi|keksit|purukumi|purukumit)\b/.test(t)) return "Makeiset & keksit";
            if (/\b(salaatti|salaatit|tomaatti|tomaatit|kurkku|kurkut|suolakurkku|suolakurkut|maustekurkku|maustekurkut|omena|omenat|banaani|banaanit|appelsiini|appelsiinit|satsuma|satsumat|sipuli|sipulit|porkkana|porkkanat|paprika|paprikat|kaali|hedelma|hedelmat|vihannes|vihannekset|marja|marjat|mustikka|mustikat|mango|mangot|rucola)\b/.test(t)) return "Hevi";
            if (/\b(leipa|leivat|sampyla|sampylat|patonki|patongit|pulla|pullat|munkki|munkit|donitsi|donitsit)\b/.test(t)) return "Leipomo";
            if(department.includes("snack")||department.includes("candy")||department.includes("confection")||department.includes("sweet")) return "Makeiset & keksit";
            if(department.includes("frozen")) return "Pakasteet";
            if(department.includes("fruit")||department.includes("vegetable")) return "Hevi";
            if(department.includes("beverage")||department.includes("drink")) return "Juomat";
            if(department.includes("fish")||department.includes("seafood")) return "Kala";
            if(department.includes("meat")) return "Liha & makkarat";
            if(department.includes("bakery")||department.includes("bread")) return "Leipomo";
            if(department.includes("dairy")) return "Maitotuotteet";
            if(department.includes("pet")) return "Lemmikit";
            if(department.includes("household")||department.includes("clean")) return "Kodinhoito";
            if(department.includes("personal care")||department.includes("beauty")||department.includes("hygiene")) return "Hygienia & kosmetiikka";
            if(department.includes("colonial")) return "Kuivatuotteet";
            return "Muut";
          }
          const stores=arr(await data("stores",{businessId:BUSINESS,pagination:{offset:0,limit:1000}}));
          const selected=stores.find(s=>normalize(s.name)==="k supermarket jokela")||stores.find(s=>normalize(s.name).includes("jokela"));
          if(!selected) throw new Error("Jokela store not found");
          const offers=arr(await data("offers",{businessIds:[BUSINESS],sources:["publication","business_product"],pagination:{limit:1000,offset:0},sort:["score_desc"]}));
          const pubIds=[...new Set(offers.map(o=>String(o.publicationPublicId??"")).filter(Boolean))];
          const allowed=new Set();
          for(const publicationId of pubIds){
            const ps=arr(await data("stores",{publicationId,businessId:BUSINESS,pagination:{offset:0,limit:1000}}));
            if(ps.some(s=>String(s.id??"")===String(selected.id??"")||normalize(s.name)===normalize(selected.name))) allowed.add(publicationId);
          }
          const live=offers.filter(o=>allowed.has(String(o.publicationPublicId??""))).map(o=>({publicId:String(o.publicId??""),name:String(o.name??o.title??""),department:String(o.departmentSlug??o.department??""),category:category(o),publicationId:String(o.publicationPublicId??""),membershipPrice:o.membershipPrice??null,appPrice:o.appPrice??null,price:o.price??null,fromPrice:o.fromPrice??null,pieceCountFrom:o.pieceCountFrom??null,pieceCountGet:o.pieceCountGet??null,pieceCountGetFor:o.pieceCountGetFor??null,pieceCountMin:o.pieceCountMin??null,pieceCountTo:o.pieceCountTo??null,pieceCountMax:o.pieceCountMax??null,unitPrice:o.unitPrice??null,baseUnit:o.baseUnit??null}));
          const counts={}; for(const x of live) counts[x.category]=(counts[x.category]||0)+1;
          const suspicious=live.filter(x=>x.category==="Kala"||x.category==="Muut"||/makkara|kanan|broiler|pors|naudan|liha|kinkku|leikkele|lohi|nier/i.test(x.name));
          const atria=live.filter(x=>/atria kanan minuuttifileet/i.test(x.name));
          console.log(JSON.stringify({store:{id:selected.id,name:selected.name},rawOffers:offers.length,allowedPublications:[...allowed],liveOffers:live.length,categoryCounts:counts,atria,suspicious},null,2));
          if(!live.length) process.exitCode=2;
          NODE
