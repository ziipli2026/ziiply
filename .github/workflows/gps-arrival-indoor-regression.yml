name: GPS arrival indoor regression
on:
  push:
    branches:
      - test/mobile-store-arrival-gps-debug-20261102
    paths:
      - 'src/app/components/ziiply/location/**'
      - 'scripts/test-gps-arrival-indoor-regression.cjs'
      - '.github/workflows/gps-arrival-indoor-regression.yml'
  workflow_dispatch:
jobs:
  arrival:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/test-gps-arrival-indoor-regression.cjs
      - run: node scripts/test-ziiply-arrival-sequence.cjs
      - run: node scripts/test-ziiply-arrival-scenarios.cjs
      - run: node scripts/test-scanner-live-arrival.cjs
