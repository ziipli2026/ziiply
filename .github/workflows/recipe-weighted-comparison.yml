name: Recipe weighted comparison
on:
  push:
    paths:
      - 'src/app/page.tsx'
      - 'scripts/audit-recipe-weighted-comparison-20261024.cjs'
      - '.github/workflows/recipe-weighted-comparison.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/audit-recipe-weighted-comparison-20261024.cjs
