name: Prisma fallback deep resolver audit (read-only)
on:
  push:
    paths:
      - '.github/workflows/prisma-fallback-deep-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run resolver + current-ID audit
        run: |
          node <<'NODE' | tee prisma-fallback-deep-audit.txt
          const T=[
            ["Prisma Hämeenkatu Tampere","726413330",61.4982,23.7608,"Tampere","Hämeenkatu 21"],
            ["Prisma Raksila Oulu","516528759",65.0126,25.4848,"Oulu","Tehtaankatu 3"],
            ["Prisma Myyrmanni Vantaa","726435566",60.2615,24.8536,"Vantaa","Iskoskuja 3"],
            ["Prisma Jumbo Vantaa","613761030",60.2925,24.9635,"Vantaa","Vantaanportinkatu 3"],
            ["Prisma Limingantulli Oulu","627829302",64.9977,25.4650,"Oulu","Nuottasaarentie 1"],
            ["Prisma Lielahti Tampere","697940575",61.5179,23.6665,"Tampere","Turvesuonkatu 2"],
            ["Prisma Kaleva Tampere","517609418",61.4979,23.8282,"Tampere","Sammonkatu 75"]
          ];
          const H="44ca017dddccfe49e787b483f471f26217adca807f8c71101d11e881abd9e480";
          const PH="6da249b0fd87c05275a239ed490976c851d7aff90ead0f3a3978e8283f21252d";
          const C="production-45c31f7a746096c6da12e16aba1887e031fbd9de";
          const PC="production-14a82a5b48cd1dd42c0592db0037514ed3c84de";
          const date=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Helsinki"}).format(new Date());
          const n=x=>String(x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();
          async function prod(id){const v={availabilityDate:date,facets:[{key:"brandName",order:"asc"},{key:"category"},{key:"labels"}],filters:[{key:"labels",value:["DISCOUNTED"]}],generatedSessionId:"1d6b5de9-df99-4608-af07-7d754955df82",fetchSponsoredContent:true,limit:48,queryString:"",sortForAvailabilityLabelDate:date,storeId:String(id),useRandomId:false,marketingId:"d0bcc6e5-6130-494e-b6fb-12b5cb9c60cf",from:0,offset:0,skip:0,page:1},u=new URL("https://api.s-kaupat.fi/");u.searchParams.set("operationName","RemoteFilteredProducts");u.searchParams.set("variables",JSON.stringify(v));u.searchParams.set("extensions",JSON.stringify({persistedQuery:{version:1,sha256Hash:H}}));const r=await fetch(u,{headers:{accept:"application/graphql-response+json,application/json;q=0.9","content-type":"application/json","accept-language":"fi",origin:"https://www.s-kaupat.fi",referer:"https://www.s-kaupat.fi/","x-client-name":"skaupat-web","x-client-version":C}}),d=await r.json();return {http:r.status,rows:d?.data?.store?.products?.productListItems||[],errors:d?.errors||null}}
          async function slots(lat,lon){const u=new URL("https://api.s-kaupat.fi/");u.searchParams.set("operationName","remotePickupSlots");u.searchParams.set("variables",JSON.stringify({startDate:date,endDate:date,location:{latitude:lat,longitude:lon},limit:20}));u.searchParams.set("extensions",JSON.stringify({persistedQuery:{version:1,sha256Hash:PH}}));const r=await fetch(u,{headers:{accept:"application/json","content-type":"application/json",origin:"https://www.s-kaupat.fi",referer:"https://www.s-kaupat.fi/","x-client-name":"skaupat-web","x-client-version":PC}}),d=await r.json();const candidates=[d?.data?.pickupSlotsForCoordinates?.slotsInPickupPoints,d?.data?.pickupSlots?.slotsInPickupPoints,d?.data?.pickupSlotsForCoordinates,d?.data?.pickupSlots];let rows=[];for(const q of candidates)if(Array.isArray(q)){rows=q;break}return {http:r.status,errors:d?.errors||null,rows}}
          function safe(rows,name,city,street){const tokens=n(name).replace(/^prisma /,"").replace(/ tampere| vantaa| oulu$/g,"").split(" ").filter(x=>x.length>3),ct=n(city),st=n(street).replace(/\s+\d.*$/,""),a=[];for(const x of rows){const S=x.store||{},P=x.pickupPoint||x,pn=n(P.name),pc=n(P.address?.city||P.city),pa=n(P.address?.streetAddress||P.address?.street||P.address),brand=n(S.brand||"");if(!brand.includes("prisma")&&!pn.includes("prisma"))continue;const nh=tokens.some(t=>pn.includes(t)),ch=pc===ct,sh=st.length>3&&pa.includes(st);if((nh&&ch)||(sh&&ch))a.push({id:String(S.id||""),name:P.name||"",address:pa,city:pc})}const ids=[...new Set(a.map(x=>x.id).filter(Boolean))];return{id:ids.length===1?ids[0]:null,candidates:a}}
          for(const [name,id,lat,lon,city,street] of T){const c=await prod(id);const o={name,currentId:id,currentHttp:c.http,currentCount:c.rows.length,currentErrors:c.errors};if(c.rows.length===0){const p=await slots(lat,lon);const rr=safe(p.rows,name,city,street);o.pickupHttp=p.http;o.pickupErrors=p.errors;o.fallbackId=rr.id;o.candidates=rr.candidates.slice(0,8);if(rr.id&&rr.id!==id){const f=await prod(rr.id);o.fallbackCount=f.rows.length;o.fallbackHttp=f.http;o.fallbackErrors=f.errors}}console.log(JSON.stringify(o));await new Promise(r=>setTimeout(r,700))}
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: prisma-fallback-deep-audit
          path: prisma-fallback-deep-audit.txt
