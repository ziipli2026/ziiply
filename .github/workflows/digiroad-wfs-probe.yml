name: Digiroad WFS speed limit probe
on:
  push:
    branches: [test/digiroad-wfs-speed-limits]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Query five sample locations (read-only)
        run: node scripts/test-digiroad-wfs-speed-limits.mjs
      - name: Match simulated GPS trajectories to real Digiroad line geometries
        run: node scripts/test-digiroad-map-matching.mjs

      - name: GPS matching safety regressions
        run: node scripts/test-digiroad-matching-safety.mjs

      - name: Probe motorways ring roads and major routes for 60 to 120 kmh
        run: node scripts/test-digiroad-main-roads.mjs

      - name: Compare lightweight GPS sized main-road queries
        run: node scripts/test-digiroad-lightweight-roads.mjs

      - name: Verify small GPS query preserves actual high speed segment
        run: node scripts/test-digiroad-segment-centered.mjs

      - name: Test reusable Digiroad matcher
        run: node scripts/test-digiroad-module.mjs

      - name: Test speed limit confirmation and route continuity
        run: node scripts/test-digiroad-speed-tracker.mjs

      - name: Test GPS cache and network request suppression
        run: node scripts/test-digiroad-speed-service.mjs

      - name: Simulate 80 to 100 to 120 kmh GPS drive
        run: node scripts/test-digiroad-long-drive.mjs
