name: Desktop normal search - 31 live priced EANs
on:
  workflow_dispatch:
  push:
    branches: [preview/legacy-desktop-ui]
    paths: [.github/workflows/desktop-priced-31.yml, scripts/audit-desktop-priced-31.cjs]
permissions:
  contents: read
concurrency:
  group: desktop-priced-31
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --global vercel@65.9.0
      - name: Pin deployed desktop and verify source
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/prepare-neon-live-target.cjs
      - name: Audit actual normal handler and selected-store prices
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/audit-desktop-priced-31.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-priced-31
          path: desktop-priced-31.json
          if-no-files-found: error
