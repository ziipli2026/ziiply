name: Ziiply arrival and offer cache simulations
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/app/components/ziiply/location/ziiplyArrivalSequence.ts'
      - 'scripts/test-ziiply-arrival-scenarios.cjs'
      - 'src/app/components/ziiply/offerSearch/ziiplyOfferSearchCore.ts'
      - 'src/app/components/ziiply/mobile/MobileStorePickerModal.tsx'
      - '.github/workflows/ziiply-arrival-simulation.yml'
jobs:
  arrival-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node scripts/test-ziiply-arrival-scenarios.cjs
  offer-selection-cache-simulation:
    runs-on: ubuntu-latest
    steps:
      - name: Selection cache state-machine regression
        run: |
          node <<'NODE'
          const cache=new Map(), fetchCount=new Map();
          const norm=x=>String(x||"").toLowerCase().trim();
          const key=s=>[s.mode,norm(s.sId),norm(s.sName),norm(s.kId),norm(s.kName)].join("|");
          async function provider(s){const k=key(s);fetchCount.set(k,(fetchCount.get(k)||0)+1);return {offers:s.mode==="hyper"?37:24,storeKey:k}}
          async function warm(s){const k=key(s);if(cache.has(k))return {hit:true,...cache.get(k)};const v=await provider(s);cache.set(k,v);return {hit:false,...v}}
          (async()=>{
            const hyper={mode:"hyper",sId:"prisma-hyvinkaa",sName:"Prisma Hyvinkää",kId:"3221",kName:"K-Citymarket Hyvinkää"};
            const local={mode:"local",sId:"519941769",sName:"S-market Vehkoja",kId:"ks-jokela",kName:"K-Supermarket Jokela"};
            const changed={...local,sId:"685839110",sName:"S-market Jokela"};
            const a=await warm(hyper),b=await warm(hyper),c=await warm(local),d=await warm(hyper),e=await warm(changed);
            const checks={firstMiss:!a.hit,repeatHit:b.hit,newModeMiss:!c.hit,returnHit:d.hit,storeChangeMiss:!e.hit,hyperFetchedOnce:fetchCount.get(key(hyper))===1,localFetchedOnce:fetchCount.get(key(local))===1};
            console.log(JSON.stringify({checks,fetchCount:Object.fromEntries(fetchCount)},null,2));
            if(Object.values(checks).some(v=>!v))process.exitCode=1;
          })();
          NODE
  offer-warmup-code-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real offer warmup shares master cache and campaign results
        run: |
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const src=fs.readFileSync('src/app/components/ziiply/offerSearch/ziiplyOfferSearchCore.ts','utf8');
          const warm=src.match(/export async function warmZiiplyGostaOfferCacheV182\([\s\S]*?\n\}/)?.[0];
          assert.ok(warm,'warmup function exists');
          assert.match(warm,/fetchGostaMasterOfferResultsV156\(context\)/,'warmup uses same master request');
          assert.match(warm,/preparedGostaAllV803\(context, masterResults\)/,'warmup prepares result');
          assert.match(warm,/campaignType === "campaign"/,'warmup includes campaigns');
          assert.match(src,/ZIIPLY_GOSTA_MASTER_CACHE_TTL_MS_V156 = 5 \* 60 \* 1000/,'five minute TTL');
          assert.match(src,/ziiplyGostaMasterCacheV156\.get\(contextKey\)/,'master reads cached result');
          console.log('PASS actual offer warmup implementation shares master cache, prepares campaigns, and has 5-minute TTL');
          NODE
  offer-selection-wiring-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whether store selection invokes actual offer warmup
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict');
          const root='src/app/components/ziiply';
          let matches=[];
          function walk(dir){for(const ent of fs.readdirSync(dir,{withFileTypes:true})){const p=path.join(dir,ent.name);if(ent.isDirectory())walk(p);else if(/\.(tsx?|jsx?)$/.test(p)&&!p.includes('.backup.')){const s=fs.readFileSync(p,'utf8');if(s.includes('warmZiiplyGostaOfferCacheV182'))matches.push({path:p,uses:s.split('warmZiiplyGostaOfferCacheV182').length-1});}}}
          walk(root);
          console.log('Actual warmup references:',JSON.stringify(matches));
          assert.ok(matches.some(m=>m.uses>1)||matches.length>1,'Warmup is defined but no call from store-selection UI was found');
          NODE
