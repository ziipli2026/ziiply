name: Ziiply OFF missing EAN lookup
run-name: OFF EAN empty queue regression test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ziiply-off-missing-eans.yml'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum missing EANs to query per run'
        required: true
        default: '2000'
        type: choice
        options: ['100','500','1000','1500','2000']
  schedule:
    - cron: '20 1 * * *'
concurrency:
  group: ziiply-off-missing-eans
  cancel-in-progress: false
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4' 'certifi>=2025.1.31'
      - run: python -m py_compile scripts/import-off-missing-eans.py
      - name: Fetch missing EANs from OFF
        env:
          DATABASE_URL: ${{ secrets.ZIIPLY_DATABASE_URL }}
          OFF_LOOKUP_LIMIT: ${{ inputs.limit || '2000' }}
          OFF_LOOKUP_RECHECK_HOURS: '720'
          OFF_LOOKUP_FORCE_RECHECK: 'false'
        run: python -u scripts/import-off-missing-eans.py
