name: Offer image regression

on:
  push:
    branches:
      - preview/legacy-desktop-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Image matching regression
        run: npm run test:offer-images
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Regression summary
        if: always()
        run: echo 'Offer image checks finished; inspect preceding steps for result.' >> "$GITHUB_STEP_SUMMARY"
