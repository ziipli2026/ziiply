name: Audit K-Market regional publications
on:
  pull_request:
    paths:
      - 'scripts/audit-kmarket-regions.mjs'
      - '.github/workflows/audit-kmarket-regions.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare Tjek K-Market publications
        run: node scripts/audit-kmarket-regions.mjs
