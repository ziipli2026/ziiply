name: Normal search source and responsive smoke
on:
  workflow_dispatch:
  push:
    branches: [test/normal-search-full-audit-20261117]
    paths:
      - 'tests/normal-search-source-contract.test.cjs'
      - 'tests/normal-search-parity.spec.cjs'
      - '.github/workflows/normal-search-smoke.yml'
permissions:
  contents: read
jobs:
  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/normal-search-source-contract.test.cjs
  responsive-search:
    strategy:
      fail-fast: false
      matrix:
        mobile-width: [390, 820]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --no-package-lock @playwright/test
      - run: npx playwright install chromium
      - name: Verify final search results on phone/tablet and desktop
        env:
          NORMAL_SEARCH_SMOKE: '1'
          NORMAL_SEARCH_MOBILE_WIDTH: ${{ matrix.mobile-width }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          ZIIPLY_LIVE_URL: https://ziiply-git-test-monta-four-chains-l-25d7a2-ziipli2026s-projects.vercel.app
        run: |
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET" || exit 1
          npx playwright test tests/normal-search-parity.spec.cjs --browser=chromium --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: normal-responsive-${{ matrix.mobile-width }}
          path: normal-search-evidence/
          if-no-files-found: ignore
