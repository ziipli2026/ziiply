name: Ziiply live relevance audit - 127 products
on:
  workflow_dispatch:
jobs:
  relevance:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Compile shared comparison rules
        run: npx tsc src/app/components/ziiply/ziiplyCore.ts --target ES2021 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck --outDir .tmp-five-baskets
      - name: Audit live S and K search results
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/ziiply-relevance-audit-live.cjs
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relevance-shard-${{ matrix.shard }}
          path: relevance-reports/
          if-no-files-found: warn
