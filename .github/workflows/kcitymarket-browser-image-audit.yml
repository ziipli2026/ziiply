name: K-Citymarket - selaimen kuvatesti
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts --legacy-peer-deps --no-audit --no-fund playwright
      - name: Install Playwright Chromium
        run: npx --yes playwright install --with-deps chromium
      - name: Test actual image decode in Chromium
        env:
          DATABASE_URL: ${{ secrets.ZIIPLY_DATABASE_URL }}
        run: npx --yes tsx scripts/ziiply-kcitymarket-browser-image-audit.mts
