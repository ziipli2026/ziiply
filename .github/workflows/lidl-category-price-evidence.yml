name: Lidl category price evidence batch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect-lidl-category-price-evidence.mjs'
      - 'scripts/build-lidl-ean-price-plan.mjs'
      - 'scripts/lib/lidl-public-price-classifier.mjs'
      - 'scripts/lib/lidl-evidence-freshness.mjs'
      - 'data/lidl/verified-ean-links.json'
      - '.github/workflows/lidl-category-price-evidence.yml'
  pull_request:
    paths:
      - 'scripts/collect-lidl-category-price-evidence.mjs'
      - 'scripts/build-lidl-ean-price-plan.mjs'
      - 'scripts/lib/lidl-public-price-classifier.mjs'
      - 'scripts/lib/lidl-evidence-freshness.mjs'
      - 'data/lidl/verified-ean-links.json'
      - '.github/workflows/lidl-category-price-evidence.yml'
  workflow_dispatch:
  schedule:
    - cron: "15 6,12,16 * * 1,4"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Lidl collector syntax
        run: node --check scripts/collect-lidl-category-price-evidence.mjs
      - name: Collect official Lidl category price evidence
        run: |
          mkdir -p tmp/lidl
          node scripts/collect-lidl-category-price-evidence.mjs \
            https://www.lidl.fi/h/valmisateriat/h10097147 \
            https://www.lidl.fi/h/vihannekset/h10095593 \
            https://www.lidl.fi/h/juustot/h10096077 \
            https://www.lidl.fi/h/saeilykehedelmaet-ja-vihannekset/h10096100 \
            https://www.lidl.fi/h/kuivatuotteet/h10096095 \
            https://www.lidl.fi/h/lihat/h10095752 \
            https://www.lidl.fi/h/juustot-maitotuotteet-ja-kananmunat/h10095761 \
            https://www.lidl.fi/h/paistopiste-leivaet-ja-leivonnaiset/h10096086 \
            https://www.lidl.fi/h/leivaet-ja-leivonnaiset/h10096094 \
            https://www.lidl.fi/h/kahvit-teet-ja-kaakaot/h10071683 \
            https://www.lidl.fi/h/pakastepizzat-ja-snacksit/h10096197 \
            https://www.lidl.fi/h/hedelmaet-ja-vihannekset/h10071012 \
            https://www.lidl.fi/h/kala/h10071050 \
            https://www.lidl.fi/h/oljyt-ja-kastikkeet/h10096110 \
            https://www.lidl.fi/h/murot-ja-hillot/h10096153 \
            https://www.lidl.fi/h/pakasteet/h10071049 \
            https://www.lidl.fi/h/makeiset-ja-snacksit/h10096205 \
            https://www.lidl.fi/h/juomat/h10071022 \
            https://www.lidl.fi/h/kana/h10095753 \
            https://www.lidl.fi/h/naudanliha/h10095754 \
            https://www.lidl.fi/h/sianliha/h10095755 \
            https://www.lidl.fi/h/leikkeleet/h10095758 \
            https://www.lidl.fi/h/maito-ja-kerma/h10096075 \
            https://www.lidl.fi/h/jogurtit-ja-rahkat/h10096076 \
            https://www.lidl.fi/h/riisi-ja-pasta/h10096096 \
            https://www.lidl.fi/h/keitot-ja-kastikkeet/h10096098 \
            https://www.lidl.fi/c/hyytaevaen-herkullinen-se-kannattaa/a10104529 \
            https://www.lidl.fi/c/uutta-valikoimassa/a10026611 \
            > tmp/lidl/category-price-evidence.json
          node -e 'const x=require("./tmp/lidl/category-price-evidence.json"); if((x.records?.length||0)<20) throw new Error(`Too few strong Lidl price observations: ${x.records?.length||0}`); console.log("strong",x.strongCount,"review",x.reviewCount,"statusCounts",x.statusCounts,"matchCounts",x.matchCounts,"officialApi",x.officialApi)'\n          node scripts/build-lidl-ean-price-plan.mjs tmp/lidl/category-price-evidence.json > tmp/lidl/ean-price-plan.json\n          node -e 'const x=require("./tmp/lidl/ean-price-plan.json"); console.log("exact EAN price plan",x.count)'
      - uses: actions/upload-artifact@v4
        with:
          name: lidl-category-price-evidence
          path: |\n            tmp/lidl/category-price-evidence.json\n            tmp/lidl/ean-price-plan.json
          retention-days: 14
