name: Normal product K-match simulation

on:
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Live coverage and counterpart simulations
        shell: bash
        run: |
          node <<'NODE'
          const BASE="https://ziiply.vercel.app";
          const pairs=[{label:"HYPER Hyvinkää",s:292,k:3221},{label:"LOCAL Jokela",s:721,k:3334}];
          const queries=["kevytmaito","täysmaito","jauheliha","kahvi","juusto","jogurtti","ruisleipä","cola","voi","kananmuna","broileri","pasta","riisi","banaani","tomaatti","kinkku","makkara","rahka","kaurajuoma","kerma","kala","leikkele","murot","mehu","pakastepizza","jäätelö","ketsuppi","majoneesi","tonnikala","lohi","margariini","mysli","suklaa","keksit","piimä","maustamaton jogurtti","raejuusto","tuorejuusto","mozzarella","meetvursti","pekoni","nakki","kananfilee","kanasuikale","kalapuikko","katkarapu","peruna","porkkana","kurkku","paprika","omena","appelsiini","sipuli","salaatti","kaurahiutale","vehnäjauho","sokeri","suola","rypsiöljy","oliiviöljy","tomaattimurska","pavut","hernekeitto","nuudeli","tortilla","sämpylä","paahtoleipä","näkkileipä","granola","vanukas","proteiinirahka","mehukeitto","energiajuoma","kivennäisvesi","limonadi","kasvimaito","soijajuoma","mantelijuoma","ruokakerma","kuohukerma","smetana","ranskankerma","majoneesisalaatti","valmisateria","keitto","salaattiateria","pakastevihannes","ranskanperuna","kalakeitto","lihapulla"];
          const norm=v=>String(v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9åäö%]+/g," ").replace(/\s+/g," ").trim();
          const ean=v=>String(v||"").replace(/\D/g,"");
          const size=v=>{const raw=String(v||"").toLowerCase().replace(/,/g,".");const m=raw.match(/(\d+(?:\.\d+)?)\s*(kg|g|l|dl|cl|ml)\b/);if(!m)return "";let n=+m[1],u=m[2];if(u==="kg"){n*=1000;u="g";}else if(u==="l"){n*=1000;u="ml";}else if(u==="dl"){n*=100;u="ml";}else if(u==="cl"){n*=10;u="ml";}return String(n)+u;};
          async function get(path){const r=await fetch(BASE+path,{headers:{accept:"application/json"}});if(!r.ok)throw new Error(path+" HTTP "+r.status);return r.json();}
          async function s(q,id){return (await get("/api/s-products?search="+encodeURIComponent(q)+"&store="+id)).items||[];}
          async function k(q,id){return (await get("/api/k-products?search="+encodeURIComponent(q)+"&store="+id)).items||[];}
          function hardBad(a,b){
            const A=norm(a),B=norm(b),pet=/koira|koiran|koirille|dog|primadog|best in|dibo/;
            if(!pet.test(A)&&pet.test(B))return true;
            if(A.includes("kokonainen broileri")&&!B.includes("kokonainen broileri"))return true;
            if(A.includes("kananmuna")&&/leikkuri/.test(B))return true;
            const forms=["pizza","wrap","patonki","croissant","kolmioleipa","keitto","keittokuppi","ateria","ateriakuppi","pasta ateria","smoothie","rahkapulla","piirakka"];
            for(const x of forms)if(A.includes(x)!==B.includes(x))return true;
            if(A.includes("jauheliha")){
              for(const x of ["kana","sika nauta","nauta kana","viljapors","nauta viljaposs","nauta"])if(A.includes(x)!==B.includes(x))return true;
              const ap=A.match(/(\\d{1,2})%/),bp=B.match(/(\\d{1,2})%/);if(ap&&bp&&Math.abs(+ap[1]-+bp[1])>2)return true;
              const as=size(a),bs=size(b);if(as&&bs&&as!==bs)return true;
            }
            if(A.includes("maito")){
              for(const x of ["kevytmaito","taysmaito","rasvaton","uht","laktoositon"])if(A.includes(x)!==B.includes(x))return true;
            }
            if(A.includes("jogurtti")){
              for(const x of ["mustikka","vanilja","kahvi","mansikka","maustamaton"])if(A.includes(x)!==B.includes(x))return true;
              for(const x of ["rasvaton","laktoositon","juotava"])if(A.includes(x)!==B.includes(x))return true;
              const as=size(a),bs=size(b);if(as&&bs&&as!==bs)return true;
            }
            if(A.includes("jauheliha")){
              if(A.includes("luomu")!==B.includes("luomu"))return true;
            }
            if(A.includes("kaurajuoma")){
              for(const x of ["barista","vanilja","vanilla","suklaa","cinnamon","dolce"])if(A.includes(x)!==B.includes(x))return true;
            }
            if(A.includes("kananmuna")){
              const spec=x=>{const m=x.match(/(?:^| )((?:s|m|l|xl)(?:[ /](?:s|m|l|xl))?)[ ]*(\d{1,2})(?= |$)/);return m?{cls:m[1].replace(/ /g,"/"),count:+m[2]}:null;};
              const ac=spec(A),bc=spec(B);
              if(ac&&bc&&(ac.count!==bc.count||ac.cls!==bc.cls))return true;
            }
            if(A.includes("cola")){
              const multi=x=>/\b\d+\s*(?:pack|pk|x)\b/.test(x);
              if(multi(A)!==multi(B))return true;
              const zero=x=>/\bzero\b/.test(x);if(zero(A)!==zero(B))return true;
            }
            if(A.includes("pasta")&&A.includes("ateria")){
              for(const x of ["pekoni","carbonara","tomaatti","mozzarella","juusto","mustapippuri"])if(A.includes(x)!==B.includes(x))return true;
            }
            if(A.includes("rahka")){
              const bakeType=x=>x.includes("kranssi")?"kranssi":x.includes("vuokapulla")?"vuokapulla":x.includes("taytepulla")||x.includes("pulla")?"pulla":x.includes("piirakka")?"piirakka":"";
              const at=bakeType(A),bt=bakeType(B);if(at!==bt)return true;
            }
            if(A.includes("calzone")&&!B.includes("calzone"))return true;
            if(A.includes("riisi")){
              for(const x of ["monivilja","kaura","ohra","quinoa"])if(A.includes(x)!==B.includes(x))return true;
              if(!A.includes("hiutale")&&B.includes("hiutale"))return true;
            }
            if(A.includes("smoothie")){
              for(const x of ["ananas","guava","kookos","mango","banaani"])if(A.includes(x)!==B.includes(x))return true;
            }
            if(pet.test(A)&&pet.test(B)){
              for(const x of ["lohi","riista","lammas"])if(A.includes(x)!==B.includes(x))return true;
              const as=size(a),bs=size(b);if(as&&bs&&as!==bs)return true;
            }
            if(A.includes("pizza")||A.includes("patonki")){
              const as=size(a),bs=size(b);
              if(as&&bs&&as!==bs){
                const grams=x=>{const m=x.match(/^(\d+(?:\.\d+)?)g$/);return m?+m[1]:null;};
                const ag=grams(as),bg=grams(bs);if(ag&&bg&&Math.max(ag,bg)/Math.min(ag,bg)>1.35)return true;
              }
            }
            const forms2=["panini","heatpot","pastakastike","ciabatta","juustodippi"];
            for(const x of forms2)if(A.includes(x)!==B.includes(x))return true;
            if(A.includes("tuorejuusto")){
              for(const x of ["chili","paprika","valkosipuli","kevyt","laktoositon"])if(A.includes(x)!==B.includes(x))return true;
              const as=size(a),bs=size(b);if(as&&bs&&as!==bs)return true;
            }
            if(A.includes("pastakastike")){
              for(const x of ["mozzarella","tomaatti","basilika"])if(A.includes(x)!==B.includes(x))return true;
              const as=size(a),bs=size(b);if(as&&bs&&as!==bs)return true;
            }
            if(A.includes("kivennäisvesi")){
              for(const x of ["vichy","sitruuna","lime","greippi"])if(A.includes(x)!==B.includes(x))return true;
            }
            if(A.includes("vichy")&&/(original|magnesium)/.test(B))return true;
            if(A.includes("paprika")&&!/(juusto|dippi|mauste|kastike|ciabatta)/.test(A)){
              if(/juusto|dippi|mauste|kastike|ciabatta/.test(B))return true;
            }
            if(A.includes("sipuli")&&A.includes("paahdettu")&&!B.includes("paahdettu"))return true;
            return false;
          }
          if(!hardBad("Kotimaista Vichy kivennäisvesi 0,33l","Hartwall Vichy Original Triple Magnesium kivennäisvesi 0,33l"))throw new Error("VICHY_GUARD_REGRESSION");
          // Production-candidate regression: these are the semantic pairs that must be rejected
          // before pickBestKProduct scoring. This remains simulation-only.
          const productionCandidateRejectCases=[
            ["Kotimaista Vichy kivennäisvesi 0,33l","Hartwall Vichy Original Triple Magnesium kivennäisvesi 0,33l"],
            ["HK panini mozzarella-tomaatti 210g","Pirkka Tomaatti-mozzarella Heatpot 70g"],
            ["Paprika-juusto herkkuciabatta kg","Jokilaakson Juusto Nacho&Taco Cheddar juustodippi 10% makea paprika 250g"],
            ["Raguletto Mozzarella-Basilika Pastakastike 400 ml","Pasta Zara pastakastike 280g Tomaatti-basilika"],
            ["Kotimaista Tuorejuusto chili 200g","Valio Viola kevyt 200g paprika-chili tuorejuusto laktoositon"],
            ["Kieku vapaa kananmuna M/L15 1020g","Pirkka vapaa iso kananmuna L15 1020g"],
            ["Kieku vapaa kananmuna S/M10","Pirkka vapaa kananmuna M10"],
          ];
          for(const [source,target] of productionCandidateRejectCases){
            if(!hardBad(source,target))throw new Error("PRODUCTION_CANDIDATE_REJECT_REGRESSION: "+source+" -> "+target);
          }
          const productionCandidateAcceptCases=[
            ["Xtra sika-nauta jauheliha 23% 300g","K-Menu sika-nauta jauheliha 300g"],
            ["Kotimaista kanan jauheliha 4% 400 g","Pirkka suomalainen kanan jauheliha 400g"],
            ["Kieku vapaa kananmuna L15 1020g","Pirkka vapaa iso kananmuna L15 1020g"],
            ["Coop tomaatti-vuohenjuustokeitto 300 g","Pirkka tomaatti-vuohenjuustokeitto 300g"],
            ["Kotimaista 1l kaurajuoma UHT","Pirkka kaurajuoma 1L UHT"],
            ["Kotimaista rasvaton piimä 1l","Valio rasvaton piimä 1l"],
            ["Coop kevyt meetvursti 200g","Snellman Kevyt kotimainen meetvursti 200g"],
            ["Kotimaista smetana 35% 120g laktoositon","Pirkka smetana 35% 120g laktoositon"],
            ["Kotimaista Vichy kivennäisvesi 0,33l","Pirkka Vichy kivennäisvesi 0,33l"],
          ];
          for(const [source,target] of productionCandidateAcceptCases){
            if(hardBad(source,target))throw new Error("PRODUCTION_CANDIDATE_ACCEPT_REGRESSION: "+source+" -> "+target);
          }
          console.log("PRODUCTION_CANDIDATE_REGRESSION "+JSON.stringify({reject:productionCandidateRejectCases.length,accept:productionCandidateAcceptCases.length,status:"PASS"}));

          // Next weakness probe: current production K matching prefers the cheapest item
          // whenever name scores are within 14 points. Measure how often that can override
          // an otherwise better semantic/name match. Simulation only.
          let nearTieCheaperOverrides=0, nearTieLargeSizeMismatch=0, nearTieExamples=[];
          function prodLikeScore(a,b){
            const A=new Set(norm(a).split(" ").filter(x=>x.length>2&&!/^\\d/.test(x)));
            return norm(b).split(" ").reduce((n,t)=>n+(A.has(t)?18:0),0);
          }
          function inspectNearTie(source,items){
            const usable=items.filter(x=>!hardBad(source,x.name));
            const ranked=usable.map(x=>({x,sc:prodLikeScore(source,x.name)})).sort((a,b)=>b.sc-a.sc);
            if(ranked.length<2)return;
            const best=ranked[0], cheaper=ranked.filter(r=>best.sc-r.sc<=14&&Number(r.x.price)>0&&Number(r.x.price)<Number(best.x.price)).sort((a,b)=>Number(a.x.price)-Number(b.x.price))[0];
            if(!cheaper)return;
            nearTieCheaperOverrides++;
            const as=size(source),bs=size(best.x.name),cs=size(cheaper.x.name);
            if(as&&cs&&as!==cs)nearTieLargeSizeMismatch++;
            if(nearTieExamples.length<20)nearTieExamples.push({source,best:best.x.name,bestScore:best.sc,bestPrice:best.x.price,cheaper:cheaper.x.name,cheaperScore:cheaper.sc,cheaperPrice:cheaper.x.price,sourceSize:as||null,bestSize:bs||null,cheaperSize:cs||null});
          }
          function score(a,b){const A=new Set(norm(a).split(" ").filter(x=>x.length>2&&!/^\d/.test(x)));return norm(b).split(" ").reduce((n,t)=>n+(A.has(t)?1:0),0);}
          function terms(name){const stripped=String(name).replace(/\b(Coop|Rainbow|Xtra|Kotimaista|Suomalainen|Pirkka|K-Menu)\b/gi," ").replace(/\s+/g," ").trim();const n=norm(name),o=[name,stripped];for(const [x,t] of [["maito","maito"],["jauheliha","jauheliha"],["kahvi","kahvi"],["juusto","juusto"],["jogur","jogurtti"],["leipa","leipä"],["cola","cola"],["voi","voi"],["kananmuna","kananmuna"],["broiler","broileri"],["pasta","pasta"],["riisi","riisi"],["banaani","banaani"],["toma","tomaatti"],["kink","kinkku"],["makk","makkara"],["rahka","rahka"]])if(n.includes(x))o.push(t);return [...new Map(o.filter(Boolean).map(x=>[norm(x),x])).values()];}
          for(const pair of pairs){const st={tested:0,eanDirect:0,exactName:0,safeSizeName:0,safeName:0,noSafeMatch:0,hardBadChosen:0,directEanQueriesReturningExact:0,rejectedSemantic:0};
            for(const q of queries){const rows=(await s(q,pair.s)).slice(0,5);for(const p of rows){st.tested++;const pe=ean(p.ean),ps=size(p.name);let tier="NO_SAFE_MATCH",item=null;
              if(pe){const er=await k(pe,pair.k);item=er.find(x=>ean(x.ean)===pe)||null;if(item){tier="EAN_DIRECT";st.directEanQueriesReturningExact++;}}
              if(!item){const nr=await k(p.name,pair.k);item=nr.find(x=>norm(x.name)===norm(p.name))||null;if(item)tier="EXACT_NAME";}
              if(!item){let u=[];for(const t of terms(p.name).slice(0,5))u.push(...await k(t,pair.k));let all=[...new Map(u.map(x=>[String(x.id),x])).values()];inspectNearTie(p.name,all);let d=all.filter(x=>!hardBad(p.name,x.name));st.rejectedSemantic+=all.length-d.length;const ss=ps?d.filter(x=>size(x.name)===ps):d,pool=ss.length?ss:d,rank=pool.map(x=>({x,sc:score(p.name,x.name)})).sort((a,b)=>b.sc-a.sc);if(rank[0]?.sc>=2){item=rank[0].x;tier=ss.length?"SAFE_SIZE_NAME":"SAFE_NAME";}}
              if(tier==="EAN_DIRECT")st.eanDirect++;else if(tier==="EXACT_NAME")st.exactName++;else if(tier==="SAFE_SIZE_NAME")st.safeSizeName++;else if(tier==="SAFE_NAME")st.safeName++;else st.noSafeMatch++;if(item&&hardBad(p.name,item.name))st.hardBadChosen++;
              console.log(JSON.stringify({pair:pair.label,q,s:p.name,sSize:ps||null,sEan:pe||null,tier,k:item?.name||null,kSize:item?size(item.name)||null:null,kEan:item?.ean||null}));
            }}
            console.log("SAFE_SUMMARY "+pair.label+" "+JSON.stringify(st));
          }
          console.log("NEAR_TIE_PRICE_PROBE "+JSON.stringify({nearTieCheaperOverrides,nearTieLargeSizeMismatch,examples:nearTieExamples}));

          // Safer production-candidate rule: price may break a near tie only when
          // the cheaper candidate is semantically allowed and known package sizes match.
          let safePriceTieAllowed=0,safePriceTieBlocked=0,safePriceTieBlockedSize=0;
          const safeTieExamples=[];
          function safePriceTie(source,best,cheaper){
            if(hardBad(source,cheaper.name))return false;
            const S=norm(source),C=norm(cheaper.name),ss=size(source),cs=size(cheaper.name);
            if(ss&&cs&&ss!==cs)return false;
            // Price is only a tie-breaker when there is positive evidence of equivalence.
            // Known equal package size is strong evidence, but size alone is not enough:
            // require at least one meaningful shared product token as well.
            const stop=new Set(["coop","xtra","kotimaista","suomalainen","pirkka","menu","valio","arla","tuote","pakattu","laktoositon","luomu","kevyt"]);
            const sw=S.split(" ").filter(x=>x.length>=4&&!/^\\d/.test(x)&&!stop.has(x));
            const shared=sw.filter(x=>C.includes(x));
            const sameKnownSize=Boolean(ss&&cs&&ss===cs);
            if(sameKnownSize&&shared.length>=1)return true;
            // Without a measurable package size, require considerably stronger textual identity.
            if(!ss&&!cs&&shared.length>=2)return true;
            return false;
          }
          for(const ex of nearTieExamples){
            const b={name:ex.best,price:ex.bestPrice},ch={name:ex.cheaper,price:ex.cheaperPrice};
            const ok=safePriceTie(ex.source,b,ch);
            if(ok)safePriceTieAllowed++;else {safePriceTieBlocked++;if(ex.sourceSize&&ex.cheaperSize&&ex.sourceSize!==ex.cheaperSize)safePriceTieBlockedSize++;}
            safeTieExamples.push({source:ex.source,cheaper:ex.cheaper,decision:ok?"ALLOW_PRICE_TIE":"BLOCK_PRICE_TIE"});
          }
          console.log("SAFE_PRICE_TIE_PROBE "+JSON.stringify({sampled:nearTieExamples.length,allowed:safePriceTieAllowed,blocked:safePriceTieBlocked,blockedSize:safePriceTieBlockedSize,examples:safeTieExamples}));

          // Brand-retention probe: buildKSearchName currently strips Valio and Arla.
          // Measure whether keeping those consumer brands as the first K search term
          // surfaces an exact-name or same-brand candidate that the stripped search misses.
          let brandProbe={tested:0,brandFirstExactGain:0,brandFirstSameBrandGain:0,brandFirstNoGain:0,examples:[]};
          async function probeBrandRetention(source,storeId){
            const n=norm(source); const brand=n.includes("valio")?"valio":n.includes("arla")?"arla":"";
            if(!brand)return;
            brandProbe.tested++;
            const stripped=terms(source)[0]||"";
            const kept=n;
            if(!stripped||stripped===kept)return;
            const [a,b]=await Promise.all([k(stripped,storeId),k(kept,storeId)]);
            const exactA=a.some(x=>norm(x.name)===n), exactB=b.some(x=>norm(x.name)===n);
            const brandA=a.some(x=>norm(x.name).includes(brand)), brandB=b.some(x=>norm(x.name).includes(brand));
            let gain="";
            if(!exactA&&exactB){brandProbe.brandFirstExactGain++;gain="EXACT";}
            else if(!brandA&&brandB){brandProbe.brandFirstSameBrandGain++;gain="BRAND";}
            else brandProbe.brandFirstNoGain++;
            if(gain&&brandProbe.examples.length<20)brandProbe.examples.push({source,brand,stripped,kept,gain,strippedTop:a.slice(0,3).map(x=>x.name),keptTop:b.slice(0,3).map(x=>x.name)});
          }
          for(const pair of pairs){
            const seen=new Set();
            // Deliberately query the brands: the generic category sample can easily
            // contain zero branded products in its first result window.
            for(const q of ["valio","arla","valio maito","arla maito","valio jogurtti","arla jogurtti","valio juusto","arla juusto"]){
              const sp=await s(q,pair.s);
              for(const p of sp.slice(0,80)){
                if(seen.has(p.name))continue; seen.add(p.name);
                if(/\\b(valio|arla)\\b/i.test(p.name))await probeBrandRetention(p.name,pair.k);
              }
            }
          }
          console.log("BRAND_RETENTION_PROBE "+JSON.stringify(brandProbe));

          // First-hit probe: production findBestKMatchForStore returns the first acceptable
          // non-value-brand candidate. Measure cases where a later search term contains an
          // exact-name or materially higher-scoring candidate.
          let firstHitProbe={tested:0,laterExactGain:0,laterScoreGain:0,noGain:0,examples:[]};
          function simpleScore(a,b){const A=new Set(norm(a).split(" ").filter(x=>x.length>2&&!/^\\d/.test(x)));return norm(b).split(" ").reduce((n,t)=>n+(A.has(t)?18:0),0);}
          async function probeFirstHit(source,storeId){
            const ts=terms(source).slice(0,6); if(ts.length<2)return;
            let first=null,laterBest=null;
            for(let i=0;i<ts.length;i++){
              const xs=(await k(ts[i],storeId)).filter(x=>!hardBad(source,x.name));
              if(!xs.length)continue;
              const cand=xs.map(x=>({x,sc:simpleScore(source,x.name)})).sort((a,b)=>b.sc-a.sc)[0];
              if(!first){first={...cand,term:ts[i],idx:i};continue;}
              if(!laterBest||cand.sc>laterBest.sc)laterBest={...cand,term:ts[i],idx:i};
            }
            if(!first||!laterBest)return;
            firstHitProbe.tested++;
            const exactLater=norm(laterBest.x.name)===norm(source)&&norm(first.x.name)!==norm(source);
            const scoreGain=laterBest.sc-first.sc;
            if(exactLater)firstHitProbe.laterExactGain++;
            else if(scoreGain>=18)firstHitProbe.laterScoreGain++;
            else {firstHitProbe.noGain++;return;}
            if(firstHitProbe.examples.length<20)firstHitProbe.examples.push({source,firstTerm:first.term,first:first.x.name,firstScore:first.sc,laterTerm:laterBest.term,later:laterBest.x.name,laterScore:laterBest.sc,scoreGain,exactLater});
          }
          for(const pair of pairs){
            const seen=new Set();
            for(const q of queries){
              for(const p of (await s(q,pair.s)).slice(0,25)){
                if(seen.has(p.name))continue;seen.add(p.name);
                await probeFirstHit(p.name,pair.k);
              }
            }
          }
          console.log("FIRST_HIT_PROBE "+JSON.stringify(firstHitProbe));

          // Aggregated-candidate probe: instead of returning the first acceptable hit,
          // collect candidates from the existing search terms and choose the strongest
          // semantic/name match. Require a meaningful score advantage before replacing
          // the current first hit.
          let aggregateProbe={tested:0,changed:0,meaningfulGain:0,exactGain:0,unsafeRejected:0,examples:[]};
          async function probeAggregate(source,storeId){
            const ts=terms(source).slice(0,6); if(ts.length<2)return;
            let first=null; const pool=[];
            for(let i=0;i<ts.length;i++){
              const xs=await k(ts[i],storeId);
              for(const x of xs){
                if(hardBad(source,x.name)){aggregateProbe.unsafeRejected++;continue;}
                const row={x,sc:simpleScore(source,x.name),term:ts[i],idx:i};
                pool.push(row);
                if(!first)first=row;
              }
            }
            if(!first||!pool.length)return;
            aggregateProbe.tested++;
            const ded=[...new Map(pool.map(r=>[String(r.x.id||r.x.name),r])).values()];
            ded.sort((a,b)=>b.sc-a.sc || a.idx-b.idx || Number(a.x.price)-Number(b.x.price));
            const best=ded[0]; const gain=best.sc-first.sc;
            if(String(best.x.id||best.x.name)!==String(first.x.id||first.x.name))aggregateProbe.changed++;
            const exact=norm(best.x.name)===norm(source)&&norm(first.x.name)!==norm(source);
            if(exact)aggregateProbe.exactGain++;
            if(exact||gain>=18){
              aggregateProbe.meaningfulGain++;
              if(aggregateProbe.examples.length<20)aggregateProbe.examples.push({source,first:first.x.name,firstTerm:first.term,firstScore:first.sc,best:best.x.name,bestTerm:best.term,bestScore:best.sc,gain,exact});
            }
          }
          for(const pair of pairs){
            const seen=new Set();
            for(const q of queries){
              for(const p of (await s(q,pair.s)).slice(0,25)){
                if(seen.has(p.name))continue;seen.add(p.name);
                await probeAggregate(p.name,pair.k);
              }
            }
          }
          console.log("AGGREGATE_CANDIDATE_PROBE "+JSON.stringify(aggregateProbe));
