name: Normal product K-match simulation

on:
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Live coverage and counterpart simulations
        shell: bash
        run: |
          node <<'NODE'
          const BASE="https://ziiply.vercel.app";
          const pairs=[
            {label:"HYPER Hyvinkää",s:292,k:3221},
            {label:"LOCAL Jokela",s:721,k:3334},
          ];
          const queries=["kevytmaito","täysmaito","jauheliha","kahvi","juusto","jogurtti","ruisleipä","cola","voi","kananmuna","broileri","pasta","riisi","banaani","tomaatti","kinkku","makkara","rahka"];
          const norm=v=>String(v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9åäö%]+/g," ").replace(/\s+/g," ").trim();
          const ean=v=>String(v||"").replace(/\D/g,"");
          const size=v=>{const m=norm(v).match(/(\d+(?:[.,]\d+)?)\s*(kg|g|l|ml|cl)\b/);return m?m[1].replace(",",".")+m[2]:"";};
          async function get(path){const r=await fetch(BASE+path,{headers:{accept:"application/json"}});if(!r.ok)throw new Error(path+" HTTP "+r.status);return r.json();}
          async function s(q,id){return (await get("/api/s-products?search="+encodeURIComponent(q)+"&store="+id)).items||[]}
          async function k(q,id){return (await get("/api/k-products?search="+encodeURIComponent(q)+"&store="+id)).items||[]}
          function terms(name){
            const original=String(name||"").trim();
            const stripped=original.replace(/\b(Coop|Rainbow|Xtra|Kotimaista|Suomalainen|Pirkka|K-Menu|Valio|Arla)\b/gi," ").replace(/\s+/g," ").trim();
            const n=norm(original), out=[original,stripped];
            const rules=[["maito","maito"],["jauheliha","jauheliha"],["kahvi","kahvi"],["juusto","juusto"],["jogur","jogurtti"],["leipa","leipä"],["cola","cola"],["voi","voi"],["kananmuna","kananmuna"],["broiler","broileri"],["pasta","pasta"],["riisi","riisi"],["banaani","banaani"],["toma","tomaatti"],["kink","kinkku"],["makk","makkara"],["rahka","rahka"]];
            for(const [needle,t] of rules)if(n.includes(needle))out.push(t);
            return [...new Map(out.filter(Boolean).map(x=>[norm(x),x])).values()];
          }
          function hardBad(a,b){
            const A=norm(a),B=norm(b);
            const groups=[
              ["koira","koiran","koirille","dog"],
              ["wrap","caesarwrap","patonki","pizza","pasteija","keitto","ateria"],
              ["mauste","mausteseos"],
            ];
            if(!groups[0].some(x=>A.includes(x))&&groups[0].some(x=>B.includes(x)))return true;
            if(A.includes("kokonainen broileri")&&(B.includes("wrap")||B.includes("filee")||B.includes("mauste")))return true;
            if(A.includes("jauheliha")&&groups[0].some(x=>B.includes(x)))return true;
            if(A.includes("kananmuna")&&groups[0].some(x=>B.includes(x)))return true;
            if(A.includes("makkara")&&groups[0].some(x=>B.includes(x))&&!groups[0].some(x=>A.includes(x)))return true;
            return false;
          }
          function tokenScore(a,b){
            const aa=new Set(norm(a).split(" ").filter(x=>x.length>2&&!/^\\d/.test(x)));
            return norm(b).split(" ").reduce((n,t)=>n+(aa.has(t)?1:0),0);
          }
          async function safeTiered(p,kstore){
            const pe=ean(p.ean||p.gtin||p.eanCode||p.barcode||p.externalId), ps=size(p.name);
            if(pe){
              const erows=await k(pe,kstore);
              const exact=erows.find(x=>ean(x.ean)===pe);
              if(exact)return {tier:"EAN_DIRECT",item:exact};
            }
            const exactNameRows=await k(p.name,kstore);
            const exactName=exactNameRows.find(x=>norm(x.name)===norm(p.name));
            if(exactName)return {tier:"EXACT_NAME",item:exactName};
            let union=[];
            for(const t of terms(p.name).slice(0,6))union.push(...await k(t,kstore));
            const ded=[...new Map(union.map(x=>[String(x.id),x])).values()]
              .filter(x=>!hardBad(p.name,x.name));
            const sameSize=ps?ded.filter(x=>size(x.name)===ps):ded;
            const pool=sameSize.length?sameSize:ded;
            const ranked=pool.map(x=>({x,score:tokenScore(p.name,x.name)})).sort((a,b)=>b.score-a.score);
            const best=ranked[0];
            if(!best||best.score<2)return {tier:"NO_SAFE_MATCH",item:null};
            return {tier:sameSize.length?"SAFE_SIZE_NAME":"SAFE_NAME",item:best.x};
          }
          const reports={};
          for(const pair of pairs){
            const summary={queries:0,sReturned:0,sPriced:0,sWithEan:0,kReturned:0,productsTested:0,exactEanFound:0,eanNotSeen:0,noKCandidates:0,sizePreserved:0,sizeMismatch:0};
            const details=[];
            for(const q of queries){
              const sp=await s(q,pair.s), kp=await k(q,pair.k);
              summary.queries++; summary.sReturned+=sp.length; summary.kReturned+=kp.length;
              const priced=sp.filter(x=>Number(x.storeItems?.[0]?.price||x.price||0)>0);
              summary.sPriced+=priced.length; summary.sWithEan+=priced.filter(x=>ean(x.ean||x.gtin||x.eanCode||x.barcode||x.externalId)).length;
              const sample=priced.slice(0,5);
              for(const p of sample){
                summary.productsTested++;
                const pe=ean(p.ean||p.gtin||p.eanCode||p.barcode||p.externalId), ps=size(p.name);
                let union=[], searches=[];
                for(const t of terms(p.name).slice(0,6)){const rows=await k(t,pair.k);searches.push([t,rows.length]);union.push(...rows);}
                const ded=[...new Map(union.map(x=>[String(x.id),x])).values()];
                const exact=pe?ded.find(x=>ean(x.ean)===pe):null;
                if(exact)summary.exactEanFound++; else if(pe)summary.eanNotSeen++;
                if(!ded.length)summary.noKCandidates++;
                const tokenSet=new Set(norm(p.name).split(" ").filter(x=>x.length>2));
                const score=x=>norm(x.name).split(" ").reduce((n,t)=>n+(tokenSet.has(t)?1:0),0);
                const sameSize=ps?ded.filter(x=>size(x.name)===ps):ded;
                const best=[...(sameSize.length?sameSize:ded)].sort((a,b)=>score(b)-score(a)||Number(a.price||999)-Number(b.price||999))[0];
                if(best&&ps&&size(best.name)===ps)summary.sizePreserved++;
                else if(best&&ps&&size(best.name)&&size(best.name)!==ps)summary.sizeMismatch++;
                details.push({q,sName:p.name,sEan:pe||null,sSize:ps||null,searches,exactK:exact?.name||null,bestK:best?.name||null,bestKEan:best?.ean||null,bestKSize:best?size(best.name)||null:null,kCandidates:ded.length});
              }
            }
            reports[pair.label]={summary,details};
            console.log("\n### "+pair.label+" SUMMARY\n"+JSON.stringify(summary,null,2));
            console.log("\n### "+pair.label+" CASES");
            for(const d of details)console.log(JSON.stringify(d));
          }
          console.log("\n### HYPER vs LOCAL COVERAGE");
          for(const q of queries){
            const [hs,ls]=await Promise.all([s(q,pairs[0].s),s(q,pairs[1].s)]);
            const hp=hs.filter(x=>Number(x.storeItems?.[0]?.price||x.price||0)>0);
            const lp=ls.filter(x=>Number(x.storeItems?.[0]?.price||x.price||0)>0);
            console.log(JSON.stringify({q,hyperPriced:hp.length,localPriced:lp.length,ratio:hp.length?Number((lp.length/hp.length).toFixed(2)):null}));
          }
          console.log("\n### COOP SOURCE-DATA PROBE");
          for(const pair of pairs){
            const rows=await s("coop",pair.s);
            const priced=rows.filter(x=>Number(x.storeItems?.[0]?.price||x.price||0)>0);
            console.log(JSON.stringify({pair:pair.label,returned:rows.length,priced:priced.length,withEan:priced.filter(x=>ean(x.ean||x.gtin||x.eanCode||x.barcode||x.externalId)).length,samples:priced.slice(0,12).map(x=>({name:x.name,ean:ean(x.ean||x.gtin||x.eanCode||x.barcode||x.externalId)||null,price:Number(x.storeItems?.[0]?.price||x.price||0)}))}));
          }
          NODE
