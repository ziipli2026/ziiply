name: Prisma Shadow Mapper Simulation
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/prisma-shadow-mapper-simulation.yml'
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --legacy-peer-deps
      - name: Shadow corrected CMS mapper against current offers
        run: |
          cat > scripts/.tmp-prisma-shadow.mts <<'TS'
          import { searchSelectedSKaupatOffersV11 } from "../src/app/components/ziiply/offerSearch/ziiplyOfferSearchSources";
          const storeName="Prisma Hyvinkää",storeId="634976534",MASTER="__ziiply_all_offers__";
          const ctx={storeName,sStoreName:storeName,storeNames:[storeName],sStoreNames:[storeName],storeCompareScope:"within_chain",withinChain:"S"};
          const d=await searchSelectedSKaupatOffersV11(MASTER,ctx as any);
          const date=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Helsinki",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
          const variables={preview:false,storeId,skipProducts:false,availabilityDate:date,where:{storeId,path:"tuotteet/kampanjat",platform:"WEB",availabilityDate:date,userConsent:{marketing:false,marketingId:"ziiply-gosta",useCustomerId:false,sessionId:"ziiply-gosta",loop54:true}}};
          const extensions={clientLibrary:{name:"@apollo/client",version:"4.2.12"},persistedQuery:{version:1,sha256Hash:"f6d87786fda8fb5c233c4eaed08f37b0c5b87dc0d8d4c44c33c5529e446369d1"}};
          const u=new URL("https://api.s-kaupat.fi/");u.searchParams.set("operationName","RemoteGetPageContent");u.searchParams.set("variables",JSON.stringify(variables));u.searchParams.set("extensions",JSON.stringify(extensions));
          const r=await fetch(u,{headers:{accept:"application/graphql-response+json,application/json;q=0.9","accept-language":"fi",origin:"https://www.s-kaupat.fi",referer:"https://www.s-kaupat.fi/","x-client-name":"skaupat-web","x-client-version":"production-14a82a5b48cd1dd42c0592db0037514ed3c84de8"}});
          const b=await r.json(),sections=b?.data?.pageContent?.sections??[],seen=new Set<string>(),c:any[]=[];
          for(const s of sections)for(const p of (s.products??[])){const ean=String(p.ean??"").trim();if(!ean||seen.has(ean))continue;const pr=p.pricing??p.store?.pricing??{};const price=Number(pr.campaignPrice??pr.currentPrice??p.price);if(!Number.isFinite(price)||price<=0)continue;seen.add(ean);c.push({ean,title:p.name,price,validUntil:String(pr.campaignPriceValidUntil??""),storeId,section:s.title});}
          const price=(x:any)=>{const n=Number(x?.price);if(Number.isFinite(n))return n.toFixed(4);const p=Number(String(x?.priceText??"").replace(/[^0-9,.-]/g,"").replace(",","."));return Number.isFinite(p)?p.toFixed(4):""};
          const valid=(x:any)=>String(x?.validUntil??x?.debugOfferEvidenceV226?.campaignPriceValidUntil??"").trim();
          const key=(x:any)=>[storeId,String(x?.ean??"").trim(),price(x),valid(x)].join("|");
          const ck=new Set(c.map(key)),hidden=d.filter((x:any)=>ck.has(key(x))),kept=d.filter((x:any)=>!ck.has(key(x)));
          const report={date,http:r.status,discounted:d.length,shadowCampaigns:c.length,hidden: hidden.length,kept:kept.length,expectedCombinedAfter:kept.length+c.length,muikku:hidden.filter((x:any)=>String(x.ean)==="2004657500003").map((x:any)=>({ean:x.ean,title:x.title,price:price(x),valid:valid(x)})),hiddenWithMissingValidity:hidden.filter((x:any)=>!valid(x)).length,shadowMissingValidity:c.filter(x=>!x.validUntil).length,hiddenSample:hidden.slice(0,10).map((x:any)=>({ean:x.ean,title:x.title,price:price(x),valid:valid(x)}))};
          console.log("SHADOW_REPORT",JSON.stringify(report,null,2));
          if(hidden.length!==108||report.hiddenWithMissingValidity!==0)process.exitCode=1;
          TS
          npx tsx scripts/.tmp-prisma-shadow.mts
          rm scripts/.tmp-prisma-shadow.mts
