name: K-local campaign source simulation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/app/components/ziiply/offerSearch/providers/kruokaProvider.ts'
      - '.github/workflows/k-local-campaign-simulation.yml'
  push:
    paths:
      - 'src/app/components/ziiply/offerSearch/providers/kruokaProvider.ts'
      - '.github/workflows/k-local-campaign-simulation.yml'
jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --package-lock=false --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Independent K-Ruoka campaign source discovery
        shell: bash
        run: |
          cat > k-campaign-source-probe.mjs <<'NODE'
          const urls=[
            'https://www.k-ruoka.fi/k-supermarket/tarjouslehti',
            'https://www.k-ruoka.fi/kauppa/k-supermarket-jokela'
          ];
          for(const url of urls) {
            try {
              const response=await fetch(url,{headers:{'User-Agent':'Mozilla/5.0 (compatible; ZiiplySourceValidation/1.0)','Accept':'text/html'}});
              const html=await response.text();
              const title=html.match(/<title[^>]*>([^<]*)<\/title>/i)?.[1]??null;
              const campaignTokens=['Tefal','kampanja','campaign','tarjouslehti','Tefal Edition paistinpannu 20 cm'];
              console.log('K_INDEPENDENT_SOURCE '+JSON.stringify({url,status:response.status,bytes:html.length,title,markers:Object.fromEntries(campaignTokens.map(t=>[t,html.toLowerCase().includes(t.toLowerCase())])),nextData:html.includes('__NEXT_DATA__'),rsc:html.includes('self.__next_f.push'),tefalContext:(()=>{const i=html.toLowerCase().indexOf('tefal edition');return i<0?null:html.slice(Math.max(0,i-160),i+300).replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').slice(0,450)})()}));
              if(response.status===403)console.warn('K_INDEPENDENT_SOURCE_BLOCKED '+url+' (HTTP 403; do not treat response body as campaign data)'); else if(!response.ok)console.warn('K_INDEPENDENT_SOURCE_HTTP '+response.status+' '+url);
            } catch(error) {
              console.error('K_INDEPENDENT_SOURCE_ERROR '+JSON.stringify({url,error:String(error)}));
            }
          }
          NODE
          node k-campaign-source-probe.mjs
      - name: Live K-local campaign probe
        shell: bash
        run: |
          # Inspect the two actual store-publication viewer responses. A 200 response
          # with zero hotspots is not proof that a campaign has no products.
          node --input-type=module <<'NODE'
          for (const id of ['ji1luTAL','aETRYhoN']) {
            for (const page of [1,2]) {
              try {
                const response=await fetch('https://publication-viewer.tjek.com/api/paged-publications/'+encodeURIComponent(id)+'/'+page,{signal:AbortSignal.timeout(12000)});
                const body=await response.text();
                let json;try{json=JSON.parse(body)}catch{}
                const hotspots=Array.isArray(json?.hotspots)?json.hotspots:[];
                console.log('K_LOCAL_VIEWER '+JSON.stringify({id,page,status:response.status,keys:json&&typeof json==='object'?Object.keys(json):[],hotspots:hotspots.length,firstHotspot:hotspots[0]?{keys:Object.keys(hotspots[0]),offer:hotspots[0].offer}:null,decorations:Array.isArray(json?.decorations)?json.decorations.length:null,firstDecoration:Array.isArray(json?.decorations)?json.decorations.slice(0,2):json?.decorations,bodySample:json?undefined:body.slice(0,120)}));
              } catch(error) {console.log('K_LOCAL_VIEWER_ERROR '+JSON.stringify({id,page,error:String(error)}));}
            }
          }
          NODE
          # Check whether a store-specific publication has products on later pages.
          node --input-type=module <<'NODE'
          for (const id of ['ji1luTAL','aETRYhoN']) {
            const counts=[];
            for(let page=3;page<=20;page++){
              try{
                const r=await fetch('https://publication-viewer.tjek.com/api/paged-publications/'+encodeURIComponent(id)+'/'+page,{signal:AbortSignal.timeout(10000)});
                if(!r.ok){counts.push({page,status:r.status});break;}
                const j=await r.json();
                const hotspots=Array.isArray(j.hotspots)?j.hotspots:[];
                const decorations=Array.isArray(j.decorations)?j.decorations:[];
                if(hotspots.length||decorations.length)counts.push({page,hotspots:hotspots.length,decorations:decorations.length,offerIds:hotspots.slice(0,2).map(h=>h?.offer?.id).filter(Boolean)});
              }catch(error){counts.push({page,error:String(error)});break;}
            }
            console.log('K_LOCAL_LATER_PAGES '+JSON.stringify({id,nonemptyOrErrors:counts}));
          }
          NODE
          # Alternative path: query Tjek's offer index directly for the selected
          # publication/store instead of relying on the empty publication viewer.
          node --input-type=module <<'NODE'
          const stable=v=>JSON.stringify(v,(_k,x)=>x&&Object.prototype.toString.call(x)==='[object Object]'?Object.keys(x).sort().reduce((o,k)=>(o[k]=x[k],o),{}):x);
          async function tjek(name,params,slug){
            const key=Buffer.from(stable([name,params])).toString('base64');
            const r=await fetch('https://etarjouslehdet.fi/',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json, text/plain, */*',Referer:'https://etarjouslehdet.fi/'+slug},body:JSON.stringify({data:[key]}),signal:AbortSignal.timeout(12000)});
            if(!r.ok)throw Error('HTTP '+r.status);
            for(const line of (await r.text()).split(/\\r?\\n/).filter(Boolean)){try{const j=JSON.parse(line);if(j.key===key)return j.value}catch{}}
            throw Error('Missing Tjek response key');
          }
          for(const {slug,name,id} of [{slug:'K-Supermarket',name:'K-Supermarket Jokela',id:'ji1luTAL'},{slug:'K-Market',name:'K-Market Hakalantori',id:'aETRYhoN'}]){
            try{
              const business=await tjek('businesses',{pagination:{offset:0,limit:100}},slug);
              console.log('K_ALT_BUSINESS '+JSON.stringify({name,businessCount:business?.data?.length}));
              const rows=await tjek('offers',{publicationIds:[id],sources:['publication','business_product'],pagination:{offset:0,limit:1000},sort:['score_desc']},slug);
              console.log('K_ALT_PUBLICATION '+JSON.stringify({name,id,count:rows?.data?.length??null,publications:(rows?.data??[]).slice(0,5).map(x=>({id:x.publicId,publicationPublicId:x.publicationPublicId,name:x.name}))}));
            }catch(e){console.log('K_ALT_ERROR '+JSON.stringify({name,error:String(e)}));}
          }
          NODE
          cat > k-campaign-probe.mts <<'NODE'
          import { fetchKruokaOffers, getLastKruokaPipelineDebugV49 } from './src/app/components/ziiply/offerSearch/providers/kruokaProvider.ts';
          const stores = ['K-Supermarket Jokela','K-Market Hakalantori','K-Market Etu-Lyötty'];
          let failures=0;
          for (const storeName of stores) {
            const rows=await fetchKruokaOffers('__ziiply_all_offers__', {} as any, {storeName,kStoreName:storeName});
            const debug=getLastKruokaPipelineDebugV49();
            const offers=rows.filter(row=>(row as any).campaignType!=='campaign');
            const campaigns=rows.filter(row=>(row as any).campaignType==='campaign');
            const offerFallbacks=offers.filter(row=>!(row as any).category||(row as any).category==='Muut');
            const campaignFallbacks=campaigns.filter(row=>!(row as any).category||(row as any).category==='Muut');
            const categoryCounts=(items:any[])=>Object.fromEntries([...new Set(items.map(row=>String((row as any).category||'Muut')))].sort().map(category=>[category,items.filter(row=>String((row as any).category||'Muut')===category).length]));
            const semanticCategoryFailures=rows.filter(row=>{
              const title=String((row as any).title||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase();
              const category=String((row as any).category||'');
              if(/salaattimix|salaattisekoitus/.test(title)) return category!=='Hevi';
              if(title.includes('suklaalevy')||title.includes('suklaapatukka')||title.includes('suklaakonvehti')) return category!=='Makeiset & keksit';
              return false;
            });
            console.log('K_CAMPAIGN_PROBE '+JSON.stringify({storeName,total:rows.length,offers:offers.length,campaigns:campaigns.length,offerCategories:categoryCounts(offers as any[]),campaignCategories:categoryCounts(campaigns as any[]),offerFallbacks:offerFallbacks.map(x=>x.title),campaignFallbacks:campaignFallbacks.map(x=>x.title),semanticCategoryFailures:semanticCategoryFailures.map(x=>({title:x.title,category:x.category})),probe:debug?.campaignProbe,publicationFetch:debug?.publicationFetch,publicationPipeline:debug?.publicationPipeline,sourceMarkers:(debug?.rawOffers??[]).slice(0,8).map(o=>({publicationPublicId:o.publicationPublicId,name:o.name,campaignType:o.campaignType,offerType:o.offerType,promotionType:o.promotionType,campaignLabel:o.campaignLabel,publicationLabel:o.publicationLabel,isCampaign:o.isCampaign,keys:Object.keys(o).filter(k=>/campaign|promo|type|label|source|category/i.test(k))})),error:debug?.error,publications:debug?.kSupermarketPublicationResolverDebug?.publications?.map(p=>({label:p.label,id:p.id,active:p.active})),samples:campaigns.slice(0,3).map(x=>({title:x.title,price:x.price,category:x.category}))}));
            const localPublicationIds=(debug?.kSupermarketPublicationResolverDebug?.publications??[]).filter(p=>p.active && p.label.normalize('NFKC').replace(/[‐‑‒–—−]/g,'-').toLocaleLowerCase('fi').includes(storeName.normalize('NFKC').replace(/[‐‑‒–—−]/g,'-').toLocaleLowerCase('fi'))).map(p=>p.id);
            const campaignIds=debug?.campaignProbe?.campaignPublicationIds??[];
            const regionalLeak=(debug?.rawOffers??[]).filter(o=>o.campaignType==='campaign' && !campaignIds.includes(String(o.publicationPublicId??''))).length;
            const localRows=(debug?.rawOffers??[]).filter(o=>campaignIds.includes(String(o.publicationPublicId??'')));
            const weeklyMisclassified=localRows.filter(o=>{const a=Date.parse(String(o.validFrom??'')),b=Date.parse(String(o.validUntil??''));return Number.isFinite(a)&&Number.isFinite(b)&&b-a<=7*86400000&&o.campaignType==='campaign';}).length;
            const monthlyMisclassified=localRows.filter(o=>{const a=Date.parse(String(o.validFrom??'')),b=Date.parse(String(o.validUntil??''));return Number.isFinite(a)&&Number.isFinite(b)&&b-a>7*86400000&&o.campaignType!=='campaign';}).length;
            console.log('K_LOCAL_VALIDITY_SPLIT '+JSON.stringify({storeName,weeklyMisclassified,monthlyMisclassified,localRows:localRows.length}));
            console.log('K_LOCAL_CAMPAIGN_ASSERT '+JSON.stringify({storeName,localPublicationIds,campaignIds,regionalLeak,returnedCampaigns:campaigns.length}));
            const ouluSplitFailure=storeName==='K-Market Etu-Lyötty' && (offers.length===0 || campaigns.length===0);
            if(debug?.error || !localPublicationIds.length || !localPublicationIds.every(id=>campaignIds.includes(id)) || regionalLeak || weeklyMisclassified || monthlyMisclassified || campaigns.length===0 || ouluSplitFailure || offerFallbacks.length || campaignFallbacks.length || semanticCategoryFailures.length) failures++;
          }
          if(failures) {console.error('Campaign source validation failed for '+failures+' store(s)');process.exitCode=1;}
          NODE
          npx --yes tsx k-campaign-probe.mts
