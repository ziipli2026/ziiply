name: K-Citymarket 41LV preproduction probe
on:
  push:
    paths:
      - '.github/workflows/kcitymarket-41lv-probe.yml'
      - 'src/app/components/ziiply/offerSearch/providers/kCitymarketSpatialParser.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Parse 41LV independently without publishing
        shell: bash
        run: |
          set -euo pipefail
          cp src/app/components/ziiply/offerSearch/providers/kCitymarketSpatialParser.js /tmp/kcm-41lv-parser.mjs
          node scripts/citymarket/export-leaflet.mjs "https://kcm-lehdet.k-ruoka.fi/loppuviikon_tarjouslehdet/" /tmp/kcm-41lv-probe /tmp/kcm-41lv-parser.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dir='/tmp/kcm-41lv-probe/';
          const manifest=JSON.parse(fs.readFileSync(dir+'archive-manifest.json','utf8'));
          const evidence=JSON.parse(fs.readFileSync(dir+'parser-evidence.json','utf8'));
          const all=evidence.rows||[];
          const resolved=all.filter(r=>r.spatialResolved?.value>0&&!r.spatialResolved?.displayOnlyUnitPrice);
          const percentages=all.filter(r=>Number(r.percentageOffer?.percent)>0);
          const multibuy=resolved.filter(r=>Number(r.spatialResolved.quantity)>1);
          const bad=resolved.filter(r=>!Number.isFinite(Number(r.spatialResolved.value))||Number(r.spatialResolved.value)<=0||Number(r.spatialResolved.value)>1000);
          const unique=new Set(resolved.map(r=>[r.page,r.title,r.spatialResolved.value].join('|')));
          const report={leaflet:manifest.publisherUrl||manifest.leafletUrl||manifest.entry,sha256:manifest.pdfSha256,pages:manifest.pageCount,rows:all.length,resolved:resolved.length,percentages:percentages.length,multibuy:multibuy.length,duplicates:resolved.length-unique.size,bad:bad.length,multibuySample:multibuy.slice(0,20).map(r=>({title:r.title,price:r.spatialResolved.value,quantity:r.spatialResolved.quantity,unit:r.spatialResolved.unit})),unresolvedSample:all.filter(r=>!r.spatialResolved&&!r.percentageOffer).slice(0,15).map(r=>({page:r.page,title:r.title}))};
          console.log('KCM_41LV_PROBE',JSON.stringify(report,null,2));
          if(!/41LV_KCM/i.test(JSON.stringify(manifest)))throw Error('Publisher is not 41LV: refuse release');
          if(manifest.pageCount<1||resolved.length<15||bad.length)throw Error('41LV insufficient or invalid parser coverage');
          // Verified directly against the publisher's page 5 artwork (41LV).
          // Just1 6-roll + household-paper set = 10 EUR; Soft Embo 40-roll
          // two-bag offer = 29.90 EUR. Never allow the spatial parser's
          // erroneous 6.10 EUR association to pass a release gate.
          // These are two distinct promotion types, not two unit-price offers.
          // 6-roll is a mixed WC + household paper SET at EUR 10.
          // 40-roll is TWO bags at EUR 29.90 total (EUR 14.95 per bag).
          const knownPage5=[
            {title:/^WC-PAPERI 6 rl$/i,expected:10,kind:'mixed-set',quantity:2},
            {title:/^WC-PAPERI 40 rl$/i,expected:29.90,kind:'same-product-multibuy',quantity:2}
          ];
          const page5Diagnostics=all.filter(r=>r.page===5&&/WC-PAPERI/i.test(String(r.title))).map(r=>({
            title:r.title,actual:r.spatialResolved,previous:r.debugRejectedCardPrice,
            selected:r.debugCardPrice,cardAnchor:r.debugCardAnchor,
            imageAnchor:r.imageAnchor,nearby:r.nearby,unitPrice:r.unitPrice,
            spatialCandidates:r.spatialCandidates,spatialPriceBoxes:r.spatialPriceBoxes
          }));
          fs.writeFileSync(dir+'page5-wc-spatial-diagnostics.json',JSON.stringify(page5Diagnostics,null,2));
          // Preserve exact geometry for rejected large prices so that a
          // publisher-owned price is not accidentally rescued by proximity.
          const rejectedGeometry=page5Diagnostics.map(r=>({
            title:r.title,
            titleAnchor:r.cardAnchor,
            rejectedPrice:r.previous?{
              value:r.previous.value,quantity:r.previous.quantity,unit:r.previous.unit,
              priceAnchor:r.previous.anchor,score:r.previous.score,
              parts:r.previous.parts
            }:null,
            chosenPrice:r.selected?{
              value:r.selected.value,quantity:r.selected.quantity,unit:r.selected.unit,
              priceAnchor:r.selected.anchor,score:r.selected.score
            }:null,
            nearby:r.nearby
          }));
          fs.writeFileSync(dir+'page5-rejected-price-geometry.json',JSON.stringify(rejectedGeometry,null,2));
          const page5Failures=knownPage5.flatMap(({title,expected,kind,quantity})=>{
            const match=all.find(r=>r.page===5&&title.test(String(r.title)));
            const actual=match?.spatialResolved?.value==null?null:Number(match.spatialResolved.value);
            const q=Number(match?.spatialResolved?.quantity||1);
            const context=[...(match?.nearby||[]),...(match?.spatialGroups||[]).map(g=>g.text)].join(' ').toUpperCase();
            const semanticProof=kind==='mixed-set'
              ? /TALOUSPAPERI/.test(context)&&/SETTI/.test(context)
              : /2\s*SÄKKIÄ/.test(context);
            // A mixed set must not be published as the unit price of its WC component.
            const valid=kind==='mixed-set'
              ? (actual===null&&semanticProof)
              : (actual!==null&&Math.abs(actual-expected)<.005&&q===quantity&&semanticProof);
            return valid?[]:[{title:String(title),expected,kind,quantity,actual,actualQuantity:q,semanticProof,found:Boolean(match)}];
          });
          fs.writeFileSync(dir+'verified-page5-prices.json',JSON.stringify({source:'41LV original PDF page 5, visually checked',expected:[{product:'Lotus Just1 WC-PAPERI 6 rl plus household-paper 6 rl, set',price:10},{product:'Lotus Soft Embo WC-PAPERI 40 rl, 2 bags',price:29.90}],failures:page5Failures},null,2));
          fs.writeFileSync(dir+'probe-report.json',JSON.stringify({...report,verifiedPage5Failures:page5Failures},null,2));

          const suspicious=multibuy.filter(r=>Number(r.spatialResolved.quantity)>=4 || Number(r.spatialResolved.value)/Number(r.spatialResolved.quantity)<1.5 || /\\b(?:ja|tai)\\b/i.test(String(r.title)) && Number(r.spatialResolved.quantity)>2);
          console.log('KCM_41LV_MANUAL_REVIEW_REQUIRED',JSON.stringify(suspicious.map(r=>({page:r.page,title:r.title,price:r.spatialResolved.value,quantity:r.spatialResolved.quantity,unit:r.spatialResolved.unit})),null,2));
          fs.writeFileSync(dir+'manual-review.json',JSON.stringify(suspicious.map(r=>({page:r.page,title:r.title,price:r.spatialResolved.value,quantity:r.spatialResolved.quantity,unit:r.spatialResolved.unit,source:r.spatialResolved.source,nearby:r.nearby,spatialCandidates:r.spatialCandidates,spatialPriceBoxes:r.spatialPriceBoxes})),null,2));
          // Independent visual audit of original publisher PDF pages 4, 6, 15, 16 and 18.
          // Keep incorrect quantity associations blocked even when spatial confidence is high.
          const verifiedMultibuy=[
            {page:4,title:/^VASELINE 40 g$/i,price:3.50,quantity:2},
            {page:6,title:/^SUIHKEET 600 ml/i,price:5,quantity:2},
            {page:6,title:/^TIIVISTEET 1 l/i,price:5,quantity:2},
            {page:6,title:/^WC-GEELIT 750 ml/i,price:5,quantity:2},
            {page:6,title:/^PYYKINPESUNESTEET 840/i,price:12,quantity:3},
            {page:15,title:/^PROTEIINI- 3\. PIRTELÖT 200 ml/i,price:2.50,quantity:2},
            {page:16,title:/^PROTEIINIVAAHDOLLA 200 g/i,price:5,quantity:4},
            {page:16,title:/^MAKUPALA VANUKKAAT 120 g/i,price:2.50,quantity:4},
            {page:16,title:/^ACTIMEL JOGURTTI-/i,price:3.69,quantity:1},
            {page:16,title:/^JUOMAT 8 x 100 g/i,price:3.69,quantity:1},
            {page:18,title:/^POHJOISEN MAUT ATERIAT/i,price:5,quantity:4},
            {page:18,title:/^NATURE HFC KISSAN MÄRKÄRUOAT/i,price:4.20,quantity:4}
          ];
          const verifiedMultibuyFailures=verifiedMultibuy.flatMap(v=>{
            const row=all.find(r=>r.page===v.page&&v.title.test(String(r.title)));
            const actual=Number(row?.spatialResolved?.value);
            const quantity=Number(row?.spatialResolved?.quantity||1);
            return row&&Math.abs(actual-v.price)<0.005&&quantity===v.quantity?[]:[{page:v.page,title:String(v.title),expectedPrice:v.price,expectedQuantity:v.quantity,actualPrice:row?.spatialResolved?.value??null,actualQuantity:quantity,found:Boolean(row)}];
          });
          fs.writeFileSync(dir+'verified-multibuy-audit.json',JSON.stringify({source:'Original 41LV PDF pages 4, 6, 15, 16, 18; manually verified',failures:verifiedMultibuyFailures},null,2));
          // Keep full parser evidence for every failed publisher-verified case.
          // This allows geometric ownership fixes instead of page-specific price overrides.
          fs.writeFileSync(dir+'multibuy-mismatch-diagnostics.json',JSON.stringify(verifiedMultibuyFailures.map(f=>{
            const row=all.find(r=>r.page===f.page&&String(f.title).slice(1).length&&new RegExp(String(f.title).slice(1,String(f.title).lastIndexOf('/')),'i').test(String(r.title)));
            return {...f,cardAnchor:row?.debugCardAnchor,imageAnchor:row?.imageAnchor,nearby:row?.nearby,
              chosenPrice:row?.debugCardPrice,rejectedPrice:row?.debugRejectedCardPrice,
              spatialCandidates:row?.spatialCandidates,spatialPriceBoxes:row?.spatialPriceBoxes,
              spatialGroups:row?.spatialGroups};
          }),null,2));
          if(verifiedMultibuyFailures.length)throw Error('41LV HOLD: publisher-verified multibuy mismatch: '+JSON.stringify(verifiedMultibuyFailures));
          if(page5Failures.length)throw Error('41LV HOLD: verified page-5 WC-paper prices do not match spatial parser: '+JSON.stringify(page5Failures));
          if(suspicious.length)throw Error('41LV HOLD: ambiguous multibuy prices require comparison against the original leaflet before production');

          NODE
      - name: Preserve probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kcitymarket-41lv-preproduction-probe
          path: /tmp/kcm-41lv-probe/
          retention-days: 90
          if-no-files-found: warn
