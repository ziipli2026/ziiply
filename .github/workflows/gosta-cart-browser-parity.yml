name: Gosta cart browser parity
on:
  push:
    branches:
      - fix/gosta-mobile-cart-campaign-parity-20261115
  workflow_dispatch:
jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save @playwright/test && npx playwright install --with-deps chromium
      - name: Run real browser checks
        env:
          ZIIPLY_PREVIEW_URL: https://ziiply-b2gt9m72n-ziipli2026s-projects.vercel.app
        run: npx playwright test tests/gosta-cart-parity.browser.spec.cjs --browser=chromium --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gosta-cart-browser-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
