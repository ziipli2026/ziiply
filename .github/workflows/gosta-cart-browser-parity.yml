name: Gosta cart browser parity
on:
  push:
    branches:
      - fix/gosta-cart-main-integration-20261116
  workflow_dispatch:
jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save @playwright/test && npx playwright install --with-deps chromium
      - name: Start Next.js from the tested Git commit
        run: |
          nohup npm run dev -- --hostname 127.0.0.1 > /tmp/ziiply-next.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:3000/ -o /dev/null; then
              echo "Next.js server ready"
              exit 0
            fi
            sleep 2
          done
          tail -n 120 /tmp/ziiply-next.log
          exit 1
      - name: Run Chromium browser checks on this commit
        env:
          ZIIPLY_PREVIEW_URL: http://127.0.0.1:3000
        run: npx playwright test tests/gosta-cart-parity.browser.spec.cjs --browser=chromium --reporter=line
      - name: Show server diagnostics if failed
        if: failure()
        run: tail -n 120 /tmp/ziiply-next.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gosta-cart-browser-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
