name: Isolated normal search provider replay parity
on:
  push:
    branches:
      - test/normal-search-main-isolated-20261119
    paths:
      - '.github/workflows/normal-search-provider-replay.yml'
      - 'tests/normal-search-targeted-diagnostic.spec.cjs'
      - 'src/app/components/ziiply/search/normalSearchCatalog.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --no-package-lock @playwright/test
      - run: npx playwright install chromium
      - name: Compare identical provider response bytes on mobile and desktop
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          ZIIPLY_LIVE_URL: https://ziiply-evbgm87vz-ziipli2026s-projects.vercel.app
          NORMAL_SEARCH_REPLAY: '1'
          NORMAL_SEARCH_SELECTED_QUERIES: mansikka,oliiviöljy,kala,muro,makkara,suklaa
        run: |
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET" || exit 1
          npx playwright test tests/normal-search-targeted-diagnostic.spec.cjs --browser=chromium --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-replay-parity-evidence
          path: normal-search-evidence/
          if-no-files-found: ignore
