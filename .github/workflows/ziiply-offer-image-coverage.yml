name: Ziiply offer image coverage audit
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Read production image coverage (no writes)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/ziiply-offer-image-coverage.mjs
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziiply-offer-image-coverage
          path: image-coverage-reports/
          if-no-files-found: warn
