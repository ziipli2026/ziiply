name: Desktop Neon - corrected 31 EAN regression
on:
  push:
    branches: [preview/legacy-desktop-ui]
    paths: ['.github/workflows/neon-31-corrected.yml', 'scripts/audit-neon-31-corrected.cjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/test-desktop-normal-relevance.cjs
      - name: Test corrected route against real Neon for all 31 queries
        env:
          DATABASE_URL: ${{ secrets.ZIIPLY_DATABASE_URL }}
        run: node scripts/audit-neon-31-corrected.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neon-31-corrected
          path: neon-31-corrected.json
          if-no-files-found: error
