name: K-Citymarket leaflet parser history
on:
  pull_request:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/kcitymarket-40av-audit.yml"
      - "scripts/citymarket/leaflet-regression-publications.json"
      - "tests/fixtures/citymarket/**"
      - "tests/kcitymarket-category-regression.test.cjs"
      - "tests/kcitymarket-multibuy-display.test.cjs"
      - "src/app/components/ziiply/cards/ZiiplyMobileOfferSearchCard.tsx"
      - "src/app/components/ziiply/offerSearch/providers/kCitymarketProvider.ts"
      - "src/app/components/ziiply/offerSearch/providers/kCitymarketSpatialParser.js"
      - "src/app/components/ziiply/offerSearch/kOfferTabPolicy.ts"
      - "tests/k-offer-tab-policy.test.cjs"
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run K offer tab policy regression
        run: node --test tests/k-offer-tab-policy.test.cjs
      - name: Run Citymarket category regression
        run: node --test tests/kcitymarket-category-regression.test.cjs
      - name: Run Citymarket multibuy display regression
        run: node --test tests/kcitymarket-multibuy-display.test.cjs
      - name: Verify permanently archived Citymarket sources offline
        shell: bash
        run: |
          git fetch --depth=1 origin archive/citymarket-publications
          git worktree add --detach /tmp/kcm-frozen FETCH_HEAD
          node scripts/citymarket/verify-frozen-archive.mjs /tmp/kcm-frozen
      - name: Replay archived publisher geometry with current parser
        shell: bash
        run: |
          cp src/app/components/ziiply/offerSearch/providers/kCitymarketSpatialParser.js /tmp/kcm-replay-parser.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const manifest=JSON.parse(fs.readFileSync('scripts/citymarket/leaflet-regression-publications.json','utf8'));
          for(const entry of manifest.historicalFixtures||[]){
            const folder='/tmp/kcm-frozen/publications/'+entry.id;
            if(!fs.existsSync(folder+'/publisher-responses.json')){
              console.log('KCM_REPLAY_PENDING_CAPTURE',entry.id);
              continue;
            }
            execFileSync('node',['scripts/citymarket/replay-frozen-parser.mjs',folder,entry.fixture,'/tmp/kcm-replay-parser.mjs'],{stdio:'inherit'});
          }
          NODE
      - name: Verify frozen Citymarket fixtures and current live leaflet
        shell: bash
        run: |
          cp src/app/components/ziiply/offerSearch/providers/kCitymarketSpatialParser.js /tmp/kcm-parser.mjs
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import parser from "file:///tmp/kcm-parser.mjs";

          const manifest=JSON.parse(fs.readFileSync("scripts/citymarket/leaflet-regression-publications.json","utf8"));
          const historical=Array.isArray(manifest?.historicalFixtures)?manifest.historicalFixtures:[];
          if(!historical.length) throw new Error("No frozen Citymarket historical fixtures configured");

          for(const entry of historical){
            const fixture=JSON.parse(fs.readFileSync(entry.fixture,"utf8"));
            if(fixture.id!==entry.id) throw new Error(`${entry.id}: fixture id mismatch`);
            if(!Array.isArray(fixture.offers)||fixture.offers.length!==fixture.offerCount) {
              throw new Error(`${entry.id}: fixture offer count mismatch`);
            }
            if(!fixture.pdfSha256||!(Number(fixture.pageCount)>0)||!(Number(fixture.offerCount)>0)) {
              throw new Error(`${entry.id}: incomplete frozen evidence`);
            }
            const duplicateKeys=fixture.offers.filter((x,i,a)=>a.findIndex(y=>y.key===x.key)!==i);
            if(duplicateKeys.length) throw new Error(`${entry.id}: duplicate approved offer keys`);
            console.log("KCM_FROZEN_FIXTURE",JSON.stringify({id:entry.id,pages:fixture.pageCount,offers:fixture.offerCount,pdfSha256:fixture.pdfSha256}));
          }

          const current=manifest?.current;
          if(!current?.url||!current?.fixture) throw new Error("No current Citymarket publication configured");
          const expected=JSON.parse(fs.readFileSync(current.fixture,"utf8"));
          const out=await parser(current.url);
          const rows=Array.isArray(out?.rows)?out.rows:[];
          const resolved=rows.filter(r=>Number(r?.spatialResolved?.value)>0);
          const percentages=rows.filter(r=>Number(r?.percentageOffer?.percent)>0);
          if(!rows.length||(!resolved.length&&!percentages.length)) throw new Error(`${current.id}: live parser returned no usable rows`);

          const liveKeys=new Set([
            ...resolved.map(r=>{
              const page=Number(r.page)||0;
              const title=String(r.title||"").trim().toLowerCase();
              const price=Number(r.spatialResolved.value);
              return `kcm:spatial:${page}:${title}:${Number.isFinite(price)?price:""}`;
            }),
            ...percentages.filter(r=>!r?.spatialResolved).map(r=>{
              const page=Number(r.page)||0;
              const title=String(r.title||"").trim().toLowerCase();
              return `kcm:spatial:${page}:${title}:percent:${Number(r.percentageOffer.percent)}`;
            })
          ]);
          const expectedKeys=new Set(expected.offers.map(x=>x.key));
          const matched=[...expectedKeys].filter(k=>liveKeys.has(k));
          const missing=[...expectedKeys].filter(k=>!liveKeys.has(k));
          const extra=[...liveKeys].filter(k=>!expectedKeys.has(k));
          console.log("KCM_CURRENT_LIVE",JSON.stringify({
            id:current.id,
            expected:expectedKeys.size,
            liveResolved:resolved.length,
            livePercentages:percentages.length,
            matched:matched.length,
            missing:missing.length,
            extra:extra.length,
            missingSample:missing.slice(0,10),
            extraSample:extra.slice(0,10)
          },null,2));
          // Every approved offer (including percent campaigns) is mandatory.
          // Extra rows are reported for manual source verification; a frozen fixture
          // cannot establish that all unapproved rows are false positives.
          if(missing.length) throw new Error(`${current.id}: missing approved offers (${matched.length}/${expectedKeys.size})`);
          NODE

  archive-current:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Preserve original publisher PDF and parser evidence
        shell: bash
        run: |
          cp src/app/components/ziiply/offerSearch/providers/kCitymarketSpatialParser.js /tmp/kcm-archive-parser.mjs
          ENTRY=$(node -p "require('./scripts/citymarket/leaflet-regression-publications.json').current.url")
          node scripts/citymarket/export-leaflet.mjs "$ENTRY" /tmp/kcm-leaflet-archive /tmp/kcm-archive-parser.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const dir='/tmp/kcm-leaflet-archive/';
          const manifest=JSON.parse(fs.readFileSync(dir+'archive-manifest.json','utf8'));
          const digest=createHash('sha256').update(fs.readFileSync(dir+'leaflet.pdf')).digest('hex');
          if(digest!==manifest.pdfSha256)throw Error('Archive PDF hash mismatch');
          const current=JSON.parse(fs.readFileSync('scripts/citymarket/leaflet-regression-publications.json','utf8')).current;
          const fixture=JSON.parse(fs.readFileSync(current.fixture,'utf8'));
          if(fixture.pdfSha256!==digest)throw Error('Archived PDF does not match approved fixture');
          if(fixture.pageCount!==manifest.pageCount)throw Error('Archived PDF page count mismatch');
          console.log('KCM_ARCHIVE_VERIFIED',JSON.stringify({pdfSha256:digest,pages:manifest.pageCount,offers:manifest.offerCount}));
          NODE
      - name: Replay newly captured publication without network
        shell: bash
        run: |
          cp src/app/components/ziiply/offerSearch/providers/kCitymarketSpatialParser.js /tmp/kcm-replay-parser.mjs
          FIXTURE=$(node -p "require('./scripts/citymarket/leaflet-regression-publications.json').current.fixture")
          node scripts/citymarket/replay-frozen-parser.mjs /tmp/kcm-leaflet-archive "$FIXTURE" /tmp/kcm-replay-parser.mjs
      - name: Commit verified source to permanent archive branch
        shell: bash
        run: |
          set -euo pipefail
          PUB_ID=$(node -p "require('./scripts/citymarket/leaflet-regression-publications.json').current.id")
          ARCHIVE_BRANCH=archive/citymarket-publications
          if git ls-remote --exit-code --heads origin "$ARCHIVE_BRANCH" >/dev/null; then
            git fetch origin "$ARCHIVE_BRANCH"
            git worktree add --detach /tmp/kcm-permanent-archive FETCH_HEAD
          else
            git worktree add --detach /tmp/kcm-permanent-archive HEAD
            git -C /tmp/kcm-permanent-archive switch --orphan "$ARCHIVE_BRANCH"
            git -C /tmp/kcm-permanent-archive rm -rf -q . || true
          fi
          ARCHIVE_DIR="/tmp/kcm-permanent-archive/publications/$PUB_ID"
          if [ -f "$ARCHIVE_DIR/archive-manifest.json" ]; then
            # First verified capture is immutable. Never silently replace
            # historical evidence with a newly parsed version of the same issue.
            node - "$ARCHIVE_DIR" /tmp/kcm-leaflet-archive <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const [oldDir,newDir]=process.argv.slice(2);
          const old=JSON.parse(fs.readFileSync(oldDir+'/archive-manifest.json'));
          const fresh=JSON.parse(fs.readFileSync(newDir+'/archive-manifest.json'));
          const digest=crypto.createHash('sha256').update(fs.readFileSync(oldDir+'/leaflet.pdf')).digest('hex');
          if(old.pdfSha256!==digest||fresh.pdfSha256!==digest)throw Error('Immutable Citymarket archive source differs from current publisher');
          if(!fs.existsSync(oldDir+'/publisher-responses.json'))throw Error('Permanent archive missing original publisher responses');
          console.log('KCM_ARCHIVE_IMMUTABLE',old.pdfSha256);
          NODE
          else
            mkdir -p "$ARCHIVE_DIR"
            cp -a /tmp/kcm-leaflet-archive/. "$ARCHIVE_DIR/"
          fi
          git -C /tmp/kcm-permanent-archive add "publications/$PUB_ID"
          if ! git -C /tmp/kcm-permanent-archive diff --cached --quiet; then
            git -C /tmp/kcm-permanent-archive -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Archive verified Citymarket $PUB_ID source"
            git -C /tmp/kcm-permanent-archive push origin "HEAD:refs/heads/$ARCHIVE_BRANCH"
          else
            echo "Permanent archive already contains identical $PUB_ID source"
          fi
      - name: Upload source archive for future regression recovery
        uses: actions/upload-artifact@v4
        with:
          name: kcitymarket-source-archive
          path: /tmp/kcm-leaflet-archive/
          retention-days: 90
          if-no-files-found: error
