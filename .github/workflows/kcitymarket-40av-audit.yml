name: K-Citymarket leaflet parser history
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/kcitymarket-40av-audit.yml"
      - "scripts/citymarket/leaflet-regression-publications.json"
      - "src/app/components/ziiply/offerSearch/providers/kCitymarketSpatialParser.js"
      - "src/app/components/ziiply/offerSearch/kOfferTabPolicy.ts"
      - "tests/k-offer-tab-policy.test.cjs"
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run K offer tab policy regression
        run: node --test tests/k-offer-tab-policy.test.cjs
      - name: Replay every approved Citymarket leaflet with current parser
        shell: bash
        run: |
          cp src/app/components/ziiply/offerSearch/providers/kCitymarketSpatialParser.js /tmp/kcm-parser.mjs
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import parser from "file:///tmp/kcm-parser.mjs";
          const manifest=JSON.parse(fs.readFileSync("scripts/citymarket/leaflet-regression-publications.json","utf8"));
          const publications=Array.isArray(manifest?.publications)?manifest.publications:[];
          if(!publications.length) throw new Error("No approved Citymarket regression publications configured");
          const summaries=[];
          for(const publication of publications){
            const out=await parser(publication.url);
            const rows=Array.isArray(out?.rows)?out.rows:[];
            const resolved=rows.filter(r=>Number(r?.spatialResolved?.value)>0);
            const invalidResolved=resolved.filter(r=>!Number.isFinite(Number(r.spatialResolved.value))||Number(r.spatialResolved.value)<=0);
            const summary={
              id:publication.id,
              url:publication.url,
              total:rows.length,
              resolved:resolved.length,
              unresolved:rows.length-resolved.length,
              invalidResolved:invalidResolved.length,
              leaflet:out?.leaflet??null
            };
            summaries.push(summary);
            console.log("KCM_HISTORY_PUBLICATION",JSON.stringify(summary));
            if(!rows.length) throw new Error(`${publication.id}: parser returned zero rows`);
            if(!resolved.length) throw new Error(`${publication.id}: parser returned zero resolved offers`);
            if(invalidResolved.length) throw new Error(`${publication.id}: invalid resolved prices`);
          }
          console.log("KCM_HISTORY_SUMMARY",JSON.stringify({revision:manifest.revision,count:summaries.length,publications:summaries},null,2));
          NODE
