name: Beta login dependency lockfile repair
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair-lockfile:
    if: github.ref == 'refs/heads/feature/arvo-health-sync-contract-20261030'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(beta): synchronize npm lockfile'
          git push origin HEAD:${GITHUB_REF_NAME}
