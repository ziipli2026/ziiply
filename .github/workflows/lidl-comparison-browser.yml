name: Lidl comparison browser
on:
  pull_request:
    paths:
      - 'src/app/api/offers/search/route.ts'
      - 'src/app/page.tsx'
      - 'src/app/desktop-preview/DesktopPreviewClient.tsx'
      - 'src/app/components/ziiply/**'
      - 'scripts/test-lidl-comparison-browser.cjs'
      - '.github/workflows/lidl-comparison-browser.yml'
  push:
    branches: ['fix/lidl-comparison-notice', 'fix/lidl-final-category-pipeline']
jobs:
  browser:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --prefix /tmp/lidl-browser --no-save --package-lock=false playwright@1.56.1
      - run: npm run build
      - name: Verify Ziiply catalog database before browser test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node - <<'NODE'
          const { neon } = require('@neondatabase/serverless');
          (async () => {
            if (!process.env.DATABASE_URL) throw new Error('DATABASE_URL secret missing: Ziiply catalog tests cannot run');
            const sql = neon(process.env.DATABASE_URL);
            const rows = await sql`SELECT to_regclass('public.ziiply_ean_products')::text AS catalog`;
            if (rows[0]?.catalog !== 'ziiply_ean_products') {
              throw new Error('DATABASE_URL points to a database without Ziiply EAN catalog; configure the Ziiply Neon project, not the other app database');
            }
            const count = await sql`SELECT count(*)::int AS n FROM public.ziiply_ean_products`;
            if (!count[0]?.n) throw new Error('Ziiply EAN catalog is empty: cannot validate shared categorization');
            console.log('Ziiply EAN catalog verified; rows:', count[0].n);
          })().catch(e => { console.error(e.message); process.exitCode = 1; });
          NODE
      - name: Browser test against active leaflet publication
        env:
          # Secrets are never printed. If absent, the test still runs and
          # reports the publication-source gap rather than silently passing.
          OFFER_PUBLICATION_DATABASE_URL: ${{ secrets.OFFER_PUBLICATION_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm run start -- -H 127.0.0.1 -p 3179 &
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3179/ >/dev/null; then break; fi
            sleep 2
          done
          NODE_PATH=/tmp/lidl-browser/node_modules node scripts/test-lidl-comparison-browser.cjs
