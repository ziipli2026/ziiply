name: Product energy browser check
on:
  push:
    branches: [test/product-energy-mobile, test/product-energy-desktop]
    paths: [.github/workflows/product-energy-browser.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  energy:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --prefix "$RUNNER_TEMP/energy-browser" --no-save --package-lock=false playwright@1.56.1
      - name: Start temporary card fixture
        run: |
          mkdir -p src/app/energy-browser-check
          cat > src/app/energy-browser-check/page.tsx <<'TSX'
          import ProductEnergy from "../components/ziiply/cards/ProductEnergy";
          import SearchCards from "../components/ziiply/cards/ZiiplyMobileSearchResultsCard";
          const product = {name:"Vaasan Koulunäkki 460 g",ean:"6437005083136",price:3.49};
          export default async function Fixture({searchParams}: {searchParams:Promise<{mode?:string}>}) {
            const {mode}=await searchParams;
            if(mode) return <SearchCards open compact={mode==="recipe"} products={[product]} />;
            return <main>
              <section id="live"><ProductEnergy ean={product.ean} /></section>
              <section id="duplicate"><ProductEnergy ean={product.ean} /></section>
              <section id="fineli"><ProductEnergy nutrition={{source:"fineli-generic",nutrients:{ENERC:{value:1046,unit:"kJ"}}}} /></section>
              <section id="missing"><ProductEnergy /></section>
              {Array.from({length:32},(_,i)=><section id={"card-"+(i+1)} key={i} style={{height:350}}>
                {i===31 && <ProductEnergy ean="1234567890123" />}
              </section>)}
            </main>;
          }
          TSX
          npm run dev -- -H 127.0.0.1 -p 3100 > /tmp/energy-next.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent --max-time 30 http://127.0.0.1:3100/energy-browser-check >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/energy-next.log
          exit 1
      - name: Verify kcal and kJ in Chromium
        run: |
          NODE_PATH="$RUNNER_TEMP/energy-browser/node_modules" node <<'NODE'
          const {chromium, devices}=require("playwright");
          const assert=require("node:assert/strict");
          (async()=>{
            const ean="6437005083136";
            const response=await fetch("https://ziiply.vercel.app/api/ean-bank?ean="+ean,{signal:AbortSignal.timeout(25000)});
            assert.ok(response.ok,"live EAN API "+response.status);
            const live=await response.json();
            assert.equal(live.product.ean,ean);
            assert.ok(Number(live.product.nutrition.kcal_100g)>0);
            const browser=await chromium.launch();
            try {
              const main="http://127.0.0.1:3100/energy-browser-check";
              for(const [name,options] of [["mobile",devices["iPhone 13"]],["desktop",{viewport:{width:1440,height:900}}]]) {
                const page=await browser.newPage(options);
                const calls=[];
                await page.route("**/api/ean-bank?*",route=>{
                  const code=new URL(route.request().url()).searchParams.get("ean");
                  calls.push(code);
                  return route.fulfill({json:code===ean?live:{ok:true,product:{nutrition:{kj_100g:1046}}}});
                });
                await page.goto(main);
                await page.locator("#live").getByText(/kcal.*kJ/).waitFor();
                await page.locator("#duplicate").getByText(/kcal.*kJ/).waitFor();
                assert.deepEqual(calls,[ean]);
                assert.match(await page.locator("#fineli").innerText(),/Energia-arvio: 250 kcal/);
                assert.equal(await page.locator("#missing").innerText(),"");
                await page.locator("#card-32").scrollIntoViewIfNeeded();
                await page.locator("#card-32").getByText(/250 kcal.*kJ/).waitFor();
                assert.deepEqual(calls,[ean,"1234567890123"]);
                for(const mode of ["normal","recipe"]){
                  await page.goto(main+"?mode="+mode);
                  await page.getByText("Vaasan Koulunäkki 460 g",{exact:true}).waitFor();
                  await page.getByText(/Energia:.*kcal.*kJ/).waitFor();
                  console.log("PASS",name,mode,"result card");
                }
                console.log("PASS",name,"live EAN, shared request, missing data, kJ and card 32");
                await page.close();
              }
            }finally{await browser.close();}
          })().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
      - if: failure()
        run: cat /tmp/energy-next.log
