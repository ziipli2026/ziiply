name: Monta four-chain live comparison
on:
  push:
    branches: [test/monta-four-chains-live-20261116]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Install Vercel CLI and link test project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo '::error::Missing VERCEL_TOKEN secret'; exit 1; }
          npm install --global vercel@65.9.0
          vercel link --yes --project ziiply --scope ziipli2026s-projects --token "$VERCEL_TOKEN"
      - name: Test protected branch preview with authenticated real APIs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ZIIPLY_LIVE_URL: https://ziiply-git-test-monta-four-chains-l-25d7a2-ziipli2026s-projects.vercel.app
        run: |
          vercel env run -- sh -c '
            test -n "$VERCEL_OIDC_TOKEN" || { echo "::error::No Vercel development OIDC token available"; exit 1; }
            npx playwright test tests/monta-four-chains-live.spec.cjs --browser=chromium --reporter=line
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monta-four-chains-live-evidence
          path: |
            test-results/
          if-no-files-found: ignore
