name: Monta four-chain live comparison
on:
  push:
    branches: [test/monta-four-chains-live-20261116]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test live main production with real APIs
        env:
          ZIIPLY_LIVE_URL: https://ziiply.fi
        run: npx playwright test tests/monta-four-chains-live.spec.cjs --browser=chromium --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monta-four-chains-live-evidence
          path: |
            test-results/
          if-no-files-found: ignore
