name: Monta four-chain live comparison
on:
  push:
    branches: [test/monta-four-chains-live-20261116]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Test protected branch preview with Chromium and Automation Bypass
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          ZIIPLY_LIVE_URL: https://ziiply-git-test-monta-four-chains-l-25d7a2-ziipli2026s-projects.vercel.app
        run: |
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET" || { echo '::error::Missing existing VERCEL_AUTOMATION_BYPASS_SECRET for Chromium'; exit 1; }
          # Run on separate browser processes, never concurrently. Preserve both
          # evidence files even if one side fails; parity runs last.
          set +e
          echo '=== MOBILE ONLY ==='
          npx playwright test tests/monta-four-chains-live.spec.cjs --browser=chromium --reporter=line --grep '^Monta live all chains: mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monta-four-chains-live-evidence
          path: |
            test-results/
          if-no-files-found: ignore

          mobile_status=$?
          echo '=== WAIT 30s BEFORE DESKTOP ==='
          sleep 30
          echo '=== DESKTOP ONLY ==='
          npx playwright test tests/monta-four-chains-live.spec.cjs --browser=chromium --reporter=line --grep '^Monta live all chains: desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monta-four-chains-live-evidence
          path: |
            test-results/
          if-no-files-found: ignore

          desktop_status=$?
          echo '=== PARITY FROM SAVED EVIDENCE ==='
          npx playwright test tests/monta-four-chains-live.spec.cjs --browser=chromium --reporter=line --grep '^Monta: mobile and desktop visible EAN sets match per query
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monta-four-chains-live-evidence
          path: |
            test-results/
          if-no-files-found: ignore

          parity_status=$?
          echo "Mobile: $mobile_status Desktop: $desktop_status Parity: $parity_status"
          test "$mobile_status" -eq 0 && test "$desktop_status" -eq 0 && test "$parity_status" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monta-four-chains-live-evidence
          path: |
            test-results/
          if-no-files-found: ignore
