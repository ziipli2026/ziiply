name: Monta four-chain live comparison
on:
  push:
    branches: [test/monta-four-chains-live-20261116]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test
      - run: npx playwright install chromium
      - name: Run mobile then desktop then parity (separate processes)
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          ZIIPLY_LIVE_URL: https://ziiply-git-test-monta-four-chains-l-25d7a2-ziipli2026s-projects.vercel.app
        run: |
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET" || exit 1
          set +e
          npx playwright test tests/monta-four-chains-live.spec.cjs --browser=chromium --reporter=line --grep "Monta live all chains: mobile"
          mobile_status=$?
          sleep 30
          npx playwright test tests/monta-four-chains-live.spec.cjs --browser=chromium --reporter=line --grep "Monta live all chains: desktop"
          desktop_status=$?
          npx playwright test tests/monta-four-chains-live.spec.cjs --browser=chromium --reporter=line --grep "Monta: mobile and desktop visible EAN sets match per query"
          parity_status=$?
          echo "Mobile=$mobile_status Desktop=$desktop_status Parity=$parity_status"
          test "$mobile_status" -eq 0 && test "$desktop_status" -eq 0 && test "$parity_status" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monta-four-chains-live-evidence
          path: |
            test-results/
            monta-evidence/
          if-no-files-found: ignore
