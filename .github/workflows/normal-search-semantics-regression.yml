name: Normal search semantics regression

on:
  push:
    branches: [main]
    paths:
      - "src/app/components/ziiply/ziiplyCore.ts"
      - "src/app/components/ziiply/search/**"
      - "src/app/page.tsx"
      - ".github/workflows/normal-search-semantics-regression.yml"
  workflow_dispatch:

jobs:
  semantic-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Compile search core for functional regression
        run: |
          rm -rf .tmp-search-regression
          npx tsc src/app/components/ziiply/ziiplyCore.ts \
            --target ES2020 \
            --module commonjs \
            --moduleResolution node \
            --esModuleInterop \
            --skipLibCheck \
            --outDir .tmp-search-regression
          npx tsc src/app/components/ziiply/search/searchIntentAI.ts \
            --target ES2020 \
            --module commonjs \
            --moduleResolution node \
            --esModuleInterop \
            --skipLibCheck \
            --outDir .tmp-search-regression/search
      - name: Verify normal-search semantics
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const core = fs.readFileSync("src/app/components/ziiply/ziiplyCore.ts", "utf8");
          const intent = fs.readFileSync("src/app/components/ziiply/search/searchIntentAI.ts", "utf8");
          const memory = fs.readFileSync("src/app/components/ziiply/search/searchIntentMemory.ts", "utf8");
          const page = fs.readFileSync("src/app/page.tsx", "utf8");

          const requiredAliases = [
            ['pilsneri', 'pilsner'],
            ['pils', 'pilsner'],
            ['kahvia', 'kahvi'],
            ['maitoa', 'maito'],
            ['juustoa', 'juusto 500g'],
            ['jogurttia', 'jogurtti 1kg'],
            ['jauhelihaa', 'jauheliha 400g'],
            ['munia', 'kananmuna 10 kpl'],
            ['kananmunia', 'kananmuna 10 kpl'],
            ['piima', 'piimä'],
          ];

          let failures = 0;
          for (const [input, expected] of requiredAliases) {
            const pattern = new RegExp('(?:^|\\n)\\s*["\\\']?' + input + '["\\\']?\\s*:\\s*["\\\']' + expected.replace(/[.*+?^$()|[\\]{}]/g, '\\$&') + '["\\\']');
            if (!pattern.test(core)) {
              console.error('FAIL alias:', input, '=>', expected);
              failures++;
            } else {
              console.log('PASS alias:', input, '=>', expected);
            }
          }

          const requiredArchitecture = [
            'export function getSearchQuery',
            'export function detectSearchIntent',
            'export function getNormalSearchQueries',
            'export function rankNormalSearchResults',
            'export function isClearlyButtermilkProduct',
          ];
          for (const symbol of requiredArchitecture) {
            if (!core.includes(symbol)) {
              console.error('FAIL missing search stage:', symbol);
              failures++;
            } else {
              console.log('PASS stage:', symbol);
            }
          }

          const inflectionIntentCases = [
            ['maitoa', 'maito', 'milk_drink'],
            ['kahvia', 'kahvi', 'coffee'],
            ['juustoa', 'juusto', 'cheese'],
            ['jogurttia', 'jogurtti', 'yogurt'],
            ['voita', 'voi', 'butter'],
            ['kermaa', 'kerma', 'cream'],
            ['jauhelihaa', 'jauheliha', 'meat'],
            ['leipää', 'leipä', 'bread'],
            ['kananmunia', 'kananmuna', 'eggs'],
            ['munia', 'kananmuna', 'eggs'],
            ['tomaatteja', 'tomaatti', 'vegetable'],
            ['kurkkua', 'kurkku', 'vegetable'],
            ['perunoita', 'peruna', 'vegetable'],
            ['porkkanoita', 'porkkana', 'vegetable'],
            ['omenoita', 'omena', 'fruit'],
            ['banaaneja', 'banaani', 'fruit'],
            ['pilsneri', 'pilsner', 'unknown'],
          ];

          for (const [input, canonical, expectedIntent] of inflectionIntentCases) {
            const correctionPattern = new RegExp('(?:^|\\n)\\s*["\\\']?' + input + '["\\\']?\\s*:\\s*["\\\']' + canonical + '["\\\']');
            if (!correctionPattern.test(intent)) {
              console.error('FAIL canonical grocery form:', input, '=>', canonical);
              failures++;
              continue;
            }
            if (expectedIntent !== 'unknown') {
              const intentRule = new RegExp('\\["' + expectedIntent.replace('_', '\\_') + '"');
              if (!intentRule.test(intent)) {
                console.error('FAIL missing intent rule:', expectedIntent, 'for', input);
                failures++;
              } else {
                console.log('PASS grocery form:', input, '=>', canonical, '=>', expectedIntent);
              }
            } else {
              console.log('PASS grocery form:', input, '=>', canonical);
            }
          }

          const structuralChecks = [
            [intent, 'pilsneri: "pilsner"', 'semantic pilsner normalization'],
            [memory, 'learned_structure_preference', 'structure-based learning'],
            [memory, 'getProductPackageSize', 'package-size structure'],
            [memory, 'STRUCTURE_ATTRIBUTE_TERMS', 'attribute structure'],
            [memory, 'getLearnedStructureBoost', 'structure-only production boost'],
            [page, 'learnZiiplyNormalSearchChoice(learnedQuery, product, "added_to_cart")', 'cart selection learning hook'],
            [page, 'getLearnedStructureBoost(aOriginalQuery, a).boost', 'production ranking learning bridge'],
          ];
          for (const [source, fragment, label] of structuralChecks) {
            if (!source.includes(fragment)) {
              console.error('FAIL structural search check:', label);
              failures++;
            } else {
              console.log('PASS structural search check:', label);
            }
          }

          const relevanceIndex = page.indexOf('const rankedPair = rankNormalSearchResults(');
          const learningIndex = page.indexOf('const aLearnedStructureBoost = getLearnedStructureBoost(');
          if (relevanceIndex < 0 || learningIndex < 0 || relevanceIndex > learningIndex) {
            console.error('FAIL ordering: learned preference must run after normal relevance');
            failures++;
          } else {
            console.log('PASS ordering: normal relevance precedes learned preference');
          }

          if (failures) process.exit(1);
          console.log('SAFE_SUMMARY normal-search semantics regression passed');
          NODE

      - name: Functional grocery typo autocorrect regression
        shell: bash
        run: |
          node <<'NODE'
          const { correctSearchQuery, resolveSearchIntentAI } = require('./.tmp-search-regression/search/searchIntentAI.js');

          const typoCases = [
            ['matio', 'maito', 'milk_drink'],
            ['maitoo', 'maito', 'milk_drink'],
            ['jogurti', 'jogurtti', 'yogurt'],
            ['kanamuna', 'kananmuna', 'eggs'],
            ['tomati', 'tomaatti', 'vegetable'],
          ];
          for (const [input, expected, expectedIntent] of typoCases) {
            const actual = correctSearchQuery(input);
            if (actual !== expected) {
              console.error('FAIL typo autocorrect:', input, '=>', actual, 'expected', expected);
              process.exit(1);
            }
            const resolved = resolveSearchIntentAI(input);
            if (resolved.intent !== expectedIntent) {
              console.error('FAIL typo intent:', input, '=>', resolved.intent, 'expected', expectedIntent);
              process.exit(1);
            }
            console.log('PASS typo autocorrect+intent:', input, '=>', actual, '=>', resolved.intent);
          }

          // Piimä is intentionally not in the newer intent enum yet; still verify the typo
          // correction itself without pretending it has a dedicated intent in this layer.
          if (correctSearchQuery('piiimä') !== 'piimä') {
            console.error('FAIL typo autocorrect: piiimä');
            process.exit(1);
          }

          const protectedQueries = ['valio', 'arla', 'pirkka', 'juhla mokka', 'oltermanni', 'rainbow'];
          for (const input of protectedQueries) {
            const actual = correctSearchQuery(input);
            if (actual !== input) {
              console.error('FAIL protected query changed:', input, '=>', actual);
              process.exit(1);
            }
            console.log('PASS protected query unchanged:', input);
          }

          console.log('SAFE_SUMMARY grocery typo autocorrect regression passed');
          NODE

      - name: Functional piima ranking regression
        shell: bash
        run: |
          node <<'NODE'
          const core = require('./.tmp-search-regression/ziiplyCore.js');

          const products = [
            { id: 1, name: 'Kotimaista rasvaton piimä 1l', category: 'Maidot ja piimät', price: 1.19 },
            { id: 2, name: 'Valio Eila laktoositon piimä 1 l rasvaton', category: 'Maidot ja piimät', price: 1.69 },
            { id: 3, name: 'Arla rasvaton AB-piimä 1l', category: 'Maidot ja piimät', price: 1.55 },
            { id: 4, name: 'Vaasan Piimälimppu 400g', category: 'Leivät', price: 2.89 },
            { id: 5, name: 'Rosten piimäsämpylä 6kpl', category: 'Leivät', price: 2.59 },
          ];

          const ranked = core.rankNormalSearchResults('piimä', products);
          const positions = new Map(ranked.map((product, index) => [product.id, index]));
          const drinkIds = [1, 2, 3];
          const breadIds = [4, 5];
          const lastDrink = Math.max(...drinkIds.map(id => positions.get(id)));
          const firstBread = Math.min(...breadIds.map(id => positions.get(id)));

          if (!(lastDrink < firstBread)) {
            console.error('FAIL piimä ranking:', ranked.map(product => product.name));
            process.exit(1);
          }

          if (!core.isClearlyButtermilkProduct(products[0]) ||
              !core.isClearlyButtermilkProduct(products[2]) ||
              core.isClearlyButtermilkProduct(products[3]) ||
              core.isClearlyButtermilkProduct(products[4])) {
            console.error('FAIL piimä product classification');
            process.exit(1);
          }

          console.log('PASS piimä ranking: all buttermilk drinks precede piimä breads');
          console.log('SAFE_SUMMARY functional piimä regression passed');
          NODE

      - name: Functional maito ranking regression
        shell: bash
        run: |
          node <<'NODE'
          const core = require('./.tmp-search-regression/ziiplyCore.js');

          const products = [
            { id: 11, name: 'Kotimaista rasvaton maito 1l', category: 'Maidot ja piimät', price: 0.99 },
            { id: 12, name: 'Valio Eila laktoositon rasvaton maito 1 l', category: 'Maidot ja piimät', price: 1.65 },
            { id: 13, name: 'Arla kevytmaito 1l', category: 'Maidot ja piimät', price: 1.29 },
            { id: 14, name: 'Maitokolmio Sipaisu rasvaseos 400g', category: 'Rasvat ja levitteet', price: 2.49 },
            { id: 15, name: 'Fazer maitosuklaa 200g', category: 'Makeiset', price: 3.19 },
            { id: 16, name: 'Valio kuohukerma 2 dl', category: 'Kermat', price: 1.39 },
            { id: 17, name: 'Valio maitorahka 250g', category: 'Rahkat', price: 1.09 },
          ];

          for (const query of ['maito', 'maitoa']) {
            const ranked = core.rankNormalSearchResults(query, products);
            const positions = new Map(ranked.map((product, index) => [product.id, index]));
            const milkIds = [11, 12, 13];
            const wrongIds = [14, 15, 16, 17];
            const lastMilk = Math.max(...milkIds.map(id => positions.get(id)));
            const firstWrong = Math.min(...wrongIds.map(id => positions.get(id)));

            if (!(lastMilk < firstWrong)) {
              console.error('FAIL milk ranking for', query, ranked.map(product => product.name));
              process.exit(1);
            }
            console.log('PASS milk ranking:', query, 'keeps true milk before incidental/wrong products');
          }

          console.log('SAFE_SUMMARY functional maito regression passed');
          NODE
