name: Comparison different missing items
on:
  push:
    paths:
      - 'src/app/components/ziiply/cards/ZiiplyMobileCompareCardresponsive.tsx'
      - 'scripts/audit-comparison-different-missing-items-20261002.cjs'
      - '.github/workflows/comparison-different-missing-items.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/audit-comparison-different-missing-items-20261002.cjs
