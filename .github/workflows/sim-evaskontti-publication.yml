name: Sim K-Supermarket Evaskontti publication
on:
  push:
    branches: [sim/ksupermarket-evaskontti-publication]
jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Compare Evaskontti and Jokela
        shell: bash
        run: |
          node <<'NODE'
          const ORIGIN="https://etarjouslehdet.fi", BUSINESS="f305U8";
          const KH={"accept":"application/json","content-type":"application/json","x-k-build-number":"29159","x-k-experiments":"ab4d.10001.0!d2ae.10003.0!a.00145.0!a.00150.0!a.00154.1"};
          async function kprobe(path,body){try{const r=await fetch("https://www.k-ruoka.fi/kr-api/"+path,{method:"POST",headers:KH,body:body?JSON.stringify(body):undefined});const t=await r.text();console.log("KAPI",path,r.status,t.slice(0,1200).replace(/\\n/g," "));}catch(e){console.log("KAPI_ERR",path,String(e))}}
          const norm=v=>String(v??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[‐-‒–—−]/g,"-").replace(/&/g," ja ").replace(/[^a-z0-9åäö]+/gi," ").replace(/\s+/g," ").trim();
          const b64=value=>Buffer.from(JSON.stringify(value,(_k,v)=>Object.prototype.toString.call(v)==="[object Object]"?Object.keys(v).sort().reduce((o,k)=>(o[k]=v[k],o),{}):v),"utf8").toString("base64");
          async function data(name,params){const key=b64([name,params]);const r=await fetch(ORIGIN+"/",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json, text/plain, */*",Referer:ORIGIN+"/K-Supermarket"},body:JSON.stringify({data:[key]})});if(!r.ok)throw new Error(name+" HTTP "+r.status);for(const line of (await r.text()).split(/\r?\n/).filter(Boolean)){try{const row=JSON.parse(line);if(row.key===key)return row.value}catch{}}throw new Error(name+" key missing")}
          const arr=v=>Array.isArray(v?.data)?v.data.filter(x=>x&&typeof x==="object"):[];
          async function inspectKRuoka(slug){const u="https://www.k-ruoka.fi/kauppa/"+slug;const r=await fetch(u,{headers:{"user-agent":"Mozilla/5.0"}});const h=await r.text();const links=[...h.matchAll(/href=["']([^"']*tarjouslehdet[^"']*)["']/gi)].map(m=>m[1]);const ids=[...new Set([...h.matchAll(/tarjouslehti-([0-9]+P?)/gi)].map(m=>m[1]))];return {status:r.status,links:[...new Set(links)].slice(0,10),ids:ids.slice(0,10),len:h.length}}
          await kprobe("stores/search",{query:"K-Supermarket Eväskontti",offset:0,limit:5});
          for(const ep of ["tos-offers","raw-offer/product-map","offers","offer-search","leaflets","campaigns"]){await kprobe(ep,{storeId:"4165GCi",storeName:"K-Supermarket Eväskontti",offset:0,limit:20})}
          for(const slug of ["k-supermarket-evaskontti","k-supermarket-rantakyla","k-supermarket-lansivayla","k-supermarket-matkus","k-supermarket-okeroinen","k-supermarket-herkkuduo","k-supermarket-annika","k-supermarket-joutsensilta","k-supermarket-ounasvaara","k-supermarket-jokela"]){try{console.log("KRUOKA_PAGE",slug,JSON.stringify(await inspectKRuoka(slug)))}catch(e){console.log("KRUOKA_PAGE_ERROR",slug,String(e))}}
          for(const slug of ["k-supermarket-evaskontti","k-supermarket-rantakyla","k-supermarket-okeroinen","k-supermarket-joutsensilta","k-supermarket-jokela"]){try{const u="https://www.k-ruoka.fi/tarjouslehdet/kauppa/"+slug;const r=await fetch(u);const h=await r.text();console.log("LEAFLET_ROUTE",slug,r.status,h.length,h.includes("applicationState"),h.includes("KSM-KESKI- JA ITÄ-SUOMI"),h.slice(0,80).replace(/\\s+/g," "))}catch(e){console.log("LEAFLET_ROUTE_ERR",slug,String(e))}}
          const fronts=await data("fronts",{businessSlugs:["K-Supermarket"]}); console.log("FRONTS",JSON.stringify(fronts)); const stores=arr(await data("stores",{businessId:BUSINESS,pagination:{offset:0,limit:1000}}));
          function pick(label){const q=norm(label);return stores.find(s=>norm(s.name)===q)||stores.find(s=>norm(s.name).includes(q.replace("k supermarket ","")))}
          const ev=pick("K-Supermarket Eväskontti"), jo=pick("K-Supermarket Jokela");
          const cities=["Helsinki","Espoo","Vantaa","Järvenpää","Hyvinkää","Lahti","Tampere","Turku","Jyväskylä","Kuopio","Joensuu","Oulu","Rovaniemi"];
          const matrix=cities.map(city=>{const ss=stores.filter(s=>norm(s.city)===norm(city));return {city,total:ss.length,sample:ss.slice(0,3).map(s=>({id:s.id,name:s.name}))}}); console.log("CITY_MATRIX",JSON.stringify(matrix));
          if(!ev||!jo) throw new Error("store missing "+JSON.stringify({ev:!!ev,jo:!!jo,evMatches:stores.filter(s=>norm(s.name).includes("evaskontti")).map(s=>({id:s.id,name:s.name})),joMatches:stores.filter(s=>norm(s.name).includes("jokela")).map(s=>({id:s.id,name:s.name}))}));
          const baseParams={businessIds:[BUSINESS],sources:["publication","business_product"],pagination:{limit:1000,offset:0},sort:["score_desc"]};
          const offers=arr(await data("offers",baseParams));
          for(const [label,extra] of [["storeId",{storeId:String(ev.id)}],["storeIds",{storeIds:[String(ev.id)]}],["stores",{stores:[String(ev.id)]}]]){
            try{
              const probe=arr(await data("offers",{...baseParams,...extra}));
              const pubs=[...new Set(probe.map(o=>String(o.publicationPublicId??"")).filter(Boolean))];
              console.log("EVASKONTTI_PROBE",JSON.stringify({label,count:probe.length,pubs:pubs.map(id=>({id,count:probe.filter(o=>String(o.publicationPublicId??"")===id).length}))}));
            }catch(e){console.log("EVASKONTTI_PROBE_ERROR",label,String(e))}
          }
          const ids=[...new Set(offers.map(o=>String(o.publicationPublicId??"")).filter(Boolean))];
          const rows=[];
          for(const id of ids){const ps=arr(await data("stores",{publicationId:id,businessId:BUSINESS,pagination:{offset:0,limit:1000}}));rows.push({id,count:offers.filter(o=>String(o.publicationPublicId??"")===id).length,ev:ps.some(s=>String(s.id)===String(ev.id)),jo:ps.some(s=>String(s.id)===String(jo.id)),stores:ps.length,samples:ps.map(s=>({name:s.name,city:s.city,postalCode:s.postalCode}))})}
          rows.sort((a,b)=>b.count-a.count);
          const covered=new Set(); for(const r of rows){if(r.id!=="2mlUHxXd") for(const s of r.samples) covered.add(String(s.name))}
          const coverage=matrix.map(m=>{const ss=stores.filter(s=>norm(s.city)===norm(m.city)); const hit=ss.filter(s=>covered.has(String(s.name))); return {city:m.city,total:ss.length,covered:hit.length,coveredNames:hit.map(s=>s.name)};}); console.log("REGIONAL_COVERAGE",JSON.stringify(coverage));
          const dominant=rows[0], second=rows[1]?.count??0;
          const safe=!!dominant&&dominant.count>=10&&(second===0||dominant.count>=second*2);
          const current=(store)=>rows.filter(r=>r[store]).reduce((n,r)=>n+r.count,0);
          const proposed=(store)=>rows.filter(r=>r[store]||(safe&&r.id===dominant.id)).reduce((n,r)=>n+r.count,0);
          console.log(JSON.stringify({selected:{ev:{id:ev.id,name:ev.name},jo:{id:jo.id,name:jo.name}},rawOffers:offers.length,publications:rows,dominant:{...dominant,second,safe},current:{evaskontti:current("ev"),jokela:current("jo")},proposed:{evaskontti:proposed("ev"),jokela:proposed("jo")}},null,2));
          if(current("ev")!==0) console.log("NOTE Evaskontti already maps publications; investigate another filter.");
          if(proposed("jo")<current("jo")) process.exitCode=2;
          NODE
