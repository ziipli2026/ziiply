name: PostHog beta inventory
on:
  push:
    branches:
      - test/posthog-beta-audit-20261116
  workflow_dispatch:
jobs:
  inventory:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Inventory PostHog instrumentation
        run: npm run audit:posthog
