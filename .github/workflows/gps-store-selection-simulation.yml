name: GPS store selection simulation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/gps-store-selection-simulation.yml"
      - "src/app/components/ziiply/location/ziiplyStoreSelectionCore.ts"
      - "src/app/page.tsx"
      - "src/app/api/store-search/route.ts"
      - "src/app/components/ziiply/ziiplyCore.ts"

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe live candidate directories
        shell: bash
        run: |
          node <<'NODE'
          const crypto=require("crypto");
          const origin="https://etarjouslehdet.fi";
          const stable=v=>Buffer.from(JSON.stringify(v,(_k,x)=>Object.prototype.toString.call(x)==="[object Object]"?Object.keys(x).sort().reduce((o,k)=>(o[k]=x[k],o),{}):x),"utf8").toString("base64");
          async function stores(businessId){
            const key=stable(["stores",{businessId,pagination:{offset:0,limit:3000}}]);
            const r=await fetch(origin+"/",{method:"POST",headers:{"content-type":"application/json","x-api-key":"152000596c6e45d9983eab0c14afebea","user-agent":"Mozilla/5.0"},body:JSON.stringify({data:[key]})});
            const j=await r.json();
            const seen=new Set(), out=[];
            function walk(x){if(!x||typeof x!=="object")return;if(Array.isArray(x)){for(const y of x)walk(y);return;}const name=String(x.name||x.title||"");const lat=Number(x.latitude??x.coordinates?.latitude),lon=Number(x.longitude??x.coordinates?.longitude);if(name&&Number.isFinite(lat)&&Number.isFinite(lon)){const id=String(x.id||x.storeId||x.uuid||name);const k=id+"|"+name;if(!seen.has(k)){seen.add(k);out.push({id,name,latitude:lat,longitude:lon});}}for(const y of Object.values(x))walk(y);}
            walk(j); return out;
          }
          (async()=>{
            for(const [label,id] of [["S","d8ccs8"],["K_SUPER","f305U8"],["K_MARKET","9c56Y8"]]){
              const all=await stores(id); const near=all.filter(x=>/jokela|hyvinkää|hyvinkaa|prisma|citymarket/i.test(x.name));
              console.log("GPS_LIVE_DIRECTORY",JSON.stringify({label,businessId:id,count:all.length,sample:near.slice(0,40)},null,2));
            }
          })().catch(e=>{console.error(e);process.exit(2)});
          NODE
      - name: Probe hypermarket source
        run: |
          for q in 'Prisma%20Hyvink%C3%A4%C3%A4' 'K-Citymarket%20Hyvink%C3%A4%C3%A4' 'Prisma' 'K-Citymarket'; do
            echo "GPS_RH_QUERY=$q"
            curl -sS "https://api.ruoanhinta.fi/api/stores?search=$q" | python3 -c 'import json,sys; a=json.load(sys.stdin); print(json.dumps([{"id":x.get("id"),"name":x.get("name"),"chain":x.get("chain"),"type":x.get("type"),"city":x.get("city"),"externalId":x.get("externalId"),"lat":x.get("lat"),"long":x.get("long")} for x in a[:200]],ensure_ascii=False))'
          done
      - name: Live four-slot resolver simulation
        shell: bash
        run: |
          cat > live-gps-test.ts <<'TS'
          import { resolveZiiplyPageStoreSelection } from "./src/app/components/ziiply/location/ziiplyStoreSelectionCore";
          const origin="https://etarjouslehdet.fi";
          const stable=(v:any)=>Buffer.from(JSON.stringify(v,(_k,x)=>Object.prototype.toString.call(x)==="[object Object]"?Object.keys(x).sort().reduce((o:any,k)=>(o[k]=x[k],o),{}):x),"utf8").toString("base64");
          async function tjek(businessId:string){
            const key=stable(["stores",{businessId,pagination:{offset:0,limit:3000}}]);
            const r=await fetch(origin+"/",{method:"POST",headers:{"content-type":"application/json","x-api-key":"152000596c6e45d9983eab0c14afebea","user-agent":"Mozilla/5.0"},body:JSON.stringify({data:[key]})});
            const j=await r.json(); const out:any[]=[],seen=new Set<string>();
            function walk(x:any){if(!x||typeof x!=="object")return;if(Array.isArray(x)){x.forEach(walk);return;}const name=String(x.name||x.title||"");const latitude=Number(x.latitude??x.coordinates?.latitude),longitude=Number(x.longitude??x.coordinates?.longitude);if(name&&Number.isFinite(latitude)&&Number.isFinite(longitude)){const id=String(x.id||x.storeId||x.uuid||name),k=id+"|"+name;if(!seen.has(k)){seen.add(k);out.push({id,name,latitude,longitude});}}Object.values(x).forEach(walk)} walk(j); return out;
          }
          async function rh(search:string){
            const r=await fetch("https://api.ruoanhinta.fi/api/stores?search="+encodeURIComponent(search)); const a=await r.json();
            return a.filter((x:any)=>x.country==="Suomi"&&Number.isFinite(Number(x.lat))&&Number.isFinite(Number(x.long))&&!/abc|verkkokauppa|puutarha|lemmikki/i.test(String(x.name))).map((x:any)=>({id:x.id,name:x.name,lat:x.lat,lon:x.long}));
          }
          async function main(){
          const [s,ks,km,p,c]=await Promise.all([tjek("d8ccs8"),tjek("f305U8"),tjek("9c56Y8"),rh("Prisma"),rh("K-Citymarket")]);
          const stores=[...s,...ks,...km,...p,...c];
          const cases=[["Jokela",60.552446,24.966490],["Hyvinkää",60.631,24.858],["Tuusula",60.4023,25.0263],["Oulu",65.0121,25.4651]];
          let fail=false;
          for(const [label,latitude,longitude] of cases as any[]){
            const r=resolveZiiplyPageStoreSelection({stores,areas:[],coords:{latitude,longitude},mode:"local"});
            const got={sLocal:r.sLocal?.name,kLocal:r.kLocal?.name,sHyper:r.sHyper?.name,kHyper:r.kHyper?.name};
            const ids=[r.sLocal?.id,r.kLocal?.id,r.sHyper?.id,r.kHyper?.id].filter(Boolean);
            const complete=ids.length===4, unique=new Set(ids).size===ids.length;
            console.log("GPS_LIVE_RESOLVER",JSON.stringify({label,got,complete,unique,distances:{sLocal:r.sLocal?.distanceKm,kLocal:r.kLocal?.distanceKm,sHyper:r.sHyper?.distanceKm,kHyper:r.kHyper?.distanceKm},debug:r.debug}));
            if(!complete||!unique) fail=true;
          }
          console.log("GPS_LIVE_COUNTS",JSON.stringify({s:s.length,kSuper:ks.length,kMarket:km.length,prisma:p.length,kCitymarket:c.length,total:stores.length}));
          if(fail) process.exitCode=2;
          }
          main().catch(e=>{ console.error(e); process.exit(2); });
          TS
          npx --yes tsx live-gps-test.ts
      - name: Probe product-compatible Ruoanhinta local store IDs
        shell: bash
        run: |
          node <<'JS'
          const qs=["S-market","Sale","Alepa","K-Market","K-Supermarket"];
          const pts=[["Jokela",60.552446,24.966490],["Hyvinkää",60.6310,24.8580],["Tuusula",60.4023,25.0263],["Oulu",65.0121,25.4651]];
          const rad=x=>x*Math.PI/180,dist=(a,b,c,d)=>{const R=6371,p=rad(c-a),q=rad(d-b),z=Math.sin(p/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(q/2)**2;return 2*R*Math.asin(Math.sqrt(z))};
          (async()=>{let all=[];for(const q of qs){const r=await fetch("https://api.ruoanhinta.fi/api/stores?search="+encodeURIComponent(q));const j=await r.json();const a=Array.isArray(j)?j:(j.items||[]);console.log("RH_LOCAL_COUNT",q,a.length);all.push(...a.map(x=>({...x,_q:q,latitude:Number(x.lat??x.latitude),longitude:Number(x.long??x.lon??x.longitude)})));}
          const uniq=[...new Map(all.map(x=>[String(x.id),x])).values()].filter(x=>Number.isFinite(x.latitude)&&Number.isFinite(x.longitude));
          for(const [label,lat,lon] of pts){const s=uniq.filter(x=>/s-market|\bsale\b|alepa/i.test(x.name||"")).sort((a,b)=>dist(lat,lon,a.latitude,a.longitude)-dist(lat,lon,b.latitude,b.longitude))[0];const k=uniq.filter(x=>/k-market|k-supermarket/i.test(x.name||"")).sort((a,b)=>dist(lat,lon,a.latitude,a.longitude)-dist(lat,lon,b.latitude,b.longitude))[0];console.log("RH_LOCAL_NEAREST",JSON.stringify({label,s:s&&{id:s.id,name:s.name,d:dist(lat,lon,s.latitude,s.longitude)},k:k&&{id:k.id,name:k.name,d:dist(lat,lon,k.latitude,k.longitude)}}));}
          console.log("RH_LOCAL_UNIQUE",uniq.length);})().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Verify deployed store-search to live product prices
        shell: bash
        env:
          PROD_BASE: https://ziiply.eu
        run: |
          node <<'JS'
          const base=process.env.PROD_BASE;
          const points=[
            ["Jokela",60.552446,24.966490],
            ["Hyvinkää",60.6310,24.8580],
            ["Tuusula",60.4023,25.0263],
            ["Oulu",65.0121,25.4651],
          ];
          const dist=(a,b,c,d)=>{const R=6371,r=x=>x*Math.PI/180,x=r(c-a),y=r(d-b),h=Math.sin(x/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
          for(const [label,lat,lon] of points){
            const u=base+"/api/store-search?search=GPS&gps=1&lat="+lat+"&lon="+lon+"&latitude="+lat+"&longitude="+lon;
            const sr=await fetch(u,{cache:"no-store"}); const sd=await sr.json(); const stores=sd.items||[];
            const ranked=stores.map(s=>({...s,d:dist(lat,lon,Number(s.latitude),Number(s.longitude))})).filter(s=>Number.isFinite(s.d)).sort((a,b)=>a.d-b.d);
            const s=ranked.find(x=>/^(S-market|Sale\b|Alepa\b)/i.test(String(x.name||"")));
            const k=ranked.find(x=>/^(K-Market|K-Supermarket)/i.test(String(x.name||"")));
            if(!s||!k) throw new Error(label+": deployed route missing local stores");
            const [sp,kp]=await Promise.all([
              fetch(base+"/api/s-products?search=maito&store="+encodeURIComponent(String(s.id)),{cache:"no-store"}),
              fetch(base+"/api/k-products?search=maito&store="+encodeURIComponent(String(k.id)),{cache:"no-store"}),
            ]);
            const [sj,kj]=await Promise.all([sp.json(),kp.json()]);
            const si=(sj.items||[]).filter(x=>Number(x.price??x.storeItems?.[0]?.price)>0);
            const ki=(kj.items||[]).filter(x=>Number(x.price??x.storeItems?.[0]?.price)>0);
            console.log("GPS_DEPLOYED_E2E",JSON.stringify({label,s:{name:s.name,id:s.id,count:si.length,sample:si[0]?.price??si[0]?.storeItems?.[0]?.price},k:{name:k.name,id:k.id,count:ki.length,sample:ki[0]?.price??ki[0]?.storeItems?.[0]?.price}}));
            if(!sp.ok||!kp.ok||si.length===0||ki.length===0) process.exitCode=2;
            if(label==="Hyvinkää"&&/Hämeenkatu/i.test(String(s.name))) process.exitCode=3;
          }
          JS
      - name: Verify live K product prices for GPS stores
        shell: bash
        run: |
          node <<'JS'
          const points=[
            ["Jokela","K-Supermarket Jokela"],
            ["Hyvinkää","K-Supermarket Vieremä"],
            ["Tuusula","K-Supermarket Hyrrä"],
            ["Oulu","K-Market Torinranta"],
          ];
          const searches=["K-Market","K-Supermarket"];
          const batches=await Promise.all(searches.map(async q=>{const x=await (await fetch("https://api.ruoanhinta.fi/api/stores?search="+encodeURIComponent(q))).json();return Array.isArray(x)?x:(x.items||[])}));
          const all=batches.flat();
          for(const [label,expected] of points){
            const s=all.find(x=>String(x.name||"").toLowerCase()===expected.toLowerCase());
            if(!s) throw new Error(label+": K store missing: "+expected);
            const u="https://api.ruoanhinta.fi/api/items?search="+encodeURIComponent("maito")+"&storeIds="+encodeURIComponent(String(s.id))+"&skip=0&take=30";
            const res=await fetch(u); const data=await res.json(); const items=(data.items||[]).filter(p=>Number(p.storeItems?.[0]?.price)>0);
            console.log("GPS_K_LIVE_PRICE",JSON.stringify({label,store:s.name,storeId:s.id,externalId:s.externalId??null,status:res.status,count:items.length,sample:items.slice(0,3).map(p=>({name:p.name,price:p.storeItems?.[0]?.price}))}));
            if(!res.ok||items.length===0) process.exitCode=2;
          }
          JS
      - name: Verify live S product prices for GPS stores
        shell: bash
        run: |
          node <<'JS'
          const points=[
            ["Jokela",60.552446,24.966490,"S-market Jokela"],
            ["Hyvinkää",60.6310,24.8580,"S-market Vehkoja"],
            ["Tuusula",60.4023,25.0263,"S-market Tuusula"],
            ["Oulu",65.0121,25.4651,"S-market Herkku Oulu"],
          ];
          const norm=v=>String(v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();
          const pages=["s-market","sale","alepa"];
          const official=new Set();
          for(const p of pages){
            let url="https://www.s-kaupat.fi/myymalat/"+p, seen=new Set();
            for(let n=0;n<30&&url&&!seen.has(url);n++){
              seen.add(url); const html=await (await fetch(url)).text();
              for(const m of html.matchAll(/\/myymala\/([^/"?]+)\/(\d{5,})/g)) official.add(norm(decodeURIComponent(m[1]).replace(/-/g," ")));
              const curs=[...html.matchAll(/href=["']([^"']*cursor=[^"']*)["']/g)].map(m=>new URL(m[1].replace(/&amp;/g,"&"),url).toString()).filter(x=>!seen.has(x));
              url=curs[0]||"";
            }
          }
          const searches=["S-market","Sale","Alepa"];
          const batches=await Promise.all(searches.map(async q=>{const x=await (await fetch("https://api.ruoanhinta.fi/api/stores?search="+encodeURIComponent(q))).json();return Array.isArray(x)?x:(x.items||[])}));
          const all=batches.flat();
          for(const [label,lat,lon,expected] of points){
            const rows=all.filter(s=>norm(s.name)===norm(expected));
            const s=rows[0]; if(!s) throw new Error(label+": expected active store missing from Ruoanhinta: "+expected);
            if(official.size && !official.has(norm(s.name))) throw new Error(label+": expected store missing from official S-kaupat directory: "+s.name);
            const u="https://api.ruoanhinta.fi/api/items?search="+encodeURIComponent("maito")+"&storeIds="+encodeURIComponent(String(s.id))+"&skip=0&take=20";
            const res=await fetch(u); const data=await res.json(); const items=(data.items||[]).filter(p=>Number(p.storeItems?.[0]?.price)>0);
            console.log("GPS_S_LIVE_PRICE",JSON.stringify({label,store:s.name,storeId:s.id,status:res.status,count:items.length,sample:items.slice(0,3).map(p=>({name:p.name,price:p.storeItems?.[0]?.price}))}));
            if(!res.ok||items.length===0) process.exitCode=2;
          }
          JS
      - name: Verify stale S-store filtering
        shell: bash
        run: |
          cat > /tmp/check-stale-s.mjs <<'JS'
          const norm=v=>String(v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();
          const html=await (await fetch("https://www.s-kaupat.fi/myymalat/alepa")).text();
          const active=[...html.matchAll(/\/myymala\/([^/"?]+)\/(\d{5,})/g)].map(m=>norm(decodeURIComponent(m[1]).replace(/-/g," ")));
          const rh=await (await fetch("https://api.ruoanhinta.fi/api/stores?search="+encodeURIComponent("Alepa Hämeenkatu"))).json();
          const rows=Array.isArray(rh)?rh:(rh.items||[]);
          const stale=rows.filter(x=>/alepa hämeenkatu/i.test(String(x.name||"")));
          console.log("STALE_S_CHECK",JSON.stringify({officialFirstPageHasHameenkatu:active.some(x=>x==="alepa hameenkatu"),ruoanhintaHasHameenkatu:stale.length>0,ruoanhintaRows:stale.map(x=>({id:x.id,name:x.name}))}));
          if(active.some(x=>x==="alepa hameenkatu")) process.exit(2);
          JS
          node /tmp/check-stale-s.mjs
      - name: Verify current production integration
        shell: bash
        run: |
          grep -q 'resolveZiiplyPageStoreSelection' src/app/page.tsx
          grep -q 'params.set("gps", "1")' src/app/page.tsx
          grep -q 'const gps = request.nextUrl.searchParams.get("gps") === "1"' src/app/api/store-search/route.ts
          grep -q '"K-Citymarket"' src/app/api/store-search/route.ts
          grep -q 'sStoreId?: string | number' src/app/components/ziiply/ziiplyCore.ts
          echo GPS_PRODUCTION_INTEGRATION_SUCCESS
      - name: Simulate complete GPS store-search route branch
        shell: bash
        run: |
          cat > gps-route-branch-test.ts <<'TS'
          import { resolveZiiplyPageStoreSelection } from "./src/app/components/ziiply/location/ziiplyStoreSelectionCore";
          const origin="https://etarjouslehdet.fi";
          const stable=(v:any)=>Buffer.from(JSON.stringify(v,(_k,x)=>Object.prototype.toString.call(x)==="[object Object]"?Object.keys(x).sort().reduce((o:any,k)=>(o[k]=x[k],o),{}):x),"utf8").toString("base64");
          async function localDirectory(businessId:string){
            const key=stable(["stores",{businessId,pagination:{offset:0,limit:3000}}]);
            const r=await fetch(origin+"/",{method:"POST",headers:{"content-type":"application/json","x-api-key":"152000596c6e45d9983eab0c14afebea","user-agent":"Mozilla/5.0"},body:JSON.stringify({data:[key]})});
            if(!r.ok) throw new Error("local "+businessId+" "+r.status);
            const j:any=await r.json(),out:any[]=[],seen=new Set<string>();
            function walk(x:any){if(!x||typeof x!=="object")return;if(Array.isArray(x)){x.forEach(walk);return;}const name=String(x.name||x.title||"");const latitude=Number(x.latitude??x.coordinates?.latitude),longitude=Number(x.longitude??x.coordinates?.longitude);if(name&&Number.isFinite(latitude)&&Number.isFinite(longitude)){const id=String(x.id||x.storeId||x.uuid||name),k=id+"|"+name;if(!seen.has(k)){seen.add(k);out.push({id,name,latitude,longitude})}}Object.values(x).forEach(walk)} walk(j); return out;
          }
          async function hyper(search:string,chain:string){
            const r=await fetch("https://api.ruoanhinta.fi/api/stores?search="+encodeURIComponent(search)); if(!r.ok)throw new Error("rh "+r.status); const a:any=await r.json();
            return (Array.isArray(a)?a:a.items||[]).filter((x:any)=>x.country==="Suomi"&&x.chain===chain&&Number.isFinite(Number(x.lat))&&Number.isFinite(Number(x.long))&&!/abc|verkkokauppa|puutarha|lemmikki/i.test(String(x.name))).map((x:any)=>({id:x.id,name:x.name,chain:x.chain,type:x.type,city:x.city,postalCode:x.postalCode,externalId:x.externalId,latitude:Number(x.lat),longitude:Number(x.long)}));
          }
          async function gpsBranch(){
            const [s,ks,km,p,c]=await Promise.all([localDirectory("d8ccs8"),localDirectory("f305U8"),localDirectory("9c56Y8"),hyper("Prisma","prisma"),hyper("K-Citymarket","kcitymarket")]);
            const s2=s.filter((x:any)=>/^(S-market|Sale|Alepa)\b/i.test(x.name)&&!/ABC|liikenneasema|huoltoasema/i.test(x.name));
            const items=[...s2,...ks,...km,...p,...c];
            const seen=new Set<string>(); return items.filter((x:any)=>{const k=String(x.id)+"|"+x.name;if(seen.has(k))return false;seen.add(k);return true});
          }
          async function manualBranch(search:string){
            const r=await fetch("https://api.ruoanhinta.fi/api/stores?search="+encodeURIComponent(search)); const a:any=await r.json();
            return (Array.isArray(a)?a:a.items||[]).map((x:any)=>({id:x.id,name:x.name,chain:x.chain,type:x.type,city:x.city,postalCode:x.postalCode,externalId:x.externalId,latitude:x.lat,longitude:x.long}));
          }
          async function main(){
            const gps=await gpsBranch(); const manual=await manualBranch("Prisma Hyvinkää");
            const manualOk=manual.some((x:any)=>x.name==="Prisma Hyvinkää"); const coordOk=gps.every((x:any)=>Number.isFinite(Number(x.latitude))&&Number.isFinite(Number(x.longitude)));
            const cases=[["Jokela",60.552446,24.966490],["Hyvinkää",60.631,24.858],["Tuusula",60.4023,25.0263],["Oulu",65.0121,25.4651]] as const; let fail=!manualOk||!coordOk;
            for(const [label,latitude,longitude] of cases){const r=resolveZiiplyPageStoreSelection({stores:gps,coords:{latitude,longitude},mode:"local"});const got={sLocal:r.sLocal?.name,kLocal:r.kLocal?.name,sHyper:r.sHyper?.name,kHyper:r.kHyper?.name};const complete=Object.values(got).every(Boolean),unique=new Set(Object.values(got)).size===4;console.log("GPS_ROUTE_BRANCH_CASE",JSON.stringify({label,got,complete,unique}));if(!complete||!unique)fail=true}
            console.log("GPS_ROUTE_BRANCH",JSON.stringify({gpsCount:gps.length,manualCount:manual.length,manualOk,coordOk}));
            if(fail)process.exit(2);
          }
          main().catch(e=>{console.error(e);process.exit(2)});
          TS
          npx --yes tsx gps-route-branch-test.ts
      - name: Simulate full local plus hyper GPS API pool
        shell: bash
        run: |
          cat > gps-full-api-pool-test.ts <<'TS'
          import { resolveZiiplyPageStoreSelection } from "./src/app/components/ziiply/location/ziiplyStoreSelectionCore";
          async function main(){
            const origin="https://etarjouslehdet.fi";
          const stable=(v:any)=>Buffer.from(JSON.stringify(v,(_k,x)=>Object.prototype.toString.call(x)==="[object Object]"?Object.keys(x).sort().reduce((o:any,k)=>(o[k]=x[k],o),{}):x),"utf8").toString("base64");
          async function tjek(businessId:string,kind:"s"|"ks"|"km"){
            const key=stable(["stores",{businessId,pagination:{offset:0,limit:3000}}]);
            const r=await fetch(origin+"/",{method:"POST",headers:{"content-type":"application/json","x-api-key":"152000596c6e45d9983eab0c14afebea","user-agent":"Mozilla/5.0"},body:JSON.stringify({data:[key]})});
            if(!r.ok) throw new Error("Tjek proxy "+businessId+" "+r.status);
            const j:any=await r.json(); const flat:any[]=[]; const seen=new Set<string>();
