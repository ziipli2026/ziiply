name: GPS store selection simulation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/gps-store-selection-simulation.yml"
      - "src/app/components/ziiply/location/ziiplyStoreSelectionCore.ts"

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe live candidate directories
        shell: bash
        run: |
          node <<'NODE'
          const crypto=require("crypto");
          const origin="https://etarjouslehdet.fi";
          const stable=v=>Buffer.from(JSON.stringify(v,(_k,x)=>Object.prototype.toString.call(x)==="[object Object]"?Object.keys(x).sort().reduce((o,k)=>(o[k]=x[k],o),{}):x),"utf8").toString("base64");
          async function stores(businessId){
            const key=stable(["stores",{businessId,pagination:{offset:0,limit:3000}}]);
            const r=await fetch(origin+"/",{method:"POST",headers:{"content-type":"application/json","x-api-key":"152000596c6e45d9983eab0c14afebea","user-agent":"Mozilla/5.0"},body:JSON.stringify({data:[key]})});
            const j=await r.json();
            const seen=new Set(), out=[];
            function walk(x){if(!x||typeof x!=="object")return;if(Array.isArray(x)){for(const y of x)walk(y);return;}const name=String(x.name||x.title||"");const lat=Number(x.latitude??x.coordinates?.latitude),lon=Number(x.longitude??x.coordinates?.longitude);if(name&&Number.isFinite(lat)&&Number.isFinite(lon)){const id=String(x.id||x.storeId||x.uuid||name);const k=id+"|"+name;if(!seen.has(k)){seen.add(k);out.push({id,name,latitude:lat,longitude:lon});}}for(const y of Object.values(x))walk(y);}
            walk(j); return out;
          }
          (async()=>{
            for(const [label,id] of [["S","d8ccs8"],["K_SUPER","f305U8"],["K_MARKET","9c56Y8"]]){
              const all=await stores(id); const near=all.filter(x=>/jokela|hyvinkää|hyvinkaa|prisma|citymarket/i.test(x.name));
              console.log("GPS_LIVE_DIRECTORY",JSON.stringify({label,businessId:id,count:all.length,sample:near.slice(0,40)},null,2));
            }
          })().catch(e=>{console.error(e);process.exit(2)});
          NODE
      - name: Probe hypermarket source
        run: |
          for q in 'Prisma%20Hyvink%C3%A4%C3%A4' 'K-Citymarket%20Hyvink%C3%A4%C3%A4' 'Prisma' 'K-Citymarket'; do
            echo "GPS_RH_QUERY=$q"
            curl -sS "https://api.ruoanhinta.fi/api/stores?search=$q" | python3 -c 'import json,sys; a=json.load(sys.stdin); print(json.dumps([{"id":x.get("id"),"name":x.get("name"),"chain":x.get("chain"),"type":x.get("type"),"city":x.get("city"),"externalId":x.get("externalId"),"lat":x.get("lat"),"long":x.get("long")} for x in a[:200]],ensure_ascii=False))'
          done
      - name: Live four-slot resolver simulation
        shell: bash
        run: |
          cat > live-gps-test.ts <<'TS'
          import { resolveZiiplyPageStoreSelection } from "./src/app/components/ziiply/location/ziiplyStoreSelectionCore";
          const origin="https://etarjouslehdet.fi";
          const stable=(v:any)=>Buffer.from(JSON.stringify(v,(_k,x)=>Object.prototype.toString.call(x)==="[object Object]"?Object.keys(x).sort().reduce((o:any,k)=>(o[k]=x[k],o),{}):x),"utf8").toString("base64");
          async function tjek(businessId:string){
            const key=stable(["stores",{businessId,pagination:{offset:0,limit:3000}}]);
            const r=await fetch(origin+"/",{method:"POST",headers:{"content-type":"application/json","x-api-key":"152000596c6e45d9983eab0c14afebea","user-agent":"Mozilla/5.0"},body:JSON.stringify({data:[key]})});
            const j=await r.json(); const out:any[]=[],seen=new Set<string>();
            function walk(x:any){if(!x||typeof x!=="object")return;if(Array.isArray(x)){x.forEach(walk);return;}const name=String(x.name||x.title||"");const latitude=Number(x.latitude??x.coordinates?.latitude),longitude=Number(x.longitude??x.coordinates?.longitude);if(name&&Number.isFinite(latitude)&&Number.isFinite(longitude)){const id=String(x.id||x.storeId||x.uuid||name),k=id+"|"+name;if(!seen.has(k)){seen.add(k);out.push({id,name,latitude,longitude});}}Object.values(x).forEach(walk)} walk(j); return out;
          }
          async function rh(search:string){
            const r=await fetch("https://api.ruoanhinta.fi/api/stores?search="+encodeURIComponent(search)); const a=await r.json();
            return a.filter((x:any)=>x.country==="Suomi"&&Number.isFinite(Number(x.lat))&&Number.isFinite(Number(x.long))&&!/abc|verkkokauppa|puutarha|lemmikki/i.test(String(x.name))).map((x:any)=>({id:x.id,name:x.name,lat:x.lat,lon:x.long}));
          }
          async function main(){
          const [s,ks,km,p,c]=await Promise.all([tjek("d8ccs8"),tjek("f305U8"),tjek("9c56Y8"),rh("Prisma"),rh("K-Citymarket")]);
          const stores=[...s,...ks,...km,...p,...c];
          const cases=[["Jokela",60.552446,24.966490],["Hyvinkää",60.631,24.858],["Tuusula",60.4023,25.0263],["Oulu",65.0121,25.4651]];
          let fail=false;
          for(const [label,latitude,longitude] of cases as any[]){
            const r=resolveZiiplyPageStoreSelection({stores,areas:[],coords:{latitude,longitude},mode:"local"});
            const got={sLocal:r.sLocal?.name,kLocal:r.kLocal?.name,sHyper:r.sHyper?.name,kHyper:r.kHyper?.name};
            const ids=[r.sLocal?.id,r.kLocal?.id,r.sHyper?.id,r.kHyper?.id].filter(Boolean);
            const complete=ids.length===4, unique=new Set(ids).size===ids.length;
            console.log("GPS_LIVE_RESOLVER",JSON.stringify({label,got,complete,unique,distances:{sLocal:r.sLocal?.distanceKm,kLocal:r.kLocal?.distanceKm,sHyper:r.sHyper?.distanceKm,kHyper:r.kHyper?.distanceKm},debug:r.debug}));
            if(!complete||!unique) fail=true;
          }
          console.log("GPS_LIVE_COUNTS",JSON.stringify({s:s.length,kSuper:ks.length,kMarket:km.length,prisma:p.length,kCitymarket:c.length,total:stores.length}));
          if(fail) process.exitCode=2;
          }
          main().catch(e=>{ console.error(e); process.exit(2); });
          TS
          npx --yes tsx live-gps-test.ts
      - name: Simulate patched project typecheck and build
        shell: bash
        run: |
          rm -rf /tmp/ziiply-patch-build
          mkdir -p /tmp/ziiply-patch-build
          cp -a . /tmp/ziiply-patch-build/repo
          cd /tmp/ziiply-patch-build/repo
          node <<'JS'
          const fs=require("fs");
          const p="src/app/page.tsx",r="src/app/api/store-search/route.ts";
          let page=fs.readFileSync(p,"utf8"),route=fs.readFileSync(r,"utf8");
          if(!page.includes("resolveZiiplyPageStoreSelection")) {
            const imp='import { resolveZiiplyPageStoreSelection } from "./components/ziiply/location/ziiplyStoreSelectionCore";';
            const directive='"use client";';
            if(page.includes(directive)) page=page.replace(directive,directive+'\n'+imp);
            else page=imp+'\n'+page;
          }
          const a='const ranked = rankStoresForMode(stores, mode, coords);';
          const b='const ranked = coords ? resolveZiiplyPageStoreSelection({ stores, coords, mode }) : rankStoresForMode(stores, mode, coords);';
          const x='const ranked = rankStoresForMode(gpsStorePoolV40, gpsMode, gpsCoordsV320);';
          const y='const ranked = resolveZiiplyPageStoreSelection({ stores: gpsStorePoolV40, coords: gpsCoordsV320, mode: gpsMode });';
          if(!page.includes(a)||!page.includes(x)) throw new Error("page seams changed");
          page=page.replace(a,b).replace(x,y);
          const q='externalId: store.externalId,';
          if(!route.includes(q)) throw new Error("route seam changed");
          route=route.replace(q,q+'\n        latitude: store.lat,\n        longitude: store.long,');
          fs.writeFileSync(p,page);fs.writeFileSync(r,route);
          console.log("GPS_PATCH_COPY_APPLIED");
          JS
          # The repository lockfile is currently inconsistent with package.json.
          # Repair ONLY inside this disposable /tmp copy; never touch the checked-out repo.
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          node -e 'const p=require("./package.json"),l=require("./package-lock.json"); const r=l.packages[""]; const ok=p.dependencies.next===r.dependencies.next&&p.dependencies.react===r.dependencies.react&&p.dependencies["react-dom"]===r.dependencies["react-dom"]&&p.devDependencies["eslint-config-next"]===r.devDependencies["eslint-config-next"]; console.log("GPS_LOCK_REGEN",JSON.stringify({next:r.dependencies.next,react:r.dependencies.react,reactDom:r.dependencies["react-dom"],eslintNext:r.devDependencies["eslint-config-next"],ok})); if(!ok)process.exit(2)'
          # GPS resolver IDs may be source strings; existing product helpers already stringify IDs into URLs.
          # Simulate widening only in the disposable copy, then build again.
          node <<'JS2'
          const fs=require("fs"),p="src/app/page.tsx"; let s=fs.readFileSync(p,"utf8");
          const targets=[
            ["async function fetchSProducts(\n    search: string,\n    storeId: number,","async function fetchSProducts(\n    search: string,\n    storeId: string | number,"],
            ["async function fetchSProductsAllowUnpricedV463(\n    search: string,\n    storeId: number,","async function fetchSProductsAllowUnpricedV463(\n    search: string,\n    storeId: string | number,"],
            ["async function hydrateSProductPriceFromSearchBranchV463(\n    candidate: Product,\n    variants: string[],\n    nameCandidates: string[],\n    storeId: number,","async function hydrateSProductPriceFromSearchBranchV463(\n    candidate: Product,\n    variants: string[],\n    nameCandidates: string[],\n    storeId: string | number,"],
            ["async function fetchKProducts(\n    search: string,\n    storeId: number,","async function fetchKProducts(\n    search: string,\n    storeId: string | number,"],
            ["async function findBestKMatchForStore(\n    query: string,\n    storeId: number,","async function findBestKMatchForStore(\n    query: string,\n    storeId: string | number,"]
          ];
          for(const [a,b] of targets){if(s.includes(a))s=s.replace(a,b)}
          // The new resolver's selected store intentionally has no city field.
          // buildDynamicArea only needs city on the non-GPS/manual branch, so preserve the old ranker there.
          const unionCity='ranked.selectedS?.city ||\n        ranked.selectedK?.city ||';
          const manualCity='stores.find((store) => store.city)?.city ||';
          if(s.includes(unionCity)) s=s.replace(unionCity,manualCity);
          fs.writeFileSync(p,s);
          const core="src/app/components/ziiply/ziiplyCore.ts"; let z=fs.readFileSync(core,"utf8");
          for(const k of ["sStoreId","kStoreId","sLocalStoreId","kLocalStoreId"]) z=z.replace(k+"?: number;",k+"?: string | number;");
          fs.writeFileSync(core,z);
          console.log("GPS_STORE_ID_TYPE_SIMULATION_APPLIED");
          JS2
          npm run typecheck --if-present
          npm run build
          echo GPS_PATCH_PROJECT_BUILD_SUCCESS
      - name: Simulate complete GPS store-search route branch
        shell: bash
        run: |
          cat > gps-route-branch-test.ts <<'TS'
          import { resolveZiiplyPageStoreSelection } from "./src/app/components/ziiply/location/ziiplyStoreSelectionCore";
          const origin="https://etarjouslehdet.fi";
          const stable=(v:any)=>Buffer.from(JSON.stringify(v,(_k,x)=>Object.prototype.toString.call(x)==="[object Object]"?Object.keys(x).sort().reduce((o:any,k)=>(o[k]=x[k],o),{}):x),"utf8").toString("base64");
          async function localDirectory(businessId:string){
            const key=stable(["stores",{businessId,pagination:{offset:0,limit:3000}}]);
            const r=await fetch(origin+"/",{method:"POST",headers:{"content-type":"application/json","x-api-key":"152000596c6e45d9983eab0c14afebea","user-agent":"Mozilla/5.0"},body:JSON.stringify({data:[key]})});
            if(!r.ok) throw new Error("local "+businessId+" "+r.status);
            const j:any=await r.json(),out:any[]=[],seen=new Set<string>();
            function walk(x:any){if(!x||typeof x!=="object")return;if(Array.isArray(x)){x.forEach(walk);return;}const name=String(x.name||x.title||"");const latitude=Number(x.latitude??x.coordinates?.latitude),longitude=Number(x.longitude??x.coordinates?.longitude);if(name&&Number.isFinite(latitude)&&Number.isFinite(longitude)){const id=String(x.id||x.storeId||x.uuid||name),k=id+"|"+name;if(!seen.has(k)){seen.add(k);out.push({id,name,latitude,longitude})}}Object.values(x).forEach(walk)} walk(j); return out;
          }
          async function hyper(search:string,chain:string){
            const r=await fetch("https://api.ruoanhinta.fi/api/stores?search="+encodeURIComponent(search)); if(!r.ok)throw new Error("rh "+r.status); const a:any=await r.json();
            return (Array.isArray(a)?a:a.items||[]).filter((x:any)=>x.country==="Suomi"&&x.chain===chain&&Number.isFinite(Number(x.lat))&&Number.isFinite(Number(x.long))&&!/abc|verkkokauppa|puutarha|lemmikki/i.test(String(x.name))).map((x:any)=>({id:x.id,name:x.name,chain:x.chain,type:x.type,city:x.city,postalCode:x.postalCode,externalId:x.externalId,latitude:Number(x.lat),longitude:Number(x.long)}));
          }
          async function gpsBranch(){
            const [s,ks,km,p,c]=await Promise.all([localDirectory("d8ccs8"),localDirectory("f305U8"),localDirectory("9c56Y8"),hyper("Prisma","prisma"),hyper("K-Citymarket","kcitymarket")]);
            const s2=s.filter((x:any)=>/^(S-market|Sale|Alepa)\b/i.test(x.name)&&!/ABC|liikenneasema|huoltoasema/i.test(x.name));
            const items=[...s2,...ks,...km,...p,...c];
            const seen=new Set<string>(); return items.filter((x:any)=>{const k=String(x.id)+"|"+x.name;if(seen.has(k))return false;seen.add(k);return true});
          }
          async function manualBranch(search:string){
            const r=await fetch("https://api.ruoanhinta.fi/api/stores?search="+encodeURIComponent(search)); const a:any=await r.json();
            return (Array.isArray(a)?a:a.items||[]).map((x:any)=>({id:x.id,name:x.name,chain:x.chain,type:x.type,city:x.city,postalCode:x.postalCode,externalId:x.externalId,latitude:x.lat,longitude:x.long}));
          }
          async function main(){
            const gps=await gpsBranch(); const manual=await manualBranch("Prisma Hyvinkää");
            const manualOk=manual.some((x:any)=>x.name==="Prisma Hyvinkää"); const coordOk=gps.every((x:any)=>Number.isFinite(Number(x.latitude))&&Number.isFinite(Number(x.longitude)));
            const cases=[["Jokela",60.552446,24.966490],["Hyvinkää",60.631,24.858],["Tuusula",60.4023,25.0263],["Oulu",65.0121,25.4651]] as const; let fail=!manualOk||!coordOk;
            for(const [label,latitude,longitude] of cases){const r=resolveZiiplyPageStoreSelection({stores:gps,coords:{latitude,longitude},mode:"local"});const got={sLocal:r.sLocal?.name,kLocal:r.kLocal?.name,sHyper:r.sHyper?.name,kHyper:r.kHyper?.name};const complete=Object.values(got).every(Boolean),unique=new Set(Object.values(got)).size===4;console.log("GPS_ROUTE_BRANCH_CASE",JSON.stringify({label,got,complete,unique}));if(!complete||!unique)fail=true}
            console.log("GPS_ROUTE_BRANCH",JSON.stringify({gpsCount:gps.length,manualCount:manual.length,manualOk,coordOk}));
            if(fail)process.exit(2);
          }
          main().catch(e=>{console.error(e);process.exit(2)});
          TS
          npx --yes tsx gps-route-branch-test.ts
      - name: Simulate minimal production patch statically
        shell: bash
        run: |
          node <<'JS'
          const fs=require("fs");
          let page=fs.readFileSync("src/app/page.tsx","utf8");
          let route=fs.readFileSync("src/app/api/store-search/route.ts","utf8");
          const coreImport='import { resolveZiiplyPageStoreSelection } from "./components/ziiply/location/ziiplyStoreSelectionCore";\n';
          if(!page.includes("resolveZiiplyPageStoreSelection")) page=coreImport+page;
          const oldRank='const ranked = rankStoresForMode(stores, mode, coords);';
          const newRank='const ranked = coords ? resolveZiiplyPageStoreSelection({ stores, coords, mode }) : rankStoresForMode(stores, mode, coords);';
          if(!page.includes(oldRank)) throw new Error("buildDynamicArea seam changed");
          page=page.replace(oldRank,newRank);
          const oldActive='const ranked = rankStoresForMode(gpsStorePoolV40, gpsMode, gpsCoordsV320);';
          const newActive='const ranked = resolveZiiplyPageStoreSelection({ stores: gpsStorePoolV40, coords: gpsCoordsV320, mode: gpsMode });';
          if(!page.includes(oldActive)) throw new Error("activeStores seam changed");
          page=page.replace(oldActive,newActive);
          const coordNeedle='externalId: store.externalId,';
          if(!route.includes(coordNeedle)) throw new Error("route seam changed");
          route=route.replace(coordNeedle,coordNeedle+'\n        latitude: store.lat,\n        longitude: store.long,');
          fs.mkdirSync("/tmp/ziiply-gps-patch",{recursive:true});
          fs.writeFileSync("/tmp/ziiply-gps-patch/page.tsx",page);
          fs.writeFileSync("/tmp/ziiply-gps-patch/route.ts",route);
          const checks={resolverImport:page.includes("resolveZiiplyPageStoreSelection"),dynamicAreaUsesResolver:page.includes(newRank),activeStoresUsesResolver:page.includes(newActive),routePreservesCoords:route.includes("latitude: store.lat")&&route.includes("longitude: store.long"),productionUnchanged:!fs.readFileSync("src/app/page.tsx","utf8").includes("resolveZiiplyPageStoreSelection")};
          console.log("GPS_MIN_PATCH_STATIC",JSON.stringify(checks));
          if(!Object.values(checks).every(Boolean)) process.exit(2);
          JS
          npx --yes esbuild /tmp/ziiply-gps-patch/page.tsx --loader:.tsx=tsx --format=esm --outfile=/tmp/ziiply-gps-patch/page.js --log-level=error
          npx --yes esbuild /tmp/ziiply-gps-patch/route.ts --loader:.ts=ts --format=esm --outfile=/tmp/ziiply-gps-patch/route.js --log-level=error
          echo GPS_MIN_PATCH_PARSE_SUCCESS
      - name: Simulate full local plus hyper GPS API pool
        shell: bash
        run: |
          cat > gps-full-api-pool-test.ts <<'TS'
          import { resolveZiiplyPageStoreSelection } from "./src/app/components/ziiply/location/ziiplyStoreSelectionCore";
          async function main(){
            const origin="https://etarjouslehdet.fi";
          const stable=(v:any)=>Buffer.from(JSON.stringify(v,(_k,x)=>Object.prototype.toString.call(x)==="[object Object]"?Object.keys(x).sort().reduce((o:any,k)=>(o[k]=x[k],o),{}):x),"utf8").toString("base64");
          async function tjek(businessId:string,kind:"s"|"ks"|"km"){
            const key=stable(["stores",{businessId,pagination:{offset:0,limit:3000}}]);
            const r=await fetch(origin+"/",{method:"POST",headers:{"content-type":"application/json","x-api-key":"152000596c6e45d9983eab0c14afebea","user-agent":"Mozilla/5.0"},body:JSON.stringify({data:[key]})});
            if(!r.ok) throw new Error("Tjek proxy "+businessId+" "+r.status);
            const j:any=await r.json(); const flat:any[]=[]; const seen=new Set<string>();
            const walk=(x:any)=>{if(!x||typeof x!=="object")return;if(Array.isArray(x)){x.forEach(walk);return;}const name=String(x.name||x.title||"");const latitude=Number(x.latitude??x.coordinates?.latitude),longitude=Number(x.longitude??x.coordinates?.longitude);if(name&&Number.isFinite(latitude)&&Number.isFinite(longitude)){const id=String(x.id||x.storeId||x.uuid||name),k=id+"|"+name;if(!seen.has(k)){seen.add(k);flat.push({id,name,latitude,longitude})}}Object.values(x).forEach(walk)}; walk(j);
            return kind==="s"?flat.filter(x=>/^(S-market|Sale|Alepa)\b/i.test(x.name)&&!/ABC|liikenneasema|huoltoasema/i.test(x.name)):flat;
          }
          async function rh(search:string,chain:string){
              const r=await fetch("https://api.ruoanhinta.fi/api/stores?search="+encodeURIComponent(search)); const a:any=await r.json();
              return (Array.isArray(a)?a:a.items||[]).filter((x:any)=>x.country==="Suomi"&&x.chain===chain&&Number.isFinite(Number(x.lat))&&Number.isFinite(Number(x.long))&&!/verkkokauppa|puutarha|lemmikki|abc/i.test(String(x.name))).map((x:any)=>({...x,latitude:Number(x.lat),longitude:Number(x.long)}));
            }
            const [s,ks,km,p,c]=await Promise.all([tjek("d8ccs8","s"),tjek("f305U8","ks"),tjek("9c56Y8","km"),rh("Prisma","prisma"),rh("K-Citymarket","kcitymarket")]);
            const stores=[...s,...ks,...km,...p,...c];
            const tests=[["Jokela",60.552446,24.966490],["Hyvinkää",60.6310,24.8580],["Tuusula",60.4023,25.0263],["Oulu",65.0121,25.4651]] as const;
            let fail=false;
            for(const [label,latitude,longitude] of tests){
              const r=resolveZiiplyPageStoreSelection({stores,coords:{latitude,longitude},mode:"local"});
              const got={sLocal:r.sLocal?.name,kLocal:r.kLocal?.name,sHyper:r.sHyper?.name,kHyper:r.kHyper?.name};
              const complete=Object.values(got).every(Boolean); const unique=new Set(Object.values(got)).size===4;
              console.log("GPS_FULL_API_POOL",JSON.stringify({label,got,complete,unique}));
              if(!complete||!unique) fail=true;
            }
            console.log("GPS_FULL_API_COUNTS",JSON.stringify({s:s.length,kSuper:ks.length,kMarket:km.length,prisma:p.length,kCitymarket:c.length,total:stores.length}));
            if(fail) process.exit(2);
          }
          main().catch(e=>{console.error(e);process.exit(2)});
          TS
          npx --yes tsx gps-full-api-pool-test.ts
      - name: Simulate store-search GPS API contract
        shell: bash
        run: |
          cat > gps-store-api-contract-test.ts <<'TS'
          function normalizeRuoanhinta(store:any){
            return {id:store.id,name:store.name,chain:store.chain,type:store.type,city:store.city,postalCode:store.postalCode,externalId:store.externalId,latitude:Number(store.lat),longitude:Number(store.long)};
          }
          async function fetchRh(search:string){
            const r=await fetch("https://api.ruoanhinta.fi/api/stores?search="+encodeURIComponent(search));
            if(!r.ok) throw new Error("Ruoanhinta "+r.status);
            const a=await r.json();
            return (Array.isArray(a)?a:a.items||[]).filter((x:any)=>x.country==="Suomi"&&Number.isFinite(Number(x.lat))&&Number.isFinite(Number(x.long))).map(normalizeRuoanhinta);
          }
          async function main(){
          const manual=await fetchRh("Prisma Hyvinkää");
          const gps=[...(await fetchRh("Prisma")).filter((x:any)=>x.chain==="prisma"&&!/verkkokauppa|puutarha|lemmikki|abc/i.test(x.name)),...(await fetchRh("K-Citymarket")).filter((x:any)=>x.chain==="kcitymarket")];
          const manualPreserved=manual.some((x:any)=>x.name==="Prisma Hyvinkää");
          const coordsPreserved=gps.every((x:any)=>Number.isFinite(x.latitude)&&Number.isFinite(x.longitude));
          const hyperCoverage={prisma:gps.filter((x:any)=>x.chain==="prisma").length,kCitymarket:gps.filter((x:any)=>x.chain==="kcitymarket").length};
