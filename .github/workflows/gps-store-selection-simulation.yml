name: GPS store selection simulation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/gps-store-selection-simulation.yml"
      - "src/app/components/ziiply/location/ziiplyStoreSelectionCore.ts"
      - "src/app/page.tsx"
      - "src/app/api/store-search/route.ts"
      - "src/app/components/ziiply/ziiplyCore.ts"

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify deployed store-search to live product prices
        shell: bash
        env:
          PROD_BASE: https://ziiply.vercel.app
        run: |
          node <<'JS'
          const base=process.env.PROD_BASE;
          const points=[
            ["Jokela",60.552446,24.966490],
            ["Hyvinkää",60.6310,24.8580],
            ["Tuusula",60.4023,25.0263],
            ["Oulu",65.0121,25.4651],
          ];
          const dist=(a,b,c,d)=>{const R=6371,r=x=>x*Math.PI/180,x=r(c-a),y=r(d-b),h=Math.sin(x/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
          for(const [label,lat,lon] of points){
            const u=base+"/api/store-search?search=GPS&gps=1&lat="+lat+"&lon="+lon+"&latitude="+lat+"&longitude="+lon+"&debug=1";
            const sr=await fetch(u,{cache:"no-store"}); const raw=await sr.text(); let sd={}; try{sd=JSON.parse(raw)}catch{} const stores=sd.items||[]; console.log("GPS_STORE_RESULT",JSON.stringify({label,status:sr.status,count:stores.length,debug:sd.debug,first:stores.slice(0,12).map(x=>({name:x.name,id:x.id,lat:x.latitude,lon:x.longitude}))}));
            const ranked=stores.map(s=>({...s,d:dist(lat,lon,Number(s.latitude),Number(s.longitude))})).filter(s=>Number.isFinite(s.d)).sort((a,b)=>a.d-b.d);
            const s=ranked.find(x=>/^(S-market|Sale\b|Alepa\b)/i.test(String(x.name||"")));
            const k=ranked.find(x=>/^(K-Market|K-Supermarket)/i.test(String(x.name||"")));
            if(!s||!k){ console.log("GPS_DEPLOYED_MISSING",JSON.stringify({label,s:!!s,k:!!k,stores:ranked.slice(0,20).map(x=>({name:x.name,id:x.id,d:x.d}))})); continue; }
            const [sp,kp]=await Promise.all([
              fetch(base+"/api/s-products?search=maito&store="+encodeURIComponent(String(s.id)),{cache:"no-store"}),
              fetch(base+"/api/k-products?search=maito&store="+encodeURIComponent(String(k.id)),{cache:"no-store"}),
            ]);
            const [st,kt]=await Promise.all([sp.text(),kp.text()]);
            console.log("GPS_DEPLOYED_HTTP",JSON.stringify({label,s:{status:sp.status,url:sp.url,type:sp.headers.get("content-type"),head:st.slice(0,120)},k:{status:kp.status,url:kp.url,type:kp.headers.get("content-type"),head:kt.slice(0,120)}}));
            let sj={},kj={}; try{sj=JSON.parse(st)}catch{} try{kj=JSON.parse(kt)}catch{};
            const si=(sj.items||[]).filter(x=>Number(x.price??x.storeItems?.[0]?.price)>0);
            const ki=(kj.items||[]).filter(x=>Number(x.price??x.storeItems?.[0]?.price)>0);
            console.log("GPS_DEPLOYED_E2E",JSON.stringify({label,s:{name:s.name,id:s.id,count:si.length,sample:si[0]?.price??si[0]?.storeItems?.[0]?.price},k:{name:k.name,id:k.id,count:ki.length,sample:ki[0]?.price??ki[0]?.storeItems?.[0]?.price}}));
            if(!sp.ok||!kp.ok||si.length===0||ki.length===0) process.exitCode=2;
            if(label==="Hyvinkää"&&/Hämeenkatu/i.test(String(s.name))) process.exitCode=3;
          }
          JS
      - name: Verify deployed store-search end to end
        shell: bash
        run: |
          node <<'JS'
          const dist=(a,b,c,d)=>{const R=6371,r=x=>x*Math.PI/180,x=r(c-a),y=r(d-b),h=Math.sin(x/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
          const candidates=["https://ziiply.vercel.app"];
          let base="";
          for(const candidate of candidates){
            try{
              const probe=await fetch(candidate+"/api/store-search?search=Jokela&gps=1&lat=60.552446&lon=24.966490&latitude=60.552446&longitude=24.966490",{redirect:"follow"});
              console.log("GPS_DEPLOY_PROBE",JSON.stringify({candidate,status:probe.status,url:probe.url}));
              if(probe.ok){base=candidate;break}
            }catch(e){console.log("GPS_DEPLOY_PROBE",JSON.stringify({candidate,error:String(e),cause:String(e?.cause||"")}))}
          }
          if(!base) throw new Error("No reachable Ziiply production base");
          const cases=[
            ["Jokela",60.552446,24.966490],
            ["Hyvinkää",60.6310,24.8580],
            ["Tuusula",60.4023,25.0263],
            ["Oulu",65.0121,25.4651],
          ];
          for(const [label,lat,lon] of cases){
            const u=base+"/api/store-search?search="+encodeURIComponent(label)+"&gps=1&lat="+lat+"&lon="+lon+"&latitude="+lat+"&longitude="+lon;
            const r=await fetch(u,{headers:{"user-agent":"Ziiply-GPS-regression"}});
            const d=await r.json(); const items=Array.isArray(d.items)?d.items:[];
            const ranked=items.map(x=>({...x,d:dist(lat,lon,Number(x.latitude),Number(x.longitude))})).filter(x=>Number.isFinite(x.d)).sort((a,b)=>a.d-b.d);
            const s=ranked.find(x=>/^(S-market|Sale\b|Alepa\b)/i.test(String(x.name||"")));
            const k=ranked.find(x=>/^(K-Market|K-Supermarket)/i.test(String(x.name||"")));
            console.log("GPS_DEPLOYED_ROUTE",JSON.stringify({label,status:r.status,count:items.length,s:s&&{name:s.name,id:s.id,externalId:s.externalId},k:k&&{name:k.name,id:k.id,externalId:k.externalId}}));
            if(!r.ok||!s||!k||/Alepa Hämeenkatu/i.test(String(s.name))) process.exitCode=2;
            for(const [chain,x] of [["s",s],["k",k]]){
              if(!x) continue;
              const pr=await fetch(base+"/api/"+chain+"-products?search="+encodeURIComponent("maito")+"&store="+encodeURIComponent(String(x.id)));
              const pd=await pr.json(); const pi=Array.isArray(pd.items)?pd.items:[];
              console.log("GPS_DEPLOYED_PRICE",JSON.stringify({label,chain,store:x.name,storeId:x.id,status:pr.status,count:pi.length,sample:pi.slice(0,2).map(y=>({name:y.name,price:y.price}))}));
              if(!pr.ok||pi.length===0||!pi.some(y=>Number(y.price)>0)) process.exitCode=2;
            }
          }
          JS
      - name: Verify live K product prices for GPS stores
        shell: bash
        run: |
          node <<'JS'
          const points=[
            ["Jokela","K-Supermarket Jokela"],
            ["Hyvinkää","K-Supermarket Vieremä"],
            ["Tuusula","K-Supermarket Hyrrä"],
            ["Oulu","K-Market Torinranta"],
          ];
          const searches=["K-Market","K-Supermarket"];
          const batches=await Promise.all(searches.map(async q=>{const x=await (await fetch("https://api.ruoanhinta.fi/api/stores?search="+encodeURIComponent(q))).json();return Array.isArray(x)?x:(x.items||[])}));
          const all=batches.flat();
          for(const [label,expected] of points){
            const s=all.find(x=>String(x.name||"").toLowerCase()===expected.toLowerCase());
            if(!s) throw new Error(label+": K store missing: "+expected);
            const u="https://api.ruoanhinta.fi/api/items?search="+encodeURIComponent("maito")+"&storeIds="+encodeURIComponent(String(s.id))+"&skip=0&take=30";
            const res=await fetch(u); const data=await res.json(); const items=(data.items||[]).filter(p=>Number(p.storeItems?.[0]?.price)>0);
            console.log("GPS_K_LIVE_PRICE",JSON.stringify({label,store:s.name,storeId:s.id,externalId:s.externalId??null,status:res.status,count:items.length,sample:items.slice(0,3).map(p=>({name:p.name,price:p.storeItems?.[0]?.price}))}));
            if(!res.ok||items.length===0) process.exitCode=2;
          }
          JS
      - name: Verify live S product prices for GPS stores
        shell: bash
        run: |
          node <<'JS'
          const points=[
            ["Jokela",60.552446,24.966490,"S-market Jokela"],
            ["Hyvinkää",60.6310,24.8580,"S-market Vehkoja"],
            ["Tuusula",60.4023,25.0263,"S-market Tuusula"],
            ["Oulu",65.0121,25.4651,"S-market Herkku Oulu"],
          ];
          const norm=v=>String(v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();
          const pages=["s-market","sale","alepa"];
          const official=new Set();
          for(const p of pages){
            let url="https://www.s-kaupat.fi/myymalat/"+p, seen=new Set();
            for(let n=0;n<30&&url&&!seen.has(url);n++){
              seen.add(url); const html=await (await fetch(url)).text();
              for(const m of html.matchAll(/\/myymala\/([^/"?]+)\/(\d{5,})/g)) official.add(norm(decodeURIComponent(m[1]).replace(/-/g," ")));
              const curs=[...html.matchAll(/href=["']([^"']*cursor=[^"']*)["']/g)].map(m=>new URL(m[1].replace(/&amp;/g,"&"),url).toString()).filter(x=>!seen.has(x));
              url=curs[0]||"";
            }
          }
          const searches=["S-market","Sale","Alepa"];
          const batches=await Promise.all(searches.map(async q=>{const x=await (await fetch("https://api.ruoanhinta.fi/api/stores?search="+encodeURIComponent(q))).json();return Array.isArray(x)?x:(x.items||[])}));
          const all=batches.flat();
          for(const [label,lat,lon,expected] of points){
            const rows=all.filter(s=>norm(s.name)===norm(expected));
            const s=rows[0]; if(!s) throw new Error(label+": expected active store missing from Ruoanhinta: "+expected);
            if(official.size && !official.has(norm(s.name))) throw new Error(label+": expected store missing from official S-kaupat directory: "+s.name);
            const u="https://api.ruoanhinta.fi/api/items?search="+encodeURIComponent("maito")+"&storeIds="+encodeURIComponent(String(s.id))+"&skip=0&take=20";
            const res=await fetch(u); const data=await res.json(); const items=(data.items||[]).filter(p=>Number(p.storeItems?.[0]?.price)>0);
            console.log("GPS_S_LIVE_PRICE",JSON.stringify({label,store:s.name,storeId:s.id,status:res.status,count:items.length,sample:items.slice(0,3).map(p=>({name:p.name,price:p.storeItems?.[0]?.price}))}));
            if(!res.ok||items.length===0) process.exitCode=2;
          }
          JS
      - name: Verify current production integration
        shell: bash
        run: |
          grep -q 'resolveZiiplyPageStoreSelection' src/app/page.tsx
          grep -q 'params.set("gps", "1")' src/app/page.tsx
          grep -q 'const gps = request.nextUrl.searchParams.get("gps") === "1"' src/app/api/store-search/route.ts
          grep -q '"K-Citymarket"' src/app/api/store-search/route.ts
          grep -q 'sStoreId?: string | number' src/app/components/ziiply/ziiplyCore.ts
          echo GPS_PRODUCTION_INTEGRATION_SUCCESS
      - name: Simulate store-search GPS API contract
        shell: bash
        run: |
          cat > gps-store-api-contract-test.ts <<'TS'
          function normalizeRuoanhinta(store:any){
            return {id:store.id,name:store.name,chain:store.chain,type:store.type,city:store.city,postalCode:store.postalCode,externalId:store.externalId,latitude:Number(store.lat),longitude:Number(store.long)};
          }
          async function fetchRh(search:string){
            const r=await fetch("https://api.ruoanhinta.fi/api/stores?search="+encodeURIComponent(search));
            if(!r.ok) throw new Error("Ruoanhinta "+r.status);
            const a=await r.json();
            return (Array.isArray(a)?a:a.items||[]).filter((x:any)=>x.country==="Suomi"&&Number.isFinite(Number(x.lat))&&Number.isFinite(Number(x.long))).map(normalizeRuoanhinta);
          }
          async function main(){
          const manual=await fetchRh("Prisma Hyvinkää");
          const gps=[...(await fetchRh("Prisma")).filter((x:any)=>x.chain==="prisma"&&!/verkkokauppa|puutarha|lemmikki|abc/i.test(x.name)),...(await fetchRh("K-Citymarket")).filter((x:any)=>x.chain==="kcitymarket")];
          const manualPreserved=manual.some((x:any)=>x.name==="Prisma Hyvinkää");
          const coordsPreserved=gps.every((x:any)=>Number.isFinite(x.latitude)&&Number.isFinite(x.longitude));
          const hyperCoverage={prisma:gps.filter((x:any)=>x.chain==="prisma").length,kCitymarket:gps.filter((x:any)=>x.chain==="kcitymarket").length};
          console.log("GPS_STORE_API_CONTRACT",JSON.stringify({manualCount:manual.length,manualPreserved,coordsPreserved,hyperCoverage,sample:gps.slice(0,3)}));
          if(!manualPreserved||!coordsPreserved||hyperCoverage.prisma<50||hyperCoverage.kCitymarket<50) process.exit(2);
          }
          main().catch(e=>{console.error(e);process.exit(2);});
          TS
          npx --yes tsx gps-store-api-contract-test.ts
      - name: Simulate resolver through active store IDs
        shell: bash
        run: |
          cat > gps-active-store-contract-test.ts <<'TS'
          import { resolveZiiplyPageStoreSelection } from "./src/app/components/ziiply/location/ziiplyStoreSelectionCore";
          const stores=[
            {id:"s-jokela",name:"S-market Jokela",type:"S",latitude:60.553731,longitude:24.967098},
            {id:"k-jokela",name:"K-Supermarket Jokela",type:"K",latitude:60.5524463543,longitude:24.9664902869},
            {id:"p-hyv",name:"Prisma Hyvinkää",type:"S",latitude:60.62988,longitude:24.866795},
            {id:"c-hyv",name:"K-Citymarket Hyvinkää",type:"K",latitude:60.6325695193,longitude:24.8639144333},
          ];
          const coords={latitude:60.552446,longitude:24.966490};
          const r=resolveZiiplyPageStoreSelection({stores,coords,mode:"local"});
          const area={sStoreId:r.sHyper?.id,sStoreName:r.sHyper?.name,kStoreId:r.kHyper?.id,kStoreName:r.kHyper?.name,sLocalStoreId:r.sLocal?.id,sLocalStoreName:r.sLocal?.name,kLocalStoreId:r.kLocal?.id,kLocalStoreName:r.kLocal?.name};
          function active(mode:"local"|"hyper"){
            return mode==="local"
              ? {sStoreId:area.sLocalStoreId,sStoreName:area.sLocalStoreName,kStoreId:area.kLocalStoreId,kStoreName:area.kLocalStoreName}
              : {sStoreId:area.sStoreId,sStoreName:area.sStoreName,kStoreId:area.kStoreId,kStoreName:area.kStoreName};
          }
          for(const mode of ["local","hyper"] as const){
            const a=active(mode);
            const productUrls={s:`/api/s-products?search=maito&store=${a.sStoreId}`,k:`/api/k-products?search=maito&store=${a.kStoreId}`};
            const expected=mode==="local"?a.sStoreId==="s-jokela"&&a.kStoreId==="k-jokela":a.sStoreId==="p-hyv"&&a.kStoreId==="c-hyv";
            console.log("GPS_ACTIVE_STORE_CONTRACT",JSON.stringify({mode,active:a,productUrls,expected}));
            if(!expected) process.exitCode=2;
          }
          TS
          npx --yes tsx gps-active-store-contract-test.ts
      - name: Simulate resolver to Area contract
        shell: bash
        run: |
          cat > gps-area-contract-test.ts <<'TS'
          import { resolveZiiplyPageStoreSelection } from "./src/app/components/ziiply/location/ziiplyStoreSelectionCore";
          const stores=[
            {id:"s-jokela",name:"S-market Jokela",type:"S",latitude:60.553731,longitude:24.967098},
            {id:"k-jokela",name:"K-Supermarket Jokela",type:"K",latitude:60.5524463543,longitude:24.9664902869},
            {id:"p-hyv",name:"Prisma Hyvinkää",type:"S",latitude:60.62988,longitude:24.866795},
            {id:"c-hyv",name:"K-Citymarket Hyvinkää",type:"K",latitude:60.6325695193,longitude:24.8639144333},
          ];
          function areaFromResolver(query:string,coords:any,mode:"local"|"hyper"){
            const r=resolveZiiplyPageStoreSelection({stores,coords,mode});
            return {label:"Oma sijainti",aliases:[query,"Oma sijainti"],sStoreId:r.sHyper?.id,sStoreName:r.sHyper?.name,kStoreId:r.kHyper?.id,kStoreName:r.kHyper?.name,sLocalStoreId:r.sLocal?.id,sLocalStoreName:r.sLocal?.name,kLocalStoreId:r.kLocal?.id,kLocalStoreName:r.kLocal?.name};
          }
          const expectedKeys=["label","aliases","sStoreId","sStoreName","kStoreId","kStoreName","sLocalStoreId","sLocalStoreName","kLocalStoreId","kLocalStoreName"];
          for(const mode of ["local","hyper"] as const){
            const a=areaFromResolver("Jokela",{latitude:60.552446,longitude:24.966490},mode);
            const keys=expectedKeys.every(k=>Object.prototype.hasOwnProperty.call(a,k));
            const values=a.sLocalStoreName==="S-market Jokela"&&a.kLocalStoreName==="K-Supermarket Jokela"&&a.sStoreName==="Prisma Hyvinkää"&&a.kStoreName==="K-Citymarket Hyvinkää";
            const active=mode==="local"?[a.sLocalStoreName,a.kLocalStoreName]:[a.sStoreName,a.kStoreName];
            console.log("GPS_AREA_CONTRACT",JSON.stringify({mode,keys,values,active,area:a}));
            if(!keys||!values) process.exitCode=2;
          }
          TS
          npx --yes tsx gps-area-contract-test.ts
      - name: Simulate page GPS integration seam
        shell: bash
        run: |
          cat > gps-page-seam-test.ts <<'TS'
          import fs from "node:fs";
          const page=fs.readFileSync("src/app/page.tsx","utf8");
          const checks={
            hasGpsApply: /applyLocation\([\s\S]*source:\s*"manual"\s*\|\s*"gps"/.test(page),
            passesCoordsToFetch: /fetchStoresForLocationQuery\([\s\S]*coordsOverride\s*\|\|\s*gpsCoordsV320/.test(page),
            writesFoundStores: page.includes("setFoundStores(storesWithDistanceV97)"),
            buildsDynamicArea: /buildDynamicArea\(\s*query,\s*storesWithDistanceV97/.test(page),
            oldRankerStillActive: /rankStoresForMode\(\s*storesWithDistanceV97/.test(page),
            newResolverWired: page.includes("resolveZiiplyPageStoreSelection"),
            storeRouteUsed: page.includes("/api/store-search?"),
          };
          console.log("GPS_PAGE_SEAM",JSON.stringify(checks));
          if(!checks.hasGpsApply||!checks.passesCoordsToFetch||!checks.writesFoundStores||!checks.buildsDynamicArea||!checks.oldRankerStillActive||!checks.storeRouteUsed) process.exit(2);
          if(!checks.newResolverWired) process.exit(3);
          TS
          npx --yes tsx gps-page-seam-test.ts
      - name: Simulate Jokela and Hyvinkaa against production resolver
        shell: bash
        run: |
          cat > gps-selection-test.ts <<'TS'
          import { resolveZiiplyPageStoreSelection } from "./src/app/components/ziiply/location/ziiplyStoreSelectionCore";

          const stores = [
            { id:"s-jokela", name:"S-market Jokela", latitude:60.5520, longitude:24.9667 },
            { id:"k-jokela", name:"K-Supermarket Jokela", coordinates:{latitude:60.552446,longitude:24.966490} },
            { id:"s-vehkoja", name:"S-market Vehkoja", latitude:60.6300, longitude:24.8050 },
            { id:"k-hakalantori", name:"K-Market Hakalantori", latitude:60.6330, longitude:24.8300 },
            { id:"k-vierema", name:"K-Supermarket Vieremä", latitude:60.6380, longitude:24.8620 },
            { id:"prisma-hyvinkaa", name:"Prisma Hyvinkää", latitude:60.6310, longitude:24.8530 },
            { id:"citymarket-hyvinkaa", name:"K-Citymarket Hyvinkää", latitude:60.6310, longitude:24.8580 },
          ];

          const cases = [
            {
              label:"Jokela",
              coords:{latitude:60.552446,longitude:24.966490},
              expected:{sLocal:"S-market Jokela",kLocal:"K-Supermarket Jokela",sHyper:"Prisma Hyvinkää",kHyper:"K-Citymarket Hyvinkää"}
            },
            {
              label:"Hyvinkää",
              coords:{latitude:60.6310,longitude:24.8580},
              expected:{sLocal:"S-market Vehkoja",kLocal:"K-Supermarket Vieremä",sHyper:"Prisma Hyvinkää",kHyper:"K-Citymarket Hyvinkää"}
            }
          ];

          let failed = false;
          for (const c of cases) {
            const r = resolveZiiplyPageStoreSelection({stores,areas:[],coords:c.coords,mode:"local"});
            const got = {sLocal:r.sLocal?.name,kLocal:r.kLocal?.name,sHyper:r.sHyper?.name,kHyper:r.kHyper?.name};
            const unique = new Set([r.sLocal?.id,r.kLocal?.id,r.sHyper?.id,r.kHyper?.id].filter(Boolean));
            const distances = {
              sLocal:r.sLocal?.distanceKm,kLocal:r.kLocal?.distanceKm,
              sHyper:r.sHyper?.distanceKm,kHyper:r.kHyper?.distanceKm
            };
            const match = Object.entries(c.expected).every(([k,v]) => (got as any)[k] === v);
            const noDuplicates = unique.size === 4;
            console.log("GPS_SIMULATION", JSON.stringify({case:c.label,coords:c.coords,got,expected:c.expected,distances,debug:r.debug,match,noDuplicates},null,2));
            if (!match || !noDuplicates) failed = true;
          }

          const far = resolveZiiplyPageStoreSelection({
            stores,areas:[],coords:{latitude:65.0121,longitude:25.4651},mode:"local",
            maxLocalDistanceKm:35,maxHyperDistanceKm:90
          });
          const farEmpty = !far.sLocal && !far.kLocal && !far.sHyper && !far.kHyper;
          console.log("GPS_COVERAGE_RADIUS", JSON.stringify({farEmpty,result:far},null,2));
          if (!farEmpty) failed = true;
          if (failed) process.exitCode=2;
          TS
          npx --yes tsx gps-selection-test.ts
