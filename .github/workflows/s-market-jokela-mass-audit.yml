name: S-market Jokela massatarkistus

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Hae tuotannon kaikki tarjoukset master-hakusanalla
        env:
          API_URL: https://ziiply.vercel.app/api/offers/search
        run: |
          mkdir -p audit
          node <<'NODE'
          const fs = await import('node:fs');
          const base = process.env.API_URL;
          const cases = [
            {name:'official-store-id', params:{q:'__ziiply_all_offers__',sStoreName:'S-market Jokela',sStoreId:'685839110'}},
            {name:'ui-store-id', params:{q:'__ziiply_all_offers__',sStoreName:'S-market Jokela',sStoreId:'721'}},
            {name:'store-name-only', params:{q:'__ziiply_all_offers__',sStoreName:'S-market Jokela'}},
            {name:'all-within-chain', params:{q:'__ziiply_all_offers__',sStoreName:'S-market Jokela',sStoreId:'685839110',withinChain:'S'}}
          ];
          const attempts = [];
          let best = null;
          for (const test of cases) {
            const url = new URL(base);
            for (const [k,v] of Object.entries(test.params)) url.searchParams.set(k,v);
            url.searchParams.set('_',String(Date.now()));
            try {
              const res = await fetch(url,{headers:{accept:'application/json'},signal:AbortSignal.timeout(90000),cache:'no-store'});
              const raw = await res.text();
              let data;
              try {data=JSON.parse(raw);}catch{data={ok:false,error:'Non-JSON response',bodySnippet:raw.slice(0,400)};}
              fs.writeFileSync('audit/response-'+test.name+'.json',JSON.stringify(data,null,2));
              const n = Array.isArray(data.results)?data.results.length:0;
              const diag={case:test.name,status:res.status,ok:data.ok,resultCount:n,baseCount:data.sEvidenceRouteV228?.baseResultCount??null,localEvidenceCount:data.sEvidenceRouteV228?.localEvidenceCountV231??null,error:data.error??null,deploy:data.deploy??null};
              attempts.push(diag);console.log(JSON.stringify(diag));
              if (res.ok && data.ok && (!best || n>best.results.length)) best=data;
              if (n>0) break;
            } catch(err){const diag={case:test.name,error:String(err)};attempts.push(diag);console.error(JSON.stringify(diag));}
          }
          fs.writeFileSync('audit/attempts.json',JSON.stringify(attempts,null,2));
          if(best)fs.writeFileSync('audit/jokela-all.json',JSON.stringify(best,null,2));
          if(!best || !Array.isArray(best.results) || best.results.length===0){
            console.error('VIRHE: Tuotannon tarjousrajapinta palautti nolla tuotetta kaikilla hakukonteksteilla. Tämä EI ole onnistunut massatarkistus.');
            console.warn('Tuotannon nollatulos kirjattu; seuraava vaihe hakee S-kaupat-lähteen suoraan.');
          }
          NODE

      - name: Hae S-kaupat lähde suoraan jos tuotannon haku on tyhjä
        if: always()
        run: |
          mkdir -p audit
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const date = new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Helsinki',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
          const hash='f6d87786fda8fb5c233c4eaed08f37b0c5b87dc0d8d4c44c33c5529e446369d1';
          const storeId='685839110';
          const variables={preview:false,storeId,skipProducts:false,availabilityDate:date,where:{storeId,path:'tuotteet/kampanjat',platform:'WEB',availabilityDate:date,userConsent:{marketing:false,marketingId:'ziiply-gosta',useCustomerId:false,sessionId:'ziiply-gosta',loop54:true}}};
          const extensions={clientLibrary:{name:'@apollo/client',version:'4.2.12'},persistedQuery:{version:1,sha256Hash:hash}};
          const url=new URL('https://api.s-kaupat.fi/');
          url.searchParams.set('operationName','RemoteGetPageContent');
          url.searchParams.set('variables',JSON.stringify(variables));
          url.searchParams.set('extensions',JSON.stringify(extensions));
          try {
            const response=await fetch(url,{headers:{accept:'application/graphql-response+json,application/json;q=0.9','accept-language':'fi',origin:'https://www.s-kaupat.fi',referer:'https://www.s-kaupat.fi/','x-client-name':'skaupat-web','x-client-version':'production-14a82a5b48cd1dd42c0592db0037514ed3c84de8'},signal:AbortSignal.timeout(90000)});
            const body=await response.json();
            fs.writeFileSync('audit/jokela-s-kaupat-source.json',JSON.stringify(body,null,2));
            const sections=body?.data?.pageContent?.sections||[];
            const products=sections.flatMap(s=>Array.isArray(s.products)?s.products:[]);
            console.log('S-kaupat direct status:',response.status,'sections:',sections.length,'products:',products.length,'errors:',JSON.stringify(body.errors||[]).slice(0,400));
            fs.writeFileSync('audit/jokela-source-diagnostics.json',JSON.stringify({status:response.status,sections:sections.length,products:products.length,errors:body.errors||[]},null,2));
            const existing = fs.existsSync('audit/jokela-all.json') ? JSON.parse(fs.readFileSync('audit/jokela-all.json','utf8')) : null;
            if(products.length && (!existing || !Array.isArray(existing.results) || existing.results.length===0)){
              const rows=products.map((p,i)=>({id:String(p.id||i),title:p.name,ean:p.ean||p.eanCode||p.gtin||'',storeName:'S-market Jokela',chain:'S-market',priceText:String(p.pricing?.campaignPrice??p.pricing?.currentPrice??p.price??''),unitPriceText:String(p.pricing?.comparisonPrice??''),category:(p.hierarchyPath||[]).at(-1)?.name||'',salesUnit:p.pricing?.salesUnit||'',isWeightedProduct:p.pricing?.isApproximatePrice===true,debugLocalCampaignEvidenceV231:p.pricing||{},imageUrl:p.productDetails?.productImages?.mainImage?.urlTemplate||''}));
              fs.writeFileSync('audit/jokela-all.json',JSON.stringify({ok:true,results:rows,source:'s-kaupat-direct-raw'},null,2));
            }
          }catch(e){console.error('S-kaupat direct fetch failed:',String(e));fs.writeFileSync('audit/jokela-source-diagnostics.json',JSON.stringify({error:String(e)},null,2));}
          NODE

      - name: Vertaa yhdeksän kaksoistuotteen osiot ja hinnat
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'audit/jokela-s-kaupat-source.json';
          if (!fs.existsSync(file)) throw new Error('Alkuperäinen S-kaupat-lähde puuttuu');
          const data = JSON.parse(fs.readFileSync(file,'utf8'));
          const sections = data?.data?.pageContent?.sections;
          if (!Array.isArray(sections)) throw new Error('Lähteessä ei ole sections-taulukkoa');
          const target = new Set(['6409100026684','6438574457175','2001360900007','6409620000324','6405506177159','2000141500009','6408430024858','8445290398178','8700216236874']);
          const found = {};
          for (const [sectionIndex,section] of sections.entries()) {
            for (const p of Array.isArray(section.products)?section.products:[]) {
              const ean = String(p.ean||p.eanCode||p.gtin||'');
              if (!target.has(ean)) continue;
              const pricing = p.pricing||p.store?.pricing||{};
              (found[ean]??=[]).push({
                sectionIndex:sectionIndex+1,
                sectionTitle:section.title||section.name||'',
                sectionDescription:section.description||'',
                name:p.name,
                campaignPrice:pricing.campaignPrice??null,
                currentPrice:pricing.currentPrice??null,
                regularPrice:pricing.regularPrice??null,
                comparisonPrice:pricing.comparisonPrice??null,
                comparisonUnit:pricing.comparisonUnit??null,
                salesUnit:pricing.salesUnit??null,
                campaignPriceValidUntil:pricing.campaignPriceValidUntil??null
              });
            }
          }
          const report = [...target].map(ean=>{
            const occurrences=found[ean]||[];
            const prices=occurrences.map(x=>JSON.stringify([x.campaignPrice,x.currentPrice,x.regularPrice,x.comparisonPrice,x.comparisonUnit]));
            return {ean,occurrences,differentSections:new Set(occurrences.map(x=>x.sectionIndex)).size>1,priceDifferences:new Set(prices).size>1};
          });
          fs.writeFileSync('audit/jokela-duplicate-source-comparison.json',JSON.stringify(report,null,2));
          console.log('KAKSOISTUOTTEIDEN OSIO- JA HINTAVERTAILU');
          for(const r of report){
            console.log('\n'+r.ean+' | esiintymiä '+r.occurrences.length+' | eri osiot '+r.differentSections+' | hintaero '+r.priceDifferences);
            for(const x of r.occurrences) console.log('  Osio '+x.sectionIndex+' '+x.sectionTitle+' | '+x.name+' | campaign='+x.campaignPrice+' current='+x.currentPrice+' regular='+x.regularPrice+' comparison='+x.comparisonPrice+'/'+x.comparisonUnit);
          }
          const missing=report.filter(x=>x.occurrences.length===0).map(x=>x.ean);
          const single=report.filter(x=>x.occurrences.length===1).map(x=>x.ean);
          const duplicates=report.filter(x=>x.occurrences.length>1);
          const conflicts=duplicates.filter(x=>x.priceDifferences);
          const sameSectionDuplicates=duplicates.filter(x=>!x.differentSections).map(x=>x.ean);
          console.log('KAKSOISTUOTTEIDEN YHTEENVETO',JSON.stringify({checked:report.length,missing,single,duplicates:duplicates.length,sameSectionDuplicates,priceConflicts:conflicts.map(x=>x.ean)}));
          if(missing.length) console.warn('Tarkistuslistan EAN-koodeja ei nykyisessä lähteessä:',missing.join(', '));
          if(single.length) console.warn('Vain kerran esiintyvät EAN-koodit:',single.join(', '));
          if(sameSectionDuplicates.length) console.warn('Saman osion kaksoiskappaleet:',sameSectionDuplicates.join(', '));
          if(conflicts.length) throw new Error('Kaksoistuotteiden hinnoissa ristiriita: '+conflicts.map(x=>x.ean).join(', '));
          NODE

      - name: Tarkista kaikki tuotekohtaisesti
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('audit/jokela-all.json', 'utf8'));
          if (!data.ok || !Array.isArray(data.results)) {
            throw new Error('Tarjousrajapinta ei palauttanut odotettua results-taulukkoa: ' + JSON.stringify(data).slice(0, 500));
          }
          const rows = data.results.filter(x => /s-market jokela/i.test(String(x.storeName || x.storeLabel || x.shopName || '')) || /^(s|s-market)$/i.test(String(x.chain || ''))); 
          console.log('API results:', data.results.length, 'selected rows:', rows.length);
          console.log('API top-level keys:', Object.keys(data));
          console.log('First result metadata:', data.results.slice(0, 3).map(x => ({chain:x.chain,storeName:x.storeName,storeLabel:x.storeLabel,title:x.title,source:x.source})));
          fs.writeFileSync('audit/jokela-response-diagnostics.json', JSON.stringify({
            responseKeys: Object.keys(data),
            resultCount: data.results.length,
            selectedCount: rows.length,
            firstResults: data.results.slice(0, 5).map(x => ({chain:x.chain,storeName:x.storeName,storeLabel:x.storeLabel,title:x.title,source:x.source})),
            sEvidenceRouteV228: data.sEvidenceRouteV228 || null,
            error: data.error || null
          }, null, 2));
          const issues = [];
          const categoryAliasDifferences = [];
          const seen = new Map();
          const categoryCounts = {};
          for (const [i, item] of rows.entries()) {
            const e = item.debugLocalCampaignEvidenceV231 || {};
            const title = String(item.title || item.name || '');
            const ean = String(item.ean || '').trim();
            const category = String(item.neonDisplayCategory || item.category || '').trim();
            const money = v => {
              if (typeof v === 'number') return v;
              const t = String(v ?? '').replace(/\s/g, '').replace('€', '').replace(',', '.');
              return t && Number.isFinite(Number(t)) ? Number(t) : null;
            };
            const price = money(item.priceText ?? item.price);
            const comparison = String(item.unitPriceText || item.comparisonPriceText || item.unitPrice || '');
            const salesUnit = String(item.salesUnit || '').toUpperCase();
            categoryCounts[category || '(puuttuu)'] = (categoryCounts[category || '(puuttuu)'] || 0) + 1;
            const add = (type, details = '') => issues.push({ row: i + 1, ean, title, category, type, details });
            if (!title) add('missing_title');
            if (!ean) add('missing_ean');
            if (!category) add('missing_category');
            if (price == null || price <= 0) add('invalid_price', String(item.priceText || item.price || ''));
            if (!comparison) add('missing_unit_price');
            if (!item.imageUrl && !item.image) add('missing_image');
            if (ean) {
              if (seen.has(ean)) add('duplicate_ean', 'First row: ' + seen.get(ean));
              else seen.set(ean, i + 1);
            }
            if (e.campaignPrice != null && price != null && Math.abs(price - Number(e.campaignPrice)) > 0.011) add('campaign_price_mismatch', String(e.campaignPrice));
            if (e.regularPrice != null && e.campaignPrice != null && Number(e.campaignPrice) > Number(e.regularPrice)) add('campaign_above_regular');
            if (item.isWeightedProduct || item.isApproximatePrice || ['KG','KGM','L','LTR'].includes(salesUnit)) {
              if (!comparison) add('weighted_missing_comparison');
            }
            // Different category taxonomies are expected: the Neon display category overrides the provider category.
            // Report both labels for review, but do not count a mere label difference as a defect.
            if (item.neonDisplayCategory && item.category && item.neonDisplayCategory !== item.category) {
              categoryAliasDifferences.push({ean, sourceCategory: item.category, displayCategory: item.neonDisplayCategory});
            }
          }
          const report = {
            generatedAt: new Date().toISOString(),
            source: 'https://ziiply.vercel.app/api/offers/search',
            store: 'S-market Jokela',
            rawResultCount: data.results.length,
            checkedRows: rows.length,
            categoryCounts,
            issueCount: issues.length,
            categoryAliasDifferenceCount: categoryAliasDifferences.length,
            categoryAliasDifferences,
            issues
          };
          fs.writeFileSync('audit/jokela-report.json', JSON.stringify(report, null, 2));
          fs.writeFileSync('audit/jokela-report.txt', [
            'S-market Jokela — massatarkistus',
            'Tuotteita: ' + rows.length,
            'Havaintoja: ' + issues.length,
            'Luokittelun nimike-eroja (ei automaattisia virheitä): ' + categoryAliasDifferences.length,
            '',
            'Tuoteryhmät:',
            ...Object.entries(categoryCounts).sort((a,b)=>a[0].localeCompare(b[0])).map(([k,v])=>'  '+k+': '+v),
            '',
            'Havainnot:',
            ...issues.map(x=>x.row+' | '+x.ean+' | '+x.title+' | '+x.type+' | '+x.details)
          ].join('\n'));
          console.log(fs.readFileSync('audit/jokela-report.txt', 'utf8').slice(0, 12000));
          if (!rows.length) throw new Error('Tuotannon ja S-kaupat-lähteen tulos on tyhjä. Katso jokela-source-diagnostics.json sekä response-*.json.');
          NODE

      - name: Täsmäytä lähteen ja tuotannon EANit massana
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const sourcePath = 'audit/jokela-s-kaupat-source.json';
          const productionPath = 'audit/response-official-store-id.json';
          if (!fs.existsSync(sourcePath) || !fs.existsSync(productionPath)) throw new Error('Lähde- tai tuotantovastaus puuttuu');
          const source = JSON.parse(fs.readFileSync(sourcePath,'utf8'));
          const production = JSON.parse(fs.readFileSync(productionPath,'utf8'));
          const sections = source?.data?.pageContent?.sections || [];
          const raw = sections.flatMap(section => (Array.isArray(section.products)?section.products:[]).map(p=>({section:section.title||'',product:p})));
          const normalize = p=>String(p?.ean||p?.eanCode||p?.gtin||'').trim();
          const sourceByEan = new Map();
          for (const row of raw) {
            const ean = normalize(row.product);
            if (!ean) continue;
            if (!sourceByEan.has(ean)) sourceByEan.set(ean,[]);
            sourceByEan.get(ean).push(row);
          }
          const results = Array.isArray(production.results)?production.results:[];
          const prodEans = new Set(results.map(normalize).filter(Boolean));
          const missing = [];
          const counts = {};
          const today = new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Helsinki',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
          for (const [ean,occurrences] of sourceByEan) {
            if (prodEans.has(ean)) continue;
            const p = occurrences[0].product;
            const pricing = p.pricing||p.store?.pricing||{};
            const campaign = pricing.campaignPrice;
            const regular = pricing.regularPrice??p.price;
            const current = pricing.currentPrice;
            const until = String(pricing.campaignPriceValidUntil||'').slice(0,10);
            const reasons=[];
            // Mirror provider V6 section-chain exclusion to identify rows rejected before mapping.
            const sectionExclusions = occurrences.map(({section,product})=>{
              const sourceSection = sections.find(x=>(Array.isArray(x.products)?x.products:[]).includes(product));
              const evidence = [sourceSection?.title,sourceSection?.description,sourceSection?.text,sourceSection?.tagTitle,sourceSection?.metadata?.entryName].filter(Boolean).join(' | ');
              const chains = [];
              if (/\bprisma\b/i.test(evidence)) chains.push('prisma');
              if (/\bs[ -]?market\b/i.test(evidence)) chains.push('s-market');
              if (/\balepa\b/i.test(evidence)) chains.push('alepa');
              if (/\bsale\b/i.test(evidence)) chains.push('sale');
              return {section,chains,excluded:chains.length>0&&!chains.includes('s-market'),evidence:evidence.slice(0,300)};
            });
            if(sectionExclusions.length && sectionExclusions.every(x=>x.excluded)) reasons.push('excluded_by_section_chain_filter');
            if (until && (!/^\d{4}-\d{2}-\d{2}$/.test(until)||until<today)) reasons.push('expired_or_invalid_date');
            if (campaign!=null && Number.isFinite(Number(campaign)) && ((regular!=null&&Number(campaign)>Number(regular))||(current!=null&&Number(campaign)>Number(current)))) reasons.push('campaign_above_regular_or_current');
            if (!(Number(current)>0) && !(campaign!=null && regular!=null && Number(campaign)>0 && Number(campaign)<Number(regular))) reasons.push('no_eligible_price');
            if (!reasons.length) reasons.push('unexplained_requires_pipeline_check');
            for(const reason of reasons) counts[reason]=(counts[reason]||0)+1;
            missing.push({ean,title:p.name,sections:occurrences.map(x=>x.section),sectionExclusions,pricing:{campaignPrice:campaign??null,currentPrice:current??null,regularPrice:regular??null,validUntil:until||null},reasons});
          }
          const report={sourceRawRows:raw.length,sourceUniqueEans:sourceByEan.size,productionRows:results.length,productionUniqueEans:prodEans.size,duplicateSourceRows:raw.length-sourceByEan.size,missingUniqueEans:missing.length,missingReasons:counts,missing,productionOnlyEans:[...prodEans].filter(x=>!sourceByEan.has(x))};
          fs.writeFileSync('audit/jokela-source-production-reconciliation.json',JSON.stringify(report,null,2));
          console.log('JOKELA EAN MASS RECONCILIATION',JSON.stringify({sourceRawRows:report.sourceRawRows,sourceUniqueEans:report.sourceUniqueEans,productionRows:report.productionRows,productionUniqueEans:report.productionUniqueEans,duplicateSourceRows:report.duplicateSourceRows,missingUniqueEans:report.missingUniqueEans,missingReasons:report.missingReasons,productionOnlyCount:report.productionOnlyEans.length}));
          for(const row of missing)console.log('MISSING EAN',row.ean,JSON.stringify(row.reasons),row.title);
          NODE

      - name: Tuoteryhmien ja hintojen syvätarkistus massana
        if: always()
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='audit/response-official-store-id.json';
          if(!fs.existsSync(path))throw Error('Tuotannon vastaus puuttuu');
          const data=JSON.parse(fs.readFileSync(path,'utf8'));
          const rows=Array.isArray(data.results)?data.results:[];
          if(!rows.length)throw Error('Tuotannossa ei tuotteita: syvätarkistusta ei voi hyväksyä');
          const num=x=>{if(x==null)return null;const v=Number(String(x).replace(/\s/g,'').replace('€','').replace(',','.'));return Number.isFinite(v)?v:null};
          const findings=[],categories=[],prices=[],displayFallbacks=[];
          const classify=(row,i)=>{
            const title=String(row.title||row.name||'');
            const source=String(row.category||'');
            const display=String(row.neonDisplayCategory||'');
            const t=title.toLowerCase(),d=display.toLowerCase(),src=source.toLowerCase();
            // High-confidence mismatches only. Avoid matching ingredients (porkkana, kana,
            // suklaa, maito) or generic substrings inside unrelated product names.
            const checks=[
              {when:/\\b(?:kitkat|vohvelikeksi|suklaakeksi|keksi|keksit)\\b/i.test(t)&&/karkit|suklaat|keksit/.test(src),wrong:/leipomo|hevi|liha|juoma/.test(d),family:'Makeiset & keksit'},
              {when:/\\bpiltti\\b/i.test(t)&&/lapset/.test(src),wrong:/\\bhevi\\b/.test(d),family:'Lastenruoat'},
              {when:/\\b(?:wc-paperi|talouspaperi)\\b/i.test(t),wrong:/\\bhevi|liha|juoma|pakaste|leipomo\\b/.test(d),family:'Kodinhoito'},
              {when:/\\b(?:pyykinpesuneste|astianpesuaine)\\b/i.test(t),wrong:/\\bhevi|liha|juoma|pakaste|leipomo\\b/.test(d),family:'Kodinhoito'}
            ];
            for(const check of checks){
              if(check.when&&check.wrong)categories.push({row:i+1,ean:row.ean,title,sourceCategory:source,displayCategory:display,expectedFamily:check.family,reason:'category_semantic_review'});
            }
            if(!display&&source)displayFallbacks.push({row:i+1,ean:row.ean,title,fallbackCategory:source,categoryPath:row.categoryPath||null,reason:'neon_display_category_absent_source_fallback_available'});
            if(display&&source&&display!==source)categories.push({row:i+1,ean:row.ean,title,sourceCategory:source,displayCategory:display,reason:'taxonomy_label_difference_review'});
          };
          rows.forEach((row,i)=>{
            classify(row,i);
            const e=row.debugLocalCampaignEvidenceV231||{};
            const price=num(row.priceText??row.price);
            const regular=num(e.regularPrice),campaign=num(e.campaignPrice),current=num(e.currentPrice);
            const unitText=String(row.unitPriceText||row.comparisonPriceText||row.unitPrice||'');
            const salesUnit=String(row.salesUnit||'').toLowerCase();
            const title=String(row.title||'');
            const add=(reason,detail)=>prices.push({row:i+1,ean:row.ean,title,reason,detail});
            if(price==null||price<=0)add('invalid_price',{price});
            if(campaign!=null&&price!=null&&Math.abs(campaign-price)>.011)add('campaign_price_mismatch',{campaign,price});
            if(campaign!=null&&regular!=null&&campaign>regular)add('campaign_above_regular',{campaign,regular});
            if(!unitText)add('missing_unit_price',{salesUnit});
            if((row.isWeightedProduct||row.isApproximatePrice||['kg','kgm'].includes(salesUnit))&&!/kg/i.test(unitText))add('weighted_unit_price_review',{salesUnit,unitText});
            if(/\b\d+\s*(?:kpl|pkt|pack|rll|rl)\b/i.test(title)&&campaign!=null&&regular!=null&&campaign<regular&&price!=null&&Math.abs(price-campaign)>.011)add('multipack_price_review',{price,campaign,regular});
            if(current!=null&&campaign!=null&&campaign>current)add('campaign_above_current',{campaign,current});
          });
          const summary={checked:rows.length,categoryReviewRows:categories.length,displayFallbackRows:displayFallbacks.length,priceReviewRows:prices.length,categoryReasons:categories.reduce((o,x)=>(o[x.reason]=(o[x.reason]||0)+1,o),{}),priceReasons:prices.reduce((o,x)=>(o[x.reason]=(o[x.reason]||0)+1,o),{})};
          fs.writeFileSync('audit/jokela-deep-category-review.json',JSON.stringify({summary,categories,displayFallbacks},null,2));
          fs.writeFileSync('audit/jokela-deep-price-review.json',JSON.stringify({summary,prices},null,2));
          fs.writeFileSync('audit/jokela-deep-summary.txt',JSON.stringify(summary,null,2));
          console.log('JOKELA DEEP AUDIT',JSON.stringify(summary));
          if(prices.some(x=>['invalid_price','campaign_price_mismatch','campaign_above_regular','campaign_above_current'].includes(x.reason)))process.exitCode=1;
          NODE

      - name: Tallenna kaikki debugit ja raportti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s-market-jokela-massatarkistus
          path: audit/
          if-no-files-found: warn
          retention-days: 14
