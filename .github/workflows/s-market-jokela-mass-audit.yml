name: S-market Jokela massatarkistus

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Hae tuotannon kaikki tarjoukset ja kokeile oikeita hakukonteksteja
        env:
          API_URL: https://ziiply.vercel.app/api/offers/search
        run: |
          mkdir -p audit
          node <<'NODE'
          const fs = await import('node:fs');
          const base = process.env.API_URL;
          const cases = [
            {name:'official-store-id', params:{q:'',sStoreName:'S-market Jokela',sStoreId:'685839110'}},
            {name:'ui-store-id', params:{q:'',sStoreName:'S-market Jokela',sStoreId:'721'}},
            {name:'store-name-only', params:{q:'',sStoreName:'S-market Jokela'}},
            {name:'all-within-chain', params:{q:'',sStoreName:'S-market Jokela',sStoreId:'685839110',withinChain:'S'}}
          ];
          const attempts = [];
          let best = null;
          for (const test of cases) {
            const url = new URL(base);
            for (const [k,v] of Object.entries(test.params)) url.searchParams.set(k,v);
            url.searchParams.set('_',String(Date.now()));
            try {
              const res = await fetch(url,{headers:{accept:'application/json'},signal:AbortSignal.timeout(90000),cache:'no-store'});
              const raw = await res.text();
              let data;
              try {data=JSON.parse(raw);}catch{data={ok:false,error:'Non-JSON response',bodySnippet:raw.slice(0,400)};}
              fs.writeFileSync('audit/response-'+test.name+'.json',JSON.stringify(data,null,2));
              const n = Array.isArray(data.results)?data.results.length:0;
              const diag={case:test.name,status:res.status,ok:data.ok,resultCount:n,baseCount:data.sEvidenceRouteV228?.baseResultCount??null,localEvidenceCount:data.sEvidenceRouteV228?.localEvidenceCountV231??null,error:data.error??null,deploy:data.deploy??null};
              attempts.push(diag);console.log(JSON.stringify(diag));
              if (res.ok && data.ok && (!best || n>best.results.length)) best=data;
              if (n>0) break;
            } catch(err){const diag={case:test.name,error:String(err)};attempts.push(diag);console.error(JSON.stringify(diag));}
          }
          fs.writeFileSync('audit/attempts.json',JSON.stringify(attempts,null,2));
          if(best)fs.writeFileSync('audit/jokela-all.json',JSON.stringify(best,null,2));
          if(!best || !Array.isArray(best.results) || best.results.length===0){
            console.error('VIRHE: Tuotannon tarjousrajapinta palautti nolla tuotetta kaikilla hakukonteksteilla. Tämä EI ole onnistunut massatarkistus.');
            process.exitCode=1;
          }
          NODE

      - name: Tarkista kaikki tuotekohtaisesti
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('audit/jokela-all.json', 'utf8'));
          if (!data.ok || !Array.isArray(data.results)) {
            throw new Error('Tarjousrajapinta ei palauttanut odotettua results-taulukkoa: ' + JSON.stringify(data).slice(0, 500));
          }
          const rows = data.results.filter(x => /s-market jokela/i.test(String(x.storeName || x.storeLabel || x.shopName || '')) || /^(s|s-market)$/i.test(String(x.chain || ''))); 
          console.log('API results:', data.results.length, 'selected rows:', rows.length);
          console.log('API top-level keys:', Object.keys(data));
          console.log('First result metadata:', data.results.slice(0, 3).map(x => ({chain:x.chain,storeName:x.storeName,storeLabel:x.storeLabel,title:x.title,source:x.source})));
          fs.writeFileSync('audit/jokela-response-diagnostics.json', JSON.stringify({
            responseKeys: Object.keys(data),
            resultCount: data.results.length,
            selectedCount: rows.length,
            firstResults: data.results.slice(0, 5).map(x => ({chain:x.chain,storeName:x.storeName,storeLabel:x.storeLabel,title:x.title,source:x.source})),
            sEvidenceRouteV228: data.sEvidenceRouteV228 || null,
            error: data.error || null
          }, null, 2));
          const issues = [];
          const seen = new Map();
          const categoryCounts = {};
          for (const [i, item] of rows.entries()) {
            const e = item.debugLocalCampaignEvidenceV231 || {};
            const title = String(item.title || item.name || '');
            const ean = String(item.ean || '').trim();
            const category = String(item.neonDisplayCategory || item.category || '').trim();
            const money = v => {
              if (typeof v === 'number') return v;
              const t = String(v ?? '').replace(/\s/g, '').replace('€', '').replace(',', '.');
              return t && Number.isFinite(Number(t)) ? Number(t) : null;
            };
            const price = money(item.priceText ?? item.price);
            const comparison = String(item.unitPriceText || item.comparisonPriceText || item.unitPrice || '');
            const salesUnit = String(item.salesUnit || '').toUpperCase();
            categoryCounts[category || '(puuttuu)'] = (categoryCounts[category || '(puuttuu)'] || 0) + 1;
            const add = (type, details = '') => issues.push({ row: i + 1, ean, title, category, type, details });
            if (!title) add('missing_title');
            if (!ean) add('missing_ean');
            if (!category) add('missing_category');
            if (price == null || price <= 0) add('invalid_price', String(item.priceText || item.price || ''));
            if (!comparison) add('missing_unit_price');
            if (!item.imageUrl && !item.image) add('missing_image');
            if (ean) {
              if (seen.has(ean)) add('duplicate_ean', 'First row: ' + seen.get(ean));
              else seen.set(ean, i + 1);
            }
            if (e.campaignPrice != null && price != null && Math.abs(price - Number(e.campaignPrice)) > 0.011) add('campaign_price_mismatch', String(e.campaignPrice));
            if (e.regularPrice != null && e.campaignPrice != null && Number(e.campaignPrice) > Number(e.regularPrice)) add('campaign_above_regular');
            if (item.isWeightedProduct || item.isApproximatePrice || ['KG','KGM','L','LTR'].includes(salesUnit)) {
              if (!comparison) add('weighted_missing_comparison');
            }
            if (item.neonDisplayCategory && item.category && item.neonDisplayCategory !== item.category) add('neon_display_mismatch', String(item.neonDisplayCategory));
          }
          const report = {
            generatedAt: new Date().toISOString(),
            source: 'https://ziiply.vercel.app/api/offers/search',
            store: 'S-market Jokela',
            rawResultCount: data.results.length,
            checkedRows: rows.length,
            categoryCounts,
            issueCount: issues.length,
            issues
          };
          fs.writeFileSync('audit/jokela-report.json', JSON.stringify(report, null, 2));
          fs.writeFileSync('audit/jokela-report.txt', [
            'S-market Jokela — massatarkistus',
            'Tuotteita: ' + rows.length,
            'Havaintoja: ' + issues.length,
            '',
            'Tuoteryhmät:',
            ...Object.entries(categoryCounts).sort((a,b)=>a[0].localeCompare(b[0])).map(([k,v])=>'  '+k+': '+v),
            '',
            'Havainnot:',
            ...issues.map(x=>x.row+' | '+x.ean+' | '+x.title+' | '+x.type+' | '+x.details)
          ].join('\n'));
          console.log(fs.readFileSync('audit/jokela-report.txt', 'utf8').slice(0, 12000));
          if (!rows.length) throw new Error('Yhtään Jokelan tuotetta ei saatu. Katso attempts.json ja response-*.json artefaktista.');
          NODE

      - name: Tallenna kaikki debugit ja raportti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s-market-jokela-massatarkistus
          path: audit/
          if-no-files-found: warn
          retention-days: 14
