name: Neon-first search relevance regression
on:
  workflow_dispatch:
  push:
    branches: [test/neon-first-product-search]
    paths:
      - 'src/app/api/neon-first-search/**'
      - 'scripts/neon-search-regression.mjs'
      - 'scripts/neon-real-sk-upstream-smoke.mjs'
      - 'scripts/neon-search-latency-benchmark.mjs'
      - 'scripts/neon-vs-current-search-comparison.mjs'
      - 'scripts/neon-ean-price-lookup-experiment.mjs'
      - 'scripts/neon-ean-upstream-diagnostics.mjs'
      - 'tests/neon-first-simulation.test.cjs'
      - 'tests/neon-ean-price-enrichment.test.mjs'
      - 'tests/neon-ruoanhinta-price-lookup.test.mjs'
      - 'tests/neon-selected-store-merge.test.mjs'
      - 'tests/neon-search-pipeline-isolation.test.mjs'
      - 'src/lib/neonSearchSimulation/ruoanhintaPriceLookup.mjs'
      - 'src/lib/neonSearchSimulation/enrichPrices.mjs'
      - 'src/lib/neonSearchSimulation/**'
      - 'src/app/neon-search-simulation/page.tsx'
      - 'tests/neon-first-simulation.test.cjs'
      - 'scripts/neon-search-category-coverage.mjs'
      - 'scripts/verify-neon-search-db.mjs'
      - '.github/workflows/neon-search-regression.yml'
permissions:
  contents: read
concurrency:
  group: neon-search-relevance
  cancel-in-progress: true
jobs:
  relevance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record immutable commit under test
        run: echo "Testing commit $GITHUB_SHA (GitHub Actions checkout is pinned to this commit)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies for isolated regression runner
        run: npm install --no-save --package-lock=false --no-audit --no-fund
      - name: Validate Next.js TypeScript compilation before integration tests
        run: npx tsc --noEmit --incremental false
      - name: Verify Neon target before starting server
        env:
          DATABASE_URL: ${{ secrets.ZIIPLY_DATABASE_URL }}
        run: node scripts/verify-neon-search-db.mjs
      - name: Start exactly checked-out Next.js search API locally
        env:
          DATABASE_URL: ${{ secrets.ZIIPLY_DATABASE_URL }}
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::ZIIPLY_DATABASE_URL GitHub secret missing; cannot run live Neon queries"
            exit 1
          fi
          npm run dev -- --hostname 127.0.0.1 --port 3099 > /tmp/neon-search-next.log 2>&1 &
          echo $! > /tmp/neon-search-next.pid
          for i in $(seq 1 25); do
            if curl -fsS --silent 'http://127.0.0.1:3099/api/neon-first-search?q=6413300102017' -o /tmp/neon-search-health.json; then
              node -e "const r=require('/tmp/neon-search-health.json');if(!r.ok)process.exit(1)" && exit 0
            fi
            sleep 3
          done
          echo '::error::Local search API failed readiness checks; inspect server log below'
          tail -100 /tmp/neon-search-next.log || true
          exit 1
      - name: Run live search relevance tests against same commit, no Vercel
        env:
          SEARCH_BASE_URL: http://127.0.0.1:3099
        run: node scripts/neon-search-regression.mjs
      - name: Test live Neon EAN response merged with isolated S/K provider fixtures
        env:
          SEARCH_BASE_URL: http://127.0.0.1:3099
        run: node --test tests/neon-first-simulation.test.cjs
      - name: Test optional exact-EAN price enrichment helper
        run: node --test tests/neon-ean-price-enrichment.test.mjs
      - name: Test Ruoanhinta EAN verified store price adapter
        run: node --test tests/neon-ruoanhinta-price-lookup.test.mjs
      - name: Test selected-store mobile merge contract
        run: node --test tests/neon-selected-store-merge.test.mjs
      - name: Verify normal search, recipe and offer pipeline isolation
        run: node --test tests/neon-search-pipeline-isolation.test.mjs
      - name: Read-only live S/K upstream EAN and price coverage smoke test
        continue-on-error: true
        env:
          SEARCH_BASE_URL: http://127.0.0.1:3099
        run: node scripts/neon-real-sk-upstream-smoke.mjs
      - name: Benchmark live Neon first results and real S/K price readiness
        env:
          SEARCH_BASE_URL: http://127.0.0.1:3099
        run: node scripts/neon-search-latency-benchmark.mjs
      - name: Compare current provider-first versus Neon-first latency and result parity (read-only)
        env:
          SEARCH_BASE_URL: http://127.0.0.1:3099
        run: node scripts/neon-vs-current-search-comparison.mjs
      - name: Verify all unique Neon-only EAN prices after baseline (read-only bounded experiment)
        env:
          SEARCH_BASE_URL: http://127.0.0.1:3099
          EAN_LOOKUP_LIMIT: 250
        run: node scripts/neon-ean-price-lookup-experiment.mjs
      - name: Diagnose Ruoanhinta exact EAN response and S-kaupat direct GraphQL (read-only)
        run: node scripts/neon-ean-upstream-diagnostics.mjs
        env:
          SEARCH_BASE_URL: http://127.0.0.1:3099
      - name: Audit every Neon product category (diagnostic report)
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.ZIIPLY_DATABASE_URL }}
          SEARCH_BASE_URL: http://127.0.0.1:3099
        run: node scripts/neon-search-category-coverage.mjs
      - name: Report branch movement without failing a valid pinned-commit test
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT=$(gh api repos/${{ github.repository }}/git/ref/heads/test/neon-first-product-search --jq '.object.sha')
          echo "Tested commit: $GITHUB_SHA"
          echo "Current branch HEAD: $CURRENT"
          if [ "$CURRENT" != "$GITHUB_SHA" ]; then echo "::notice::Branch advanced; this run still tests its immutable commit. New commits trigger their own run."; fi
      - name: Show local server log on failure
        if: failure()
        run: tail -120 /tmp/neon-search-next.log || true
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-search-regression
          path: |
            artifacts/neon-ean-upstream-diagnostics.json
            artifacts/neon-ean-price-lookup-experiment.json
            artifacts/neon-vs-current-search-comparison.json
            artifacts/neon-search-latency-benchmark.json
            artifacts/neon-real-sk-upstream-smoke.json
            artifacts/neon-search-regression.json
            artifacts/neon-search-contract-checks.json
            artifacts/neon-search-intent-diagnostics.json
            artifacts/neon-search-category-coverage.json
            artifacts/neon-search-ranking-diagnostics.json
            artifacts/neon-search-unique-category-analysis.json
          if-no-files-found: ignore
