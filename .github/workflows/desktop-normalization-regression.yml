name: Desktop normal search normalization
on:
  push:
    branches: [preview/legacy-desktop-ui]
    paths:
      - 'src/app/components/ziiply/search/**'
      - 'src/app/desktop-preview/DesktopPreviewClient.tsx'
      - 'src/app/api/neon-first-search/route.ts'
      - 'scripts/test-desktop-normal-relevance.cjs'
      - 'tests/desktop-normal-search.test.cjs'
      - '.github/workflows/desktop-normalization-regression.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - run: node scripts/test-desktop-normal-relevance.cjs
      - run: node tests/desktop-normal-search.test.cjs
      - run: npx tsc --noEmit
      - run: npm run build
