name: Fix mobile normal search ranking
on:
  push:
    branches: [main]
    paths: [".github/workflows/fix-mobile-normal-search.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ziiply-mobile-search-fix
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Patch both fresh and cached normal search using shared desktop ranking
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/page.tsx')
          s=p.read_text()
          old='''       const unique=recipeIngredient?prioritizeRecipeFishProducts(recipeIngredient.name,rankProductResultsByRelevanceAndPrice(focusedSearchTerms[0],normalUnique.filter(recipeAllows),getProductPrice),recipeIngredient):normalUnique;'''
          new='''       const unique=recipeIngredient
             ? prioritizeRecipeFishProducts(recipeIngredient.name,rankProductResultsByRelevanceAndPrice(focusedSearchTerms[0],normalUnique.filter(recipeAllows),getProductPrice),recipeIngredient)
             : rankProductResultsByRelevanceAndPrice(focusedSearchTerms[0] || useTerms[0] || "",normalUnique.filter((product: Product) => getProductPrice(product) > 0 && productGroupGate(focusedSearchTerms[0] || useTerms[0] || "", product.name) && !isBadNormalResult(product, focusedSearchTerms[0] || useTerms[0] || "")),getProductPrice);'''
          assert s.count(old)==1, 'fresh results anchor mismatch'
          s=s.replace(old,new)
          old='''       const cachedValidated = cachedNormalSearchV441.results.filter((product: Product) =>
                 productGroupGate(cachedTerm, product.name) && !isBadNormalResult(product, cachedTerm),
               );'''
          new='''       const cachedValidated = rankProductResultsByRelevanceAndPrice(
                 cachedTerm,
                 cachedNormalSearchV441.results.filter((product: Product) =>
                   getProductPrice(product) > 0 &&
                   productGroupGate(cachedTerm, product.name) &&
                   !isBadNormalResult(product, cachedTerm),
                 ),
                 getProductPrice,
               );'''
          assert s.count(old)==1, 'cached results anchor mismatch'
          s=s.replace(old,new)
          p.write_text(s)
          print('Applied identical relevance/price ranking to fresh and cached normal results')
          PY
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Commit tested fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git diff --cached --check
          git commit -m "fix: apply shared relevance and price ranking to mobile fresh and cached results"
          git pull --rebase origin main
          git push origin HEAD:main
