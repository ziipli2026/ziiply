name: Fineli salt HTTP preview smoke test
on:
  push:
    branches: [test/fineli-salt-live-preview]
    paths:
      - '.github/workflows/fineli-salt-http-preview.yml'
  workflow_dispatch:
    inputs:
      ean:
        description: 'Optional EAN; if blank select from existing read-only audit'
        required: false
        type: string
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        if: ${{ inputs.ean == '' }}
        with:
          python-version: '3.12'
      - name: Select EAN from existing read-only Fineli audit
        if: ${{ inputs.ean == '' }}
        env:
          DATABASE_URL: ${{ secrets.ZIIPLY_DATABASE_URL }}
        run: |
          python -m pip install 'psycopg[binary]>=3.2,<4' 'certifi>=2025.1.31'
          python -u scripts/review-approved-fineli-salt.py > /tmp/fineli-review.log
          python - <<'PY'
          import json, os
          import certifi, psycopg
          from difflib import SequenceMatcher
          def tokens(s):
              import re
              return set(x for x in re.findall(r'[^\\W_]+', (s or '').casefold()) if len(x) >= 3)
          def compatible(a, b):
              x, y = tokens(a), tokens(b)
              return bool(x and y and (x & y or SequenceMatcher(None, (a or '').casefold(), (b or '').casefold()).ratio() >= 0.72))
          db = psycopg.connect(os.environ['DATABASE_URL'], sslmode='verify-full', sslrootcert=certifi.where())
          cur = db.cursor()
          with open('/tmp/fineli-review.log') as f:
              for line in f:
                  if line.startswith('FINELI_SALT_REVIEW_ITEM '):
                      item=json.loads(line.split(' ',1)[1])
                      if item.get('approved_matches') == 1:
                          cur.execute('SELECT name FROM public.ziiply_ean_products WHERE ean = %s LIMIT 1', (item['ean'],))
                          row = cur.fetchone()
                          if not row or not compatible(row[0], item.get('product_name')):
                              continue
                          print('Matching candidate EAN:', item['ean'], 'catalog:', row[0], 'OFF:', item.get('product_name'))
                          with open(os.environ['GITHUB_ENV'],'a') as out:
                              out.write('FINELI_TEST_EAN='+item['ean']+'\n')
                          break
              else:
                  raise SystemExit('No unique approved EAN found; supply one manually')
          PY
      - name: Check live preview EAN without writes
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          FINELI_PREVIEW_URL: https://ziiply-3zgbkvz85-ziipli2026s-projects.vercel.app
          MANUAL_EAN: ${{ inputs.ean }}
        run: |
          if [ -n "$MANUAL_EAN" ]; then export FINELI_TEST_EAN="$MANUAL_EAN"; fi
          node --test tests/fineli-salt-live-preview.test.mjs
