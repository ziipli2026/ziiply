name: Offer category regression
on:
  pull_request:
    paths:
      - 'src/app/components/ziiply/offerSearch/sharedProductCategory.ts'
      - 'src/app/components/ziiply/offerSearch/lidlIndependentCategory.ts'
      - 'src/app/components/ziiply/offerSearch/ziiplyOfferSearchCore.ts'
      - 'tests/shared-product-category.test.cjs'
      - 'tests/lidl-category-integration.test.cjs'
      - 'package.json'
      - '.github/workflows/offer-category-regression.yml'
  workflow_dispatch:
jobs:
  categories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:offer-categories
