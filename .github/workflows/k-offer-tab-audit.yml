name: K-chain offer tab audit
on:
  pull_request:
  push:
    paths:
      - 'src/app/components/ziiply/offerSearch/kOfferTabPolicy.ts'
      - 'src/app/components/ziiply/offerSearch/providers/kCitymarketProvider.ts'
      - 'src/app/components/ziiply/offerSearch/providers/kruokaProvider.ts'
      - '.github/workflows/k-offer-tab-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --package-lock=false --no-audit --no-fund
      - name: TypeScript compile
        run: npx tsc --noEmit
      - name: Shared Tarjoukset/Kampanjat policy matrix
        run: |
          cat > k-offer-tab-audit.mts <<'NODE'
          import { auditKOfferTabs, removeCampaignCopiesOfLeaflet } from './src/app/components/ziiply/offerSearch/kOfferTabPolicy.ts';
          import { mapTjekCategoryV54, mapTjekOffer } from './src/app/components/ziiply/offerSearch/providers/kruokaProvider.ts';
          const cases = [
            { chain:'K-Citymarket', offer:{title:'AITO NAKKI 360 g',price:3.79}, campaign:{title:'HK AITO NAKKI',price:3.79}, duplicate:true },
            { chain:'K-Citymarket', offer:{title:'ENERGIAJUOMAT 0,5 l/tlk',price:4}, campaign:{title:'Nocco ENERGIAJUOMAT 0,33 l/tlk',price:4}, duplicate:false },
            { chain:'K-Supermarket', offer:{title:'Arla SHAKE UP 240 ml',price:3}, campaign:{title:'Arla SHAKE UP 240 ml',price:3}, duplicate:true },
            { chain:'K-Supermarket', offer:{title:'Froosh SMOOTHIE 250 ml',price:4}, campaign:{title:'Froosh SMOOTHIE 250 ml',price:3.5}, duplicate:false },
            { chain:'K-Market', offer:{title:'Santa Maria TORTILLAT 320 g',price:2.49}, campaign:{title:'Santa Maria TORTILLAT 320 g',price:2.49}, duplicate:true },
            { chain:'K-Market', offer:{title:'PIZZA 300 g',price:3}, campaign:{title:'PIZZA 350 g',price:3}, duplicate:false },
          ];
          for (const c of cases) {
            const audit=auditKOfferTabs([c.offer],[c.campaign]);
            const filtered=removeCampaignCopiesOfLeaflet([c.offer],[c.campaign]);
            if ((audit.duplicateCampaignCount===1)!==c.duplicate) throw new Error(c.chain+': audit mismatch');
            if ((filtered.length===0)!==c.duplicate) throw new Error(c.chain+': filtering mismatch');
          }
          const categoryCases=[
            ['Hevi','Hevi'],['hevi','Hevi'],['HEVI','Hevi'],
            ['Valmisruoka','Valmisruoka'],['valmisruoka','Valmisruoka'],
            ['Maitotuotteet','Maitotuotteet'],['maitotuotteet','Maitotuotteet'],
          ];
          for (const [input,canonical] of categoryCases) {
            const row={title:'test',price:1,category:input};
            const normalized=row.category.trim().replace(/\\s+/g,' ');
            if (normalized.toLocaleLowerCase('fi-FI')!==canonical.toLocaleLowerCase('fi-FI')) throw new Error('category normalization mismatch');
            const audit=auditKOfferTabs([], [row]);
            if (audit.normalizedCategoryIssues.length) throw new Error('category whitespace issue');
          }
          const semanticCategoryCases=[
            [{name:'Salonen Pehmosämpylä kaura, peruna tai juusto 5 kpl/325 g',category:'Maitotuotteet'},'Leipomo'],
            [{name:'Atria rehti lihaisat kuorettomat nakit 280 g',category:'Kala'},'Liha & makkarat'],
            [{name:'Kaalikääryle, lihan alkuperämaa Suomi',category:'Maitotuotteet'},'Valmisruoka'],
            [{name:'Saarioinen ARKI ANNOSATERIAT',category:'Maitotuotteet'},'Valmisruoka'],
            [{name:'Saarioinen Arki annosateriat 310 g',category:'Maitotuotteet'},'Valmisruoka'],
            [{name:'Hätälä pohjolan lohipihvi 190 g',category:'Liha & makkarat'},'Kala'],
          ];
          for (const [row,expected] of semanticCategoryCases) {
            const actual=mapTjekCategoryV54(row);
            if (actual!==expected) throw new Error('semantic category mismatch: '+row.name+' => '+actual+' expected '+expected);
          }
          const kgMapped=mapTjekOffer({name:'Kaalikääryle, lihan alkuperämaa Suomi',price:13.9,unitPrice:13.9,baseUnit:'piece',description:'13,90/kg',validFrom:'2026-10-04T21:00:00+0000',validUntil:'2026-10-07T20:59:59+0000'},0,'3334','K-Supermarket Jokela','K-Supermarket','K-Supermarket');
          if (!kgMapped || kgMapped.unitPrice!=='13,90/kilogram' || kgMapped.unitPriceUnit!=='kilogram') throw new Error('explicit source kg unit must override piece');
          const multiMapped=mapTjekOffer({name:'Myllyn Paras MAKARONI',membershipPrice:1,price:0.55,unitPrice:0.83,baseUnit:'kilogram',pieceCountFrom:3,pieceCountTo:3,description:'400 g (0,83/kg)'},0,'3334','K-Supermarket Jokela','K-Supermarket','K-Supermarket');
          if (!multiMapped || multiMapped.priceText!=='1,00 € / 3 kpl' || multiMapped.unitPrice!=='0,83/kilogram') throw new Error('multi-buy unit regression');
          const bad=auditKOfferTabs([], [{title:'x',price:1,category:'  Hevi  '}]);
          if (bad.normalizedCategoryIssues.length!==1) throw new Error('category whitespace regression not detected');
          console.log('K_CHAIN_OFFER_TAB_AUDIT_OK');
          NODE
          npx --yes tsx k-offer-tab-audit.mts
