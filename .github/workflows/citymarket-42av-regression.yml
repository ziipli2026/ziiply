name: Citymarket 42AV regression
on:
  push:
    branches:
      - preview/mobile-citymarket-42av
  workflow_dispatch:
jobs:
  parser-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test 42AV publisher archive
        run: node --test tests/kcitymarket-42av-printed-transactions.test.mjs
