name: Complete Citymarket Tjek snapshots
on:
  workflow_dispatch:
  push:
    branches: [main, fix/citymarket-complete-snapshots]
    paths:
      - '.github/workflows/kcitymarket-tjek-snapshots.yml'
      - 'scripts/refresh-citymarket-tjek.cjs'
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: citymarket-tjek-snapshots
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - run: node --test tests/kcitymarket-complete-snapshot.test.cjs
      - run: node scripts/refresh-citymarket-tjek.cjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
