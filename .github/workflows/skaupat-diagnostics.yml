name: S-kaupat API diagnostics

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test existing store-directory resolver
        shell: bash
        run: |
          npx --yes tsx <<'TS'
          import { resolveSKaupatStoreIdFromDirectoryV1 as resolve } from "./src/app/components/ziiply/offerSearch/ziiplyStoreDirectory.ts";
          const stores = [
            "Prisma Kuopio",
            "S-market Kemi",
            "S-market Joensuu Kauppakatu",
            "S-market Vaasanpuistikko",
            "Prisma Raksila Oulu",
            "S-market Talvitie Rovaniemi",
            "Prisma Lappeenranta",
            "S-market Pansio",
            "S-market Lukkarinsanta",
            "S-market Kemiö"
          ];
          for (const store of stores) {
            try {
              const id = await resolve(store);
              console.log("DIRECTORY_RESOLVER_RESULT " + JSON.stringify({ store, id }));
            } catch (error) {
              console.log("DIRECTORY_RESOLVER_RESULT " + JSON.stringify({ store, id: null, error: String(error) }));
            }
          }
          TS

      - name: Probe S-kaupat store search HTML query
        shell: bash
        run: |
          node <<'NODE'
          const tests = [
            ["Prisma Kuopio", "https://www.s-kaupat.fi/myymalat?query=" + encodeURIComponent("Prisma Kuopio")],
            ["S-market Kemi", "https://www.s-kaupat.fi/myymalat?query=" + encodeURIComponent("S-market Kemi")],
            ["S-market Kemi chain", "https://www.s-kaupat.fi/myymalat/s-market?query=" + encodeURIComponent("S-market Kemi")]
          ];
          async function main() {
            for (const [name, url] of tests) {
              try {
                const r = await fetch(url, {headers: {accept: "text/html,application/xhtml+xml", "accept-language": "fi", "user-agent": "Mozilla/5.0"}});
                const body = await r.text();
                const marker = "/myymala/";
                const hits = [];
                let pos = 0;
                while ((pos = body.indexOf(marker, pos)) !== -1 && hits.length < 10) {
                  const piece = body.slice(pos, pos + 180);
                  hits.push(piece.replace(/\s+/g, " ").slice(0, 180));
                  pos += marker.length;
                }
                console.log("STORE_SEARCH_QUERY_RESULT " + JSON.stringify({name, status: r.status, length: body.length, hitCount: hits.length, hits}));
              } catch (e) {
                console.log("STORE_SEARCH_QUERY_RESULT " + JSON.stringify({name, error: String(e)}));
              }
            }
          }
          main().catch(e => { console.error(e); process.exitCode = 1; });
          NODE

      - name: Discover S-kaupat store API from current web bundles
        shell: bash
        run: |
          node <<'NODE'
          async function main() {
            const urls = [
              "https://www.s-kaupat.fi/myymalat?query=" + encodeURIComponent("Prisma Kuopio"),
              "https://www.s-kaupat.fi/myymalat/s-market?query=" + encodeURIComponent("S-market Kemi")
            ];
            for (const pageUrl of urls) {
              const r = await fetch(pageUrl, {headers: {"user-agent":"Mozilla/5.0","accept":"text/html"}});
              const html = await r.text();
              const srcs = [];
              let p = 0;
              while ((p = html.indexOf('src="', p)) !== -1) {
                const s = p + 5, e = html.indexOf('"', s); if (e < 0) break;
                const v = html.slice(s,e); if (v.includes(".js")) srcs.push(new URL(v,pageUrl).href); p=e+1;
              }
              console.log("BUNDLE_DISCOVERY_PAGE "+JSON.stringify({pageUrl,status:r.status,htmlLength:html.length,jsCount:[...new Set(srcs)].length}));
              let n=0;
              for (const src of [...new Set(srcs)].slice(0,80)) {
                try {
                  const jr=await fetch(src,{headers:{"user-agent":"Mozilla/5.0"}});
                  const js=await jr.text();
                  const terms=["remotePickupSlots","myymalat","pickupSlotsForCoordinates","storeSearch","storesFor","searchStores"];
                  const found=terms.filter(t=>js.includes(t));
                  if(found.length){
                    const snippets=[];
                    for(const term of found){const i=js.indexOf(term);snippets.push(js.slice(Math.max(0,i-350),i+650));}
                    console.log("BUNDLE_API_HIT "+JSON.stringify({src,status:jr.status,length:js.length,found,snippets}));
                    if(++n>=12) break;
                  }
                } catch(e) {}
              }
            }
          }
          main().catch(e=>{console.error(e);process.exitCode=1});
          NODE

      - name: Probe pickup radius as public store-id resolver
        shell: bash
        run: |
          node <<'NODE'
          const endpoint="https://api.s-kaupat.fi/";
          const hash="6da249b0fd87c05275a239ed490976c851d7aff90ead0f3a3978e8283f21252d";
          const client="production-14a82a5b48cd1dd42c0592db0037514ed3c84de8";
          const today=new Date().toISOString().slice(0,10);
          const tests=[
            ["Kuopio",62.8924,27.6770,"590778791"],
            ["Kemi",65.7364,24.5637,"522770049"],
            ["Oulu",65.0121,25.4651,"516528759"],
            ["Lappeenranta",61.0587,28.1887,"613758325"],
            ["Turku",60.4518,22.2666,"603212705"],
            ["Pori",61.4851,21.7974,"649122793"]
          ];
          async function call(label,lat,lon,limit){
            const variables={startDate:today,endDate:today,location:{latitude:lat,longitude:lon},limit};
            const u=new URL(endpoint);u.searchParams.set("operationName","remotePickupSlots");u.searchParams.set("variables",JSON.stringify(variables));u.searchParams.set("extensions",JSON.stringify({persistedQuery:{version:1,sha256Hash:hash}}));
            const r=await fetch(u,{headers:{accept:"application/json","accept-language":"fi",origin:"https://www.s-kaupat.fi",referer:"https://www.s-kaupat.fi/","x-client-name":"skaupat-web","x-client-version":client}});
            const j=await r.json(); const rows=j?.data?.pickupSlotsForCoordinates?.slotsInPickupPoints??[];
            return {status:r.status,errors:j?.errors??null,rows:rows.map(x=>({id:x?.store?.id,brand:x?.store?.brand,name:x?.pickupPoint?.name,city:x?.pickupPoint?.address?.city,distance:x?.distance}))};
          }
          (async()=>{for(const [city,lat,lon,wanted] of tests){for(const limit of [20,50,100]){const z=await call(city,lat,lon,limit);console.log("PICKUP_RADIUS_RESULT "+JSON.stringify({city,limit,wanted,status:z.status,count:z.rows.length,found:z.rows.some(x=>String(x.id)===wanted),match:z.rows.find(x=>String(x.id)===wanted)||null,last:z.rows.at(-1)||null}));}}})().catch(e=>{console.error(e);process.exitCode=1});
          NODE

      - name: Probe pageContent with pickup aliases versus public ids
        shell: bash
        run: |
          node <<'NODE'
          const endpoint="https://api.s-kaupat.fi/";
          const hash="f6d87786fda8fb5c233c4eaed08f37b0c5b87dc0d8d4c44c33c5529e446369d1";
          const client="production-14a82a5b48cd1dd42c0592db0037514ed3c84de8";
          const today=new Date().toISOString().slice(0,10);
          const ids=[
            ["Prisma Varkaus public","726015093"],
            ["S-market Kommila","708276035"],
            ["Prisma Raksila public","516528759"],
            ["S-market Pansio public","603212705"],
            ["S-market Lukkarinsanta public","649122793"]
          ];
          async function probe(label,id){
            const variables={preview:false,storeId:id,skipProducts:false,availabilityDate:today,where:{storeId:id,path:"tuotteet/kampanjat",platform:"WEB",availabilityDate:today,userConsent:{marketing:false,marketingId:"ziiply-diagnostic",useCustomerId:false,sessionId:"ziiply-diagnostic",loop54:true}}};
            const u=new URL(endpoint);u.searchParams.set("operationName","RemoteGetPageContent");u.searchParams.set("variables",JSON.stringify(variables));u.searchParams.set("extensions",JSON.stringify({persistedQuery:{version:1,sha256Hash:hash}}));
            const r=await fetch(u,{headers:{accept:"application/json","accept-language":"fi",origin:"https://www.s-kaupat.fi",referer:"https://www.s-kaupat.fi/","x-client-name":"skaupat-web","x-client-version":client}});
            const j=await r.json(); const secs=j?.data?.pageContent?.sections??[]; const ps=secs.flatMap(x=>Array.isArray(x?.products)?x.products:[]);
            const stores=[...new Map(ps.map(p=>[String(p?.store?.id||""),{id:p?.store?.id,name:p?.store?.name,brand:p?.store?.brand}])).values()].filter(x=>x.id);
            console.log("PAGECONTENT_IDENTITY_RESULT "+JSON.stringify({label,id,status:r.status,errors:j?.errors??null,sections:secs.length,products:ps.length,stores}));
          }
          (async()=>{for(const x of ids) await probe(...x)})().catch(e=>{console.error(e);process.exitCode=1});
          NODE

      - name: Probe S-kanava feedback directory as store-id source
        shell: bash
        run: |
          node <<'NODE'
          const urls=[
            "https://asiakaspalaute.s-kanava.fi/palaute/ketjut/smarket/aitiopaikka",
            "https://asiakaspalaute.s-kanava.fi/palaute/toimipaikat/603212705",
            "https://asiakaspalaute.s-kanava.fi/palaute/toimipaikat/649122793"
          ];
          (async()=>{for(const url of urls){const r=await fetch(url,{headers:{"user-agent":"Mozilla/5.0","accept-language":"fi-FI,fi;q=0.9"}});const body=await r.text();console.log("SKANAVA_DIRECTORY_RESULT "+JSON.stringify({url,status:r.status,length:body.length,hasPansio:body.toLowerCase().includes("pansio"),hasPansioId:body.includes("603212705"),hasLukkarinsanta:body.toLowerCase().includes("lukkarinsanta"),hasLukkarinsantaId:body.includes("649122793"),idSamples:[...body.matchAll(/\b\d{9}\b/g)].slice(0,20).map(x=>x[0])}));}})().catch(e=>{console.error(e);process.exitCode=1});
          NODE

      - name: Parse S-kanava S-market directory links and hidden identifiers
        shell: bash
        run: |
          node <<'NODE'
          const url="https://asiakaspalaute.s-kanava.fi/palaute/ketjut/smarket/aitiopaikka";
          (async()=>{const r=await fetch(url,{headers:{"user-agent":"Mozilla/5.0","accept-language":"fi-FI,fi;q=0.9"}});const b=await r.text();
          for(const name of ["Pansio","Lukkarinsanta","Kemi","Kauppakatu","Vaasanpuistikko"]){const i=b.toLowerCase().indexOf(name.toLowerCase());console.log("SKANAVA_NAME_CONTEXT "+JSON.stringify({name,index:i,context:i>=0?b.slice(Math.max(0,i-700),i+900):null}));}
          const hrefs=[...b.matchAll(/href=["']([^"']+)["']/gi)].map(x=>x[1]); console.log("SKANAVA_LINK_SUMMARY "+JSON.stringify({status:r.status,hrefCount:hrefs.length,storeLinks:hrefs.filter(x=>/toimipa|aitiopa|smarket/i.test(x)).slice(0,80)}));
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE

      - name: Follow S-kanava store links to detail state
        shell: bash
        run: |
          node <<'NODE'
          const base="https://asiakaspalaute.s-kanava.fi/palaute/ketjut/smarket/aitiopaikka";
          (async()=>{
            const r=await fetch(base,{headers:{"user-agent":"Mozilla/5.0","accept-language":"fi-FI,fi;q=0.9"},redirect:"manual"});
            const b=await r.text();
            const cookie=(r.headers.get("set-cookie")||"").split(";")[0];
            for(const name of ["S-market Pansio","S-market Lukkarinsanta","S-market Kemi"]){
              const marker='<span class="nimi">'+name+'</span>';
              const i=b.indexOf(marker);
              const pre=i>=0?b.slice(Math.max(0,i-600),i):"";
              const hrefs=[...pre.matchAll(/href="([^"]+)"/g)];
              const m=hrefs.at(-1);
              if(!m){console.log("SKANAVA_DETAIL_RESULT "+JSON.stringify({name,error:"no href"}));continue;}
              const u=new URL(m[1].replace(/&amp;/g,"&"),base);
              const rr=await fetch(u,{headers:{"user-agent":"Mozilla/5.0","accept-language":"fi-FI,fi;q=0.9",cookie},redirect:"manual"});
              const loc=rr.headers.get("location");
              const finalUrl=loc?new URL(loc,u):u;
              const fr=await fetch(finalUrl,{headers:{"user-agent":"Mozilla/5.0","accept-language":"fi-FI,fi;q=0.9",cookie},redirect:"manual"});
              const body=await fr.text();
              const k=body.indexOf(name);
              console.log("SKANAVA_DETAIL_RESULT "+JSON.stringify({name,clickStatus:rr.status,location:loc,detailStatus:fr.status,detailLength:body.length,hasName:k>=0,ids:[...body.matchAll(/\\b\\d{6,12}\\b/g)].slice(0,50).map(x=>x[0]),context:k>=0?body.slice(Math.max(0,k-800),k+1400):body.slice(0,800)}));
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE


      - name: Probe S-kanava direct ID behavior and discover identifiers
        shell: bash
        run: |
          node <<'NODE'
          const base="https://asiakaspalaute.s-kanava.fi/palaute/toimipaikat/";
          const tests=["603212705","649122793","522770049","603212704","111111111","abcdefghi","pobmvvmwhy95ui"];
          (async()=>{
            for(const id of tests){
              const r=await fetch(base+id,{headers:{"user-agent":"Mozilla/5.0","accept-language":"fi-FI,fi;q=0.9"},redirect:"manual"});
              const b=await r.text();
              const m=b.match(/<h3><span>([^<]+)<\/span><\/h3>/i);
              console.log("SKANAVA_DIRECT_ID_RESULT "+JSON.stringify({id,status:r.status,location:r.headers.get("location"),length:b.length,name:m?m[1]:null,hasError:/virhe|error|ei löytynyt/i.test(b)}));
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE

      - name: Probe S-kanava candidate ID neighborhood
        shell: bash
        run: |
          node <<'NODE'
          const seeds=[603212705,649122793,522770049];
          (async()=>{
            for(const seed of seeds){
              const out=[];
              for(let d=-3;d<=3;d++){
                const id=String(seed+d);
                const r=await fetch("https://asiakaspalaute.s-kanava.fi/palaute/toimipaikat/"+id,{headers:{"user-agent":"Mozilla/5.0","accept-language":"fi-FI,fi;q=0.9"}});
                const b=await r.text(); const m=b.match(/<h3><span>([^<]+)<\/span><\/h3>/i);
                out.push({id,name:m?m[1]:null,length:b.length});
              }
              console.log("SKANAVA_ID_NEIGHBORHOOD "+JSON.stringify({seed,out}));
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE

      - name: Probe S-kaupat GraphQL
        shell: bash
        run: |
          node <<'NODE'
          const endpoint = "https://api.s-kaupat.fi/";
          const hashes = {
            filtered: "44ca017dddccfe49e787b483f471f26217adca807f8c71101d11e881dab9e480",
            page: "f6d87786fda8fb5c233c4eaed08f37b0c5b87dc0d8d4c44c33c5529e446369d1"
          };
          const clients = {
            oldPickup: "production-14a82a5b48cd1dd42c0592db0037514ed3c84de8",
            oldFiltered: "production-45c31f7a746096c6da12e16aba1887e031fbd9de"
          };
          const today = new Date().toISOString().slice(0,10);
          async function probe(name, operationName, variables, hash, clientVersion) {
            const u = new URL(endpoint);
            u.searchParams.set("operationName", operationName);
            u.searchParams.set("variables", JSON.stringify(variables));
            u.searchParams.set("extensions", JSON.stringify({persistedQuery:{version:1,sha256Hash:hash}}));
            const headers={accept:"application/json","accept-language":"fi",origin:"https://www.s-kaupat.fi",referer:"https://www.s-kaupat.fi/","x-client-name":"skaupat-web"};
            if(clientVersion) headers["x-client-version"]=clientVersion;
            try {
              const r=await fetch(u,{headers});
              const text=await r.text();
              let j; try{j=JSON.parse(text)}catch{j={raw:text.slice(0,500)}}
              const root=j?.data?.store?.products;
              const list=root?.productListItems ?? root?.products ?? root?.items;
              const page=j?.data?.pageContent ?? j?.data?.remoteGetPageContent ?? j?.data?.store?.pageContent;
              const sections=page?.sections;
              let sectionProducts=0;
              if(Array.isArray(sections)) for(const s of sections) if(Array.isArray(s?.products)) sectionProducts+=s.products.length;
              const sectionShapes=Array.isArray(sections)?sections.map((s,i)=>({i,keys:s&&typeof s==="object"?Object.keys(s):[],title:s?.title??null,productCount:Array.isArray(s?.products)?s.products.length:null,firstProduct:Array.isArray(s?.products)&&s.products[0]?{keys:Object.keys(s.products[0]),name:s.products[0]?.name??null,ean:s.products[0]?.ean??null,id:s.products[0]?.id??null,pricing:s.products[0]?.pricing??null}:null})).filter(x=>x.productCount>0).slice(0,6):[];
              console.log("\n===",name,"===");
              console.log(JSON.stringify({status:r.status,errors:j?.errors?.map(e=>({message:e.message,extensions:e.extensions}))??null,topKeys:j&&typeof j==="object"?Object.keys(j):[],dataKeys:j?.data&&typeof j.data==="object"?Object.keys(j.data):[],storeKeys:j?.data?.store&&typeof j.data.store==="object"?Object.keys(j.data.store):[],productRootKeys:root&&typeof root==="object"?Object.keys(root):[],total:root?.total,from:root?.from,limit:root?.limit,productCount:Array.isArray(list)?list.length:null,pageKeys:page&&typeof page==="object"?Object.keys(page):[],sectionCount:Array.isArray(sections)?sections.length:null,sectionProducts,sectionShapes},null,2));
            } catch(e){console.log("\n===",name,"===\nERROR",String(e))}
          }
          const prisma="634976534", smarket="708276035";
          async function resolverProbe(storeName){
            const norm=v=>String(v??"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9åäö]+/gi," ").replace(/\s+/g," ").trim();
            const place=norm(storeName).replace(/^s\s*market\s+/,"").replace(/^smarket\s+/,"").trim();
            let coords=null;
            for(const query of [storeName+", Finland",place+", Finland"]){
              const u=new URL("https://nominatim.openstreetmap.org/search"); u.searchParams.set("format","jsonv2");u.searchParams.set("countrycodes","fi");u.searchParams.set("q",query);u.searchParams.set("limit","1");
              const rr=await fetch(u,{headers:{"user-agent":"Ziiply-diagnostic/1.0","accept-language":"fi"}}); const a=await rr.json(); if(a?.[0]){coords={latitude:Number(a[0].lat),longitude:Number(a[0].lon),query};break}
            }
            if(!coords){console.log("\n=== resolver",storeName,"===\nNO GEOCODE");return}
            const variables={startDate:today,endDate:today,location:{latitude:coords.latitude,longitude:coords.longitude},limit:20};
            const u=new URL(endpoint);u.searchParams.set("operationName","remotePickupSlots");u.searchParams.set("variables",JSON.stringify(variables));u.searchParams.set("extensions",JSON.stringify({persistedQuery:{version:1,sha256Hash:"6da249b0fd87c05275a239ed490976c851d7aff90ead0f3a3978e8283f21252d"}}));
            const rr=await fetch(u,{headers:{accept:"application/json","accept-language":"fi",origin:"https://www.s-kaupat.fi",referer:"https://www.s-kaupat.fi/","x-client-name":"skaupat-web","x-client-version":clients.oldPickup}});
            const j=await rr.json(); const rows=j?.data?.pickupSlotsForCoordinates?.slotsInPickupPoints??[];
            const candidates=rows.map(row=>({id:row?.store?.id,brand:row?.store?.brand,name:row?.pickupPoint?.name,city:row?.pickupPoint?.address?.city,distance:row?.distance})).slice(0,20);
            console.log("\n=== resolver",storeName,"===\n"+JSON.stringify({coords,http:rr.status,errors:j?.errors??null,count:candidates.length,candidates},null,2));
          }
          const base={generatedSessionId:"ziiply-diagnostic",limit:48,queryString:"maito",storeId:prisma,useRandomId:false,marketingId:"ziiply-diagnostic"};
          await resolverProbe("S-market Kommila Varkaus");
          await resolverProbe("S-market Hyvinkää");
          await probe("filtered-simple-no-client","RemoteFilteredProducts",base,hashes.filtered,null);
          await probe("filtered-simple-old-client","RemoteFilteredProducts",base,hashes.filtered,clients.oldFiltered);
          const discounted={availabilityDate:today,facets:[{key:"brandName",order:"asc"},{key:"category"},{key:"labels"}],filters:[{key:"labels",value:["DISCOUNTED"]}],generatedSessionId:"ziiply-diagnostic",fetchSponsoredContent:true,limit:48,queryString:"",sortForAvailabilityLabelDate:today,storeId:prisma,useRandomId:false,marketingId:"ziiply-diagnostic",from:0,offset:0,skip:0,page:1};
          await probe("filtered-discounted-old-client","RemoteFilteredProducts",discounted,hashes.filtered,clients.oldFiltered);
          await probe("filtered-discounted-no-client","RemoteFilteredProducts",discounted,hashes.filtered,null);
          await probe("random-prisma-kuopio-pagecontent","RemoteGetPageContent",{preview:false,storeId:"590778791",skipProducts:false,availabilityDate:today,where:{storeId:"590778791",path:"tuotteet/kampanjat",platform:"WEB",availabilityDate:today,userConsent:{marketing:false,marketingId:"ziiply-diagnostic",useCustomerId:false,sessionId:"ziiply-diagnostic",loop54:true}}},hashes.page,clients.oldPickup);
          await probe("random-smarket-kemi-pagecontent","RemoteGetPageContent",{preview:false,storeId:"522770049",skipProducts:false,availabilityDate:today,where:{storeId:"522770049",path:"tuotteet/kampanjat",platform:"WEB",availabilityDate:today,userConsent:{marketing:false,marketingId:"ziiply-diagnostic",useCustomerId:false,sessionId:"ziiply-diagnostic",loop54:true}}},hashes.page,clients.oldPickup);
          await probe("random-smarket-joensuu-kauppakatu-pagecontent","RemoteGetPageContent",{preview:false,storeId:"666706692",skipProducts:false,availabilityDate:today,where:{storeId:"666706692",path:"tuotteet/kampanjat",platform:"WEB",availabilityDate:today,userConsent:{marketing:false,marketingId:"ziiply-diagnostic",useCustomerId:false,sessionId:"ziiply-diagnostic",loop54:true}}},hashes.page,clients.oldPickup);
          await probe("random-smarket-vaasanpuistikko-pagecontent","RemoteGetPageContent",{preview:false,storeId:"726261697",skipProducts:false,availabilityDate:today,where:{storeId:"726261697",path:"tuotteet/kampanjat",platform:"WEB",availabilityDate:today,userConsent:{marketing:false,marketingId:"ziiply-diagnostic",useCustomerId:false,sessionId:"ziiply-diagnostic",loop54:true}}},hashes.page,clients.oldPickup);
