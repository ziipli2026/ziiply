name: S-kaupat API diagnostics
on: { workflow_dispatch: {} }
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Final 464-store mapping audit
        run: |
          node <<'NODE'
          const overrides={"e_FuHxQz":"726783952","bvL3I2nH":"726666563","T5ukTphK":"726675436","9_tWc4ba":"726661262","GB3kPt9w":"726771429","m2lA854x":"726728751","EX3lLp-I":"726722520","-Z8p5bMX":"726638148"};
          const five={"S-market Redi":"726342401","S-market Eskolanmäki":"725612617","S-market Isokyrö":"502960966","S-Market Repokallio":"726435480","S-Market Rajakylä":"726425628"};
          const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
          function csv(line){let a=[],s="",q=false;for(let i=0;i<line.length;i++){let ch=line[i];if(ch=='"'){if(q&&line[i+1]=='"'){s+='"';i++}else q=!q}else if(ch==','&&!q){a.push(s);s=""}else s+=ch}a.push(s);return a}
          (async()=>{
            const ref=["stores",{businessId:"d8ccs8",pagination:{offset:0,limit:3000}}];
            function stable(v){if(Array.isArray(v))return v.map(stable);if(v&&typeof v==="object")return Object.fromEntries(Object.keys(v).sort().map(k=>[k,stable(v[k])]));return v}
            const token=Buffer.from(JSON.stringify(stable(ref)),"utf8").toString("base64");
            const tr=await fetch("https://etarjouslehdet.fi/",{method:"POST",headers:{"content-type":"application/json","x-api-key":"152000596c6e45d9983eab0c14afebea","user-agent":"Mozilla/5.0"},body:JSON.stringify({data:[token]})});
            const tj=await tr.json();
            function findStores(x){const seen=new Set(),out=[];function walk(v){if(!v||typeof v!=="object")return;if(Array.isArray(v)){for(const z of v)walk(z);return}if(typeof v.name==="string"&&(v.id||v.publicId)&&(v.address||v.streetAddress||v.city||v.coordinates||v.location)){const id=String(v.id||v.publicId);if(!seen.has(id)){seen.add(id);out.push(v)}}for(const z of Object.values(v))walk(z)}walk(x);return out.filter(v=>/^S-market\\b/i.test(v.name||""))}
            const stores=Array.isArray(tj?.value?.data)?tj.value.data.filter(v=>/^S-market\\b/i.test(v.name||"")):findStores(tj);
            const dr=await fetch("https://raw.githubusercontent.com/samuel-d-aya/geolytics_projects/1bf552f4924ce992ad15cb36bfc4e28ca75904bf/Finland/smarket_fi_scraper_/smarket_fi_scraper/output.csv");
            const rows=(await dr.text()).split(/\r?\n/).filter(Boolean).map(csv).map(x=>({address:x[0],name:x[7],pc:x[10],id:x[11]})).filter(x=>/^\d{9}$/.test(x.id||""));
            const out=[];
            for(const s of stores){
              const tid=String(s.id||s.publicId||""), name=String(s.name||"");
              const addr=String(s.address||s.street||s.streetAddress||s.location?.address||"");
              const pc=String(s.postalCode||s.zipCode||s.location?.postalCode||"");
              let id=overrides[tid]||five[name]||null, source=overrides[tid]?"override":(five[name]?"five":null);
              if(!id){
                const hits=rows.filter(r=>{
                  const rn=norm(r.name),sn=norm(name),ra=norm(r.address),sa=norm(addr);
                  return (rn===sn && (!pc||String(r.pc)===pc)) || (rn===sn && sa && ra.includes(sa));
                });
                const ids=[...new Set(hits.map(h=>h.id))];
                if(ids.length===1){id=ids[0];source="dataset"}
              }
              out.push({tid,name,addr,pc,id,source});
            }
            const unresolved=out.filter(x=>!x.id), by={};
            out.filter(x=>x.id).forEach(x=>(by[x.id]??=[]).push(x));
            const duplicates=Object.entries(by).filter(([,v])=>v.length>1).map(([id,v])=>({id,names:v.map(x=>x.name)}));
            const oldRautalampi=out.filter(x=>x.id==="512023912");
            const summary={tjekStatus:tr.status,datasetStatus:dr.status,tjekTotal:stores.length,finalMapped:out.length-unresolved.length,datasetMapped:out.filter(x=>x.source==="dataset").length,overrideMapped:out.filter(x=>x.source==="override").length,fiveMapped:out.filter(x=>x.source==="five").length,unresolvedCount:unresolved.length,duplicateIdCount:duplicates.length,oldRautalampiUseCount:oldRautalampi.length,unresolved,duplicates,oldRautalampi};
            summary.pass=summary.tjekTotal===464&&summary.finalMapped===464&&summary.unresolvedCount===0&&summary.duplicateIdCount===0&&summary.oldRautalampiUseCount===0;
            console.log("FINAL_464_MAPPING_AUDIT "+JSON.stringify(summary,null,2));
            if(!summary.pass) process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
