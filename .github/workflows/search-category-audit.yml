name: Search category audit
on:
  push:
    branches:
      - test/search-category-audit-20261011
  workflow_dispatch:
jobs:
  category-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Test real search intent and local learning logic
        run: node scripts/test-search-behavior.cjs
      - name: Report ambiguous category substrings
        run: node scripts/audit-search-collisions.cjs
      - name: Check registry and baseline queries
        run: node scripts/audit-search-categories.cjs
      - name: Upload search audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-audit-reports
          path: search-audit-results
          if-no-files-found: ignore
