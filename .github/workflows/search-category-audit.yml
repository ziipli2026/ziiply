name: Search category audit
on:
  push:
    branches:
      - test/search-category-audit-20261011
  workflow_dispatch:
jobs:
  category-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/search-test-runtime/package-lock.json
      # The audit executes pure search code; it only needs the pinned TS compiler.
      # Keep this independent of the application dependency migration.
      - name: Install isolated search test runtime
        run: npm ci --prefix scripts/search-test-runtime --ignore-scripts --no-audit --no-fund
      - name: Test real search intent and local learning logic
        run: |
          mkdir -p search-audit-results
          set -o pipefail
          NODE_PATH="$PWD/scripts/search-test-runtime/node_modules" npm run test:search --silent | tee search-audit-results/behavior.json
      - name: Test offline product category classification fixtures
        run: |
          mkdir -p search-audit-results
          set -o pipefail
          node scripts/test-category-audit-fixtures.cjs | tee search-audit-results/category-fixtures.json
      - name: Validate Neon category findings snapshot offline
        run: |
          set -o pipefail
          node scripts/audit-category-findings.cjs scripts/fixtures/category-findings-test-20261011.csv | tee search-audit-results/category-findings.json
      - name: Report ambiguous category substrings
        if: success() || failure()
        run: |
          mkdir -p search-audit-results
          set -o pipefail
          node scripts/audit-search-collisions.cjs | tee search-audit-results/collisions.json
      - name: Check registry and baseline queries
        if: success() || failure()
        run: |
          mkdir -p search-audit-results
          set -o pipefail
          node scripts/audit-search-categories.cjs | tee search-audit-results/categories.json
      - name: Report dependency lockfile drift without modifying it
        run: node scripts/audit-dependency-lock.cjs | tee search-audit-results/dependency-lock.json
      - name: Full application TypeScript typecheck
        run: |
          npm install --package-lock=false --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/tsc --noEmit --incremental false
      - name: Compile search provider route syntax
        run: |
          set -o pipefail
          NODE_PATH="$PWD/scripts/search-test-runtime/node_modules" node scripts/check-search-route-syntax.cjs | tee search-audit-results/route-syntax.json
      - name: Test bounded provider pagination and failure recovery
        run: |
          set -o pipefail
          NODE_PATH="$PWD/scripts/search-test-runtime/node_modules" node scripts/test-search-pagination.cjs | tee search-audit-results/pagination.json
      - name: Check pagination request-count performance
        run: |
          set -o pipefail
          NODE_PATH="$PWD/scripts/search-test-runtime/node_modules" node scripts/test-search-pagination-performance.cjs | tee search-audit-results/pagination-performance.json
      - name: Audit provider coverage and pagination risks
        if: success() || failure()
        run: node scripts/audit-search-provider-coverage.cjs | tee search-audit-results/provider-coverage.json
      - name: Validate search audit report JSON
        if: success() || failure()
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const names = ['category-findings', 'category-fixtures', 'behavior', 'collisions', 'categories', 'provider-coverage', 'pagination', 'pagination-performance', 'route-syntax', 'dependency-lock'];
          let failed = false;
          for (const name of names) {
            const file = 'search-audit-results/' + name + '.json';
            try {
              const report = JSON.parse(fs.readFileSync(file, 'utf8'));
              if (!report || typeof report !== 'object') throw new Error('Invalid report');
              if (name === 'category-findings' && (report.rows !== 65 || report.status !== 'PASS' || !Array.isArray(report.failures) || report.failures.length !== 0 || report.counts?.source_misclassification !== 17 || report.counts?.more_specific_subcategory !== 37 || report.counts?.ambiguous_search_term !== 11)) throw new Error('Neon snapshot category findings regression failed');
              if (name === 'category-fixtures' && (report.total < 10 || report.passed !== report.total || !Array.isArray(report.results))) throw new Error('Category fixture regression failed');
              if (name === 'behavior' && (
                !Array.isArray(report.failures) ||
                !Array.isArray(report.rankingResults) ||
                !Array.isArray(report.retailRankingResults) ||
                !Array.isArray(report.exclusionResults) ||
                !Array.isArray(report.collisionResults) ||
                !Array.isArray(report.unreviewedCollisions) ||
                !Array.isArray(report.expandedLearningResults)
              )) throw new Error('Missing behavior test fields');
              if (name === 'dependency-lock' && (!Array.isArray(report.issues) || report.issueCount !== report.issues.length || report.mutations !== 0))
                throw new Error('Invalid dependency drift diagnostics');
              if (name === 'route-syntax' && (!Array.isArray(report.results) || report.results.length !== 3 || report.results.some(row => !row.pass)))
                throw new Error('Search route syntax compilation failed');
              if (name === 'pagination-performance' && (!Array.isArray(report.results) || report.results.length !== 4 ||
                report.networkRequestsMeasured !== false ||
                report.results.some((row, i) => row.extraRequests !== [0, 0, 2, 2][i])))
                throw new Error('Missing pagination performance scenarios');
              if (name === 'pagination' && (report.passed !== report.total || report.total < 8))
                throw new Error('Pagination regression failed');
              if (name === 'provider-coverage' && (!Array.isArray(report.report) || report.report.length !== 4))
                throw new Error('Missing provider coverage diagnostics');
              if (name === 'categories' && !Array.isArray(report.issues))
                throw new Error('Missing category issues');
              if (name === 'collisions' && !Array.isArray(report.collisions))
                throw new Error('Missing collision diagnostics');
              console.log(name + ': valid JSON');
            } catch (error) {
              failed = true;
              console.error(name + ': ' + String(error));
            }
          }
          if (failed) process.exitCode = 1;
          NODE
      - name: Summarize search audit results
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const file = 'search-audit-results/behavior.json';
          const summary = process.env.GITHUB_STEP_SUMMARY;
          if (!fs.existsSync(file)) {
            fs.appendFileSync(summary, '## Ziiply search audit\n\nBehavior report missing: test did not finish.\n');
            process.exit(0);
          }
          try {
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            const ranking = data.rankingResults || [];
            const exclusion = data.exclusionResults || [];
            const retail = data.retailRankingResults || [];
            const pagination = JSON.parse(fs.readFileSync('search-audit-results/pagination.json', 'utf8'));
            const paginationPerformance = JSON.parse(fs.readFileSync('search-audit-results/pagination-performance.json', 'utf8'));
            const dependencyLock = JSON.parse(fs.readFileSync('search-audit-results/dependency-lock.json', 'utf8'));
            const routeSyntax = JSON.parse(fs.readFileSync('search-audit-results/route-syntax.json', 'utf8'));
            const routeSyntaxPass = routeSyntax.results?.length === 3 && routeSyntax.results.every(row => row.pass);
            const requestCountsPass = paginationPerformance.results?.length === 4 &&
              paginationPerformance.networkRequestsMeasured === false &&
              paginationPerformance.results.every((row, i) => row.extraRequests === [0, 0, 2, 2][i]);
            const categories = JSON.parse(fs.readFileSync('search-audit-results/categories.json', 'utf8'));
            const findings = JSON.parse(fs.readFileSync('search-audit-results/category-findings.json', 'utf8'));
            const categoryFixtures = JSON.parse(fs.readFileSync('search-audit-results/category-fixtures.json', 'utf8'));
            const findingsPass = findings.status === 'PASS' && findings.rows === 65 && findings.failures?.length === 0 && findings.counts?.source_misclassification === 17 && findings.counts?.more_specific_subcategory === 37 && findings.counts?.ambiguous_search_term === 11;
            const categoryFixturesPass = categoryFixtures.total >= 10 && categoryFixtures.passed === categoryFixtures.total;
            const collisions = JSON.parse(fs.readFileSync('search-audit-results/collisions.json', 'utf8'));
            const registryPass = Array.isArray(categories.issues) && categories.issues.length === 0;
            const collisionTests = data.collisionResults || [];
            const diagnosticsPass = Array.isArray(collisions.collisions) &&
              collisions.collisions.length === collisions.collisionCount &&
              Array.isArray(data.unreviewedCollisions) && data.unreviewedCollisions.length === 0 &&
              collisionTests.length > 0 && collisionTests.every(x => x.pass);
            const expandedLearning = data.expandedLearningResults || [];
            const ok = findingsPass && categoryFixturesPass && data.integratedLearning?.pass === true && expandedLearning.length > 0 && expandedLearning.every(x => x.pass) && registryPass && diagnosticsPass && data.passed === data.total &&
              ranking.length > 0 && ranking.every(x => x.pass) &&
              retail.length >= 12 && retail.every(x => x.pass) &&
              pagination.total >= 10 && pagination.passed === pagination.total && requestCountsPass && routeSyntaxPass &&
              exclusion.length > 0 && exclusion.every(x => x.pass) &&
              data.learning?.pass === true && data.guardedLearning?.pass === true && data.boundedLearning?.pass === true;
            fs.appendFileSync(summary, [
              '## Ziiply search audit',
              '',
              '| Check | Result |',
              '|---|---|',
              '| Intent recognition | ' + data.passed + '/' + data.total + ' |',
              '| Product ranking | ' + ranking.filter(x=>x.pass).length + '/' + ranking.length + ' |',
              '| Retail-style ranking fixtures | ' + retail.filter(x=>x.pass).length + '/' + retail.length + ' |',
              '| Provider pagination | ' + pagination.passed + '/' + pagination.total + ' |',
              '| Search route syntax (not full typecheck) | ' + (routeSyntaxPass ? 'PASS' : 'FAIL') + ' |',
              '| Dependency lockfile drift (reported, not gated) | ' + dependencyLock.issueCount + ' entries |',
              '| Extra-request budget (simulated) | ' + (requestCountsPass ? 'PASS' : 'FAIL') + ' |',
              '| Hard exclusions | ' + exclusion.filter(x=>x.pass).length + '/' + exclusion.length + ' |',
              '| Registry audit | ' + (registryPass ? 'PASS' : 'FAIL (' + categories.issues.length + ' issues)') + ' |',
              '| Neon category findings snapshot | ' + (findingsPass ? 'PASS (65/65)' : 'FAIL') + ' |',
              '| Category classification fixtures | ' + (categoryFixturesPass ? 'PASS (' + categoryFixtures.passed + '/' + categoryFixtures.total + ')' : 'FAIL') + ' |',
              '| Reviewed substring collisions | ' + collisions.collisionCount + ' |',
              '| Collision behavior tests | ' + collisionTests.filter(x=>x.pass).length + '/' + collisionTests.length + ' |',
              '| Unreviewed collisions | ' + (data.unreviewedCollisions?.length ?? 'MISSING') + ' |',
              '| Integrated learned ranking | ' + (data.integratedLearning?.pass ? 'PASS' : 'FAIL') + ' |',
              '| Expanded category learning | ' + expandedLearning.filter(x=>x.pass).length + '/' + expandedLearning.length + ' |',
              '| Learning | ' + (data.learning?.pass ? 'PASS' : 'FAIL') + ' |',
              '| Learning guardrails | ' + (data.guardedLearning?.pass ? 'PASS' : 'FAIL') + ' |',
              '| Learning saturation and reset | ' + (data.boundedLearning?.pass ? 'PASS' : 'FAIL') + ' |',
              '| Overall | ' + (ok ? 'PASS' : 'FAIL') + ' |',
              ''
            ].join('\n'));
          } catch (error) {
            fs.appendFileSync(summary, '## Ziiply search audit\n\nCould not parse behavior report: ' + String(error) + '\n');
          }
          NODE
      - name: Summarize category snapshot regression
        if: always()
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const path='search-audit-results/category-findings.json';
          const summary=process.env.GITHUB_STEP_SUMMARY;
          if(!fs.existsSync(path)) {
            fs.appendFileSync(summary,'\n## Product category findings snapshot\n\nResult missing (not passed).\n');
            process.exit(0);
          }
          try {
            const r=JSON.parse(fs.readFileSync(path,'utf8'));
            const ok=r.status==='PASS'&&r.rows===65&&r.failures?.length===0;
            fs.appendFileSync(summary, [
              '', '## Product category findings snapshot', '',
              '| Check | Result |', '|---|---|',
              '| Snapshot rows | '+r.rows+'/65 |',
              '| Source category misclassifications | '+(r.counts?.source_misclassification??'MISSING')+'/17 |',
              '| More specific subcategories | '+(r.counts?.more_specific_subcategory??'MISSING')+'/37 |',
              '| Ambiguous search terms | '+(r.counts?.ambiguous_search_term??'MISSING')+'/11 |',
              '| Findings regression | '+(ok?'PASS':'FAIL')+' |', ''
            ].join('\n'));
          } catch(e) {fs.appendFileSync(summary,'\n## Product category findings snapshot\n\nInvalid report: '+String(e)+'\n');}
          NODE
      - name: Upload search audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-audit-reports
          path: search-audit-results
          if-no-files-found: ignore
