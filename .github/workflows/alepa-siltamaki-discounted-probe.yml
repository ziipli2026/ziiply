name: Alepa Siltamaki discounted probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/probe-alepa-siltamaki-discounted.mjs
      - .github/workflows/alepa-siltamaki-discounted-probe.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-alepa-siltamaki-discounted.mjs
