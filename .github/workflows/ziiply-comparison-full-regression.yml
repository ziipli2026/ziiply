name: Ziiply comparison full regression
on:
  workflow_dispatch:
jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Compile app and comparison types
        run: npx tsc --noEmit --pretty false
      - name: Run existing comparison price-unit audit
        run: node scripts/audit-comparison-price-units-20261002.cjs
      - name: Run existing comparison test scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find scripts -maxdepth 2 -type f \( -iname '*compar*test*.cjs' -o -iname '*compar*regression*.cjs' -o -iname '*compar*audit*.cjs' -o -iname '*compar*test*.mjs' \) | sort)
          printf 'Found %s comparison scripts\n' "${#scripts[@]}"
          for script in "${scripts[@]}"; do
            echo "::group::$script"
            node "$script"
            echo "::endgroup::"
          done
      - name: Functional cross-chain counterpart regression
        shell: bash
        run: |
          npx tsc src/app/components/ziiply/ziiplyCore.ts --target ES2021 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck --outDir .tmp-comparison-functional
          node <<'NODE'
          const core = require('./.tmp-comparison-functional/ziiplyCore.js');
          let failures = 0;
          const check = (label, actual, expected) => {
            if (actual !== expected) { console.error('FAIL', label, {actual, expected}); failures++; }
            else console.log('PASS', label);
          };
          const source = 'Valio Eila laktoositon rasvaton piimä 1 l';
          const products = [
            {name:'Valio rasvaton piimä 1 l',price:0.75},
            {name:'Kotimaista laktoositon rasvaton piimä 1 l',price:1.29},
            {name:'Pirkka laktoositon rasvaton piimä 1 l',price:1.09},
            {name:'Valio Eila laktoositon rasvaton maito 1 l',price:0.65},
            {name:'Arla laktoositon rasvaton piimä 500 ml',price:0.85},
          ];
          check('cheapest equivalent preserves attributes',core.pickCheapestCompatibleComparisonProduct(source,products)?.name,'Pirkka laktoositon rasvaton piimä 1 l');
          check('wrong product group rejected',core.isComparisonAttributeCompatible(source,products[3].name),false);
          check('wrong package rejected',core.isComparisonAttributeCompatible(source,products[4].name),false);
          check('missing lactose-free rejected',core.isComparisonAttributeCompatible(source,products[0].name),false);
          check('S own brand accepts Coop',core.isAllowedByQualityMode('Valio rasvaton maito 1 l','Coop rasvaton maito 1 l','own_brands','s'),true);
          check('S own brand rejects Pirkka',core.isAllowedByQualityMode('Valio rasvaton maito 1 l','Pirkka rasvaton maito 1 l','own_brands','s'),false);
          check('K own brand accepts Pirkka',core.isAllowedByQualityMode('Valio rasvaton maito 1 l','Pirkka rasvaton maito 1 l','own_brands','k'),true);
          check('K own brand rejects Coop',core.isAllowedByQualityMode('Valio rasvaton maito 1 l','Coop rasvaton maito 1 l','own_brands','k'),false);
          check('same brand rejects another brand',core.isAllowedByQualityMode('Valio rasvaton maito 1 l','Arla rasvaton maito 1 l','keep_brands','s','Valio','Arla'),false);
          check('same brand accepts matching brand',core.isAllowedByQualityMode('Valio rasvaton maito 1 l','Valio rasvaton maito 1 l','keep_brands','s','Valio','Valio'),true);
          if(failures) process.exit(1);
          console.log('SAFE_SUMMARY functional cross-chain counterpart regression passed');
          NODE
      - name: Live S and K product-search smoke test
        shell: bash
        run: |
          node <<'NODE'
          const base = 'https://ziiply.vercel.app';
          const cases = [
            ['S','292','maito'],
            ['K','N183','maito'],
            ['S','292','jauheliha'],
            ['K','N183','jauheliha'],
            ['S','292','kananmuna'],
            ['K','N183','kananmuna'],
          ];
          const problems = [];
          for (const [chain,store,term] of cases) {
            const endpoint = chain === 'S' ? 's-products' : 'k-products';
            const url = new URL('/api/'+endpoint,base);
            url.searchParams.set('store',store);
            if(chain === 'S') url.searchParams.set('storeName','Prisma Hyvinkää');
            url.searchParams.set('search',term);
            try {
              const response = await fetch(url,{signal:AbortSignal.timeout(25000)});
              const body = await response.json();
              const items = Array.isArray(body.items) ? body.items : Array.isArray(body.products) ? body.products : [];
              const names = items.slice(0,5).map(x=>String(x.name||''));
              console.log(JSON.stringify({chain,store,term,http:response.status,count:items.length,top:names}));
              if(!response.ok) problems.push(chain+' '+term+' HTTP '+response.status);
              else if(!items.length) problems.push(chain+' '+term+' empty results (check store ID and upstream)');
            } catch(error) {
              problems.push(chain+' '+term+' '+String(error));
            }
          }
          if(problems.length) {
            console.error('LIVE_SEARCH_ISSUES',JSON.stringify(problems));
            process.exit(1);
          }
          console.log('SAFE_SUMMARY live S/K search smoke passed');
          NODE
      - name: Live counterpart selection on S and K results
        shell: bash
        run: |
          node <<'NODE'
          const { createRequire } = await import('node:module');
          const require = createRequire(import.meta.url);
          const core = require('./.tmp-comparison-functional/ziiplyCore.js');
          const mustReject = [
            ['Arla 1% maito 1l', 'Koivulan Tilan maito 1l'],
            ['Koivulan Tilan maito 1l', 'Arla 1% maito 1l'],
            ['Arla 1% maito 1l', 'Arla 3% maito 1l'],
            ['HK Viljaporsaan jauheliha 10% 400g', 'Pirkka suomalainen kanan jauheliha 400g'],
            ['HK Viljaporsaan jauheliha 10% 400g', 'Pirkka suomalainen porsaan jauheliha 12% 400g'],
            ['Pirkka suomalainen porsaan jauheliha 12% 400g', 'HK Viljaporsaan jauheliha 10% 400g'],
            ['Tammiston nauta-sika jauheliha', 'Snellman 400g Kunnon sika-nauta jauheliha'],
            ['Snellman 400g Kunnon sika-nauta jauheliha', 'Tammiston nauta-sika jauheliha'],
            ['Atria Kanan jauheliha 800 g', 'DIBO lammas raakapakastettu jauhelihapihvi 800g pakaste'],
          ];
          for(const [source,candidate] of mustReject){
            if(core.isComparisonAttributeCompatible(source,candidate)){
              console.error('FAIL semantic counterpart',JSON.stringify({source,candidate}));
              process.exit(1);
            }
            console.log('PASS semantic counterpart rejection',JSON.stringify({source,candidate}));
          }
          const terms=['maito','jauheliha','kananmuna'];
          let total=0,errors=[];
          const unmatchedAudit=[];
          async function load(chain,term){
            const url=new URL('/api/'+(chain==='S'?'s-products':'k-products'),'https://ziiply.vercel.app');
            url.searchParams.set('search',term);
            url.searchParams.set('store',chain==='S'?'292':'N183');
            if(chain==='S')url.searchParams.set('storeName','Prisma Hyvinkää');
            const response=await fetch(url,{signal:AbortSignal.timeout(30000)});
            if(!response.ok)throw Error(chain+' '+term+' HTTP '+response.status);
            const body=await response.json();
            return (body.items||[]).filter(p=>p.name&&Number(p.price)>0).map(p=>({name:p.name,price:Number(p.price)}));
          }
          for(const term of terms){
            const [s,k]=await Promise.all([load('S',term),load('K',term)]);
            for(const [direction,source,target] of [['S->K',s,k],['K->S',k,s]]){
              let matched=0;
              for(const product of source.slice(0,60)){
                const compatible=target.filter(p=>core.isComparisonAttributeCompatible(product.name,p.name));
                const picked=core.pickCheapestCompatibleComparisonProduct(product.name,target);
                if(compatible.length){
                  if(!picked||picked.price!==Math.min(...compatible.map(p=>p.price)))errors.push(term+' '+direction+' wrong cheapest '+product.name);
                  else {matched++;if(matched<=2)console.log('EXAMPLE',JSON.stringify({direction,source:product.name,match:picked.name,price:picked.price}));}
                }else if(picked)errors.push(term+' '+direction+' incompatible '+product.name);
                else {
                  const sizePattern=/\b\d+(?:[,.]\d+)?\s*(?:kg|g|l|ml)\b/i;
                  const sameSizeCandidates=target.filter(p=>sizePattern.test(p.name)===sizePattern.test(product.name));
                  const lexicalTokens=name=>new Set(name.toLowerCase().replace(/[^a-zåäö0-9]+/g,' ').split(' ').filter(t=>t.length>=3&&!/^(?:400|300|500|600|700|800|100|200)$/.test(t)));
                  const sourceTokens=lexicalTokens(product.name);
                  const nearby=target.map(p=>{
                    const tokens=lexicalTokens(p.name);
                    const shared=[...sourceTokens].filter(t=>tokens.has(t)).length;
                    const overlap=shared/Math.max(1,Math.min(sourceTokens.size,tokens.size));
                    return {name:p.name,price:p.price,overlap:Number(overlap.toFixed(3)),compatible:core.isComparisonAttributeCompatible(product.name,p.name)};
                  }).filter(p=>p.overlap>=0.25).sort((a,b)=>b.overlap-a.overlap).slice(0,3);
                  unmatchedAudit.push({term,direction,source:product.name,sourceHasSize:sizePattern.test(product.name),candidateCount:target.length,sameSizeNameCount:sameSizeCandidates.length,nearby});
                }
              }
              total+=matched;
              console.log('COVERAGE',JSON.stringify({term,direction,sourceCount:source.length,targetCount:target.length,matched}));
            }
          }
          const classifyUnmatched = (row) => {
            const n=row.source.toLowerCase();
            if(row.term==='maito'){
              if(/(?:suklaa|kerma|rahka|vanukas|leipä|leipa|bakteeri|kahvi|cappuccino|kondensoitu|pirtelö|pirtelo|milkshake|kaakao|juoma|jäätelö|jaatelo|patukka|levite|jogurtti|jogurti|juusto|voi\b|maitojauhe)/i.test(n))return 'other_milk_related';
              if(/\bmaito\b/i.test(n))return 'plain_milk';
              return 'other_search_hit';
            }
            if(row.term==='jauheliha')return /\bjauheliha\b/i.test(n)?'plain_ground_meat':'other_search_hit';
            if(row.term==='kananmuna')return /\bkananmuna\b/i.test(n)?'plain_eggs':'other_search_hit';
            return 'other_search_hit';
          };
          const grouped={};
          for(const row of unmatchedAudit){
            const key=row.term+':'+classifyUnmatched(row);
            grouped[key]=(grouped[key]||0)+1;
          }
          console.log('UNMATCHED_AUDIT_SUMMARY',JSON.stringify({count:unmatchedAudit.length,missingSourceSize:unmatchedAudit.filter(x=>!x.sourceHasSize).length,byTerm:Object.fromEntries(terms.map(t=>[t,unmatchedAudit.filter(x=>x.term===t).length])),byProductKind:grouped}));
          for(const row of unmatchedAudit.filter(x=>classifyUnmatched(x)==='plain_milk'||classifyUnmatched(x)==='plain_ground_meat'||classifyUnmatched(x)==='plain_eggs').slice(0,35))console.log('UNMATCHED_CORE_PRODUCT',JSON.stringify(row));
          console.log('UNMATCHED_CORE_NEARBY_COUNT',JSON.stringify({withCandidates:unmatchedAudit.filter(x=>['plain_milk','plain_ground_meat','plain_eggs'].includes(classifyUnmatched(x))&&x.nearby.length).length}));
          for(const row of unmatchedAudit.slice(0,35))console.log('UNMATCHED_AUDIT_SAMPLE',JSON.stringify(row));
          if(!total)errors.push('No compatible cross-chain matches in any tested family');
          if(errors.length){console.error('LIVE_COUNTERPART_ISSUES',JSON.stringify(errors));process.exit(1);}
          console.log('SAFE_SUMMARY verified live counterpart choices:',total);
          NODE
      - name: Basket totals and cheapest-store contract regression
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const src=fs.readFileSync('src/app/components/ziiply/cards/ZiiplyMobileCompareCardresponsive.tsx','utf8');
          const selection=fs.readFileSync('src/app/components/ziiply/cards/ZiiplyMobileCompareSelectionCard.tsx','utf8');
          function body(from,to){const a=src.indexOf(from);const b=src.indexOf(to,a+from.length);assert(a>=0&&b>a,from+' must exist');return src.slice(a,b);}
          const normalization=body('function normalizeComparisonStorePrices(', 'function getCheapestStore(');
          const cheapest=body('function getCheapestStore(', 'function formatEuroCents(');
          const diff=body('function getStorePriceDiff(', 'function splitStoreName(');
          assert(normalization.includes('raw * quantity * 100'),'100x detection must require exact factor');
          assert(normalization.includes('store.totalPrice - correction'),'corrected line prices must update basket total');
          assert(cheapest.includes('aMissing === 0'),'complete basket must outrank incomplete basket');
          assert(cheapest.includes('a.totalPrice || 0'),'complete baskets must be sorted by price');
          assert(diff.includes('storeMissing !== cheapestMissing || storeCount !== cheapestCount'),'never compare different coverage');
          assert(diff.includes('!hasSameMatchedItems(store, cheapest)'),'partial baskets need same items');
          assert(diff.includes('formatEuroCents(diff)'),'difference must be cents, not euros');
          assert(selection.includes('return data.price;'),'extended line price must not multiply quantity twice');
          const tests=[
            {raw:[85,95],q:[1,1],line:[85,95],expected:[85,95],diff:10},
            {raw:[85,95],q:[2,2],line:[170,190],expected:[170,190],diff:20},
            {raw:[85,95],q:[1,1],line:[8500,9500],expected:[85,95],diff:10},
            {raw:[85,95],q:[2,2],line:[17000,19000],expected:[170,190],diff:20},
          ];
          for(const t of tests){
            const corrected=t.line.map((actual,i)=>{
              const raw=t.raw[i],quantity=t.q[i];
              return Math.abs(actual-raw*quantity*100)<0.001 ? Math.round(raw*quantity) : actual;
            });
            assert.deepEqual(corrected,t.expected);
            assert.equal(corrected[1]-corrected[0],t.diff);
            console.log('PASS basket arithmetic',JSON.stringify(t));
          }
          console.log('SAFE_SUMMARY basket coverage, price-unit and quantity contracts passed');
          NODE
      - name: Install mobile browser for UI smoke test
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps --ignore-scripts --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Capture mobile production UI and check browser errors
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { mkdirSync } from 'node:fs';
          mkdirSync('comparison-ui-artifacts',{recursive:true});
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
          const errors=[];
          page.on('pageerror',error=>errors.push(String(error)));
          const response=await page.goto('https://ziiply.vercel.app/',{waitUntil:'domcontentloaded',timeout:45000});
          await page.waitForTimeout(4500);
          await page.screenshot({path:'comparison-ui-artifacts/mobile-home.png',fullPage:true});
          const result=await page.evaluate(()=>({
            title:document.title,
            bodyText:document.body?.innerText?.slice(0,1200)||'',
            viewportWidth:innerWidth,
            documentWidth:document.documentElement.scrollWidth,
            buttons:[...document.querySelectorAll('button')].map(x=>x.innerText.trim()).filter(Boolean).slice(0,35)
          }));
          console.log('MOBILE_UI',JSON.stringify({http:response?.status(),...result,pageErrors:errors}));
          await browser.close();
          if(!response?.ok())throw Error('Production landing HTTP failure');
          if(!result.bodyText.trim())throw Error('Production landing rendered empty page');
          if(errors.length)throw Error('Uncaught browser errors: '+errors.join('; '));
          console.log('SAFE_SUMMARY mobile production render and browser error smoke passed');
          NODE
      - name: Mobile comparison interaction discovery
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { mkdirSync,writeFileSync } from 'node:fs';
          mkdirSync('comparison-ui-artifacts',{recursive:true});
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('https://ziiply.vercel.app/',{waitUntil:'domcontentloaded',timeout:45000});
          await page.waitForTimeout(2500);
          const snapshots=[];
          async function capture(stage){
            const data=await page.evaluate(()=>({
              text:document.body?.innerText?.slice(0,2400)||'',
              controls:[...document.querySelectorAll('button,[role="button"],input')].filter(e=>e.getBoundingClientRect().width>0).map(e=>({label:(e.innerText||e.getAttribute('aria-label')||e.getAttribute('placeholder')||'').trim().slice(0,90),type:e.tagName})).slice(0,65)
            }));
            snapshots.push({stage,...data});
            await page.screenshot({path:'comparison-ui-artifacts/'+stage+'.png',fullPage:true});
          }
          await capture('interaction-start');
          // Click only clearly named, visible controls; never submit checkout or change saved data.
          for(const [stage,pattern] of [
            ['search-card',/^(Haku|Hae|Justiina)$/i],
            ['cart-card',/^(Ostoskori|Ostoslista|Kori)$/i],
            ['compare-card',/^(Vertaa|Vertailu|Vertaile)$/i],
          ]){
            const candidate=page.getByRole('button',{name:pattern}).first();
            if(await candidate.isVisible().catch(()=>false)){
              await candidate.click({timeout:5000}).catch(e=>snapshots.push({stage,error:String(e)}));
              await page.waitForTimeout(900);
              await capture(stage);
            }else snapshots.push({stage,skipped:'No visible matching control'});
          }
          const stages=['search-card','cart-card','compare-card'];
          const opened=stages.filter(stage=>snapshots.some(s=>s.stage===stage&&Array.isArray(s.controls)));
          const skipped=stages.filter(stage=>!opened.includes(stage));
          const coverage={opened,skipped,allViewsReached:skipped.length===0};
          writeFileSync('comparison-ui-artifacts/interaction-coverage.json',JSON.stringify(coverage,null,2));
          console.log('INTERACTION_COVERAGE',JSON.stringify(coverage));
          const summary=[
            '## Ziiply mobile interaction coverage',
            '',
            '| View | Result |',
            '| --- | --- |',
            ...stages.map(stage=>'| '+stage+' | '+(opened.includes(stage)?'Opened':'NOT TESTED (control not found)')+' |'),
            '',
            coverage.allViewsReached?'All discovery views were reached.':'WARNING: Navigation coverage is incomplete; a green workflow is NOT an end-to-end basket verification.',
            '',
            'See comparison-mobile-ui-screenshot artifact for screenshots and interaction-discovery.json.',
          ].join('\\n');
          if(process.env.GITHUB_STEP_SUMMARY){
            const {appendFileSync}=await import('node:fs');
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary+'\\n');
          }
          writeFileSync('comparison-ui-artifacts/interaction-discovery.json',JSON.stringify({snapshots,errors},null,2));
          console.log('INTERACTION_DISCOVERY',JSON.stringify(snapshots.map(s=>({stage:s.stage,skipped:s.skipped,controls:s.controls?.slice(0,18)}))));
          await browser.close();
          if(errors.length)throw Error('Browser errors: '+errors.join('; '));
          console.log('SAFE_SUMMARY navigation discovery only; views reached:',opened.length,'/',stages.length,'; skipped views are NOT verified');
          NODE
      - name: Upload mobile UI screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparison-mobile-ui-screenshot
          path: comparison-ui-artifacts/
          if-no-files-found: ignore
      - name: Verify current comparison search contracts
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const page = fs.readFileSync('src/app/page.tsx','utf8');
          const card = fs.readFileSync('src/app/components/ziiply/cards/ZiiplyMobileCompareSelectionCard.tsx','utf8');
          const assert = (ok, msg) => { if (!ok) { console.error('FAIL',msg); process.exitCode=1; } else console.log('PASS',msg); };
          const fn = page.slice(page.indexOf('function fetchAlternativesForMatch('),page.indexOf('async function loadAlternatives('));
          assert(fn.length > 2000, 'alternative search function exists');
          assert(fn.includes('productGroupGate(sourceName, product.name)'), 'both chain searches apply product-group gate');
          assert((fn.match(/isCheapestAttributeCompatible\(sourceName, product.name\)/g)||[]).length >= 2, 'S and K preserve key attributes and pack size');
          assert((fn.match(/isAllowedByQualityMode\(/g)||[]).length >= 2, 'S and K apply quality/brand rules');
          assert(fn.includes('alternativeKStoreId'), 'K alternatives target selected store');
          assert(page.includes('const comparisonSourceEan = normalizeEan(item.ean || item.product?.ean);'), 'basket EAN takes priority');
          assert(page.includes('return alternatives.filter((candidate) =>'), 'menu results have final compatibility gate');
          assert(card.includes('filterComparisonAlternatives('), 'UI filters alternative brands');
          assert(card.includes('return data.price;'), 'line price is not multiplied by quantity twice');
          assert(page.includes('price: Math.round(match.price * 100)'), 'euro-to-cent conversion happens at comparison boundary');
          if (process.exitCode) process.exit(process.exitCode);
          console.log('SAFE_SUMMARY comparison contracts passed');
          NODE
