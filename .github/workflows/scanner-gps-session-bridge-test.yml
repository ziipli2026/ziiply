name: Scanner GPS session bridge regression
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/app/page.tsx'
      - 'src/app/components/ziiply/location/ziiplyArrivalSequence.ts'
      - 'scripts/test-scanner-live-arrival.cjs'
      - '.github/workflows/scanner-gps-session-bridge-test.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Simulate GPS arrival and scanner sessions
        run: |
          node scripts/test-ziiply-arrival-sequence.cjs
          node scripts/test-scanner-live-arrival.cjs
          node scripts/scanner-price-race-check.mjs
