name: Lidl product normalization check
on:
  push:
    branches:
      - fix/lidl-product-search-normalization
  workflow_dispatch:
jobs:
  lidl-product-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/test-lidl-product-normalization.cjs
