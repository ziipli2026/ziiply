name: Lidl product normalization check
on:
  push:
    branches:
      - fix/lidl-product-search-normalization
  workflow_dispatch:
jobs:
  lidl-product-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The repository lockfile currently disagrees with package.json.
      # Install only the compiler needed by this isolated regression test.
      - run: npm install --no-save --no-package-lock --ignore-scripts --prefix /tmp/lidl-test typescript@5
      - run: ln -s /tmp/lidl-test/node_modules node_modules
      - run: node scripts/test-lidl-product-normalization.cjs
