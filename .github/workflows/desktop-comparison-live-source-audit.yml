name: Desktop comparison live source audit
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Query Prisma and Citymarket upstream data directly
        run: node scripts/desktop-comparison-live-source-audit.cjs
