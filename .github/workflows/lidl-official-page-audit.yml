name: Lidl official product page audit
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      # Note: pushes made by GITHUB_TOKEN from this workflow do not create recursive workflow runs.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate collector syntax
        run: node --check scripts/audit-lidl-official-pages.mjs
      - name: Collect official page evidence
        run: node scripts/audit-lidl-official-pages.mjs --all --output=lidl-official-page-results.json
      - name: Print evidence summary
        run: |
          node --input-type=module -e "import fs from 'node:fs';const d=JSON.parse(fs.readFileSync('lidl-official-page-results.json'));console.log(JSON.stringify({total:d.count,candidates:d.candidateCount,sharedImages:d.sharedMetaImageCount,statusCounts:d.statusCounts,imageCheckCounts:d.imageCheckCounts,httpOK:d.records.filter(x=>x.httpStatus===200).length,errors:d.records.filter(x=>x.error).length,examples:d.records.slice(0,3).map(x=>({name:x.name,status:x.imageStatus,metaImageHost:x.metaImageHost,canonical:x.canonicalUrl,title:x.pageTitle,markup:x.imageMarkupCounts,htmlBytes:x.htmlBytes}))},null,2))"
      - name: Report structured price evidence
        run: |
          node --input-type=module -e "import fs from 'node:fs';const d=JSON.parse(fs.readFileSync('lidl-official-page-results.json'));const rows=d.records.filter(r=>r.structuredPriceEvidence?.length);console.log(JSON.stringify({pagesWithStructuredOffers:rows.length,totalStructuredOffers:rows.reduce((n,r)=>n+r.structuredPriceEvidence.length,0),products:rows.map(r=>({id:r.lidlProductId,name:r.name,offers:r.structuredPriceEvidence}))},null,2))"
      - name: Export official GTIN candidates separately
        run: |
          node --input-type=module -e "import fs from 'node:fs';const d=JSON.parse(fs.readFileSync('lidl-official-page-results.json'));const rows=d.records.filter(r=>Array.isArray(r.officialPageGtins)&&r.officialPageGtins.length);const unique=[...new Set(rows.flatMap(r=>r.officialPageGtins))];console.log(JSON.stringify({pagesWithOfficialGtins:rows.length,uniqueOfficialGtins:unique.length,products:rows.map(r=>({id:r.lidlProductId,name:r.name,gtins:r.officialPageGtins}))},null,2));fs.writeFileSync('lidl-official-gtin-candidates.json',JSON.stringify({source:'lidl.fi-official-product-page',researchOnly:true,records:rows.map(r=>({lidlProductId:r.lidlProductId,name:r.name,officialUrl:r.officialUrl,gtins:r.officialPageGtins}))},null,2)+'\\n')"
      - name: Publish official GTIN candidates separately
        run: |
          if [ ! -f lidl-official-gtin-candidates.json ]; then exit 0; fi
          node --input-type=module -e "import fs from 'node:fs';const d=JSON.parse(fs.readFileSync('lidl-official-gtin-candidates.json'));fs.writeFileSync('data/lidl/official-gtin-candidates.generated.json',JSON.stringify(d,null,2)+'\\n')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lidl/official-gtin-candidates.generated.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Lidl official GTIN candidates"
            git push
          fi

      - name: Export reachable image candidates separately
        run: |
          node --input-type=module -e "import fs from 'node:fs';const d=JSON.parse(fs.readFileSync('lidl-official-page-results.json'));fs.writeFileSync('lidl-image-candidates.json',JSON.stringify({source:d.source,researchOnly:true,visuallyVerified:false,records:d.records.filter(x=>x.imageStatus==='product_page_image_candidate').map(x=>({lidlProductId:x.lidlProductId,name:x.name,officialUrl:x.officialUrl,imageUrl:x.candidateImageUrl,imageHttpStatus:x.imageHttpStatus,imageContentType:x.imageContentType,priceEur:null,ean:null}))},null,2)+'\\n')"
      - name: Publish confirmed image URLs to source data
        run: |
          node --input-type=module -e "import fs from 'node:fs';const d=JSON.parse(fs.readFileSync('lidl-official-page-results.json'));const rows=d.records.filter(x=>x.imageStatus==='product_page_image_candidate' && x.imageReachable===true);if(rows.length<90)throw new Error('Too few confirmed official Lidl images: '+rows.length);const ids=new Set(rows.map(x=>x.lidlProductId));if(ids.size!==rows.length)throw new Error('Duplicate Lidl product ID');fs.writeFileSync('data/lidl/official-product-images.generated.json',JSON.stringify({source:'lidl.fi-official-product-page',researchOnly:true,checkedAt:d.records[0]?.checkedAt,records:rows.map(x=>({lidlProductId:x.lidlProductId,imageUrl:x.candidateImageUrl,officialUrl:x.officialUrl}))},null,2)+'\\n')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lidl/official-product-images.generated.json
          if ! git diff --cached --quiet; then
            git commit -m "Update verified Lidl official product image URLs"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lidl-official-page-results
          path: |
            lidl-official-page-results.json
            lidl-image-candidates.json
            lidl-official-gtin-candidates.json
          if-no-files-found: warn
          retention-days: 14
