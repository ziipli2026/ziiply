name: Neon exact EAN live verification
on:
  workflow_dispatch:
  push:
    branches: [preview/legacy-desktop-ui]
    paths:
      - 'scripts/test-neon-live-ean.mjs'
      - 'scripts/test-neon-exact-ean.mjs'
      - 'src/app/api/neon-first-search/route.ts'
      - '.github/workflows/neon-exact-ean-live.yml'
permissions:
  contents: read
jobs:
  exact-ean-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # These tests use Node built-ins; project dependency installation is unnecessary.
      - name: Check exact EAN search isolation
        run: node scripts/test-neon-exact-ean.mjs
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Verify original and desktop live search paths
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/test-neon-live-ean.mjs
      - name: Upload live observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-exact-ean-live-report
          path: neon-live-search-report.json
          if-no-files-found: warn
