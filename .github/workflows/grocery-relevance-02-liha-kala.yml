name: Grocery relevance 02-liha-kala
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check S and K production search
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const stores=[["S","s-products","292"],["K","k-products","3221"]];
          const terms=["jauheliha","naudanliha","sianliha","kana","kalkkuna","tonnikala","katkarapu","seiti","makkara","nakki"];
          let failures=0,checks=0;
          for(const [chain,route,store] of stores){
            for(const term of terms){
              checks++;
              try{
                const url="https://ziiply.vercel.app/api/"+route+"?store="+store+"&search="+encodeURIComponent(term);
                const response=await fetch(url,{signal:AbortSignal.timeout(25000)});
                if(!response.ok)throw Error("HTTP "+response.status);
                const body=await response.json();
                const items=body.items||[];
                const top=items.slice(0,10).map(x=>x.name);
                console.log(JSON.stringify({chain,term,count:items.length,top}));
                if(!items.length){failures++;console.error("EMPTY",chain,term);}
                if(top.some(n=>!n||typeof n!=="string")){failures++;console.error("INVALID_NAME",chain,term);}
                const first=top.slice(0,Math.min(3,top.length));
                if(term==="kana"&&first.some(n=>/oscar herkku|hhc täysravint|cesar senior|cesar classics|dagsmark|latz|koiran|kissan|täysravint/i.test(n))){failures++;console.error("PET_FOOD_KANA_TOP3",chain,term);}
                if(term==="katkarapu"&&first.some(n=>/katkarapusips/i.test(n))){failures++;console.error("SNACKS_KATKARAPU_TOP3",chain,term);}
                if(term==="naudanliha"&&first.some(n=>/piltti|semper|lovemade|naudanlihasose|lastenruoka/i.test(n))){failures++;console.error("BABY_FOOD_NAUDANLIHA_TOP3",chain,term);}
                if(term==="naudanliha"&&!first.some(n=>/entrecote|ulkofilee|sisäfilee|lehtipihvi|paisti|pihvi/i.test(n))){failures++;console.error("RAW_BEEF_MISSING_TOP3",chain,term);}
                if(term==="sianliha"&&top.slice(0,10).some(n=>/lego|minecraft/i.test(n))){failures++;console.error("TOY_IN_PORK_TOP10",chain,term);}
                if(["jauheliha","naudanliha","sianliha","kana","kalkkuna","tonnikala","katkarapu","seiti","makkara","nakki"].includes(term)&&top.slice(0,Math.min(2,top.length)).some(n=>/dreamies|sheba|vitakraft|carnilove|whiskas|pedigree|koirille|kissoille|täysrehu|täysravinto/i.test(n))){failures++;console.error("PET_FOOD_TOP5",chain,term);}
              }catch(e){failures++;console.error("ERROR",chain,term,String(e));}
            }
          }
          console.log("SUMMARY",JSON.stringify({group:"02-liha-kala",checks,failures}));
          if(failures)process.exitCode=1;
          NODE
