name: S-store identity (isolated)
on:
  push:
    branches:
      - test/s-store-identity-isolated-v1
  workflow_dispatch:
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated store identity contract
        run: node --test tests/s-store-identity-isolated.test.mjs
