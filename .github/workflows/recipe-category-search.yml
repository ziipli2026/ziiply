name: Recipe category search
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/app/components/ziiply/justiina/recipe*.ts'
      - 'src/app/components/ziiply/justiina/mobileRecipeSearch.ts'
      - 'scripts/test-mobile-recipe*.cjs'
      - 'src/app/components/ziiply/justiina/mobileRecipeSearch.ts'
      - 'scripts/test-mobile-recipe*.cjs'
      - 'scripts/test-recipe*.cjs'
      - '.github/workflows/recipe-category-search.yml'
  pull_request:
    paths:
      - 'src/app/components/ziiply/justiina/recipe*.ts'
      - 'scripts/test-recipe*.cjs'
      - '.github/workflows/recipe-category-search.yml'
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/test-recipe-category-search.cjs
      - run: node scripts/test-recipe-search.cjs
      - run: node scripts/test-recipe-audit-20.cjs
      - run: node scripts/test-recipe-search-coverage.cjs
      - run: node scripts/test-recipe-fish-debug.cjs
      - run: node scripts/test-recipe-sugar-salt-debug.cjs
      - run: node scripts/test-recipe-selected-store-fallback.cjs
      - run: node scripts/test-recipe-product-state.cjs
      - run: node scripts/test-mobile-recipe-flow.cjs
      - run: node scripts/test-mobile-recipe-stable-list.cjs
