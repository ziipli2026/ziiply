name: Citymarket publisher images
on:
  workflow_dispatch:
    inputs:
      entry:
        description: Optional immutable leaflet URL; blank discovers AV and LV
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/citymarket-leaflet-images.yml"
      - "scripts/citymarket/**"
  schedule:
    # Two checks on publication days, at 15:15 and 17:15 Helsinki.
    # Both UTC offsets are listed; the clock guard skips the extra executions.
    - cron: '15 12,13,14,15 * * 0,3'
permissions:
  contents: write
concurrency:
  group: citymarket-publisher-images
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Helsinki publication clock
        id: clock
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != schedule ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            hour=$(TZ=Europe/Helsinki date +%H)
            if [ "$hour" = 15 ] || [ "$hour" = 17 ]; then
              echo 'run=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/setup-node@v4
        if: steps.clock.outputs.run == 'true'
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        if: steps.clock.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: PDF and package-label readers
        if: steps.clock.outputs.run == 'true'
        run: |
          python -m pip install 'PyMuPDF>=1.24,<2' 'Pillow>=10,<13'
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr
      - name: Discover, parse and extract publisher images
        if: steps.clock.outputs.run == 'true'
        env:
          ENTRY: ${{ inputs.entry }}
        run: |
          if [ -n "$ENTRY" ]; then
            entries=("$ENTRY")
          else
            entries=("https://kcm-lehdet.k-ruoka.fi/alkuviikon_tarjouslehdet/" "https://kcm-lehdet.k-ruoka.fi/loppuviikon_tarjouslehdet/")
          fi
          index=0
          successful=0
          for entry in "${entries[@]}"; do
            folder="artifacts/citymarket-images/$index"
            if node scripts/citymarket/export-leaflet.mjs "$entry" "$folder" && python scripts/citymarket/build-images.py "$folder" --manifest src/app/components/ziiply/offerSearch/providers/data/kCitymarketLeafletImages.json --public public/citymarket-leaflets --reviewed scripts/citymarket/reviewed-selections.json; then
              successful=$((successful+1))
            else
              echo "::warning::Image discovery failed for $entry; previous publication images retained"
            fi
            index=$((index+1))
          done
          test "$successful" -gt 0
          node scripts/citymarket/verify-images.mjs
      - name: Publish verified image data
        if: steps.clock.outputs.run == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/citymarket-leaflets src/app/components/ziiply/offerSearch/providers/data/kCitymarketLeafletImages.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified Citymarket publisher images'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.clock.outputs.run == 'true'
        with:
          name: citymarket-image-audit
          path: artifacts/citymarket-images
          retention-days: 14
