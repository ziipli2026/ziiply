name: Tokmanni mapBlock live simulation
on:
  push:
    paths:
      - 'scripts/simulate-tokmanni-mapblock-live-20261006.cjs'
  workflow_dispatch:
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/simulate-tokmanni-mapblock-live-20261006.cjs
