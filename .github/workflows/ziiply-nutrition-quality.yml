name: Ziiply OFF Fineli nutrition quality
run-name: OFF nutrition EAN master missing-field audit 29 Oct
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ziiply-nutrition-quality.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Fill missing OFF numeric fields (never overwrite existing values)'
        type: boolean
        required: true
        default: false
concurrency:
  group: ziiply-nutrition-quality
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4' 'certifi>=2025.1.31'
      - run: python -m py_compile scripts/audit-off-fineli-nutrition.py scripts/refresh-off-missing-nutrition.py
      - name: Refresh missing nutrition from live OFF
        env:
          DATABASE_URL: ${{ secrets.ZIIPLY_DATABASE_URL }}
          OFF_NUTRITION_REFRESH_LIMIT: '180'
        run: python -u scripts/refresh-off-missing-nutrition.py
      - name: Audit and optionally complete existing OFF fields
        env:
          DATABASE_URL: ${{ secrets.ZIIPLY_DATABASE_URL }}
          NUTRITION_APPLY: ${{ github.event_name == 'push' && 'true' || (inputs.apply && 'true' || 'false') }}
        run: python -u scripts/audit-off-fineli-nutrition.py
