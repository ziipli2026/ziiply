name: Citymarket local offer integration simulation
on:
  pull_request:
  push:
    paths:
      - 'src/app/components/ziiply/offerSearch/providers/kCitymarketLocalTjekProvider.ts'
      - 'src/app/api/offers/search/route.ts'
      - 'src/app/components/ziiply/offerSearch/kOfferTabPolicy.ts'
      - 'tests/k-offer-tab-policy.test.cjs'
      - 'src/app/components/ziiply/cards/ZiiplyMobileOfferSearchCard.tsx'
      - 'src/app/components/ziiply/offerSearch/providers/kCitymarketProvider.ts'
      - '.github/workflows/kcitymarket-local-integration-simulation.yml'
  workflow_dispatch:
jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --package-lock=false --no-audit --no-fund
      - name: TypeScript compile
        run: npx tsc --noEmit
      - name: K offer tab policy regression
        run: node --test tests/k-offer-tab-policy.test.cjs
      - name: Citymarket semantic dedupe regression
        run: |
          cat > citymarket-dedupe-test.mts <<'NODE'
          import { removeCampaignCopiesOfLeaflet } from './src/app/components/ziiply/offerSearch/kOfferTabPolicy.ts';
          const cases = [
            ['brand prefix duplicate', [{title:'VÄLIPALAJUOMAT 240 ml',price:3}], [{title:'Arla SHAKE UP VÄLIPALAJUOMAT 240 ml',price:3}], 0],
            ['strong name duplicate', [{title:'AITO NAKKI 360 g',price:3.79}], [{title:'HK AITO NAKKI',price:3.79}], 0],
            ['generic different package survives', [{title:'ENERGIAJUOMAT 0,5 l/tlk',price:4}], [{title:'Nocco ENERGIAJUOMAT 0,33 l/tlk',price:4}], 1],
            ['different price survives', [{title:'Froosh SMOOTHIET 250 ml/pl',price:4}], [{title:'Froosh SMOOTHIET 250 ml/pl',price:3.5}], 1],
          ];
          for (const [name,offers,campaigns,wanted] of cases) {
            const got=removeCampaignCopiesOfLeaflet(offers,campaigns).length;
            if(got!==wanted) throw new Error(name+': expected '+wanted+' rows, got '+got);
          }
          console.log('CITYMARKET_SEMANTIC_DEDUPE_REGRESSION_OK');
          NODE
          npx --yes tsx citymarket-dedupe-test.mts
      - name: Shared offer price display regression
        run: |
          cat > offer-price-test.mts <<'NODE'
          import { getOfferPrice } from './src/app/components/ziiply/cards/ZiiplyMobileOfferSearchCard.tsx';
          const cases = [
            ['plain', {offerPrice:3.49}, '3,49 €'],
            ['citymarket leaflet', {offerPrice:4,__sourceOfferSearchResult:{offerQuantity:4,offerUnit:'PRK'}}, '4,00 € / 4 PRK'],
            ['citymarket campaign', {offerPrice:4,__sourceOfferSearchResult:{priceText:'4,00 € / 4 kpl',offerQuantity:4}}, '4,00 € / 4 kpl'],
            ['k-super', {offerPrice:'5,00 € / 2 kpl',__sourceOfferSearchResult:{priceText:'5,00 € / 2 kpl',offerQuantity:2}}, '5,00 € / 2 kpl'],
            ['lidl', {offerPrice:5,__sourceOfferSearchResult:{multiBuyQuantity:2,priceBasis:'multi-buy-total'}}, '5,00 € / 2 kpl'],
            ['eurospar', {offerPrice:6,__sourceOfferSearchResult:{offerQuantity:3,offerUnit:'kpl',priceBasis:'multi-buy-total'}}, '6,00 € / 3 kpl'],
            ['tokmanni', {offerPrice:10,__sourceOfferSearchResult:{offerQuantity:3,offerUnit:'kpl',multiBuyTotalPrice:10}}, '10,00 € / 3 kpl'],
          ];
          for (const [name,row,wanted] of cases) {
            const actual=getOfferPrice(row as any);
            console.log(name,actual,wanted);
            if(actual!==wanted) process.exitCode=1;
          }
          NODE
          npx --yes tsx offer-price-test.mts
      - name: Complete snapshot and failure-isolation regression
        run: node --test tests/kcitymarket-complete-snapshot.test.cjs

      - name: Citymarket daily goods presentation filter regression
        run: |
          cat > citymarket-filter-test.mts <<'NODE'
          import {category,filterKCitymarketDailyGoods} from './src/app/components/ziiply/offerSearch/providers/kCitymarketProvider.ts';
          const titles=['Miesten T-PAITA','VARSI-IMURI','LED-LAMPPU','GOLD & GREEN ROUHE tai PALAT 180 g','SUOSIKKISALAATIT','Libero HOUSUVAIPAT','Topz VANULAPUT','PENTUALUSTA','Tunnistamaton päivittäistavaratuote'];
          const input=titles.map((title,i)=>({id:String(i),title,category:category(title),price:i+1,imageUrl:'https://example.com/'+i+'.jpg'}));
          const output=filterKCitymarketDailyGoods(input);
          const removed=input.filter(x=>!output.includes(x));
          if(removed.length!==3 || removed.some(x=>x.category!=='Koti & vapaa-aika'))throw Error('Unexpected removals: '+JSON.stringify(removed));
          if(!output.some(x=>x.category==='Muut'))throw Error('Unknown products must be retained');
          if(output.some(x=>x.category==='Koti & vapaa-aika'))throw Error('Non-grocery product leaked');
          if(output.some(x=>x.imageUrl!==input.find(y=>y.id===x.id)?.imageUrl))throw Error('Images changed');
          console.log(JSON.stringify({retained:output.map(x=>x.title),removed:removed.map(x=>x.title)},null,2));
          NODE
          npx --yes tsx citymarket-filter-test.mts

      - name: Citymarket grocery scope audit (diagnostic only)
        run: |
          cat > citymarket-scope-audit.mts <<'NODE'
          import { category } from './src/app/components/ziiply/offerSearch/providers/kCitymarketProvider.ts';
          const outOfScope = ['Miesten T-PAITA', 'VARSI-IMURI', 'SÄHKÖSAVUSTIN', 'FARKKUJA', 'LED-LAMPPU'];
          const essentials = ['GOLD & GREEN ROUHE tai PALAT 180 g', 'SUOSIKKISALAATIT 220–280 g', 'Libero HOUSUVAIPAT', 'Topz VANULAPUT', 'PENTUALUSTA'];
          const classify = title => ({title,category:category(title)});
          const excludedCandidates = outOfScope.map(classify);
          const retainedEssentials = essentials.map(classify);
          const incorrectlyIncluded = excludedCandidates.filter(x=>x.category!=='Koti & vapaa-aika');
          const errors = retainedEssentials.filter(x=>!x.category || x.category==='Muut' || x.category==='Koti & vapaa-aika');
          console.log('CITYMARKET_SCOPE_AUDIT '+JSON.stringify({excludedCandidates,retainedEssentials,incorrectlyIncluded,errors},null,2));
          if(errors.length || incorrectlyIncluded.length) process.exitCode=1;
          // This is a diagnostic audit: do not filter real offers until scope rules are reviewed.
          NODE
          npx --yes tsx citymarket-scope-audit.mts

      - name: Citymarket category regression
        run: |
          cat > citymarket-test-2.mts <<'NODE'
          import { category } from './src/app/components/ziiply/offerSearch/providers/kCitymarketProvider.ts';
          const cases = [['Jättikatkaravunpyrstöt','Kala'],['Pussilakanasetti','Koti & vapaa-aika'],['AIRFRY KANA- ja POSSUTUOTTEET 300–350 g','Liha & makkarat'],['KANANPOJAN PANEROIDUT FILEEPALAT ja KANARANSKIKSET 250–380 g','Liha & makkarat'],['NOPEAT KANANUGETIT tai KANAPUIKOT DIPILLÄ 218 g','Liha & makkarat'],['myhome SATIINIPUSSILAKANASETTI','Koti & vapaa-aika'],['myhome SATIINIALUSLAKANA 150 x 270 cm','Koti & vapaa-aika'],['TYYNYLIINA SILKKI','Koti & vapaa-aika'],['myhome Pumpkin KORISTETYYNY','Koti & vapaa-aika'],['HALLOWEEN SERPENTIINI 2 rll/pkt tai ILMAPALLO 5 kpl/pkt','Koti & vapaa-aika'],['LASTEN KURPITSA-ASU KOKO 92 cm / 104 cm','Koti & vapaa-aika'],['VATI 20 x 35 cm','Koti & vapaa-aika'],['LAUTANEN 22 cm','Koti & vapaa-aika'],['KULHO 0,6 l','Koti & vapaa-aika'],['Drift LANGATTOMAT NAPPIKUULOKKEET','Koti & vapaa-aika'],['Grip BLUETOOTH-KAIUTIN','Koti & vapaa-aika'],['Recreate AKTIVITEETTIKORTIT','Koti & vapaa-aika'],['ROOSA NAUHA 2026','Koti & vapaa-aika'],['ROOSA NAUHA 2026 -RANNEKE','Koti & vapaa-aika'],['Remes KAAOS KIRJA','Koti & vapaa-aika'],['HEMTEX 24h ANGELICA TORKKUPEITTO','Koti & vapaa-aika'],['MUKI 0,4 l','Koti & vapaa-aika'],['Putkivarsitoppasaappaat','Koti & vapaa-aika'],['Konetiskitabletit','Kodinhoito'],['Kangasnaamio','Hygienia & kosmetiikka'],['Kirjolohi','Kala'],['Pölynimuri','Koti & vapaa-aika'],['PÖLYPUSSIT 12 kpl/pkt','Koti & vapaa-aika'],['Naisten SAAPPAAT','Koti & vapaa-aika'],['VEDENPITÄVÄT ULKOILUKENGÄT','Koti & vapaa-aika'],['PÖYTÄVALAISIN LADATTAVA','Koti & vapaa-aika'],['RUUSUKIMPPU','Koti & vapaa-aika'],['VERENPAINEMITTARI','Koti & vapaa-aika'],['REPPUKLIPSI','Koti & vapaa-aika'],['KYPSÄT PARIISINPERUNA','Valmisruoka'],['KISSAN ANNOSPUSSILAJITELMAT','Lemmikit'],['Meikkivoide SPF20','Hygienia & kosmetiikka'],['PYYKKIETIKKA','Kodinhoito'],['GOLD & GREEN ROUHE tai PALAT 180 g','Valmisruoka']];
          for (const [title,wanted] of cases) { const actual=category(title); console.log(title,actual,wanted); if(actual!==wanted) process.exitCode=1; }
          NODE
          npx --yes tsx citymarket-test-2.mts

      - name: Preserve source publications through Gosta cleanup and card mapping
        shell: bash
        run: |
          cat > citymarket-source-identity.mts <<'NODE'
          import { cleanZiiplyGostaOfferResultsV146, mapZiiplyGostaOfferToCardOfferV147 } from './src/app/components/ziiply/offerSearch/ziiplyOfferSearchCore.ts';
          const common = {title:'Kanan fileesuikaleet 300 g',name:'Kanan fileesuikaleet 300 g',price:3.99,priceText:'3,99 €',storeId:'fe95rtb',storeName:'K-Citymarket Hyvinkää',chain:'K',storeType:'K-Citymarket',provider:'kcitymarket-local',source:'K-Citymarket kauppakohtainen julkaisu',offerId:'same-offer',category:'Liha & makkarat',campaignType:'campaign'};
          const rows = ['first-publication','second-publication'].map(publicationId=>({...common,id:'citymarket-local-'+publicationId,debug:{publicationId}}));
          const cleaned = cleanZiiplyGostaOfferResultsV146(rows as any);
          const cards = cleaned.map(mapZiiplyGostaOfferToCardOfferV147);
          console.log(JSON.stringify({input:rows.length,cleaned:cleaned.length,cards:cards.length}));
          if(cleaned.length!==2 || cards.length!==2)throw new Error('Distinct source offers disappeared from Gosta');
          NODE
          npx --yes tsx citymarket-source-identity.mts

      - name: Desktop prepared dataset tab completion regression
        run: |
          cat > desktop-prepared-tabs.mts <<'NODE'
          import assert from 'node:assert/strict';
          import {warmZiiplyGostaOfferCacheV182 as warm,invalidateZiiplyGostaOfferCacheV804 as invalidate,mapZiiplyGostaOfferToCardOfferV147 as card} from './src/app/components/ziiply/offerSearch/ziiplyOfferSearchCore.ts';
          const context={kStoreName:'K-Citymarket Hyvinkää',kStoreId:'N183'};
          const common={title:'Kanan fileesuikaleet 300 g',price:3.99,priceText:'3,99 €',storeName:'K-Citymarket Hyvinkää',category:'Liha & makkarat'};
          const campaigns=Array.from({length:455},(_,i)=>({...common,id:'local-'+i,provider:'kcitymarket-local',source:'K-Citymarket kauppakohtainen julkaisu',offerId:'offer-'+i,debug:{publicationId:'publication-'+(i%3)},campaignType:'offer'}));
          const offers=Array.from({length:89},(_,i)=>({...common,id:'kcm:spatial:'+i,source:'K-Citymarket tarjouslehti',campaignType:'campaign'}));
          let calls=0;
          globalThis.fetch=async()=>{calls++;return new Response(JSON.stringify({ok:true,complete:true,results:[...campaigns,...offers]}),{status:200});};
          const result=await warm(context);
          assert.equal(result.campaigns.length,455);assert.equal(result.offers.length,89);
          assert.equal(result.campaigns.map(card).length,455);
          await warm(context);assert.equal(calls,1);
          invalidate(context);
          globalThis.fetch=async()=>new Response(JSON.stringify({ok:true,complete:false,results:campaigns.slice(0,3)}),{status:200});
          await assert.rejects(()=>warm(context));
          console.log('DESKTOP_PREPARED_TABS_OK campaigns=455 offers=89 cards=455 cached_requests=1 incomplete=rejected');
          NODE
          npx --yes tsx desktop-prepared-tabs.mts
