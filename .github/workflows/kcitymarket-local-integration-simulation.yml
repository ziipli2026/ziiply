name: Citymarket local offer integration simulation
on:
  push:
    paths:
      - 'src/app/components/ziiply/offerSearch/providers/kCitymarketLocalTjekProvider.ts'
      - 'src/app/api/offers/search/route.ts'
      - '.github/workflows/kcitymarket-local-integration-simulation.yml'
  workflow_dispatch:
jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --package-lock=false --no-audit --no-fund
      - name: TypeScript compile
        run: npx tsc --noEmit
      - name: Simulate two selected stores and failure isolation
        shell: bash
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { fetchKCitymarketSelectedStoreOffers } from './src/app/components/ziiply/offerSearch/providers/kCitymarketLocalTjekProvider.ts';
          const a=await fetchKCitymarketSelectedStoreOffers('K-Citymarket Hyvinkää');
          const b=await fetchKCitymarketSelectedStoreOffers('K-Citymarket Vantaa Jumbo');
          const unknown=await fetchKCitymarketSelectedStoreOffers('K-Citymarket Ei Ole Olemassa');
          const check=(rows,store)=>rows.every(row=>row.storeName===store&&Number.isFinite(row.price)&&row.price>0&&row.validFrom&&row.validUntil&&row.source==='K-Citymarket kauppakohtainen julkaisu');
          const idsA=new Set(a.map(x=>x.id));
          const overlap=b.filter(x=>idsA.has(x.id)).length;
          console.log(JSON.stringify({hyvinkaa:{count:a.length,sample:a.slice(0,3).map(x=>({title:x.title,price:x.price,publication:x.debug?.publicationId}))},jumbo:{count:b.length,sample:b.slice(0,3).map(x=>({title:x.title,price:x.price,publication:x.debug?.publicationId}))},unknownCount:unknown.length,overlap,hyvinkaaValid:check(a,'K-Citymarket Hyvinkää'),jumboValid:check(b,'K-Citymarket Vantaa Jumbo')},null,2));
          if(!a.length||!b.length||unknown.length||overlap||!check(a,'K-Citymarket Hyvinkää')||!check(b,'K-Citymarket Vantaa Jumbo'))process.exitCode=1;
          NODE
