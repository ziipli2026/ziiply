name: Citymarket local offer integration simulation
on:
  pull_request:
  push:
    paths:
      - 'src/app/components/ziiply/offerSearch/providers/kCitymarketLocalTjekProvider.ts'
      - 'src/app/api/offers/search/route.ts'
      - 'scripts/ziiply-fineli-discover-candidates.mts'
      - 'src/app/components/ziiply/offerSearch/kOfferTabPolicy.ts'
      - 'tests/k-offer-tab-policy.test.cjs'
      - 'tests/kcitymarket-source-coexistence.test.cjs'
      - 'src/app/components/ziiply/cards/ZiiplyMobileOfferSearchCard.tsx'
      - 'src/app/components/ziiply/offerSearch/ziiplyOfferSearchCore.ts'
      - 'scripts/audit-gosta-cart-multibuy-20261001.cjs'
      - 'src/app/page.tsx'
      - 'src/app/components/ziiply/offerSearch/providers/kCitymarketProvider.ts'
      - '.github/workflows/kcitymarket-local-integration-simulation.yml'
  workflow_dispatch:
jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --package-lock=false --no-audit --no-fund
      - name: TypeScript compile
        run: npx tsc --noEmit
      - name: K-Ruoka and Tjek coexistence regression
        run: node --test tests/kcitymarket-source-coexistence.test.cjs
      - name: K offer tab policy regression
        run: node --test tests/k-offer-tab-policy.test.cjs
      - name: Citymarket semantic dedupe regression
        run: |
          cat > citymarket-dedupe-test.mts <<'NODE'
          import { removeCampaignCopiesOfLeaflet } from './src/app/components/ziiply/offerSearch/kOfferTabPolicy.ts';
          const cases = [
            ['brand prefix duplicate', [{title:'VÄLIPALAJUOMAT 240 ml',price:3}], [{title:'Arla SHAKE UP VÄLIPALAJUOMAT 240 ml',price:3}], 0],
            ['strong name duplicate', [{title:'AITO NAKKI 360 g',price:3.79}], [{title:'HK AITO NAKKI',price:3.79}], 0],
            ['generic different package survives', [{title:'ENERGIAJUOMAT 0,5 l/tlk',price:4}], [{title:'Nocco ENERGIAJUOMAT 0,33 l/tlk',price:4}], 1],
            ['different price survives', [{title:'Froosh SMOOTHIET 250 ml/pl',price:4}], [{title:'Froosh SMOOTHIET 250 ml/pl',price:3.5}], 1],
          ];
          for (const [name,offers,campaigns,wanted] of cases) {
            const got=removeCampaignCopiesOfLeaflet(offers,campaigns).length;
            if(got!==wanted) throw new Error(name+': expected '+wanted+' rows, got '+got);
          }
          console.log('CITYMARKET_SEMANTIC_DEDUPE_REGRESSION_OK');
          NODE
          npx --yes tsx citymarket-dedupe-test.mts
      - name: Shared offer price display regression
        run: |
          cat > offer-price-test.mts <<'NODE'
          import { getOfferPrice } from './src/app/components/ziiply/cards/ZiiplyMobileOfferSearchCard.tsx';
          const cases = [
            ['plain', {offerPrice:3.49}, '3,49 €'],
            ['citymarket leaflet', {offerPrice:4,__sourceOfferSearchResult:{offerQuantity:4,offerUnit:'PRK'}}, '4,00 € / 4 PRK'],
            ['citymarket campaign', {offerPrice:4,__sourceOfferSearchResult:{priceText:'4,00 € / 4 kpl',offerQuantity:4}}, '4,00 € / 4 kpl'],
            ['k-super', {offerPrice:'5,00 € / 2 kpl',__sourceOfferSearchResult:{priceText:'5,00 € / 2 kpl',offerQuantity:2}}, '5,00 € / 2 kpl'],
            ['prisma reverse bundle', {offerPrice:'3 kpl = 12 €',__sourceOfferSearchResult:{priceText:'3 kpl = 12 €'}}, '12 € / 3 kpl'],
            ['lidl', {offerPrice:5,__sourceOfferSearchResult:{multiBuyQuantity:2,priceBasis:'multi-buy-total'}}, '5,00 € / 2 kpl'],
            ['eurospar', {offerPrice:6,__sourceOfferSearchResult:{offerQuantity:3,offerUnit:'kpl',priceBasis:'multi-buy-total'}}, '6,00 € / 3 kpl'],
            ['tokmanni', {offerPrice:10,__sourceOfferSearchResult:{offerQuantity:3,offerUnit:'kpl',multiBuyTotalPrice:10}}, '10,00 € / 3 kpl'],
          ];
          for (const [name,row,wanted] of cases) {
            const actual=getOfferPrice(row as any);
            console.log(name,actual,wanted);
            if(actual!==wanted) process.exitCode=1;
          }
          NODE
          npx --yes tsx offer-price-test.mts
      - name: Prisma and Cittari offer-card regression
        run: |
          cat > offer-card-regression.mts <<'NODE'
          import { enrichPrismaCampaignMultiBuyV233, mapZiiplyGostaOfferToCardOfferV147 } from './src/app/components/ziiply/offerSearch/ziiplyOfferSearchCore.ts';
          const source={ean:'6408659993003',storeLabel:'Prisma Hyvinkää',campaignType:'offer',benefitText:'4 kpl = 2 €'};
          const campaign={ean:'6408659993003',storeLabel:'Prisma Hyvinkää',campaignType:'campaign',benefitText:'Mehut'};
          const result=enrichPrismaCampaignMultiBuyV233([campaign] as any,[source,campaign] as any,'Prisma Hyvinkää');
          if(result[0].benefitText!=='4 kpl = 2 €') throw Error('Prisma multi-buy condition lost');
          for(const [priceText,quantity,total] of [['8,00 € / 3 kpl',3,8],['3 kpl = 12 €',3,12],['4,00 € / 2 kpl',2,4]] as const){
            const card=mapZiiplyGostaOfferToCardOfferV147({id:'test',title:'Test',priceText,benefitText:'Ruokatuotteet',category:'Ruokatuotteet'} as any);
            if(card.bundleQuantity!==quantity||card.bundleTotalPrice!==total) throw Error('Wrong bundle metadata '+priceText);
            if(card.discountText.includes('Ruokatuotteet')) throw Error('Category leaked into discount '+priceText);
          }
          const percent=mapZiiplyGostaOfferToCardOfferV147({id:'percent',title:'Test',priceText:'−20%',benefitText:'Ruokatuotteet',category:'Ruokatuotteet'} as any);
          if(percent.discountText!=='−20%') throw Error('Percent discount lost or category leaked');
          const plain=mapZiiplyGostaOfferToCardOfferV147({id:'plain',title:'Test',priceText:'2,99 €',benefitText:'Ruokatuotteet',category:'Ruokatuotteet'} as any);
          if(plain.bundleTotalPrice!==null||plain.bundleQuantity!==null) throw Error('Single price mistaken for bundle');
          const reversed=mapZiiplyGostaOfferToCardOfferV147({id:'reverse',title:'Test',priceText:'3 kpl = 12 €',benefitText:'Ruokatuotteet',category:'Ruokatuotteet'} as any);
          if(reversed.discountText!=='3 kpl = 12 €') throw Error('Reverse bundle condition not displayed');
          console.log('PRISMA_CITTARI_OFFER_CARD_REGRESSION_OK');
          NODE
          npx --yes tsx offer-card-regression.mts
      - name: Prisma and Cittari cart multi-buy regression
        run: node scripts/audit-gosta-cart-multibuy-20261001.cjs
      # Snapshot-backed tests require a database with active store publications.
      # Never mistake an unconfigured runner for an empty production feed.
      - name: Explain snapshot integration prerequisites
        if: ${{ env.CITYMARKET_SNAPSHOT_TEST_ENABLED != 'true' }}
        run: echo "::warning::Live Citymarket snapshot checks skipped; configure CITYMARKET_SNAPSHOT_TEST_ENABLED=true and DATABASE_URL for a populated read-only test database."
      - name: Simulate two selected stores and failure isolation (live snapshot only)
        if: ${{ env.CITYMARKET_SNAPSHOT_TEST_ENABLED == 'true' }}
        shell: bash
        run: |
          cat > citymarket-test-1.mts <<'NODE'
          import { fetchKCitymarketSelectedStoreOffers } from './src/app/components/ziiply/offerSearch/providers/kCitymarketLocalTjekProvider.ts';
          if (!process.env.DATABASE_URL) {
            console.error('CITYMARKET_SNAPSHOT_PREREQUISITE_MISSING: DATABASE_URL is not configured for this GitHub Actions job. The provider reads Neon snapshots only; it does not fetch live Tjek offers. Configure a read-only test database connection or run a separate deterministic provider test.');
            process.exit(1);
          }
          const a=await fetchKCitymarketSelectedStoreOffers('K-Citymarket Hyvinkää');
          const b=await fetchKCitymarketSelectedStoreOffers('K-Citymarket Vantaa Jumbo');
          const unknown=await fetchKCitymarketSelectedStoreOffers('K-Citymarket Ei Ole Olemassa');
          const check=(rows,store)=>rows.every(row=>row.storeName.replace(/[‑–]/g,'-')===store&&row.campaignType==='campaign'&&typeof row.category==='string'&&Number.isFinite(row.price)&&row.price>0&&row.validFrom&&row.validUntil&&row.source==='K-Citymarket kauppakohtainen julkaisu');
          console.log('VALIDATION_DIAGNOSTIC '+JSON.stringify({a:a.slice(0,2).map(x=>({storeName:x.storeName,price:x.price,validFrom:x.validFrom,validUntil:x.validUntil,source:x.source})),b:b.slice(0,2).map(x=>({storeName:x.storeName,price:x.price,validFrom:x.validFrom,validUntil:x.validUntil,source:x.source}))}));
          const idsA=new Set(a.map(x=>x.id));
          const overlap=b.filter(x=>idsA.has(x.id)).length;
          const publicationA=new Set(a.map(x=>x.debug?.publicationId).filter(Boolean));
          const publicationB=new Set(b.map(x=>x.debug?.publicationId).filter(Boolean));
          const categoriesValid=[...a,...b].every(x=>typeof x.category==='string'&&x.category.length>0);
          console.log(JSON.stringify({hyvinkaa:{count:a.length,publications:[...publicationA],sample:a.slice(0,3).map(x=>({title:x.title,price:x.price,publication:x.debug?.publicationId}))},jumbo:{count:b.length,publications:[...publicationB],sample:b.slice(0,3).map(x=>({title:x.title,price:x.price,publication:x.debug?.publicationId}))},unknownCount:unknown.length,overlap,categoriesValid,hyvinkaaValid:check(a,'K-Citymarket Hyvinkää'),jumboValid:check(b,'K-Citymarket Vantaa Jumbo')},null,2));
          if(!a.length||!b.length||unknown.length||overlap||!publicationA.size||!publicationB.size||!categoriesValid||!check(a,'K-Citymarket Hyvinkää')||!check(b,'K-Citymarket Vantaa Jumbo'))process.exitCode=1;
          NODE
          npx --yes tsx citymarket-test-1.mts

      - name: Citymarket category regression
        run: |
          cat > citymarket-test-2.mts <<'NODE'
          import { category } from './src/app/components/ziiply/offerSearch/providers/kCitymarketProvider.ts';
          const cases = [['Jättikatkaravunpyrstöt','Kala'],['Pussilakanasetti','Koti & vapaa-aika'],['AIRFRY KANA- ja POSSUTUOTTEET 300–350 g','Liha & makkarat'],['KANANPOJAN PANEROIDUT FILEEPALAT ja KANARANSKIKSET 250–380 g','Liha & makkarat'],['NOPEAT KANANUGETIT tai KANAPUIKOT DIPILLÄ 218 g','Liha & makkarat'],['myhome SATIINIPUSSILAKANASETTI','Koti & vapaa-aika'],['myhome SATIINIALUSLAKANA 150 x 270 cm','Koti & vapaa-aika'],['TYYNYLIINA SILKKI','Koti & vapaa-aika'],['myhome Pumpkin KORISTETYYNY','Koti & vapaa-aika'],['HALLOWEEN SERPENTIINI 2 rll/pkt tai ILMAPALLO 5 kpl/pkt','Koti & vapaa-aika'],['LASTEN KURPITSA-ASU KOKO 92 cm / 104 cm','Koti & vapaa-aika'],['VATI 20 x 35 cm','Koti & vapaa-aika'],['LAUTANEN 22 cm','Koti & vapaa-aika'],['KULHO 0,6 l','Koti & vapaa-aika'],['Drift LANGATTOMAT NAPPIKUULOKKEET','Koti & vapaa-aika'],['Grip BLUETOOTH-KAIUTIN','Koti & vapaa-aika'],['Recreate AKTIVITEETTIKORTIT','Koti & vapaa-aika'],['ROOSA NAUHA 2026','Koti & vapaa-aika'],['ROOSA NAUHA 2026 -RANNEKE','Koti & vapaa-aika'],['Remes KAAOS KIRJA','Koti & vapaa-aika'],['HEMTEX 24h ANGELICA TORKKUPEITTO','Koti & vapaa-aika'],['MUKI 0,4 l','Koti & vapaa-aika'],['Putkivarsitoppasaappaat','Koti & vapaa-aika'],['Konetiskitabletit','Kodinhoito'],['Kangasnaamio','Hygienia & kosmetiikka'],['Kirjolohi','Kala'],['Pölynimuri','Koti & vapaa-aika'],['PÖLYPUSSIT 12 kpl/pkt','Koti & vapaa-aika'],['Naisten SAAPPAAT','Koti & vapaa-aika'],['VEDENPITÄVÄT ULKOILUKENGÄT','Koti & vapaa-aika'],['PÖYTÄVALAISIN LADATTAVA','Koti & vapaa-aika'],['RUUSUKIMPPU','Koti & vapaa-aika'],['VERENPAINEMITTARI','Koti & vapaa-aika'],['REPPUKLIPSI','Koti & vapaa-aika'],['KYPSÄT PARIISINPERUNA','Valmisruoka'],['KISSAN ANNOSPUSSILAJITELMAT','Lemmikit'],['Meikkivoide SPF20','Hygienia & kosmetiikka'],['PYYKKIETIKKA','Kodinhoito']];
          for (const [title,wanted] of cases) { const actual=category(title); console.log(title,actual,wanted); if(actual!==wanted) process.exitCode=1; }
          NODE
          npx --yes tsx citymarket-test-2.mts

      - name: Simulate Gosta Citymarket tabs and category navigation (live snapshot only)
        if: ${{ env.CITYMARKET_SNAPSHOT_TEST_ENABLED == 'true' }}
        shell: bash
        run: |
          cat > citymarket-test-3.mts <<'NODE'
          import { fetchKCitymarketSelectedStoreOffers } from './src/app/components/ziiply/offerSearch/providers/kCitymarketLocalTjekProvider.ts';
          import { fetchKCitymarketOffers } from './src/app/components/ziiply/offerSearch/providers/kCitymarketProvider.ts';
          import { removeCampaignCopiesOfLeaflet } from './src/app/components/ziiply/offerSearch/kOfferTabPolicy.ts';
          const [national, local, jumbo] = await Promise.all([
            fetchKCitymarketOffers(),
            fetchKCitymarketSelectedStoreOffers('K-Citymarket Hyvinkää'),
            fetchKCitymarketSelectedStoreOffers('K-Citymarket Vantaa Jumbo')
          ]);
          const offers=national.filter(x=>x.campaignType!=='campaign');
          const campaigns=removeCampaignCopiesOfLeaflet(offers, local.filter(x=>x.campaignType==='campaign'));
          const master=[...offers,...campaigns];
          const categories=[...new Set(campaigns.map(x=>x.category))];
          const visible=categories.flatMap(category=>campaigns.filter(x=>x.category===category));
          const localIds=new Set(local.map(x=>x.id));
          const jumboIds=new Set(jumbo.map(x=>x.id));
          const foreign=campaigns.filter(x=>jumboIds.has(x.id));
          const missing=local.filter(x=>!visible.some(y=>y.id===x.id));
          const wrongTab=offers.filter(x=>localIds.has(x.id));
          const badCampaignCategories=campaigns.filter(x=>!x.category||x.category==='Muut');
          const badOfferCategories=offers.filter(x=>!x.category||x.category==='Muut');
          const badCategories=[...badOfferCategories,...badCampaignCategories];
          const unexpectedFallbacks=badCategories.map(x=>x.title);
          console.log('GOSTA_UI_SIMULATION '+JSON.stringify({national:national.length,local:local.length,jumbo:jumbo.length,offersTab:offers.length,campaignTab:campaigns.length,categories:categories.map(category=>({category,count:campaigns.filter(x=>x.category===category).length})),foreign:foreign.length,missing:missing.length,wrongTab:wrongTab.length,uncategorized:badCategories.map(x=>x.title),offerFallbacks:badOfferCategories.map(x=>x.title),campaignFallbacks:badCampaignCategories.map(x=>x.title),unexpectedFallbacks},null,2));
          if(!national.length||!local.length||!jumbo.length||foreign.length||wrongTab.length||visible.length!==campaigns.length||campaigns.length>local.length||unexpectedFallbacks.length)process.exitCode=1;
          NODE
          npx --yes tsx citymarket-test-3.mts
  browser:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Check the same address on phone, tablet and desktop
        run: |
          npm run start -- -H 127.0.0.1 -p 3100 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3100/ > /dev/null; then break; fi
            sleep 1
          done
          node <<'NODE'
          const { chromium, devices } = require('playwright');
          const assert = require('node:assert/strict');
          const url = 'http://127.0.0.1:3100/';
          (async () => {
            const browser = await chromium.launch();
            try {
              for (const [name, options, desktop] of [
                ['phone', devices['iPhone 13'], false],
                ['touch tablet', { viewport: { width: 1024, height: 1366 }, hasTouch: true, isMobile: true }, false],
                ['narrow window', { viewport: { width: 800, height: 900 } }, false],
                ['desktop', { viewport: { width: 1440, height: 900 } }, true],
              ]) {
                const context = await browser.newContext(options);
                await context.grantPermissions(['geolocation']);
                await context.setGeolocation({ latitude: 60.63, longitude: 24.86 });
                await context.addInitScript(() => {
                  const store = { id: '634976534', name: 'Prisma Hyvinkää', chain: 'S', latitude: 60.63, longitude: 24.86 };
                  if (!localStorage.getItem('ziiply-desktop-store-choices-v1')) {
                    localStorage.setItem('ziiply-desktop-store-choices-v1', JSON.stringify({
                      storeMode: 'hyper', storeModeChosen: true, selectedChain: 'S',
                      betweenMode: 'one', storeCompareScope: 'between_chains',
                      allStoreSelections: { hyper: { [store.id]: store }, local: {} }
                    }));
                  }
                  if (!localStorage.getItem('ziiply-store-selection-v536')) {
                    localStorage.setItem('ziiply-store-selection-v536', JSON.stringify({
                      activeArea: { label: 'Hyvinkää', sStoreId: store.id, sStoreName: store.name },
                      storeMode: 'hyper', storeModeChosenV299: true,
                      storeCompareScope: 'between_chains', betweenChainSelectionModeV749: 'one',
                      selectedChains: { s: true }
                    }));
                  }
                  localStorage.setItem('ziiply-gosta-offer-watches-v1', JSON.stringify(['kahvi']));
                });
                const page = await context.newPage();
                await page.route('**/api/offers/watch?*', route => route.fulfill({ json: {
                  ok: true, partial: false, results: [{
                    id: '6411001000110', ean: '6411001000110', title: 'Testikahvi 500 g',
                    name: 'Testikahvi 500 g', chain: 'S', storeName: 'Prisma Hyvinkää',
                    offerPrice: 4.99, price: 4.99, source: 'fixture', watchQueries: ['kahvi'],
                    validFrom: new Date(Date.now() - 86400000).toISOString().slice(0, 10),
                    validUntil: new Date(Date.now() + 86400000).toISOString().slice(0, 10)
                  }]
                }}));
                const errors = [];
                page.on('pageerror', error => errors.push(error.message));
                const response = await page.goto(url);
                assert.equal(response.status(), 200);
                const mobileHome = page.getByRole('region', { name: 'Ziiplyn avustajat' });
                const desktopHome = page.locator('[data-desktop-layout]');
                await (desktop ? desktopHome : mobileHome).waitFor({ timeout: 25000 });
                assert.equal(await (desktop ? mobileHome : desktopHome).count(), 0);
                assert.equal(page.url(), url);
                await page.getByRole('button', { name: 'Avaa tarjousvahdin 1 osumaa' }).click({ timeout: 30000 });
                if (desktop) await page.getByRole('button', { name: /Tavaratalot · 1 tarjousta/ }).click();
                await page.getByText('Testikahvi 500 g', { exact: true }).first().waitFor({ timeout: 10000 });
                await page.getByRole('button', { name: 'Lisää ostoskoriin', exact: true }).first().click();
                await page.waitForFunction(({ desktop, ean }) => {
                  const saved = desktop
                    ? JSON.parse(sessionStorage.getItem('ziiply-desktop-current-cart-v1') || '[]')
                    : JSON.parse(localStorage.getItem('ziiply-cart-v1') || '{}').items || [];
                  return saved.some(item => String(item.ean ?? item.product?.ean) === ean);
                }, { desktop, ean: '6411001000110' }, { timeout: 10000 });
                assert.deepEqual(errors, []);
                const search = await context.newPage();
                let queries = 0;
                await search.route('**/api/s-products?*', route => {
                  const params = new URL(route.request().url()).searchParams;
                  if (/maito/i.test(params.get('search') || '')) {
                    assert.equal(params.get('store'), '634976534');
                    queries++;
                  }
                  if (/Maitolaakson/i.test(params.get('search') || '')) {
                    return route.fulfill({ json: { products: [
                      { id: 99, name: 'Maitolaakson kevytmaito 1 l', ean: '6411001000999', price: 109 },
                      { id: 100, name: 'Maitolaakson kevytmaito 1 l', ean: '6411001000998', price: 89 }
                    ] } });
                  }
                  return route.fulfill({ json: { products: [
                    { id: 1, name: 'Valio täysmaito 1 l', ean: '6408430106443', price: 179 },
                    { id: 2, name: 'Kotimaista kevytmaito 1 l', ean: '6438460292804', price: 95 },
                    { id: 22, name: 'Kotimaista kevytmaito 1 l', ean: '6438460292804', price: 125 },
                    { id: 3, name: 'Maitokolmio ruisleipä', ean: '6411001000111', price: 49 },
                    { id: 4, name: 'Arla rasvaton maito 1 l', ean: '6413300101713', price: 0 }
                  ] } });
                });
                let catalogQueries = 0;
                await search.route('**/api/neon-first-search?*', route => {
                  catalogQueries++;
                  return route.fulfill({ json: { products: [
                    { id: 'catalog-only', name: 'Maitolaakson kevytmaito 1 l', ean: '6411001000999', price: 0 },
                    { id: 'catalog-unpriced', name: 'Maitolaakson täysmaito 1 l', ean: '6411001000997', price: 0 }
                  ] } });
                });
                // On first boot the app intentionally clears store selections when
                // its CacheStorage boot marker is absent. Initialize that marker,
                // then seed a deterministic store selection before search.
                await search.goto(url);
                await search.evaluate(async () => {
                  const cache = await caches.open('ziiply-boot-marker-v778');
                  await cache.put('/__ziiply_boot_marker_v778__', new Response('1'));
                  localStorage.setItem('ziiply-store-selection-v536', JSON.stringify({
                    version: 1, savedAt: Date.now(),
                    activeArea: { label: 'Hyvinkää', sStoreId: '634976534', sStoreName: 'Prisma Hyvinkää' },
                    storeMode: 'hyper', storeModeChosenV299: true,
                    storeCompareScope: 'between_chains', betweenChainSelectionModeV749: 'one',
                    selectedChains: { s: true, k: false, lidl: false, tokmanni: false }
                  }));
                });
                await search.reload();
                if (desktop) await search.getByRole('button', { name: 'Avaa Justiina', exact: true }).click();
                else await search.getByRole('button', { name: 'Justiina: Tuotehaku', exact: true }).click();
                const input = desktop ? search.getByRole('textbox', { name: 'Hae tuotteita' })
                  : search.getByPlaceholder(/Kirjoita yksi tuote|maito, kahvi/).filter({ visible: true });
                await input.fill('maito');
                const cheap = search.getByText('Kotimaista kevytmaito 1 l', { exact: true }).filter({ visible: true }).first();
                const expensive = search.getByText('Valio täysmaito 1 l', { exact: true }).filter({ visible: true }).first();
                try {
                  if (!desktop) {
                    const openResults = search.getByRole('button', { name: /Avaa löytöluettelo/ }).filter({ visible: true });
                    await cheap.or(openResults).first().waitFor({ timeout: 20000 });
                    if (!(await cheap.isVisible()) && await openResults.count() === 1) await openResults.click();
                  }
                  await cheap.waitFor({ timeout: 10000 });
                } catch (error) {
                  console.log('Search state', name, 'store queries:', queries, (await search.locator('body').innerText()).slice(0, 2500));
                  throw error;
                }
                await expensive.waitFor();
                assert.ok(queries > 0);
                assert.ok((await cheap.boundingBox()).y <= (await expensive.boundingBox()).y);
                // Same EAN from two provider rows must appear once; the cheapest
                // quote (95 cents) wins over the 125-cent duplicate.
                assert.equal(await search.getByText('Kotimaista kevytmaito 1 l', { exact: true }).filter({ visible: true }).count(), 1);
                const cheapRowText = await cheap.locator('xpath=..').innerText();
                assert.ok(cheapRowText.includes('0,95') || (await search.locator('body').innerText()).includes('0,95 €'));
                assert.equal(await search.getByText('Maitokolmio ruisleipä', { exact: true }).count(), 0);
                assert.equal(await search.getByText('Arla rasvaton maito 1 l', { exact: true }).count(), 0);
                // Neon metadata may recover a product only from a matching EAN
                // with a positive price at the selected store. A cheaper but
                // different-EAN lookup result must not be substituted.
                assert.ok(catalogQueries > 0);
                const recovered = search.getByText('Maitolaakson kevytmaito 1 l', { exact: true }).filter({ visible: true });
                await recovered.first().waitFor({ timeout: 10000 });
                assert.equal(await recovered.count(), 1);
                assert.equal(await search.getByText('Maitolaakson täysmaito 1 l', { exact: true }).count(), 0);
                console.log(name + ' passed');
                await context.close();
              }
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
