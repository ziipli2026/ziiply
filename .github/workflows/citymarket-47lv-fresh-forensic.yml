name: 47LV fresh source forensic reparse
on:
  push:
    branches:
      - audit/47lv-fresh-raw-reparse-20261119
  workflow_dispatch:
jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check grocery-only publication gate
        run: node --test tests/kcitymarket-daily-grocery-gate.test.mjs tests/kcitymarket-heading-collision.test.mjs
      - name: Reparse original 47LV directly from publisher
        run: node scripts/citymarket/export-leaflet.mjs https://kcm-tarjouslehdet.k-ruoka.fi/94s5ius_tarjouslehti_47LV_KCM/index.html 47lv-fresh
      - name: Compare fresh uncorrected spatial rows against previous 53-row fixture
        if: always()
        run: node scripts/citymarket/compare-47lv-fresh.mjs 47lv-fresh
      - name: Verify production offer conversion and grocery filtering offline
        run: |
          npm install --prefix "$RUNNER_TEMP/47lv-audit" --no-audit --no-fund --ignore-scripts typescript@5.9.3
          NODE_PATH="$RUNNER_TEMP/47lv-audit/node_modules" node scripts/citymarket/verify-47lv-provider.cjs 47lv-fresh
          ln -s "$RUNNER_TEMP/47lv-audit/node_modules" node_modules
          node scripts/citymarket/test-quality-multipack.mjs
      - name: Preserve PDF and raw comparison for independent inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citymarket-47lv-fresh-raw-forensic
          path: 47lv-fresh/
          retention-days: 14
