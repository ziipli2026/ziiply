name: Lidl Varkaus end-to-end API

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lidl-varkaus-e2e.yml'
      - 'src/app/api/offers/search/**'
      - 'src/app/components/ziiply/offerSearch/providers/lidlProvider.ts'
      - 'src/app/components/ziiply/offerSearch/providers/lidlPublicLeafletProvider.ts'
      - 'src/app/components/ziiply/offerSearch/lidlPublicationConfig.ts'
      - 'src/app/components/ziiply/offerSearch/publicationStore.ts'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      # The API route's verified official-leaflet fallback stages/reads snapshots in Neon.
      # Without this connection, an upstream Lidl 400 leaves the test with zero rows.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Start Ziiply
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/ziiply.log 2>&1 &
          echo $! > /tmp/ziiply.pid
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:3000/ >/dev/null && break
            sleep 1
          done
      - name: Call actual Varkaus Lidl API route
        run: |
          if [ -n "$DATABASE_URL" ]; then
            URL='http://127.0.0.1:3000/api/offers/search?q=__ziiply_all_offers__&provider=lidl&lidlStoreKey=4527&lidlStoreName=Varkaus'
          else
            echo 'DATABASE_URL unavailable in Actions; testing real production endpoint instead.'
            URL="${ZIIPLY_BASE_URL%/}/api/offers/search?q=__ziiply_all_offers__&provider=lidl&lidlStoreKey=4527&lidlStoreName=Varkaus"
          fi
          curl -fsS "$URL" -o /tmp/lidl.json
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/lidl.json','utf8'));
          const rows=Array.isArray(p.results)?p.results:[];
          console.log('E2E',JSON.stringify({ok:p.ok,provider:p.provider,storeKey:p.storeKey,storeName:p.storeName,results:rows.length,audit:p.lidlSourceAudit}));
          for(const x of rows.slice(0,40)) console.log('RESULT',JSON.stringify({id:x.id,title:x.title,name:x.name,category:x.category,price:x.price,priceText:x.priceText,campaignType:x.campaignType,source:x.source}));
          const offerRows=rows.filter(x=>x.campaignType!=='campaign');
          const campaignRows=rows.filter(x=>x.campaignType==='campaign');
          const nationalLeafletOffers=offerRows.filter(x=>['verified-official-leaflet','lidl-fi-public'].includes(String(x.source||'')));
          console.log('TAB_AUDIT',JSON.stringify({offers:offerRows.length,campaigns:campaignRows.length,nationalLeafletOffers:nationalLeafletOffers.length}));
          if(!p.ok || p.provider!=='lidl' || p.storeKey!=='4527' || rows.length===0 || offerRows.length===0 || nationalLeafletOffers.length===0) process.exit(1);
          NODE

      - name: Verify national Lidl offers survive missing store feed identity
        shell: bash
        run: |
          if [ -n "$DATABASE_URL" ]; then
            URL='http://127.0.0.1:3000/api/offers/search?q=__ziiply_all_offers__&provider=lidl&lidlStoreName=Varkaus'
          else
            URL="${ZIIPLY_BASE_URL%/}/api/offers/search?q=__ziiply_all_offers__&provider=lidl&lidlStoreName=Varkaus"
          fi
          curl -fsS "$URL" -o /tmp/lidl-national.json
          node <<'NODE'
          const p=require('/tmp/lidl-national.json');
          const rows=Array.isArray(p.results)?p.results:[];
          const offers=rows.filter(x=>x.campaignType!=='campaign');
          const national=offers.filter(x=>['verified-official-leaflet','lidl-fi-public'].includes(String(x.source||'')));
          console.log('NATIONAL_FALLBACK',JSON.stringify({rows:rows.length,offers:offers.length,national:national.length,storeKey:p.storeKey}));
          if(!p.ok || offers.length===0 || national.length===0) process.exit(1);
          NODE
      - name: Verify national Lidl publication for several store selections
        run: |
          node <<'NODE'
          const stores = [
            {name:'Varkaus',key:'4527'},
            {name:'Hyvinkää',key:'FI0218'},
            {name:'Jokela',key:''},
            {name:'Kuopio',key:''},
          ];
          (async()=>{
            const baselineUrl=new URL('http://127.0.0.1:3000/api/offers/search');
            baselineUrl.search=new URLSearchParams({q:'__ziiply_all_offers__',provider:'lidl'}).toString();
            const baseline=await (await fetch(baselineUrl)).json();
            const national=(baseline.results||[]).filter(x=>x.campaignType!=='campaign' && ['verified-official-leaflet','lidl-fi-public'].includes(String(x.source||'')));
            if(!baseline.ok || !national.length) throw Error('National verified Lidl publication missing');
            for(const store of stores){
              const url=new URL(baselineUrl);
              url.searchParams.set('lidlStoreName',store.name);
              if(store.key) url.searchParams.set('lidlStoreKey',store.key);
              const response=await fetch(url);
              const data=await response.json();
              const rows=(data.results||[]).filter(x=>x.campaignType!=='campaign' && ['verified-official-leaflet','lidl-fi-public'].includes(String(x.source||'')));
              const ids=new Set(rows.map(x=>String(x.id||x.name||x.title)+'|'+String(x.offerPrice??x.price)));
              const missing=national.filter(x=>!ids.has(String(x.id||x.name||x.title)+'|'+String(x.offerPrice??x.price)));
              console.log('STORE_NATIONAL',JSON.stringify({store:store.name,key:store.key,rows:rows.length,missing:missing.length,status:response.status}));
              if(!response.ok || !data.ok || !rows.length || missing.length) throw Error('National Lidl offers missing for '+store.name);
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Server log on failure
        if: failure()
        run: cat /tmp/ziiply.log || true
