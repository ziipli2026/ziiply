name: Lidl nationwide leaflet quality E2E

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lidl-varkaus-e2e.yml'
      - 'src/app/api/offers/search/**'
      - 'src/app/components/ziiply/offerSearch/providers/lidlProvider.ts'
      - 'src/app/components/ziiply/offerSearch/providers/lidlPublicLeafletProvider.ts'
      - 'src/app/components/ziiply/offerSearch/lidlPublicationConfig.ts'
      - 'src/app/components/ziiply/offerSearch/publicationStore.ts'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      # The API route's verified official-leaflet fallback stages/reads snapshots in Neon.
      # Without this connection, an upstream Lidl 400 leaves the test with zero rows.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Start Ziiply
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/ziiply.log 2>&1 &
          echo $! > /tmp/ziiply.pid
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:3000/ >/dev/null && break
            sleep 1
          done
      - name: Audit nationwide official Lidl leaflet and store independence
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const base='http://127.0.0.1:3000/api/offers/search';
          const sources=new Set(['verified-official-leaflet','lidl-fi-public']);
          const day=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Helsinki',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
          const value=x=>String(x??'').trim();
          const identity=x=>[value(x.id||x.name||x.title),value(x.offerPrice??x.price),value(x.validFrom),value(x.validUntil)].join('|');
          const official=rows=>rows.filter(x=>x.campaignType!=='campaign'&&sources.has(value(x.source)));
          const get=async params=>{
            const url=new URL(base);
            url.search=new URLSearchParams({q:'__ziiply_all_offers__',provider:'lidl',...params}).toString();
            const res=await fetch(url);
            assert.equal(res.status,200,'Lidl API HTTP status');
            const json=await res.json();
            assert.equal(json.ok,true,'Lidl API ok');
            assert.equal(json.provider,'lidl','Lidl provider');
            assert.ok(Array.isArray(json.results),'Lidl results array');
            return json;
          };
          (async()=>{
            const national=await get({});
            const rows=national.results;
            const offers=official(rows);
            assert.ok(offers.length>0,'Official dated national Lidl leaflet missing');
            const errors=[];
            let images=0, dated=0, categoryMissing=0, campaigns=0;
            const ids=new Set();
            for(const x of rows){
              const name=value(x.name||x.title);
              const price=Number(x.offerPrice??x.price);
              if(!name) errors.push('Missing product name: '+value(x.id));
              if(!Number.isFinite(price)||price<=0) errors.push('Invalid price: '+name);
              if(x.campaignType==='campaign'){campaigns++;continue;}
              if(!sources.has(value(x.source))) continue;
              const key=identity(x);
              if(ids.has(key)) errors.push('Duplicate official row: '+key);
              ids.add(key);
              if(value(x.imageUrl||x.image||x.pictureUrl)) images++;
              if(!value(x.category)||value(x.category).toLowerCase()==='muut') categoryMissing++;
              const from=value(x.validFrom).slice(0,10),until=value(x.validUntil).slice(0,10);
              if(from&&until){
                dated++;
                if(from>until||day<from||day>until) errors.push('Expired or future official row: '+key);
              } else errors.push('Missing leaflet validity: '+key);
              const quantity=Number(x.multiBuyQuantity);
              if(Number.isFinite(quantity)&&quantity>=2){
                const total=Number(x.multiBuyTotalPrice??x.offerPrice??x.price);
                if(!Number.isFinite(total)||total<=0) errors.push('Invalid multibuy total: '+key);
              }
            }
            const selected=await get({lidlStoreKey:'4527',lidlStoreName:'Varkaus'});
            assert.equal(selected.storeKey,'4527');
            const selectedKeys=new Set(official(selected.results).map(identity));
            for(const row of offers) if(!selectedKeys.has(identity(row))) errors.push('Missing nationally shared offer in selected store: '+identity(row));
            const report={day,allRows:rows.length,officialOffers:offers.length,campaigns,dated,images,imageCoverage:Math.round(100*images/offers.length)+'%',uncategorized:categoryMissing,selectedOfficial:selectedKeys.size,structuredFeedError:selected.lidlSourceAudit?.structuredFeedError||null,errors:errors.slice(0,30),errorCount:errors.length};
            console.log('LIDL_NATIONWIDE_AUDIT',JSON.stringify(report));
            if(errors.length) process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Server log on failure
        if: failure()
        run: cat /tmp/ziiply.log || true
