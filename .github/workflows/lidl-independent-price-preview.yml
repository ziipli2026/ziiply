name: Lidl independent price preview
# Identifier, variant, completeness, enrichment-priority and public-evidence audits
on:
  push:
    branches: [preview/lidl-independent-catalog]
    paths:
      - 'scripts/lib/lidl-*.mjs'
      - 'scripts/test-lidl-independent-route.mjs'
      - 'scripts/test-lidl-price-source-contract-v69.mjs'
      - 'scripts/test-lidl-verified-price-import.mjs'
      - 'scripts/test-lidl-manual-price-intake.mjs'
      - 'scripts/test-lidl-store-price-bank.mjs'
      - 'scripts/test-lidl-price-conflicts.mjs'
      - 'scripts/test-lidl-price-search-enrichment.mjs'
      - 'scripts/test-lidl-manual-price-batch.mjs'
      - 'scripts/generate-lidl-price-pilot-template.mjs'
      - 'scripts/test-lidl-price-pilot-template.mjs'
      - 'scripts/test-lidl-pilot-csv-reader.mjs'
      - 'scripts/test-lidl-barcode-kind.mjs'
      - 'scripts/test-lidl-pilot-csv-intake.mjs'
      - 'scripts/run-lidl-pilot-intake.mjs'
      - 'scripts/test-lidl-pilot-intake-cli.mjs'
      - 'scripts/audit-lidl-public-price-observations.mjs'
      - 'scripts/test-lidl-public-price-observation-audit.mjs'
      - 'scripts/audit-lidl-ean-price-coverage.mjs'
      - 'scripts/test-lidl-ean-price-coverage.mjs'
      - 'scripts/audit-lidl-ean-linkage.mjs'
      - 'scripts/test-lidl-ean-linkage.mjs'
      - 'scripts/audit-lidl-product-identifiers.mjs'
      - 'scripts/test-lidl-product-identifiers.mjs'
      - 'scripts/audit-lidl-product-name-variants.mjs'
      - 'scripts/test-lidl-product-name-variants.mjs'
      - 'scripts/audit-lidl-enrichment-priority.mjs'
      - 'scripts/test-lidl-enrichment-priority.mjs'
      - 'scripts/test-lidl-enrichment-priority-batch.mjs'
      - 'scripts/test-lidl-public-observation-evidence-v1.mjs'
      - 'data/lidl/public-observation-evidence-v1-2026-10-05.json'
      - 'data/lidl/public-observation-metadata-v2-2026-10-05.json'
      - 'data/lidl/enrichment-priority-v*-2026-10-05.json'
      - 'scripts/test-lidl-enrichment-priority-batch*.mjs'
      - 'scripts/build-lidl-product-metadata-enrichment.mjs'
      - 'scripts/test-lidl-product-metadata-enrichment.mjs'
      - 'data/lidl/product-metadata-enrichment-v1-2026-10-05.json'
      - 'src/app/api/lidl/products/route.ts'
      - 'src/lib/lidlResearchSearch.ts'
      - 'src/lib/lidlVerifiedStorePrice.ts'
      - 'data/lidl/verified-store-price-bank-v1.json'
      - 'scripts/test-lidl-verified-store-price-adapter.mjs'
      - 'scripts/test-lidl-verified-price-resolution.mjs'
      - 'scripts/import-lidl-verified-store-price.mjs'
      - 'scripts/export-lidl-pilot-verified-prices.mjs'
      - 'scripts/merge-lidl-verified-price-export.mjs'
      - 'scripts/test-lidl-verified-price-export-merge.mjs'
      - 'data/lidl/verified-store-price-evidence-template.json'
      - '.github/workflows/lidl-independent-price-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-price-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-lidl-independent-route.mjs
      - run: node scripts/test-lidl-price-source-contract-v69.mjs
      - run: node scripts/test-lidl-verified-price-import.mjs
      - run: node scripts/test-lidl-manual-price-intake.mjs
      - run: node scripts/test-lidl-store-price-bank.mjs
      - run: node scripts/test-lidl-price-conflicts.mjs
      - run: node scripts/test-lidl-price-search-enrichment.mjs
      - run: node scripts/test-lidl-manual-price-batch.mjs
      - run: node scripts/test-lidl-price-pilot-template.mjs
      - run: node scripts/test-lidl-pilot-csv-reader.mjs
      - run: node scripts/test-lidl-barcode-kind.mjs
      - run: node scripts/test-lidl-pilot-csv-intake.mjs
      - run: node scripts/test-lidl-pilot-intake-cli.mjs
      - run: node scripts/test-lidl-public-price-observation-audit.mjs
      - run: node scripts/test-lidl-ean-price-coverage.mjs
      - run: node scripts/test-lidl-ean-linkage.mjs
      - run: node scripts/test-lidl-product-identifiers.mjs
      - run: node scripts/test-lidl-product-name-variants.mjs
      - run: node scripts/test-lidl-enrichment-priority.mjs
      - run: node scripts/test-lidl-enrichment-priority-batch.mjs
      - run: node scripts/test-lidl-public-observation-evidence-v1.mjs
      - run: node scripts/build-lidl-product-metadata-enrichment.mjs
      - run: node scripts/test-lidl-product-metadata-enrichment.mjs
      - run: node scripts/test-lidl-verified-store-price-adapter.mjs
      - run: node scripts/test-lidl-verified-price-resolution.mjs
      - run: node scripts/test-lidl-verified-price-export-merge.mjs
      - run: git diff --exit-code -- data/lidl/product-metadata-enrichment-v1-2026-10-05.json
