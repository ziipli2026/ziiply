name: Mobile main 100 product search audit
# Re-run against updated shared product-group gates
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mobile-main-100-search-audit.yml"
      - "src/app/components/ziiply/ziiplyCore.ts"
      - "src/app/components/ziiply/cards/ProductEnergy.tsx"
      - "src/app/components/ziiply/search/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and compile real shared mobile search ranking
        run: |
          npm ci --ignore-scripts
          npx tsc src/app/components/ziiply/ziiplyCore.ts --target ES2021 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck --outDir .tmp-100-audit
      - name: Run 100 distinct live product queries and validate ranking
        env:
          TERMS_JSON: '["maito","kevytmaito","täysmaito","rasvaton maito","kauramaito","piimä","kerma","ruokakerma","voi","margariini","juusto","emmental","mozzarella","raejuusto","rahka","jogurtti","viili","kananmuna","leipä","ruisleipä","paahtoleipä","sämpylä","näkkileipä","cola","kaurahiutale","puuro","murot","mysli","riisi","pasta","makaroni","spagetti","nuudeli","peruna","porkkana","sipuli","valkosipuli","tomaatti","kurkku","paprika","salaatti","kaali","parsakaali","kukkakaali","banaani","omena","päärynä","appelsiini","mandariini","sitruuna","viinirypäle","mansikka","mustikka","vadelma","avokado","kiivi","vesimeloni","jauheliha","naudanliha","porsaanliha","broileri","kanafilee","nakki","makkara","kinkku","pekoni","lohi","kirjolohi","tonnikala","silakka","katkarapu","kalapuikko","kahvi","tee","kaakao","sokeri","suola","mustapippuri","kaneli","vehnäjauho","ruisjauho","leivinjauhe","hiiva","ruokaöljy","oliiviöljy","etikka","ketsuppi","sinappi","majoneesi","tomaattimurska","herne","maissi","pavut","linssit","mehu","limonadi","kivennäisvesi","jäätelö","suklaa","keksi"]'
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const core=require('./.tmp-100-audit/ziiplyCore.js');
          const terms=JSON.parse(process.env.TERMS_JSON);
          const results=[];
          async function search(term){
            const url='https://ziiply.vercel.app/api/s-products?store=292&search='+encodeURIComponent(term);
            const resp=await fetch(url,{signal:AbortSignal.timeout(25000)});
            if(!resp.ok)throw Error('HTTP '+resp.status);
            const body=await resp.json();
            const raw=Array.isArray(body)?body:(body.items||body.products||[]);
            const priced=raw.map(p=>({...p,price:Number(p.price||p.storeItems?.[0]?.price||0)})).filter(p=>Number.isFinite(p.price)&&p.price>0);
            const ranked=core.rankProductResultsByRelevanceAndPrice(term,priced,p=>p.price);
            const rankedReversed=core.rankProductResultsByRelevanceAndPrice(term,[...priced].reverse(),p=>p.price);
            const reverseOrdered=rankedReversed.every((p,i)=>i===0||rankedReversed[i-1].price<=p.price);
            const sameTop=JSON.stringify(ranked.slice(0,10).map(p=>[p.name,p.price]))===JSON.stringify(rankedReversed.slice(0,10).map(p=>[p.name,p.price]));
            const ordered=ranked.every((p,i)=>i===0||ranked[i-1].price<=p.price);
            // A known real grocery ingredient must not silently disappear.
            const requiredNonEmpty=new Set(['voi','raejuusto','silakka','sokeri','ruokaöljy','etikka']);
            const unexpectedEmpty=requiredNonEmpty.has(term)&&ranked.length===0;
            const normalized=s=>String(s||'').toLocaleLowerCase('fi').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
            const wrong=ranked.filter(p=>{
              const name=normalized(p.name);
              if(term==='oliiviöljy') return !/oliivioljy/.test(name)||/(?:tonnikala|sardiin|muikku|krutonk|krutonki|peruna|keksi|levite|oivariini|kastike|riisi|edamame|oljyssa|oljylla|oljya sisalt)/.test(name);
              if(term==='limonadi') return /(?:jaatelo|jaapuikko|limonadijaa|mehujaa|sorbet|karkki|siirappi)/.test(name);
              if(term==='cola') return /(?:colada|mocktail|jaatelo|limonadijaa|pre.workout|shot)/.test(name);
              if(term==='maito') return /(?:maitorahka|rasvaseos|kerma|suklaa|jogurtti|jaatelo|maitojuoma)/.test(name);
              if(term==='etikka') return /(?:perunalast|sips|mausteseos|puhdistusliina|puhdistusaine|pesuaine|kastike)/.test(name);
              return false;
            });
            return {term,raw:raw.length,priced:priced.length,accepted:ranked.length,sorted:ordered&&reverseOrdered,stableTop:sameTop,unexpectedEmpty,wrongGroup:wrong.slice(0,5).map(p=>p.name),top:ranked.slice(0,5).map(p=>({name:p.name,price:p.price})),rawSample:ranked.length===0?priced.slice(0,12).map(p=>p.name):undefined,rejected:priced.length-ranked.length};
          }
          (async()=>{
            for(let i=0;i<terms.length;i+=5){
              const batch=await Promise.all(terms.slice(i,i+5).map(async term=>{
                try{return await search(term)}catch(e){return {term,error:String(e)}}
              }));
              for(const r of batch){results.push(r);console.log(JSON.stringify(r))}
            }
            const summary={queries:terms.length,completed:results.filter(r=>!r.error).length,errors:results.filter(r=>r.error).length,empty:results.filter(r=>!r.error&&r.accepted===0).length,unsorted:results.filter(r=>r.sorted===false).length,unstableTop:results.filter(r=>r.stableTop===false).length,wrongGroup:results.filter(r=>r.wrongGroup?.length).length,unexpectedEmpty:results.filter(r=>r.unexpectedEmpty).map(r=>r.term),source:'live Prisma API + production shared ranking code',commit:process.env.GITHUB_SHA};
            fs.writeFileSync('mobile-main-100-search-results.json',JSON.stringify({summary,results},null,2));
            console.log('SUMMARY '+JSON.stringify(summary));
            if(summary.errors||summary.unsorted||summary.unstableTop||summary.wrongGroup||summary.unexpectedEmpty.length)process.exitCode=1;
          })();
          NODE
      - name: Check out desktop preview for side-by-side comparison
        uses: actions/checkout@v4
        with:
          ref: preview/legacy-desktop-ui
          path: .desktop-preview
      - name: Compile desktop preview search core
        run: |
          npx tsc .desktop-preview/src/app/components/ziiply/ziiplyCore.ts --target ES2021 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck --outDir .tmp-desktop-audit
      - name: Compare mobile and desktop ranking on identical live products
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const mobile=require('./.tmp-100-audit/ziiplyCore.js');
          const desktop=require('./.tmp-desktop-audit/ziiplyCore.js');
          const terms=["maito","kevytmaito","täysmaito","rasvaton maito","kauramaito","piimä","kerma","ruokakerma","voi","margariini","juusto","emmental","mozzarella","raejuusto","rahka","jogurtti","viili","kananmuna","leipä","ruisleipä","paahtoleipä","sämpylä","näkkileipä","cola","kaurahiutale","puuro","murot","mysli","riisi","pasta","makaroni","spagetti","nuudeli","peruna","porkkana","sipuli","valkosipuli","tomaatti","kurkku","paprika","salaatti","kaali","parsakaali","kukkakaali","banaani","omena","päärynä","appelsiini","mandariini","sitruuna","viinirypäle","mansikka","mustikka","vadelma","avokado","kiivi","vesimeloni","jauheliha","naudanliha","porsaanliha","broileri","kanafilee","nakki","makkara","kinkku","pekoni","lohi","kirjolohi","tonnikala","silakka","katkarapu","kalapuikko","kahvi","tee","kaakao","sokeri","suola","mustapippuri","kaneli","vehnäjauho","ruisjauho","leivinjauhe","hiiva","ruokaöljy","oliiviöljy","etikka","ketsuppi","sinappi","majoneesi","tomaattimurska","herne","maissi","pavut","linssit","mehu","limonadi","kivennäisvesi","jäätelö","suklaa","keksi"];
          const report=[];
          const norm=p=>[String(p.ean||''),String(p.name||'').toLocaleLowerCase('fi'),Number(p.price||0).toFixed(2)].join('|');
          (async()=>{
            for(let offset=0;offset<terms.length;offset+=5){
              await Promise.all(terms.slice(offset,offset+5).map(async term=>{
              try{
                const url='https://ziiply.vercel.app/api/s-products?store=292&search='+encodeURIComponent(term);
                const response=await fetch(url,{signal:AbortSignal.timeout(25000)});
                if(!response.ok)throw Error('HTTP '+response.status);
                const body=await response.json();
                const raw=Array.isArray(body)?body:(body.items||body.products||[]);
                const priced=raw.map(p=>({...p,price:Number(p.price||p.storeItems?.[0]?.price||0)})).filter(p=>Number.isFinite(p.price)&&p.price>0);
                const a=mobile.rankProductResultsByRelevanceAndPrice(term,priced,p=>p.price);
                const b=desktop.rankProductResultsByRelevanceAndPrice(term,priced,p=>p.price);
                const ak=new Set(a.map(norm)),bk=new Set(b.map(norm));
                const mobileOnly=a.filter(p=>!bk.has(norm(p))).slice(0,10).map(p=>p.name);
                const desktopOnly=b.filter(p=>!ak.has(norm(p))).slice(0,10).map(p=>p.name);
                report.push({term,raw:raw.length,mobile:a.length,desktop:b.length,mobileOnly,desktopOnly,sameOrder:JSON.stringify(a.map(norm))===JSON.stringify(b.map(norm))});
              }catch(error){report.push({term,error:String(error)})}
              }));
            }
            report.sort((a,b)=>terms.indexOf(a.term)-terms.indexOf(b.term));
            fs.writeFileSync('mobile-desktop-search-comparison.json',JSON.stringify(report,null,2));
            console.log('MOBILE_DESKTOP_COMPARISON '+JSON.stringify(report));
            if(report.some(x=>x.error))process.exitCode=1;
          })();
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-desktop-search-comparison
          path: mobile-desktop-search-comparison.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-main-100-search-results
          path: mobile-main-100-search-results.json
          if-no-files-found: warn
