name: Grocery relevance 03-hedelmat-vihannekset
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check S and K production search
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const stores=[["S","s-products","292"],["K","k-products","3221"]];
          const terms=["omena","appelsiini","päärynä","viinirypäle","kurkku","salaatti","sipuli","paprika","kesäkurpitsa","mansikka"];
          let failures=0,checks=0;
          for(const [chain,route,store] of stores){
            for(const term of terms){
              checks++;
              try{
                const url="https://ziiply.vercel.app/api/"+route+"?store="+store+"&search="+encodeURIComponent(term);
                const response=await fetch(url,{signal:AbortSignal.timeout(25000)});
                if(!response.ok)throw Error("HTTP "+response.status);
                const body=await response.json();
                const items=body.items||[];
                const top=items.slice(0,10).map(x=>x.name);
                console.log(JSON.stringify({chain,term,count:items.length,top}));
                if(!items.length){failures++;console.error("EMPTY",chain,term);}
                const freshTerms=["omena","appelsiini","päärynä","viinirypäle","paprika","mansikka","sipuli","kurkku","kesäkurpitsa"];
                const processed=/mehu|juoma|smoothie|hillo|sose|piirak|pitko|kakku|pesto|kastike|chips|sipsi|jogurtti|rahka|makkara|juusto|jäätelö|vanukas|makeinen|karkki|lelu|nukke|majo|salaatti-|riisi|puuro|kiisseli|muro|mysli|pulla|kranssi|voide|saippua|silli|silakka|suklaa|tee|viini|brandy|pihvi|mauste|öljy|jyrsijä|pasta|täyte|vanilja|cola|colajuoma/i;
                const freshName=(n)=>{const v=n.toLocaleLowerCase("fi");return (term==="viinirypäle"?v.includes("rypäle"):v.includes(term))&&!processed.test(v)&&!/(?:omena|appelsiini|päärynä|mansikka|paprika|sipuli)-(?:mango|kaneli|vanilja|chili|lime|juusto|tomaatti)/.test(v);};
                if(freshTerms.includes(term)&&!top.slice(0,3).some(freshName)){
                  failures++;console.error("FRESH_PRODUCE_MISSING_TOP3",chain,term);
                  const probes={omena:["omena","gala","pink lady"],appelsiini:["appelsiini","navel"],päärynä:["päärynä","conference"],viinirypäle:["viinirypäle","rypäle","siemenetön"],paprika:["paprika","punainen paprika"],mansikka:["mansikka","tuore mansikka"]};
                  for(const probe of probes[term]||[]){
                    try{
                      const u="https://api.ruoanhinta.fi/api/items?search="+encodeURIComponent(probe)+"&storeIds="+store+"&skip=0&take=100";
                      const raw=await (await fetch(u,{signal:AbortSignal.timeout(8000)})).json();
                      const rows=Array.isArray(raw.items)?raw.items:[];
                      console.log("UPSTREAM_PROBE",JSON.stringify({chain,term,probe,count:rows.length,examples:rows.filter(x=>x.storeItems?.[0]?.price>0).slice(0,8).map(x=>x.name)}));
                    }catch(e){console.error("UPSTREAM_PROBE_ERROR",chain,term,probe,String(e));}
                  }
                }
                if(top.some(n=>!n||typeof n!=="string")){failures++;console.error("INVALID_NAME",chain,term);}
                if(["jauheliha","naudanliha","sianliha","kana","kalkkuna","tonnikala","katkarapu","seiti","makkara","nakki"].includes(term)&&top.slice(0,5).some(n=>/dreamies|sheba|vitakraft|carnilove|whiskas|pedigree|koirille|kissoille/i.test(n))){failures++;console.error("PET_FOOD_TOP5",chain,term);}
              }catch(e){failures++;console.error("ERROR",chain,term,String(e));}
            }
          }
          console.log("SUMMARY",JSON.stringify({group:"03-hedelmat-vihannekset",checks,failures}));
          if(failures)process.exitCode=1;
          NODE
