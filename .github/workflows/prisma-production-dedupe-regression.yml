name: Prisma Production Dedupe Regression
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/prisma-production-dedupe-regression.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --legacy-peer-deps
      - name: Live provider regression
        run: |
          cat > scripts/.tmp-prisma-prod-regression.mts <<'TS'
          import { searchZiiplyOffers } from "../src/app/components/ziiply/offerSearch/ziiplyOfferSearchSources";
          const rows:any[]=await searchZiiplyOffers("__ziiply_all_offers__",{storeName:"Prisma Hyvinkää",sStoreName:"Prisma Hyvinkää",sStoreNames:["Prisma Hyvinkää"],storeCompareScope:"within_chain",withinChain:"S",selectedChain:"S"} as any);
          const offers=rows.filter(x=>x.campaignType!=="campaign"),campaigns=rows.filter(x=>x.campaignType==="campaign");
          const muikku=rows.filter(x=>String(x.ean)==="2004657500003").map(x=>({type:x.campaignType??"offer",price:x.priceText,validUntil:x.validUntil,storeId:x.storeId,title:x.title}));
          const campaignMissingValidity=campaigns.filter(x=>!String(x.validUntil??"").trim()).length;
          console.log("PROD_DEDUPE_REPORT",JSON.stringify({total:rows.length,offers:offers.length,campaigns:campaigns.length,campaignMissingValidity,muikku},null,2));
          if(offers.length!==264||campaigns.length!==121||muikku.length!==1||muikku[0]?.type!=="campaign") process.exitCode=1;
          TS
          npx tsx scripts/.tmp-prisma-prod-regression.mts
          rm scripts/.tmp-prisma-prod-regression.mts
      - name: Typecheck
        run: npx tsc --noEmit
