name: Lidl regression source capture
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lidl-regression-source-capture.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Capture official Lidl.fi product regression sources
        run: |
          mkdir -p data/lidl/regression-capture
          while IFS='|' read -r slug url; do
            curl --fail --location --retry 3 --user-agent 'ZiiplyLidlLeaflet/1.0' "$url" \
              -o "data/lidl/regression-capture/2026-10-05_07.$slug.html"
            printf '%s\n' "$url" > "data/lidl/regression-capture/2026-10-05_07.$slug.source-url.txt"
          done <<'URLS'
          kirsikkatomaatti|https://www.lidl.fi/p/kotimainen-kirsikkatomaatti/p10038326
          erankavija|https://www.lidl.fi/p/kuusamon-juusto-erankavija-juusto/p10038321
          danerolles|https://www.lidl.fi/p/danerolles-croissantit-2-kpl/p10038322
          atria-pizza|https://www.lidl.fi/p/atria-pizza-2-kpl/p10038324
          URLS
      - name: Publish immutable capture branch
        env:
          CAPTURE_BRANCH: capture/lidl-2026-10-05_07
        run: |
          mkdir -p data/lidl/parser-regression
          cp data/lidl/regression-capture/2026-10-05_07.* data/lidl/parser-regression/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/lidl/parser-regression/2026-10-05_07.*
          git commit -m 'Archive official Lidl 5-7 Oct regression sources'
          git push --force origin HEAD:refs/heads/$CAPTURE_BRANCH
      - name: Upload immutable source candidate
        uses: actions/upload-artifact@v4
        with:
          name: lidl-regression-source-2026-10-05_07-products
          path: data/lidl/regression-capture/*
          if-no-files-found: error
          retention-days: 30
