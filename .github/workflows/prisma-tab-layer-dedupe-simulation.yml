name: Prisma Tab Layer Dedupe Simulation (safe V805)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/prisma-tab-layer-dedupe-simulation.yml'
      - 'src/app/components/ziiply/offerSearch/ziiplyOfferSearchCore.ts'
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --legacy-peer-deps
      - name: Simulate dedupe after tab split only
        run: |
          cat > scripts/.tmp-tab-layer-dedupe.mts <<'TS'
          import assert from "node:assert/strict";
          import { hidePrismaOfferCopiesAlreadyInCampaignTabV805 as dedupe } from "../src/app/components/ziiply/offerSearch/ziiplyOfferSearchCore";

          const store = "Prisma Hyvinkää";
          const base = { storeLabel: store, ean: "2004657500003", price: 2.49, validUntil: "2026-11-25" };
          const campaign = { ...base, campaignType: "campaign" };
          const copy = { ...base, campaignType: "offer" };
          const otherOffers = [
            { ...copy, price: 2.59 },
            { ...copy, validUntil: "2026-11-26" },
            { ...copy, validUntil: "" },
            { ...copy, storeLabel: "Prisma Järvenpää" },
            { ...copy, storeLabel: "Lidl" },
            { ...copy, ean: "6400000000002" },
          ];
          const master = [campaign, copy, ...otherOffers];

          assert.deepEqual(dedupe(master, master, store), [campaign, ...otherOffers]);
          // A category or text filter can omit the campaign from the visible rows.
          assert.deepEqual(dedupe([copy, ...otherOffers], master, store), otherOffers);
          assert.deepEqual(dedupe([copy], [copy], store), [copy]);
          assert.deepEqual(dedupe(master, master, "Lidl"), master);
          console.log("Prisma tab-layer dedupe passed");
          TS
          trap 'rm -f scripts/.tmp-tab-layer-dedupe.mts' EXIT
          npx tsx scripts/.tmp-tab-layer-dedupe.mts
      - name: Typecheck
        run: npx tsc --noEmit
