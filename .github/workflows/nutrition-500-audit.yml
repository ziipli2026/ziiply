name: Nutrition 500 EAN audit
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/legacy-desktop-ui
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Audit 500 EANs against desktop preview API
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/audit-nutrition-500.mjs
