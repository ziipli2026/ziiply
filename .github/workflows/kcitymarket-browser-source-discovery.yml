name: K-Ruoka N183 browser source discovery
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/kcitymarket-browser-source-discovery.mjs'
      - '.github/workflows/kcitymarket-browser-source-discovery.yml'
  schedule:
    - cron: '25 */3 * * *'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser runner
        run: npm install --no-save --package-lock=false --ignore-scripts --legacy-peer-deps --no-audit --no-fund playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Probe N183 product API separately from blocked storefront
        id: api_probe
        continue-on-error: true
        shell: bash
        run: |
          node - <<'NODE'
          const {spawnSync} = require('node:child_process');
          const endpoint = 'https://www.k-ruoka.fi/kr-api/v2/product-search/kahvi?offset=0&language=fi&storeId=N183&limit=2&discountFilter=false&isTrOffer=false';
          const result = spawnSync('curl', [
            '--silent','--show-error','--max-time','18','--compressed',
            '--request','POST','--header','X-K-Build-Number: 0',
            '--header','Content-Type: application/json',
            '--header','Accept: application/json',
            '--data-binary','{}',
            '--write-out','\\n__STATUS__%{http_code}\\n__TYPE__%{content_type}',
            endpoint
          ], {encoding:'utf8',maxBuffer:2*1024*1024,timeout:22000});
          const output = result.stdout || '';
          const status = output.match(/__STATUS__(\d+)/)?.[1] || 'unknown';
          const type = output.match(/__TYPE__([^\n]+)/)?.[1] || 'unknown';
          const json = output.includes('__STATUS__') ? output.slice(0,output.lastIndexOf('__STATUS__')) : output;
          let shape = null;
          try {
            const body = JSON.parse(json);
            shape = Array.isArray(body) ? {kind:'array',count:body.length}
              : {kind:typeof body,keys:Object.keys(body).slice(0,12)};
          } catch {}
          console.log('KRUOKA_N183_PRODUCT_API_PROBE', JSON.stringify({
            status,contentType:type,shape,transportExitCode:result.status,
            error:result.error ? String(result.error).slice(0,180) : null,
            note:'Two-item product search only; not proof of store campaigns.'
          }));
          if (status !== '200' || !shape) process.exitCode=1;
          NODE
      - name: Discover K-Ruoka live network source
        if: always()
        run: node scripts/kcitymarket-browser-source-discovery.mjs
      - name: Upload K-Ruoka API discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kruoka-n183-browser-discovery
          path: artifacts/kruoka-n183-browser-discovery.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish N183 evidence summary
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'artifacts/kruoka-n183-browser-discovery.json';
          const report = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path,'utf8')) : {failed:true,error:'No discovery artifact'};
          const lines = [
            '## K-Ruoka N183 source investigation',
            '',
            '| Check | Result |',
            '| --- | --- |',
            '| Store page HTTP | ' + (report.storeHttp ?? 'unknown') + ' |',
            '| Offer page HTTP | ' + (report.offerHttp ?? 'unknown') + ' |',
            '| N183 context confirmed | ' + Boolean(report.storeContextConfirmed) + ' |',
            '| N183 API candidate count | ' + (report.n183CandidateCount ?? 0) + ' |',
            '| Visible offer cards | ' + (report.offerCards ?? 0) + ' |',
            '| Verified store offers | ' + Boolean(report.verifiedStoreOffers) + ' |',
            '| Diagnostic failed | ' + Boolean(report.failed) + ' |',
            '',
            'This workflow is discovery only; it does not import or refresh store offers.',
            '',
            '### Candidate endpoints',
            ...((report.candidates || []).slice(0,10).map(c => '- ' + c.endpoint)),
            '',
            '### Rendered offer samples',
            ...((report.visibleOfferSamples || []).slice(0,5).map(v => '- ' + String(v).replace(/[|\r\n]/g,' ').slice(0,180))),
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n')+'\n');
          NODE
      - name: Validate N183 source discovery result
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'artifacts/kruoka-n183-browser-discovery.json';
          if (!fs.existsSync(path)) {
            console.error('KRUOKA_N183_SOURCE_UNVERIFIED: discovery artifact missing');
            process.exit(1);
          }
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (report.failed || !report.storeContextConfirmed || !report.n183CandidateCount) {
            console.error('KRUOKA_N183_SOURCE_UNVERIFIED', JSON.stringify({
              failed: Boolean(report.failed),
              storeContextConfirmed: Boolean(report.storeContextConfirmed),
              n183CandidateCount: report.n183CandidateCount ?? 0,
              error: report.error ?? null,
            }));
            process.exit(1);
          }
          console.log('KRUOKA_N183_CANDIDATES_FOUND', report.n183CandidateCount,
            'Import not implemented; candidates require independent verification.');
          NODE
