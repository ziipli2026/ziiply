name: Prisma pickup resolver fix simulation (read-only v3)
on:
  push:
    paths:
      - 'src/app/components/ziiply/offerSearch/providers/skaupatProvider.ts'
      - '.github/workflows/prisma-pickup-resolver-simulation.yml'
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: |
          cat > scripts/.tmp-prisma-pickup-sim.mts <<'TS'
          import { fetchSKaupatOffers } from "../src/app/components/ziiply/offerSearch/providers/skaupatProvider";
          const T=[
            ["Prisma Hämeenkatu Tampere","726413330"],["Prisma Raksila Oulu","516528759"],
            ["Prisma Myyrmanni Vantaa","726435566"],["Prisma Jumbo Vantaa","613761030"],
            ["Prisma Limingantulli Oulu","627829302"],["Prisma Lielahti Tampere","697940575"],
            ["Prisma Kaleva Tampere","517609418"]];
          const cfg:any={id:"skaupat",chain:"S",storeLabel:"S-kaupat",url:"https://www.s-kaupat.fi/tuotteet/kampanjat"};
          for(const [name,id] of T){
            try{
              const rows:any[]=await fetchSKaupatOffers("__ziiply_all_offers__",cfg,{storeName:name,sStoreName:name,storeId:id,sStoreId:id});
              console.log("SIM",JSON.stringify({name,id,count:rows.length,first:rows[0]?.title||null}));
            }catch(e){console.log("ERR",JSON.stringify({name,id,error:String(e)}))}
            await new Promise(r=>setTimeout(r,900));
          }
          TS
          npx tsx scripts/.tmp-prisma-pickup-sim.mts 2>&1 | tee prisma-pickup-resolver-simulation.txt
      - uses: actions/upload-artifact@v4
        with:
          name: prisma-pickup-resolver-simulation
          path: prisma-pickup-resolver-simulation.txt
