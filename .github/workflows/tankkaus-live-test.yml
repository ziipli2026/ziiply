name: Tankkaus live test branch ingestion
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type YES_TEST_BRANCH to allow one-shot ingestion"
        required: true
        type: string
jobs:
  ingest:
    if: ${{ inputs.confirm == 'YES_TEST_BRANCH' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Run isolated live ingestion
        env:
          TANKKAUS_API_TOKEN: ${{ secrets.TANKKAUS_API_TOKEN }}
          DATABASE_URL: ${{ secrets.TANKKAUS_TEST_DATABASE_URL }}
          TANKKAUS_LIVE_INGEST: "true"
          TANKKAUS_PROVIDER_SCHEMA_VERIFIED: "YES"
          TANKKAUS_INGEST_WRITE_CONFIRM: "YES_TEST_BRANCH"
        run: node scripts/ingest-tankkaus-live.mjs
