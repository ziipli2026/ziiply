name: Tankkaus live test branch ingestion
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type YES_TEST_BRANCH to allow one-shot ingestion"
        required: true
        type: string
      area:
        description: "Select one bounded test area"
        required: true
        type: choice
        default: hyvinkaa
        options:
          - hyvinkaa
          - helsinki
          - tampere
          - turku
jobs:
  ingest:
    if: ${{ inputs.confirm == 'YES_TEST_BRANCH' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tankkaus-com-native-20261008
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check required credentials without exposing values
        env:
          TANKKAUS_API_TOKEN: ${{ secrets.TANKKAUS_API_TOKEN }}
          TANKKAUS_TEST_DATABASE_URL: ${{ secrets.TANKKAUS_TEST_DATABASE_URL }}
        run: |
          if [ -z "$TANKKAUS_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret TANKKAUS_API_TOKEN"
            exit 1
          fi
          if [ -z "$TANKKAUS_TEST_DATABASE_URL" ]; then
            echo "::error::Missing GitHub Actions secret TANKKAUS_TEST_DATABASE_URL"
            exit 1
          fi
      - name: Install isolated Neon client without modifying application dependencies
        run: |
          mkdir -p /tmp/tankkaus-neon-client
          cd /tmp/tankkaus-neon-client
          printf '{"private":true,"type":"module"}\n' > package.json
          npm install --no-save --ignore-scripts --no-audit --no-fund @neondatabase/serverless@1.2.0
          mkdir -p "$GITHUB_WORKSPACE/node_modules/@neondatabase"
          ln -s /tmp/tankkaus-neon-client/node_modules/@neondatabase/serverless "$GITHUB_WORKSPACE/node_modules/@neondatabase/serverless"
      - name: Run isolated live ingestion
        env:
          TANKKAUS_API_TOKEN: ${{ secrets.TANKKAUS_API_TOKEN }}
          DATABASE_URL: ${{ secrets.TANKKAUS_TEST_DATABASE_URL }}
          TANKKAUS_LIVE_INGEST: "true"
          TANKKAUS_AREA: ${{ inputs.area }}
          TANKKAUS_PROVIDER_SCHEMA_VERIFIED: "YES"
          TANKKAUS_INGEST_WRITE_CONFIRM: "YES_TEST_BRANCH"
        run: node scripts/ingest-tankkaus-live.mjs
