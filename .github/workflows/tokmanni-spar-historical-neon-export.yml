name: Tokmanni/Spar historical EAN export (read only)
on:
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-save --package-lock=false --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - run: node scripts/tokmanni-spar-historical-neon-export.mjs
        env:
          DATABASE_URL: ${{ secrets.NEON_READONLY_DATABASE_URL }}
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tokmanni-spar-historical-neon
          path: tokmanni-spar-historical-neon.json
