name: Sale ja Alepa massatarkistus

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Tarkista kauppavalinta ja hae tuotanto
        run: |
          mkdir -p audit
          node <<'NODE'
          const fs=require('node:fs');
          const chains=['Sale','Alepa'];
          const requests=chains.map(chain=>{
            const url=new URL('https://ziiply.vercel.app/api/offers/search');
            url.searchParams.set('q','__ziiply_all_offers__');
            url.searchParams.set('sStoreName',chain);
            url.searchParams.set('withinChain','S');
            return {chain,url};
          });
          let failures=0;
          for(const {chain,url} of requests){
          const response=await fetch(url,{signal:AbortSignal.timeout(90000),headers:{accept:'application/json','cache-control':'no-cache'}});
          const data=await response.json();
          fs.writeFileSync('audit/production-response-'+chain+'.json',JSON.stringify(data,null,2));
          const rows=Array.isArray(data.results)?data.results:[];
          const summary={chain,store:'chain-only (unverified store selection)',storeId:null,httpStatus:response.status,ok:data.ok===true,rows:rows.length,deploy:data.deploy||null,issues:[],categoryDifferences:[],displayFallbacks:[],categoryCounts:{}};
          const seen=new Set();
          const money=v=>{if(v==null)return null;const n=Number(String(v).replace(/\\s/g,'').replace('€','').replace(',','.'));return Number.isFinite(n)?n:null};
          for(const [index,row] of rows.entries()){
            const title=String(row.title||row.name||'').trim(),ean=String(row.ean||'').trim();
            const category=String(row.category||'').trim(),display=String(row.neonDisplayCategory||'').trim();
            const price=money(row.priceText??row.price);
            const evidence=row.debugLocalCampaignEvidenceV231||{};
            const campaign=money(evidence.campaignPrice),regular=money(evidence.regularPrice);
            const unit=String(row.unitPriceText||row.comparisonPriceText||row.unitPrice||'');
            const issue=(reason)=>summary.issues.push({index:index+1,ean,title,reason});
            if(!title)issue('missing_title');
            if(!ean)issue('missing_ean');
            if(!category&&!display)issue('missing_category');
            if(price==null||price<=0)issue('invalid_price');
            if(!unit)issue('missing_unit_price');
            if(campaign!=null&&price!=null&&Math.abs(campaign-price)>.011)issue('campaign_price_mismatch');
            if(campaign!=null&&regular!=null&&campaign>regular)issue('campaign_above_regular');
            if(ean&&seen.has(ean))issue('duplicate_ean');
            if(ean)seen.add(ean);
            if(display&&category&&display!==category)summary.categoryDifferences.push({ean,title,sourceCategory:category,neonDisplayCategory:display});
            if(!display&&category)summary.displayFallbacks.push({ean,title,sourceCategory:category});
            const group=display||category||'(puuttuu)';
            summary.categoryCounts[group]=(summary.categoryCounts[group]||0)+1;
          }
          summary.issueCount=summary.issues.length;
          summary.categoryDifferenceCount=summary.categoryDifferences.length;
          summary.displayFallbackCount=summary.displayFallbacks.length;
          fs.writeFileSync('audit/summary-'+chain+'.json',JSON.stringify(summary,null,2));
          console.log('SALE ALEPA MASS AUDIT',JSON.stringify({chain,status:response.status,rows:rows.length,issues:summary.issueCount,categoryDifferences:summary.categoryDifferenceCount,displayFallbacks:summary.displayFallbackCount}));
          for(const issue of summary.issues)console.log('ISSUE',JSON.stringify(issue));
          if(!response.ok||!data.ok||rows.length===0||summary.issueCount)failures++;
          }
          if(failures)process.exitCode=1;
          NODE
      - name: Tallenna auditointiraportti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sale-alepa-massatarkistus
          path: audit/
          if-no-files-found: warn
          retention-days: 14
