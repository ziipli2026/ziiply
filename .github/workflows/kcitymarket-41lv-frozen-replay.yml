name: K-Citymarket 41LV frozen replay
on:
  push:
    paths:
      - ".github/workflows/kcitymarket-41lv-frozen-replay.yml"
      - "scripts/citymarket/replay-frozen-parser.mjs"
      - "scripts/citymarket/verify-41lv-archive.mjs"
      - "tests/fixtures/citymarket/41LV.approved.json"
      - "src/app/components/ziiply/offerSearch/providers/kCitymarketSpatialParser.js"
  pull_request:
    paths:
      - ".github/workflows/kcitymarket-41lv-frozen-replay.yml"
      - "scripts/citymarket/replay-frozen-parser.mjs"
      - "tests/fixtures/citymarket/41LV.approved.json"
      - "src/app/components/ziiply/offerSearch/providers/kCitymarketSpatialParser.js"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check offline regression scripts syntax
        run: |
          node --check scripts/citymarket/verify-41lv-archive.mjs
          node --check scripts/citymarket/replay-frozen-parser.mjs
          node --check src/app/components/ziiply/offerSearch/providers/kCitymarketSpatialParser.js
      - name: Retrieve original successful 41LV Actions archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kcm-41lv-archive
          # This Actions artifact expires. A missing artifact is a hard failure, never a skipped regression.
          curl --fail --location --retry 3 --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/11659452422/zip" \
            --output /tmp/kcm-41lv.zip
          unzip -tq /tmp/kcm-41lv.zip
          unzip -q /tmp/kcm-41lv.zip -d /tmp/kcm-41lv-archive
          test -s /tmp/kcm-41lv-archive/publisher-responses.json
          test -s /tmp/kcm-41lv-archive/archive-manifest.json
          test -s /tmp/kcm-41lv-archive/parser-evidence.json
          node scripts/citymarket/verify-41lv-archive.mjs /tmp/kcm-41lv-archive tests/fixtures/citymarket/41LV.approved.json
      - name: Replay originally approved parser as historical control
        id: historical_replay
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/src/app/components/ziiply/offerSearch/providers/kCitymarketSpatialParser.js?ref=5b6d899e5ba01e836f3fc789416f1b8816493aaa" \
            | jq -r '.content' | base64 --decode > /tmp/kcm-41lv-approved-parser.mjs
          test -s /tmp/kcm-41lv-approved-parser.mjs
          KCM_REPLAY_REPORT=/tmp/kcm-41lv-historical-report.json node scripts/citymarket/replay-frozen-parser.mjs /tmp/kcm-41lv-archive tests/fixtures/citymarket/41LV.approved.json /tmp/kcm-41lv-approved-parser.mjs
      - name: Replay current parser against original frozen publisher responses
        id: current_replay
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cp src/app/components/ziiply/offerSearch/providers/kCitymarketSpatialParser.js /tmp/kcm-41lv-current-parser.mjs
          KCM_REPLAY_REPORT=/tmp/kcm-41lv-replay-report.json node scripts/citymarket/replay-frozen-parser.mjs /tmp/kcm-41lv-archive tests/fixtures/citymarket/41LV.approved.json /tmp/kcm-41lv-current-parser.mjs
      - name: Publish historical and current replay summaries
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const lines = ['## 41LV frozen parser comparison', '| Parser | Matched | Missing | Extra | Duplicates | Pages |', '|---|---:|---:|---:|---:|---:|'];
          for (const [label, file] of [
            ['Historical approved commit', '/tmp/kcm-41lv-historical-report.json'],
            ['Current preview branch', '/tmp/kcm-41lv-replay-report.json']
          ]) {
            if (!fs.existsSync(file)) {
              lines.push('| ' + label + ' | Report missing | — | — | — | — |');
              continue;
            }
            const r = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (r.error) {
              lines.push('| ' + label + ' | Replay failed | — | — | — | — |');
              lines.push('<details><summary>' + label + ': parser error</summary>');
              lines.push('');
              lines.push('```text');
              lines.push(String(r.error).slice(0, 6000));
              lines.push('```');
              lines.push('Missing archived requests: ' + (r.missingRequests || []).join(', '));
              lines.push('</details>');
              continue;
            }
            lines.push('| ' + label + ' | ' + r.matched + '/' + r.expected + ' | ' + r.missing.length + ' | ' + r.extra.length + ' | ' + r.duplicateKeys + ' | ' + r.pages + ' |');
            lines.push(label + ': WC-paper cases ' + JSON.stringify(r.wcPaperCases || {}) + '; failures ' + (r.wcPaperFailures || []).length + '; archived requests ' + r.requests + '.');
            if ((r.wcPaperFailures || []).length) {
              lines.push('```json');
              lines.push(JSON.stringify(r.wcPaperFailures, null, 2));
              lines.push('```');
            }
            for (const [kind, keys] of [['Missing', r.missing], ['Extra', r.extra]]) {
              if (keys.length) {
                lines.push('<details><summary>' + label + ': ' + kind + ' (' + keys.length + ')</summary>');
                lines.push('');
                lines.push('```text');
                lines.push(...keys.slice(0, 100));
                lines.push('```');
                lines.push('</details>');
              }
            }
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          NODE
      - name: Enforce both replay results
        if: always()
        shell: bash
        run: |
          echo "Historical replay: ${{ steps.historical_replay.outcome }}"
          echo "Current replay: ${{ steps.current_replay.outcome }}"
          test "${{ steps.historical_replay.outcome }}" = success
          test "${{ steps.current_replay.outcome }}" = success
      - name: Preserve exact 41LV regression differences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kcitymarket-41lv-replay-diff
          path: |
            /tmp/kcm-41lv-replay-report.json
            /tmp/kcm-41lv-historical-report.json
          if-no-files-found: warn
          retention-days: 90
