name: Desktop preview 35-category live search
on:
  workflow_dispatch:
  push:
    branches: [preview/legacy-desktop-ui]
    paths:
      - 'scripts/test-desktop-search-live.mjs'
      - 'src/app/components/ziiply/ziiplyCore.ts'
      - 'src/app/desktop-preview/DesktopPreviewClient.tsx'
      - '.github/workflows/desktop-search-35-category.yml'
jobs:
  search-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Test 35 queries against protected preview live provider endpoints
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/test-desktop-search-live.mjs
      - name: Upload detailed results even on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-search-35-category-report
          path: |
            desktop-search-35-category-report.json
            desktop-search-35-category-summary.md
          if-no-files-found: warn
