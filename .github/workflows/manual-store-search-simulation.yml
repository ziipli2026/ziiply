name: Manual store search simulation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Simulate manual store search relevance
        shell: bash
        run: |
          cat > /tmp/simulate.mjs <<'EOF'
          const queries = ["Oulu", "Jokela", "Hyvinkää", "Helsinki", "Tampere", "Inari"];

          const norm = (s) => String(s || "")
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
            .toLowerCase().trim();

          async function fetchStores(search) {
            const url = "https://api.ruoanhinta.fi/api/stores?search=" + encodeURIComponent(search);
            const r = await fetch(url, { headers: { Accept: "application/json" } });
            if (!r.ok) throw new Error(search + ": HTTP " + r.status);
            const data = await r.json();
            return Array.isArray(data) ? data : (data.items || []);
          }

          function simulate(query, stores) {
            const q = norm(query);
            const live = stores.filter(s => !s.delistedAt);
            const exactCity = live.filter(s => norm(s.city) === q);

            // Safe first-pass candidate rule:
            // 1) if exact city matches exist, they are authoritative;
            // 2) otherwise preserve exact/strong store-name matches as fallback for
            //    villages/districts such as Jokela, but expose their city so false
            //    positives can be inspected before any production implementation.
            const nameMatches = live.filter(s => {
              const n = norm(s.name);
              return n === q || n.includes(" " + q) || n.includes(q + " ");
            });

            const proposed = exactCity.length ? exactCity : nameMatches;
            return { live, exactCity, nameMatches, proposed };
          }

          for (const query of queries) {
            const stores = await fetchStores(query);
            const r = simulate(query, stores);
            console.log("\n============================================================");
            console.log("QUERY:", query);
            console.log("RAW:", stores.length, "LIVE:", r.live.length,
                        "EXACT_CITY:", r.exactCity.length,
                        "NAME_FALLBACK:", r.nameMatches.length,
                        "PROPOSED:", r.proposed.length);

            console.log("\n-- RAW/LIVE RESULTS --");
            for (const s of r.live) {
              console.log(JSON.stringify({
                id:s.id, name:s.name, city:s.city, postalCode:s.postalCode,
                chain:s.chain, type:s.type
              }));
            }

            console.log("\n-- PROPOSED FIRST-PASS RESULTS --");
            for (const s of r.proposed) {
              console.log(JSON.stringify({
                id:s.id, name:s.name, city:s.city, postalCode:s.postalCode,
                chain:s.chain, type:s.type
              }));
            }
          }
          EOF
          node /tmp/simulate.mjs
