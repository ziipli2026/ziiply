name: Manual store search simulation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Simulate manual store search relevance
        shell: bash
        run: |
          cat > /tmp/simulate.mjs <<'EOF'
          const queries = ["Jokela", "Kämmenniemi", "Oulunsalo", "Sääksjärvi", "Terälahti", "Haukipudas", "Rajamäki", "Klaukkala", "Nummela", "Veikkola", "Kellokoski", "Nikkilä", "Söderkulla", "Tikkurila", "Korso", "Laukaa", "Lievestuore", "Vaajakoski", "Muurame", "Äänekoski", "Suolahti", "Vihtavuori", "Leppävesi", "Ylistaro", "Peräseinäjoki", "Nurmo", "Jalasjärvi", "Kauhajoki", "Teuva", "Jurva", "Laihia", "Vähäkyrö", "Orivesi", "Lempäälä", "Sääksjärvi", "Pirkkala", "Ylöjärvi", "Nokia", "Kangasala", "Hervanta", "Tesoma", "Linnainmaa", "Ivalo", "Saariselkä", "Sodankylä", "Kemijärvi", "Ranua", "Posio", "Taivalkoski", "Pudasjärvi", "Liminka", "Kempele", "Muhos", "Ii", "Kiiminki", "Ylikiiminki", "Tyrnävä", "Lumijoki", "Siilinjärvi", "Nilsiä", "Juankoski", "Lapinlahti", "Iisalmi", "Sonkajärvi", "Kiuruvesi", "Mäntsälä", "Pornainen", "Askola", "Pukkila", "Myrskylä", "Lapinjärvi", "Loviisa"];

          const norm = (s) => String(s || "")
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
            .toLowerCase().trim();

          async function fetchStores(search) {
            const apiSearch = norm(search) === "ii" ? search.trim() + " " : search;
            const url = "https://api.ruoanhinta.fi/api/stores?search=" + encodeURIComponent(apiSearch);
            const r = await fetch(url, { headers: { Accept: "application/json" } });
            if (!r.ok) { console.log("FETCH_ERROR:", search, "HTTP", r.status); return []; }
            const data = await r.json();
            return Array.isArray(data) ? data : (data.items || []);
          }

          function simulate(query, stores) {
            const q = norm(query);
            const live = stores.filter(s => !s.delistedAt);
            const exactCity = live.filter(s => norm(s.city) === q);

            // Safe first-pass candidate rule:
            // 1) if exact city matches exist, they are authoritative;
            // 2) otherwise preserve exact/strong store-name matches as fallback for
            //    villages/districts such as Jokela, but expose their city so false
            //    positives can be inspected before any production implementation.
            const nameMatches = live.filter(s => {
              const n = norm(s.name);
              return n === q || n.includes(" " + q) || n.includes(q + " ");
            });

            const fallbackAnchorPostalCodes = new Set(nameMatches.map(s => String(s.postalCode || "").trim()).filter(Boolean));
            const fallbackAnchorCities = new Set(nameMatches.map(s => norm(s.city)).filter(Boolean));
            const postalAreaMatches = live.filter(s => {
              const postal = String(s.postalCode || "").trim();
              const city = norm(s.city);
              return postal && fallbackAnchorPostalCodes.has(postal) && city && fallbackAnchorCities.has(city);
            });
            const proposed = exactCity.length ? exactCity : Array.from(
              new Map([...nameMatches, ...postalAreaMatches].map(s => [String(s.id), s])).values()
            );
            return { live, exactCity, nameMatches, postalAreaMatches, proposed };
          }

          console.log("PRODUCTION_ROUTE_PARITY: manual regression algorithm includes Ii API workaround + city/name/postal locality filtering");
          const assertions = {
            "Ii": { include:[4665,436], exclude:[836] },
            "Yli-Ii": { include:[836], exclude:[4665,436] },
            "Jokela": { include:[721,3334], exclude:[17] },
            "Tikkurila": { include:[3,267], exclude:[4415] },
            "Tesoma": { include:[501,4224,3732], exclude:[4621] }
          };
          let failures = 0;

          for (const query of queries) {
            const stores = await fetchStores(query);
            const r = simulate(query, stores);
            console.log("\n============================================================");
            console.log("QUERY:", query);
            console.log("RAW:", stores.length, "LIVE:", r.live.length,
                        "EXACT_CITY:", r.exactCity.length,
                        "NAME_FALLBACK:", r.nameMatches.length,
                        "POSTAL_AREA:", r.postalAreaMatches.length,
                        "PROPOSED:", r.proposed.length);

            console.log("\n-- RAW/LIVE RESULTS --");
            for (const s of r.live) {
              console.log(JSON.stringify({
                id:s.id, name:s.name, city:s.city, postalCode:s.postalCode,
                chain:s.chain, type:s.type
              }));
            }

            const rule = assertions[query];
            if (rule) {
              const ids = new Set(r.proposed.map(s => Number(s.id)));
              for (const id of rule.include || []) if (!ids.has(id)) {
                console.error("ASSERT_FAIL:", query, "missing expected id", id); failures++;
              }
              for (const id of rule.exclude || []) if (ids.has(id)) {
                console.error("ASSERT_FAIL:", query, "included forbidden id", id); failures++;
              }
              if (!failures) console.log("ASSERT_OK:", query);
            }

            console.log("\n-- PROPOSED FIRST-PASS RESULTS --");
            for (const s of r.proposed) {
              console.log(JSON.stringify({
                id:s.id, name:s.name, city:s.city, postalCode:s.postalCode,
                chain:s.chain, type:s.type
              }));
            }
          }
          if (failures) {
            console.error("\nREGRESSION FAILED:", failures, "assertion(s)");
            process.exit(1);
          }
          console.log("\nREGRESSION PASSED");
          EOF
          node /tmp/simulate.mjs
