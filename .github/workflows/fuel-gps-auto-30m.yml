name: Fuel GPS auto 30m tests
on:
  workflow_dispatch:
  push:
    branches:
      - test/fuel-gps-auto-30m-20261101
    paths:
      - src/lib/fuelPhoto.ts
      - tests/fuel-auto-station-30m.test.cjs
      - .github/workflows/fuel-gps-auto-30m.yml
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node tests/fuel-auto-station-30m.test.cjs
