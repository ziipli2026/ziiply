name: Ziiply six-item basket regression
on:
  workflow_dispatch:
jobs:
  six-item-basket:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Compile comparison core
        run: npx tsc src/app/components/ziiply/ziiplyCore.ts --target ES2021 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck --outDir .tmp-six-item
      - name: Reproduce reported six-item fixture and enforce semantic and money contracts
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const core=require('./.tmp-six-item/ziiplyCore.js');
          const cart=[
            {ean:'6406300014251',name:'Kivikylän Kuoreton nakki 200g',s:239,k:245},
            {ean:'6410380097608',name:'Oolannin uunirapeat ranskalaiset 500g',s:165,k:165},
            {ean:'8710522920664',name:"Hellmann's ketsuppi 430ml",s:228,k:245},
            {ean:'6438574709670',name:'Kotimaista rasvaton maito 1l laktoositon UHT',s:195,k:239},
            {ean:'6414893500075',name:'Kotimaista sika-nauta jauheliha 23% 400g',s:365,k:379},
            {ean:'2000609800009',name:'Peruna Suomi',s:null,k:89},
          ];
          const check=(name,fn)=>{fn();console.log('PASS',name)};
          check('six cart rows with original EANs',()=>assert.equal(new Set(cart.map(x=>x.ean)).size,6));
          check('potato cannot match tomato',()=>assert.equal(core.isComparisonAttributeCompatible('Peruna Suomi','Terttutomaatti'),false));
          check('fresh milk cannot match UHT',()=>assert.equal(core.isComparisonAttributeCompatible('Valio rasvaton maito 1l','Valio rasvaton maito 1l UHT'),false));
          check('UHT cannot match fresh milk',()=>assert.equal(core.isComparisonAttributeCompatible('Valio rasvaton maito 1l UHT','Valio rasvaton maito 1l'),false));
          check('42 cents is not 4200 cents',()=>assert.equal(core.getProductPrice({id:200060980,name:'Terttutomaatti',price:0.42,priceAmountUnit:'eur'}),42));
          check('42 cents in cent-denominated feed stays 42',()=>assert.equal(core.getProductPrice({id:200060980,name:'Terttutomaatti',price:42,priceAmountUnit:'cent'}),42));
          check('first five S items total 1192 cents',()=>assert.equal(cart.slice(0,5).reduce((n,x)=>n+x.s,0),1192));
          check('six K rows total 1362 cents',()=>assert.equal(cart.reduce((n,x)=>n+x.k,0),1362));
          check('incomplete S basket must not win against complete K basket',()=>{
            const results=[{chain:'s',complete:false,total:1192},{chain:'k',complete:true,total:1362}];
            const best=results.filter(x=>x.complete).sort((a,b)=>a.total-b.total)[0];
            assert.equal(best.chain,'k');
          });
          console.log('FIXTURE_SUMMARY semantic and unit contracts passed; live end-to-end production cart is NOT verified by this fixture');
          NODE
      - name: Check actual comparison source guards
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const page=fs.readFileSync('src/app/page.tsx','utf8');
          const core=fs.readFileSync('src/app/components/ziiply/ziiplyCore.ts','utf8');
          const assert=require('node:assert/strict');
          assert.match(page,/comparisonSourceEan/);
          assert.match(page,/isCheapestAttributeCompatible/);
          assert.match(core,/isComparisonAttributeCompatible/);
          console.log('PASS source guards exist; does not establish their execution for the six-item basket');
          NODE
