name: Repair Lidl SPAR PR lockfile
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/lidl-spar-integration-main-oct19
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify npm clean install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile only to PR branch
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Fix package-lock.json to match package.json for Lidl SPAR integration"
          git push origin HEAD:test/lidl-spar-integration-main-oct19
