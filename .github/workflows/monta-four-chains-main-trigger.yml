name: Monta four-chain live validation
on:
  push:
    branches: [main]
    paths: [.github/workflows/monta-four-chains-main-trigger.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/monta-four-chains-live-20261116
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run four-chain live test against verified branch preview
        env:
          ZIIPLY_LIVE_URL: https://ziiply-9ue7zwvnr-ziipli2026s-projects.vercel.app
        run: npx playwright test tests/monta-four-chains-live.spec.cjs --browser=chromium --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monta-four-chains-evidence
          path: test-results/
          if-no-files-found: ignore
