name: K comparable matcher diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/app/components/ziiply/ziiplyCore.ts'
      - 'scripts/audit-k-comparable-diagnostics-20261001.cjs'
      - '.github/workflows/k-comparable-matcher-diagnostic.yml'

jobs:
  compile-core:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      NODE_PATH: ${{ github.workspace }}/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install TypeScript only
        run: npm install --no-save --ignore-scripts typescript@^5
      - name: Compile matcher core for offline diagnostics
        run: npx tsc src/app/components/ziiply/ziiplyCore.ts --target ES2021 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck --outDir /tmp/ziiply-core
      - name: Run Huiluntuhti rejection diagnostics
        run: |
          node -e 'require("fs").writeFileSync("/tmp/k-candidates.json",JSON.stringify([{name:"Kivikylän Huiluntuhti grillimakkara 375 g",ean:"1111111111111",price:3.49},{name:"Kivikylän Huiluntuhti makkarapihvi 400 g",ean:"2222222222222",price:3.59}]))'
          node scripts/audit-k-comparable-diagnostics-20261001.cjs "Kivikylän Huiluntuhti grillimakkara 400 g" 6406300000261 /tmp/k-candidates.json
      - name: Assert wrong Huiluntuhti variants stay rejected
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const core = require('/tmp/ziiply-core/ziiplyCore.js');
          const source = 'Kivikylän Huiluntuhti grillimakkara 400 g';
          const candidates = [
            {name:'Kivikylän Huiluntuhti grillimakkara 375 g',ean:'1111111111111',price:3.49},
            {name:'Kivikylän Huiluntuhti makkarapihvi 400 g',ean:'2222222222222',price:3.59},
          ];
          assert.equal(core.pickBestKProduct(candidates,source,'6406300000261'),undefined);
          console.log('PASS: wrong-size and wrong-product variants are not accepted');
          NODE
      - name: Assert diagnostic distinguishes missing data from matcher rejection
        run: |
          set -euo pipefail
          printf '[]\n' > /tmp/k-empty-candidates.json
          node scripts/audit-k-comparable-diagnostics-20261001.cjs "Kivikylän Huiluntuhti grillimakkara 400 g" 6406300000261 /tmp/k-empty-candidates.json | tee /tmp/k-empty-output.txt
          grep -q '"status":"NO_CANDIDATES_RETURNED"' /tmp/k-empty-output.txt
          node scripts/audit-k-comparable-diagnostics-20261001.cjs "Kivikylän Huiluntuhti grillimakkara 400 g" 6406300000261 /tmp/k-candidates.json | tee /tmp/k-rejected-output.txt
          grep -q '"status":"CANDIDATES_REJECTED_OR_BELOW_THRESHOLD"' /tmp/k-rejected-output.txt
          grep -q '"size-conflict-with-source-ean":1' /tmp/k-rejected-output.txt
          grep -q '"hard-k-match":1' /tmp/k-rejected-output.txt
          echo 'PASS: empty candidate feed and matcher rejection are distinguishable'
      - name: Assert reverse package-size guard and exact identity
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const core = require('/tmp/ziiply-core/ziiplyCore.js');
          const source375 = 'Kivikylän Huiluntuhti 375 g';
          const ean375 = '6409620012684';
          const wrong400 = [
            {name:'Kivikylän Huiluntuhti grillimakkara 400g',ean:'6406300000261',price:3.69},
            {name:'Kivikylän Kuoreton Huiluntuhti grillimakkara 400g',ean:'6406300014237',price:3.69},
          ];
          assert.equal(core.pickBestKProduct(wrong400,source375,ean375),undefined,
            '375g source must not select 400g candidates');
          const exact400 = {name:'Kivikylän Huiluntuhti grillimakkara 400g',ean:'6406300000261',price:3.69};
          assert.equal(core.pickBestKProduct([exact400],exact400.name,exact400.ean)?.ean,exact400.ean,
            'exact 400g EAN must remain selectable');
          console.log('PASS: reverse size conflict rejected; exact EAN selected');
          NODE
      - name: Assert unpriced feed and mixed exact EAN behavior
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const source = 'Kivikylän Huiluntuhti grillimakkara 400 g';
          fs.writeFileSync('/tmp/k-unpriced.json',JSON.stringify([
            {name:source,ean:'6406300000261',price:0}
          ]));
          NODE
          node scripts/audit-k-comparable-diagnostics-20261001.cjs "Kivikylän Huiluntuhti grillimakkara 400 g" 6406300000261 /tmp/k-unpriced.json | tee /tmp/k-unpriced-output.txt
          grep -q '"status":"NO_PRICED_CANDIDATES"' /tmp/k-unpriced-output.txt
          grep -q '"no-positive-price":1' /tmp/k-unpriced-output.txt
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const core = require('/tmp/ziiply-core/ziiplyCore.js');
          const source = 'Kivikylän Huiluntuhti grillimakkara 400 g';
          const exact = {name:source,ean:'6406300000261',price:3.69};
          const candidates = [
            {name:'Kivikylän Huiluntuhti grillimakkara 375 g',ean:'1111111111111',price:3.49},
            {name:'Kivikylän Huiluntuhti makkarapihvi 400 g',ean:'2222222222222',price:3.59},
            exact,
          ];
          assert.equal(core.pickBestKProduct(candidates,source,exact.ean)?.ean,exact.ean);
          console.log('PASS: exact EAN wins alongside rejected variants');
          NODE
