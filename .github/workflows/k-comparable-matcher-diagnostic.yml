name: K comparable matcher diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/app/components/ziiply/ziiplyCore.ts'
      - 'scripts/audit-k-comparable-diagnostics-20261001.cjs'
      - '.github/workflows/k-comparable-matcher-diagnostic.yml'

jobs:
  compile-core:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install TypeScript only
        run: npm install --no-save --ignore-scripts typescript@^5
      - name: Compile matcher core for offline diagnostics
        run: npx tsc src/app/components/ziiply/ziiplyCore.ts --target ES2021 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck --outDir /tmp/ziiply-core
      - name: Run Huiluntuhti rejection diagnostics
        run: |
          node -e 'require("fs").writeFileSync("/tmp/k-candidates.json",JSON.stringify([{name:"Kivikylän Huiluntuhti grillimakkara 375 g",ean:"1111111111111",price:3.49},{name:"Kivikylän Huiluntuhti makkarapihvi 400 g",ean:"2222222222222",price:3.59}]))'
          node scripts/audit-k-comparable-diagnostics-20261001.cjs "Kivikylän Huiluntuhti grillimakkara 400 g" 6406300000261 /tmp/k-candidates.json
      - name: Assert wrong Huiluntuhti variants stay rejected
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const core = require('/tmp/ziiply-core/ziiplyCore.js');
          const source = 'Kivikylän Huiluntuhti grillimakkara 400 g';
          const candidates = [
            {name:'Kivikylän Huiluntuhti grillimakkara 375 g',ean:'1111111111111',price:3.49},
            {name:'Kivikylän Huiluntuhti makkarapihvi 400 g',ean:'2222222222222',price:3.59},
          ];
          assert.equal(core.pickBestKProduct(candidates,source,'6406300000261'),undefined);
          console.log('PASS: wrong-size and wrong-product variants are not accepted');
          NODE
