name: Gosta Prisma campaign mirror regression
on:
  pull_request:
    paths:
      - 'src/app/api/offers/watch/route.ts'
      - 'tests/gosta-prisma-campaign-dedupe.test.cjs'
      - '.github/workflows/gosta-prisma-campaign-dedupe.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: node --test tests/gosta-prisma-campaign-dedupe.test.cjs
      - run: npx tsc --noEmit
