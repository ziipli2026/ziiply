name: Prisma fallback diagnostics
on: { workflow_dispatch: {} }
jobs:
  prisma-fallback-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: V291 Prisma pickup identity and resolver safety audit
        shell: bash
        run: |
          node <<'NODE'
          const stores=[
            ["Hämeenkatu",61.4978,23.7610],["Raksila",65.0100,25.4900],["Myyrmanni",60.2617,24.8534],["Jumbo",60.2925,24.9628],
            ["Lohja",60.2486,24.0653],["Tuusula",60.4030,25.0260],["Limingantulli",64.9990,25.4650],["Lielahti",61.5165,23.6680]
          ];
          const HASH="6da249b0fd87c05275a239ed490976c851d7aff90ead0f3a3978e8283f21252d",CLIENT="production-14a82a5b48cd1dd42c0592db0037514ed3c84de8",date=new Date().toISOString().slice(0,10);
          const flatten=(o,p="",d=0,a=[])=>{if(d>6||o==null)return a;if(typeof o!=="object"){a.push([p,o]);return a}if(Array.isArray(o)){o.slice(0,3).forEach((v,i)=>flatten(v,p+"["+i+"]",d+1,a));return a}for(const [k,v] of Object.entries(o))flatten(v,p? p+"."+k:k,d+1,a);return a};
          (async()=>{for(const [name,lat,lon] of stores){
            const v={startDate:date,endDate:date,location:{latitude:lat,longitude:lon},limit:50},u=new URL("https://api.s-kaupat.fi/");
            u.searchParams.set("operationName","remotePickupSlots");u.searchParams.set("variables",JSON.stringify(v));u.searchParams.set("extensions",JSON.stringify({persistedQuery:{version:1,sha256Hash:HASH}}));
            const r=await fetch(u,{headers:{accept:"application/json","accept-language":"fi",origin:"https://www.s-kaupat.fi",referer:"https://www.s-kaupat.fi/","x-client-name":"skaupat-web","x-client-version":CLIENT}}),d=await r.json(),rows=d?.data?.pickupSlotsForCoordinates?.slotsInPickupPoints||[];
            const near=rows.filter(x=>String(x?.store?.brand||"").toLowerCase()==="prisma").slice(0,3).map(x=>({distance:x?.distance,pickupName:x?.pickupPoint?.name,store:x?.store,pickupPoint:x?.pickupPoint,interesting:flatten(x).filter(([p,v])=>/id|name|address|city|postal|brand|chain|merchant|store|pickup/i.test(p)&&typeof v!=="object").slice(0,80)}));
            console.log("\n=== V291 "+name+" ===");console.log(JSON.stringify({status:r.status,near},null,2));await new Promise(r=>setTimeout(r,900));
          }})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
