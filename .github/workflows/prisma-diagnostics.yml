            return {status:r.status,json:j,text:t};
          }
          function walk(v,fn){if(!v)return;if(Array.isArray(v)){for(const x of v)walk(x,fn);return}if(typeof v==="object"){fn(v);for(const x of Object.values(v))walk(x,fn)}}
          function valRows(j){const a=Array.isArray(j)?j:[];return a.map(x=>x&&typeof x==="object"&&"value"in x?x.value:x)}
          function stores(v){const out=[];walk(v,o=>{const id=String(o.publicId||o.id||o.localBusinessId||"").trim();const name=String(o.name||o.title||o.label||"").trim();if(id&&name&&(o.address||o.street||o.coordinates||o.businessId===BID||o.business?.publicId===BID))out.push({id,name})});return out}
          function pubs(v){const out=[];walk(v,o=>{const id=String(o.publicId||o.id||"").trim();const name=String(o.publicationName||o.label||o.name||"").trim();const from=String(o.validFrom||"");const until=String(o.validUntil||"");if(id&&name&&(from||until))out.push({id,name,from,until})});return out}
