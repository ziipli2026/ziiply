name: Prisma fallback diagnostics
on: { workflow_dispatch: {} }
jobs:
  prisma-fallback-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: V295 Prisma resolver broad control audit
        shell: bash
        run: |
          node <<'NODE'
          // Broad controls: several cities, including multi-Prisma Tampere/Oulu.
          const tests=[
            ["Kaleva","Tampere",61.4959,23.8426],
            ["Koivistonkylä","Tampere",61.4615,23.7768],
            ["Lielahti","Tampere",61.5165,23.6680],
            ["Linnainmaa","Tampere",61.5015,23.9240],
            ["Pirkkala","Pirkkala",61.4635,23.6445],
            ["Ylöjärvi","Ylöjärvi",61.5550,23.5960],
            ["Limingantulli","Oulu",64.9990,25.4650],
            ["Linnanmaa","Oulu",65.0580,25.4660],
            ["Zeppelin","Kempele",64.9035,25.5400],
            ["Jumbo","Vantaa",60.2925,24.9628],
            ["Myyrmanni","Vantaa",60.2617,24.8534],
            ["Tuusula","Tuusula",60.4030,25.0260],
            ["Lohja","Lohja",60.2486,24.0653]
          ].map(([name,city,lat,lon])=>({name,city,lat,lon}));
          const H="6da249b0fd87c05275a239ed490976c851d7aff90ead0f3a3978e8283f21252d",C="production-14a82a5b48cd1dd42c0592db0037514ed3c84de8",date=new Date().toISOString().slice(0,10);
          const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();
          const stop=new Set(["prisma","ruoan","verkkokauppa","noutopiste","noutolokero","noutotilaus","drive","sokos"]);
          const toks=s=>norm(s).split(/\s+/).filter(x=>x.length>2&&!stop.has(x));
          async function get(t){const v={startDate:date,endDate:date,location:{latitude:t.lat,longitude:t.lon},limit:100},u=new URL("https://api.s-kaupat.fi/");u.searchParams.set("operationName","remotePickupSlots");u.searchParams.set("variables",JSON.stringify(v));u.searchParams.set("extensions",JSON.stringify({persistedQuery:{version:1,sha256Hash:H}}));const r=await fetch(u,{headers:{accept:"application/json","accept-language":"fi",origin:"https://www.s-kaupat.fi",referer:"https://www.s-kaupat.fi/","x-client-name":"skaupat-web","x-client-version":C}}),d=await r.json();return[r.status,d?.data?.pickupSlotsForCoordinates?.slotsInPickupPoints||[]]}
          (async()=>{let ok=0;for(const t of tests){const[status,all]=await get(t),want=toks(t.name);const cand=all.filter(x=>norm(x?.store?.brand)==="prisma").map(x=>{const a=x?.pickupPoint?.address||{},n=norm(x?.pickupPoint?.name),dist=Number(x?.distance||1e9),nameHit=want.length>0&&want.some(z=>n.includes(z)),cityHit=norm(a.city)===norm(t.city),safe=nameHit&&cityHit;return{id:String(x?.store?.id||""),name:x?.pickupPoint?.name,street:a.street,city:a.city,distance:Math.round(dist),nameHit,cityHit,safe}}).sort((a,b)=>Number(b.safe)-Number(a.safe)||a.distance-b.distance);const safe=cand.filter(x=>x.safe),ids=[...new Set(safe.map(x=>x.id))],resolved=ids.length===1?ids[0]:null,pass=!!resolved&&safe[0]?.distance<=1500;ok+=pass?1:0;console.log("\n=== V295 "+t.name+" / "+t.city+" ===");console.log(JSON.stringify({status,resolved,pass,safeCandidates:safe.slice(0,6),top:cand.slice(0,4)},null,2));await new Promise(r=>setTimeout(r,650))}console.log("\n=== V295 SUMMARY ===");console.log(JSON.stringify({passed:ok,total:tests.length},null,2))})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
