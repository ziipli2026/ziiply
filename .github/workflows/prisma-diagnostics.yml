name: S-local active provider diagnostics
on:
  workflow_dispatch:
jobs:
  s-local:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: S-local S-kaupat Next data discovery V269
        shell: bash
        run: |
          node <<'NODE'
          const urls=[
            "https://www.s-kaupat.fi/myymala/s-market-vehkoja/519941769",
            "https://www.s-kaupat.fi/myymala/s-market-suutarila/726666563",
            "https://www.s-kaupat.fi/myymala/s-market-kontula/513931329"
          ];
          for(const url of urls){
            try{
              const r=await fetch(url,{headers:{accept:"text/html,application/xhtml+xml","accept-language":"fi","user-agent":"Mozilla/5.0"}});
              const body=await r.text();
              const next=body.match(/<script[^>]+id=["']__NEXT_DATA__["'][^>]*>([\s\S]*?)<\/script>/i)?.[1]||"";
              const build=next?(()=>{try{return JSON.parse(next)?.buildId||""}catch{return""}})():"";
              const scripts=[...body.matchAll(/<script[^>]+src=["']([^"']+_next[^"']+)["']/gi)].map(m=>m[1]);
              const api=[...new Set([...body.matchAll(/https?:\\?\/\\?\/[^"'<>\s]+|\/api\/[^"'<>\s]+/gi)].map(m=>m[0]).filter(x=>/api|graphql|store|myym/i.test(x)))].slice(0,30);
              console.log("SLOCAL_V269_PAGE "+JSON.stringify({url,status:r.status,len:body.length,hasNext:!!next,build,scripts:scripts.slice(0,20),api}));
            }catch(e){console.log("SLOCAL_V269_PAGE "+JSON.stringify({url,error:String(e?.message||e)}))}
          }
          NODE
