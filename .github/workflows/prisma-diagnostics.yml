name: Prisma fallback diagnostics
on: { workflow_dispatch: {} }
jobs:
  prisma-fallback-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: V290 Prisma shared-ID content identity audit
        shell: bash
        run: |
          node <<'NODE'
          const tests=[
            ["Tampere shared","726491474"],["HOK shared","726452067"],["Lohja","613759562"],
            ["Limingantulli","726760153"],["Lielahti","697940575"],["Kaleva control","517609418"]
          ];
          const HASH="44ca017dddccfe49e787b483f471f26217adca807f8c71101d11e881dab9e480", CLIENT="production-45c31f7a746096c6da12e16aba1887e031fbd9de";
          const today=new Date().toISOString().slice(0,10);
          async function go(label,storeId){
            const v={availabilityDate:today,facets:[{key:"brandName",order:"asc"},{key:"category"},{key:"labels"}],filters:[{key:"labels",value:["DISCOUNTED"]}],generatedSessionId:"1d6b5de9-df99-4608-af07-7d754955df82",fetchSponsoredContent:true,limit:48,queryString:"",sortForAvailabilityLabelDate:today,storeId,useRandomId:false,marketingId:"d0bcc6e5-6130-494e-b6fb-12b5cb9c60cf",from:0,offset:0,skip:0,page:1};
            const u=new URL("https://api.s-kaupat.fi/");u.searchParams.set("operationName","RemoteFilteredProducts");u.searchParams.set("variables",JSON.stringify(v));u.searchParams.set("extensions",JSON.stringify({persistedQuery:{version:1,sha256Hash:HASH}}));
            const r=await fetch(u,{headers:{accept:"application/json","accept-language":"fi",origin:"https://www.s-kaupat.fi",referer:"https://www.s-kaupat.fi/","x-client-name":"skaupat-web","x-client-version":CLIENT}});
            const d=await r.json();const st=d?.data?.store||{}, p=st?.products||{}, items=p?.productListItems||[];
            const sample=items.slice(0,12).map(x=>({name:x?.product?.name||x?.name||"",ean:x?.product?.ean||x?.ean||x?.product?.id||x?.id||"",price:x?.price||x?.product?.price||null,keys:Object.keys(x||{}).slice(0,12)}));
            console.log("\n=== V290 "+label+" / "+storeId+" ===");
            console.log(JSON.stringify({status:r.status,storeScalar:Object.fromEntries(Object.entries(st).filter(([k,v])=>["string","number","boolean"].includes(typeof v))),productKeys:Object.keys(p),count:items.length,total:p?.totalCount??p?.total??null,sample},null,2));
          }
          (async()=>{for(const t of tests){await go(...t);await new Promise(r=>setTimeout(r,800));}})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
