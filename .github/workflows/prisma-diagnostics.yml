name: Prisma fallback diagnostics
on: { workflow_dispatch: {} }
jobs:
  prisma-fallback-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: V292 Prisma Raksila and Hameenkatu resolver audit
        shell: bash
        run: |
          node <<'NODE'
          const targets=[["Raksila",65.0100,25.4900],["Hameenkatu",61.4978,23.7610]];
          const PH="6da249b0fd87c05275a239ed490976c851d7aff90ead0f3a3978e8283f21252d",PC="production-14a82a5b48cd1dd42c0592db0037514ed3c84de8",RH="44ca017dddccfe49e787b483f471f26217adca807f8c71101d11e881dab9e480",RC="production-45c31f7a746096c6da12e16aba1887e031fbd9de",date=new Date().toISOString().slice(0,10);
          async function pickup(name,lat,lon){
            const v={startDate:date,endDate:date,location:{latitude:lat,longitude:lon},limit:100},u=new URL("https://api.s-kaupat.fi/");u.searchParams.set("operationName","remotePickupSlots");u.searchParams.set("variables",JSON.stringify(v));u.searchParams.set("extensions",JSON.stringify({persistedQuery:{version:1,sha256Hash:PH}}));
            const r=await fetch(u,{headers:{accept:"application/json","accept-language":"fi",origin:"https://www.s-kaupat.fi",referer:"https://www.s-kaupat.fi/","x-client-name":"skaupat-web","x-client-version":PC}}),d=await r.json(),rows=d?.data?.pickupSlotsForCoordinates?.slotsInPickupPoints||[];
            const prisma=rows.filter(x=>String(x?.store?.brand||"").toLowerCase()==="prisma").map(x=>({distance:Math.round(x?.distance||0),storeId:String(x?.store?.id||""),name:x?.pickupPoint?.name,address:x?.pickupPoint?.address,description:x?.pickupPoint?.description}));
            console.log("\n=== V292 PICKUP "+name+" ===");console.log(JSON.stringify({status:r.status,count:prisma.length,prisma:prisma.slice(0,15)},null,2));return prisma;
          }
          async function products(label,id){
            const v={availabilityDate:date,facets:[{key:"brandName",order:"asc"},{key:"category"},{key:"labels"}],filters:[{key:"labels",value:["DISCOUNTED"]}],generatedSessionId:"1d6b5de9-df99-4608-af07-7d754955df82",fetchSponsoredContent:true,limit:48,queryString:"",sortForAvailabilityLabelDate:date,storeId:id,useRandomId:false,marketingId:"d0bcc6e5-6130-494e-b6fb-12b5cb9c60cf",from:0,offset:0,skip:0,page:1},u=new URL("https://api.s-kaupat.fi/");u.searchParams.set("operationName","RemoteFilteredProducts");u.searchParams.set("variables",JSON.stringify(v));u.searchParams.set("extensions",JSON.stringify({persistedQuery:{version:1,sha256Hash:RH}}));
            const r=await fetch(u,{headers:{accept:"application/json","accept-language":"fi",origin:"https://www.s-kaupat.fi",referer:"https://www.s-kaupat.fi/","x-client-name":"skaupat-web","x-client-version":RC}}),d=await r.json(),p=d?.data?.store?.products||{},a=p?.productListItems||[];
            console.log("\n=== V292 PRODUCTS "+label+" / "+id+" ===");console.log(JSON.stringify({status:r.status,count:a.length,total:p?.totalCount??null,sample:a.slice(0,5).map(x=>({name:x?.product?.name||x?.name||"",id:x?.product?.id||x?.id||""}))},null,2));
          }
          (async()=>{const rr=await pickup(...targets[0]);await new Promise(r=>setTimeout(r,900));const hh=await pickup(...targets[1]);const ids=[["Raksila old","516528759"],["Hameenkatu old","726413330"],...rr.slice(0,4).map((x,i)=>["Raksila candidate "+(i+1),x.storeId]),...hh.slice(0,4).map((x,i)=>["Hameenkatu candidate "+(i+1),x.storeId])];const seen=new Set();for(const [l,id] of ids){if(!id||seen.has(l+"|"+id))continue;seen.add(l+"|"+id);await new Promise(r=>setTimeout(r,700));await products(l,id)}})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
