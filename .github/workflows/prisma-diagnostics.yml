              ps=valRows(pr.json).flatMap(pubs);
              const pm=new Map(); for(const p of ps)if(!pm.has(p.id))pm.set(p.id,p); ps=[...pm.values()];
            }
            console.log("SMARKET_V251_STORE "+JSON.stringify({query:q,http:sr.status,candidates:ss.length,best,publications:ps.length,pubSample:ps.slice(0,3)}));
