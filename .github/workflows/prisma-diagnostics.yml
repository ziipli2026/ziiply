name: Prisma diagnostics
on:
  workflow_dispatch:
jobs:
  kaleva-geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Prisma Kaleva geocode
        run: |
          node <<'NODE'
          (async () => {
            const query = "Prisma Kaleva Tampere";
            const url = "https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=fi&q=" + encodeURIComponent(query);
            const response = await fetch(url, {
              headers: {
                "User-Agent": "Ziiply-Prisma-Diagnostics/1.0",
                "Accept": "application/json"
              }
            });
            const text = await response.text();
            let data = null;
            try { data = JSON.parse(text); } catch {}
            console.log("PRISMA_KALEVA_GEOCODE " + JSON.stringify({
              query,
              status: response.status,
              count: Array.isArray(data) ? data.length : null,
              results: Array.isArray(data) ? data.map(x => ({
                lat: x.lat,
                lon: x.lon,
                display_name: x.display_name,
                type: x.type
              })) : [],
              parseOk: Array.isArray(data)
            }, null, 2));
            if (!response.ok || !Array.isArray(data)) process.exitCode = 1;
          })().catch(err => {
            console.error(err);
            process.exitCode = 1;
          });
          NODE
      - name: Prisma Kaleva pickup candidates
        run: |
          node <<'NODE'
          (async () => {
            const latitude = 61.4918293;
            const longitude = 23.8216071;
            const date = new Intl.DateTimeFormat("en-CA", {timeZone:"Europe/Helsinki",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
            const variables = {startDate:date,endDate:date,location:{latitude,longitude},limit:20};
            const extensions = {persistedQuery:{version:1,sha256Hash:"6da249b0fd87c05275a239ed490976c851d7aff90ead0f3a3978e8283f21252d"}};
            const url = new URL("https://api.s-kaupat.fi/");
            url.searchParams.set("operationName","remotePickupSlots");
            url.searchParams.set("variables",JSON.stringify(variables));
            url.searchParams.set("extensions",JSON.stringify(extensions));
            const response = await fetch(url,{headers:{
              accept:"application/graphql-response+json,application/json;q=0.9",
              "content-type":"application/json",
              "accept-language":"fi",
              origin:"https://www.s-kaupat.fi",
              referer:"https://www.s-kaupat.fi/",
              "x-client-name":"skaupat-web",
              "x-client-version":"production-14a82a5b48cd1dd42c0592db0037514ed3c84de8"
            }});
            const data=await response.json();
            const rows=data?.data?.pickupSlotsForCoordinates?.slotsInPickupPoints;
            const candidates=Array.isArray(rows)?rows.map(row=>({
              storeId:String(row?.store?.id||""),
              brand:String(row?.store?.brand||""),
              pickupName:String(row?.pickupPoint?.name||""),
              city:String(row?.pickupPoint?.address?.city||""),
              postalCode:String(row?.pickupPoint?.address?.postalCode||""),
              distance:row?.distance
            })):[];
            console.log("PRISMA_KALEVA_PICKUP "+JSON.stringify({status:response.status,count:candidates.length,candidates},null,2));
            if(!response.ok) process.exitCode=1;
          })().catch(err=>{console.error(err);process.exitCode=1});
          NODE
      - name: Prisma Kaleva discounted products
        run: |
          node <<'NODE'
          (async () => {
            const today=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Helsinki",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
            const variables={
              availabilityDate:today,
              facets:[{key:"brandName",order:"asc"},{key:"category"},{key:"labels"}],
              filters:[{key:"labels",value:["DISCOUNTED"]}],
              generatedSessionId:"1d6b5de9-df99-4608-af07-7d754955df82",
              fetchSponsoredContent:true,
              limit:48,
              queryString:"",
              sortForAvailabilityLabelDate:today,
              storeId:"517609418",
              useRandomId:false,
              marketingId:"d0bcc6e5-6130-494e-b6fb-12b5cb9c60cf",
              from:0,offset:0,skip:0,page:1
            };
            const extensions={persistedQuery:{version:1,sha256Hash:"44ca017dddccfe49e787b483f471f26217adca807f8c71101d11e881dab9e480"}};
            const url=new URL("https://api.s-kaupat.fi/");
            url.searchParams.set("operationName","RemoteFilteredProducts");
            url.searchParams.set("variables",JSON.stringify(variables));
            url.searchParams.set("extensions",JSON.stringify(extensions));
            const response=await fetch(url,{headers:{
              accept:"application/json","content-type":"application/json","accept-language":"fi",
              origin:"https://www.s-kaupat.fi",referer:"https://www.s-kaupat.fi/",
              "x-client-name":"skaupat-web","x-client-version":"production-45c31f7a746096c6da12e16aba1887e031fbd9de",
              "user-agent":"Mozilla/5.0"
            }});
            const data=await response.json();
            const products=data?.data?.products;
            const items=products?.items||products?.products||products?.edges||[];
            console.log("PRISMA_KALEVA_PRODUCTS "+JSON.stringify({
              status:response.status,storeId:"517609418",
              rootKeys:data?.data?Object.keys(data.data):[],
              productKeys:products?Object.keys(products):[],
              count:Array.isArray(items)?items.length:null,
              from:products?.from,total:products?.total,limit:products?.limit,
              errors:data?.errors||[]
            },null,2));
            if(!response.ok) process.exitCode=1;
          })().catch(err=>{console.error(err);process.exitCode=1});
          NODE
      - name: Prisma Kaleva response shape
        run: |
          node <<'NODE'
          (async () => {
            const today=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Helsinki",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
            const variables={availabilityDate:today,facets:[{key:"brandName",order:"asc"},{key:"category"},{key:"labels"}],filters:[{key:"labels",value:["DISCOUNTED"]}],generatedSessionId:"1d6b5de9-df99-4608-af07-7d754955df82",fetchSponsoredContent:true,limit:48,queryString:"",sortForAvailabilityLabelDate:today,storeId:"517609418",useRandomId:false,marketingId:"d0bcc6e5-6130-494e-b6fb-12b5cb9c60cf",from:0,offset:0,skip:0,page:1};
            const extensions={persistedQuery:{version:1,sha256Hash:"44ca017dddccfe49e787b483f471f26217adca807f8c71101d11e881dab9e480"}};
            const url=new URL("https://api.s-kaupat.fi/");
            url.searchParams.set("operationName","RemoteFilteredProducts");
            url.searchParams.set("variables",JSON.stringify(variables));
            url.searchParams.set("extensions",JSON.stringify(extensions));
            const response=await fetch(url,{headers:{accept:"application/json","content-type":"application/json","accept-language":"fi",origin:"https://www.s-kaupat.fi",referer:"https://www.s-kaupat.fi/","x-client-name":"skaupat-web","x-client-version":"production-45c31f7a746096c6da12e16aba1887e031fbd9de","user-agent":"Mozilla/5.0"}});
            const data=await response.json();
            const store=data?.data?.store;
            console.log("PRISMA_KALEVA_STORE_SHAPE "+JSON.stringify({
              status:response.status,
              dataKeys:data?.data?Object.keys(data.data):[],
              storeKeys:store&&typeof store==="object"?Object.keys(store):[],
              storeId:store?.id,
              storeName:store?.name,
              storeBrand:store?.brand,
              nestedKeys:store&&typeof store==="object"?Object.fromEntries(Object.entries(store).filter(([,v])=>v&&typeof v==="object").map(([k,v])=>[k,Array.isArray(v)?("array:"+v.length):Object.keys(v).slice(0,20)])):{}}
            ,null,2));
          })().catch(err=>{console.error(err);process.exitCode=1});
          NODE
      - name: Prisma Kaleva product counts
        run: |
          node <<'NODE'
          (async () => {
            const today=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Helsinki",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
            const variables={availabilityDate:today,facets:[{key:"brandName",order:"asc"},{key:"category"},{key:"labels"}],filters:[{key:"labels",value:["DISCOUNTED"]}],generatedSessionId:"1d6b5de9-df99-4608-af07-7d754955df82",fetchSponsoredContent:true,limit:48,queryString:"",sortForAvailabilityLabelDate:today,storeId:"517609418",useRandomId:false,marketingId:"d0bcc6e5-6130-494e-b6fb-12b5cb9c60cf",from:0,offset:0,skip:0,page:1};
            const extensions={persistedQuery:{version:1,sha256Hash:"44ca017dddccfe49e787b483f471f26217adca807f8c71101d11e881dab9e480"}};
            const url=new URL("https://api.s-kaupat.fi/");
            url.searchParams.set("operationName","RemoteFilteredProducts");
            url.searchParams.set("variables",JSON.stringify(variables));
            url.searchParams.set("extensions",JSON.stringify(extensions));
            const response=await fetch(url,{headers:{accept:"application/json","content-type":"application/json","accept-language":"fi",origin:"https://www.s-kaupat.fi",referer:"https://www.s-kaupat.fi/","x-client-name":"skaupat-web","x-client-version":"production-45c31f7a746096c6da12e16aba1887e031fbd9de","user-agent":"Mozilla/5.0"}});
            const data=await response.json();
            const p=data?.data?.store?.products;
            const items=Array.isArray(p?.productListItems)?p.productListItems:[];
            console.log("PRISMA_KALEVA_PRODUCT_COUNTS "+JSON.stringify({
              status:response.status,storeId:data?.data?.store?.id,
              total:p?.total,from:p?.from,limit:p?.limit,
              productListItems:items.length,
              firstItemKeys:items[0]&&typeof items[0]==="object"?Object.keys(items[0]):[],
              errors:data?.errors||[]
            },null,2));
          })().catch(err=>{console.error(err);process.exitCode=1});
          NODE
      - name: Prisma Kaleva V217 resolver timing
        run: |
          node <<'NODE'
          (async () => {
            const storeName="Prisma Kaleva Tampere";
            async function timed(label,fn){
              const t=Date.now();
              try { const value=await fn(); console.log("PRISMA_V217_STEP "+JSON.stringify({label,ms:Date.now()-t,...value})); return value; }
              catch(e){ const value={ok:false,error:String(e?.message||e)}; console.log("PRISMA_V217_STEP "+JSON.stringify({label,ms:Date.now()-t,...value})); return value; }
            }
            const official=await timed("official-store-search",async()=>{
              const url="https://www.s-kaupat.fi/myymalat/prisma?query="+encodeURIComponent(storeName);
              const r=await fetch(url,{headers:{accept:"text/html,application/xhtml+xml","accept-language":"fi","user-agent":"Mozilla/5.0 (compatible; Ziiply/1.0; +https://ziiply.fi)"}});
              const body=await r.text();
              const ids=[...body.matchAll(/\/myymala\/[^"'\\s<>]+\/(\d{5,})/g)].map(m=>m[1]);
              return {ok:r.ok,status:r.status,ids:[...new Set(ids)].slice(0,10)};
            });
            const directory=await timed("directory-resolver-http",async()=>{
              const url="https://www.s-kaupat.fi/myymalat/prisma";
              const r=await fetch(url,{headers:{accept:"text/html,application/xhtml+xml","accept-language":"fi","user-agent":"Mozilla/5.0"}});
              const body=await r.text();
              const ids=[...body.matchAll(/\/myymala\/[^"'\\s<>]+\/(\d{5,})/g)].map(m=>m[1]);
              return {ok:r.ok,status:r.status,ids:[...new Set(ids)].slice(0,10)};
            });
            const geo=await timed("pickup-geocode",async()=>{
              const url="https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=fi&limit=1&q="+encodeURIComponent(storeName+", Finland");
              const r=await fetch(url,{headers:{accept:"application/json","accept-language":"fi","user-agent":"Ziiply/1.0 (+https://ziiply.fi)"}});
              const a=await r.json(); return {ok:r.ok,status:r.status,lat:Number(a?.[0]?.lat),lon:Number(a?.[0]?.lon)};
            });
            let pickup={};
            if(Number.isFinite(geo.lat)&&Number.isFinite(geo.lon)){
              pickup=await timed("remotePickupSlots",async()=>{
                const today=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Helsinki",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
                const variables={startDate:today,endDate:today,location:{latitude:geo.lat,longitude:geo.lon},limit:20};
                const extensions={persistedQuery:{version:1,sha256Hash:"6da249b0fd87c05275a239ed490976c851d7aff90ead0f3a3978e8283f21252d"}};
                const u=new URL("https://api.s-kaupat.fi/"); u.searchParams.set("operationName","remotePickupSlots");u.searchParams.set("variables",JSON.stringify(variables));u.searchParams.set("extensions",JSON.stringify(extensions));
                const r=await fetch(u,{headers:{accept:"application/graphql-response+json,application/json;q=0.9","content-type":"application/json","accept-language":"fi",origin:"https://www.s-kaupat.fi",referer:"https://www.s-kaupat.fi/","x-client-name":"skaupat-web","x-client-version":"production-14a82a5b48cd1dd42c0592db0037514ed3c84de8"}});
                const d=await r.json(); const rows=d?.data?.pickupSlotsForCoordinates?.slotsInPickupPoints||[];
                const kaleva=rows.filter(x=>String(x?.pickupPoint?.name||"").toLowerCase().includes("kaleva")).map(x=>({id:String(x?.store?.id||""),name:x?.pickupPoint?.name,distance:x?.distance}));
                return {ok:r.ok,status:r.status,kaleva};
              });
            }
            console.log("PRISMA_V217_CHAIN "+JSON.stringify({official,directory,geo,pickup},null,2));
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Prisma provider source sanity
        run: |
          node <<'NODE'
          const fs = require("fs");
          const p = "src/app/components/ziiply/offerSearch/providers/skaupatProvider.ts";
          const s = fs.readFileSync(p, "utf8");
          const required = [
            "fetchSKaupatOffers",
            "getEffectiveSKaupatStoreIdV174",
            "resolveSKaupatStoreIdViaPickupSlotsV215",
            "RemoteFilteredProducts",
            "DISCOUNTED",
          ];
          const missing = required.filter(x => !s.includes(x));
          console.log("PRISMA_PROVIDER_SOURCE_SANITY", JSON.stringify({path:p,bytes:s.length,missing,pass:missing.length===0}));
          if (missing.length) process.exit(1);
          NODE
