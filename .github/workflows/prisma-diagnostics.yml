name: Prisma fallback diagnostics
on:
  workflow_dispatch:
jobs:
  prisma-fallback-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: V284 Prisma Ruoanhinta externalId fallback audit
        shell: bash
        run: |
          node <<'NODE'
          const ENDPOINT="https://www.s-kaupat.fi/api/v1/graphql";
          const HASH="f6d87786fda8fb5c233c4eaed08f37b0c5b87dc0d8d4c44c33c5529e446369d1";
          const CLIENT="production-14a82a5b48cd1dd42c0592db0037514ed3c84de8";
          const stores=[
            ["Prisma Hämeenkatu","726413330"],
            ["Prisma Raksila","516528759"],
            ["Prisma Myyrmanni","726435566"],
            ["Prisma Jumbo","613761030"],
            ["Prisma Lohja","603212895"],
            ["Prisma Tuusula","726753948"],
            ["Prisma Limingantulli","627829302"],
            ["Prisma Lielahti","697940575"],
          ];
          const norm=v=>String(v??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9åäö]+/gi," ").replace(/\s+/g," ").trim();
          function flattenProducts(v,out=[]){
            if(!v||typeof v!=="object")return out;
            if(Array.isArray(v)){for(const x of v)flattenProducts(x,out);return out}
            if(Array.isArray(v.products))for(const p of v.products)if(p&&typeof p==="object")out.push(p);
            for(const x of Object.values(v))if(x&&typeof x==="object")flattenProducts(x,out);
            return out;
          }
          async function ruoanhinta(name){
            const u=new URL("https://api.ruoanhinta.fi/api/stores");u.searchParams.set("search",name);
            const r=await fetch(u,{headers:{accept:"application/json","user-agent":"Mozilla/5.0"}});
            const body=await r.text(); let d;try{d=JSON.parse(body)}catch{return {status:r.status,error:"non-json",sample:body.slice(0,300),rows:[]}}
            const rows=Array.isArray(d)?d:Array.isArray(d?.stores)?d.stores:Array.isArray(d?.data)?d.data:[];
            return {status:r.status,rows:rows.map(x=>({name:x?.name,chain:x?.chain,city:x?.city,postalCode:x?.postalCode,externalId:x?.externalId,id:x?.id}))};
          }
          async function campaigns(id){
            if(!id)return {status:null,sections:0,products:0,uniqueProducts:0,error:"no id"};
            const variables={storeId:String(id),path:"tuotteet/kampanjat"};
            const extensions={persistedQuery:{version:1,sha256Hash:HASH}};
            const u=ENDPOINT+"?operationName=RemoteGetPageContent&variables="+encodeURIComponent(JSON.stringify(variables))+"&extensions="+encodeURIComponent(JSON.stringify(extensions));
            const r=await fetch(u,{headers:{accept:"application/json","content-type":"application/json","x-client-version":CLIENT,"user-agent":"Mozilla/5.0"}});
            const body=await r.text();let d;try{d=JSON.parse(body)}catch{return {status:r.status,sections:0,products:0,uniqueProducts:0,error:"non-json "+body.slice(0,200)}}
            const pc=d?.data?.pageContent; const sections=Array.isArray(pc?.sections)?pc.sections:[];
            const ps=flattenProducts(pc); const uniq=new Set(ps.map(p=>String(p?.ean||p?.eanCode||p?.gtin||p?.id||p?.name||p?.title||"")).filter(Boolean));
            return {status:r.status,sections:sections.length,products:ps.length,uniqueProducts:uniq.size,errors:d?.errors?.map(e=>e?.message).filter(Boolean)||[]};
          }
          (async()=>{
            for(const [name,oldId] of stores){
              const rh=await ruoanhinta(name);
              const wanted=norm(name).replace(/^prisma\s+/,"");
              const candidates=rh.rows.filter(x=>norm(x.chain).includes("prisma")||norm(x.name).includes("prisma"));
              const exact=candidates.find(x=>norm(x.name)===norm(name));
              const token=candidates.find(x=>norm(x.name).includes(wanted));
              const picked=exact||token||candidates[0]||null;
              const ext=String(picked?.externalId||"").trim();
              const oldRes=await campaigns(oldId);
              const extRes=ext&&ext!==oldId?await campaigns(ext):ext?oldRes:{status:null,sections:0,products:0,uniqueProducts:0,error:"no externalId"};
              console.log("\n=== PRISMA FALLBACK V284 "+name+" ===");
              console.log(JSON.stringify({name,oldId,ruoanhintaStatus:rh.status,ruoanhintaCandidates:candidates,picked,externalId:ext,sameId:ext===oldId,oldIdCampaigns:oldRes,externalIdCampaigns:extRes},null,2));
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
