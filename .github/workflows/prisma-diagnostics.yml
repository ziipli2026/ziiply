name: S-local active provider diagnostics
on:
  workflow_dispatch:
jobs:
  s-local:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: S-local Jokela vs Vehkoja raw campaign comparison V272
        shell: bash
        run: |
          node <<'NODE'
          const HASH="f6d87786fda8fb5c233c4eaed08f37b0c5b87dc0d8d4c44c33c5529e446369d1",CLIENT="production-14a82a5b48cd1dd42c0592db0037514ed3c84de8";
          const names=["S-market Vehkoja","S-market Jokela"];
          const norm=x=>String(x??"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9åäö]+/gi," ").replace(/\s+/g," ").trim();
          const date=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Helsinki",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
          async function search(name){const r=await fetch("https://api.ruoanhinta.fi/api/stores?search="+encodeURIComponent(name),{headers:{accept:"application/json"}});const d=await r.json();const a=Array.isArray(d)?d:(d?.items||[]);const n=norm(name);const best=a.find(x=>norm(x?.name)===n)||a.find(x=>norm(x?.name).includes(n.replace(/^s market /,"")))||a[0]||null;return{status:r.status,count:a.length,best:best&&{id:best.id,name:best.name,chain:best.chain,city:best.city,externalId:best.externalId}}}
          async function page(id){if(!/^\d{5,}$/.test(String(id||"")))return null;const variables={preview:false,storeId:String(id),skipProducts:false,availabilityDate:date,where:{storeId:String(id),path:"tuotteet/kampanjat",platform:"WEB",availabilityDate:date,userConsent:{marketing:false,marketingId:"ziiply-gosta",useCustomerId:false,sessionId:"ziiply-gosta",loop54:true}}},extensions={clientLibrary:{name:"@apollo/client",version:"4.2.12"},persistedQuery:{version:1,sha256Hash:HASH}};const u=new URL("https://api.s-kaupat.fi/");u.searchParams.set("operationName","RemoteGetPageContent");u.searchParams.set("variables",JSON.stringify(variables));u.searchParams.set("extensions",JSON.stringify(extensions));const r=await fetch(u,{headers:{accept:"application/graphql-response+json,application/json;q=0.9","accept-language":"fi",origin:"https://www.s-kaupat.fi",referer:"https://www.s-kaupat.fi/","x-client-name":"skaupat-web","x-client-version":CLIENT}});const d=await r.json(),secs=d?.data?.pageContent?.sections;let products=0;if(Array.isArray(secs))for(const s of secs)products+=Array.isArray(s?.products)?s.products.length:0;const rows=[];if(Array.isArray(secs))for(const [si,s] of secs.entries())for(const p of (Array.isArray(s?.products)?s.products:[])){rows.push({sectionIndex:si,sectionTitle:s?.title||s?.name||s?.heading||"",ean:String(p?.ean||p?.eanCode||p?.gtin||""),name:p?.name||p?.title||"",price:p?.price||p?.currentPrice||p?.offerPrice||null,benefit:p?.benefitText||p?.discountText||p?.campaignText||"",validity:p?.validityText||p?.validTo||p?.endDate||""})}return{status:r.status,sections:Array.isArray(secs)?secs.length:null,products,rows,errors:d?.errors||[]}}
          let ext=0,ok=0,all=[];for(const name of names){try{const s=await search(name),id=s.best?.externalId;if(id)ext++;const p=await page(id);if(p?.status===200&&p.sections!==null)ok++;all.push({name,id,p});console.log("SLOCAL_V272_RESULT "+JSON.stringify({name,search:s,page:{status:p?.status,sections:p?.sections,products:p?.products,errors:p?.errors}}))}catch(e){console.log("SLOCAL_V272_RESULT "+JSON.stringify({name,error:String(e?.message||e)}))}}
          if(all.length===2&&all[0].p?.rows&&all[1].p?.rows){const key=x=>x.ean||x.name;const ded=x=>{const m=new Map;for(const r of x){const k=key(r);if(k&&!m.has(k))m.set(k,r)}return m};const a=ded(all[0].p.rows),b=ded(all[1].p.rows);const onlyA=[...a.keys()].filter(k=>!b.has(k)),onlyB=[...b.keys()].filter(k=>!a.has(k));const changed=[...a.keys()].filter(k=>b.has(k)&&JSON.stringify(a.get(k))!==JSON.stringify(b.get(k)));const prismaA=[...a.values()].filter(x=>/prisma/i.test(JSON.stringify(x))),prismaB=[...b.values()].filter(x=>/prisma/i.test(JSON.stringify(x)));console.log("SLOCAL_V272_COMPARE "+JSON.stringify({vehkojaUnique:a.size,jokelaUnique:b.size,onlyVehkoja:onlyA.length,onlyJokela:onlyB.length,changed:changed.length,prismaMarkedVehkoja:prismaA.length,prismaMarkedJokela:prismaB.length,onlyVehkojaSample:onlyA.slice(0,20),onlyJokelaSample:onlyB.slice(0,20),changedSample:changed.slice(0,20),prismaVehkojaSample:prismaA.slice(0,10),prismaJokelaSample:prismaB.slice(0,10)},null,2))}
          console.log("SLOCAL_V272_SUMMARY "+JSON.stringify({tested:names.length,externalIds:ext,pageOk:ok}));
          NODE
