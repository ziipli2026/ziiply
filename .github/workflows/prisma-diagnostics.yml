name: Prisma diagnostics
on:
  workflow_dispatch:
jobs:
  kaleva-geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Prisma Kaleva geocode
        run: |
          node <<'NODE'
          (async () => {
            const query = "Prisma Kaleva Tampere";
            const url = "https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=fi&q=" + encodeURIComponent(query);
            const response = await fetch(url, {
              headers: {
                "User-Agent": "Ziiply-Prisma-Diagnostics/1.0",
                "Accept": "application/json"
              }
            });
            const text = await response.text();
            let data = null;
            try { data = JSON.parse(text); } catch {}
            console.log("PRISMA_KALEVA_GEOCODE " + JSON.stringify({
              query,
              status: response.status,
              count: Array.isArray(data) ? data.length : null,
              results: Array.isArray(data) ? data.map(x => ({
                lat: x.lat,
                lon: x.lon,
                display_name: x.display_name,
                type: x.type
              })) : [],
              parseOk: Array.isArray(data)
            }, null, 2));
            if (!response.ok || !Array.isArray(data)) process.exitCode = 1;
          })().catch(err => {
            console.error(err);
            process.exitCode = 1;
          });
          NODE
