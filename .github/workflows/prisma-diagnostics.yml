name: Prisma fallback diagnostics
on: { workflow_dispatch: {} }
jobs:
  prisma-fallback-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: V303 Prisma pickup exact production request diagnostics
        shell: bash
        run: |
          node <<'NODE'
          const T=[
          ["Prisma Hämeenkatu Tampere","726413330",61.4982,23.7608,"Tampere","Hämeenkatu 21"],
          ["Prisma Raksila Oulu","516528759",65.0126,25.4848,"Oulu","Tehtaankatu 3"],
          ["Prisma Myyrmanni Vantaa","726435566",60.2615,24.8536,"Vantaa","Iskoskuja 3"],
          ["Prisma Jumbo Vantaa","613761030",60.2925,24.9635,"Vantaa","Vantaanportinkatu 3"],
          ["Prisma Lohja","603212895",60.2494,24.0658,"Lohja","Laurinkatu 37-41"],
          ["Prisma Tuusula","726753948",60.4037,25.1057,"Tuusula","Autoasemankatu 4"],
          ["Prisma Limingantulli Oulu","627829302",64.9977,25.4650,"Oulu","Nuottasaarentie 1"],
          ["Prisma Lielahti Tampere","697940575",61.5179,23.6665,"Tampere","Turvesuonkatu 2"],
          ["Prisma Kaleva Tampere","517609418",61.4979,23.8282,"Tampere","Sammonkatu 75"]
          ];
          const H="44ca017dddccfe49e787b483f471f26217adca807f8c71101d11e881dab9e480",PH="6da249b0fd87c05275a239ed490976c851d7aff90ead0f3a3978e8283f21252d",C="production-45c31f7a746096c6da12e16aba1887e031fbd9de",PC="production-14a82a5b48cd1dd42c0592db0037514ed3c84de8",date=new Date().toISOString().slice(0,10);
          const n=x=>String(x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();
          async function prod(id){const v={availabilityDate:date,facets:[{key:"brandName",order:"asc"},{key:"category"},{key:"labels"}],filters:[{key:"labels",value:["DISCOUNTED"]}],generatedSessionId:"1d6b5de9-df99-4608-af07-7d754955df82",fetchSponsoredContent:true,limit:48,queryString:"",sortForAvailabilityLabelDate:date,storeId:String(id),useRandomId:false,marketingId:"d0bcc6e5-6130-494e-b6fb-12b5cb9c60cf",from:0,offset:0,skip:0,page:1},u=new URL("https://api.s-kaupat.fi/");u.searchParams.set("operationName","RemoteFilteredProducts");u.searchParams.set("variables",JSON.stringify(v));u.searchParams.set("extensions",JSON.stringify({persistedQuery:{version:1,sha256Hash:H}}));const r=await fetch(u,{headers:{accept:"application/graphql-response+json,application/json;q=0.9","content-type":"application/json","accept-language":"fi",origin:"https://www.s-kaupat.fi",referer:"https://www.s-kaupat.fi/","x-client-name":"skaupat-web","x-client-version":C}}),d=await r.json();return d?.data?.store?.products?.productListItems?.length||0}
          async function slots(lat,lon){const u=new URL("https://api.s-kaupat.fi/");u.searchParams.set("operationName","remotePickupSlots");u.searchParams.set("variables",JSON.stringify({startDate:date,endDate:date,location:{latitude:lat,longitude:lon},limit:20}));u.searchParams.set("extensions",JSON.stringify({persistedQuery:{version:1,sha256Hash:PH}}));const r=await fetch(u,{headers:{accept:"application/json","content-type":"application/json",origin:"https://www.s-kaupat.fi",referer:"https://www.s-kaupat.fi/","x-client-name":"skaupat-web","x-client-version":PC}}),d=await r.json();console.log("\n=== V303 PICKUP RAW "+lat+","+lon+" HTTP "+r.status+" ===");console.log(JSON.stringify({errors:d?.errors||null,dataKeys:Object.keys(d?.data||{}),data:d?.data||null},null,2).slice(0,30000));const candidates=[d?.data?.pickupSlotsForCoordinates?.slotsInPickupPoints,d?.data?.pickupSlots?.slotsInPickupPoints,d?.data?.pickupSlotsForCoordinates,d?.data?.pickupSlots];for(const q of candidates)if(Array.isArray(q))return q;return[]}
          function safe(rows,name,city,street){const tokens=n(name).replace(/^prisma /,"").replace(/ tampere| vantaa| oulu$/g,"").split(" ").filter(x=>x.length>3),ct=n(city),st=n(street).replace(/\s+\d.*$/,""),a=[];for(const x of rows){const S=x.store||{},P=x.pickupPoint||x,pn=n(P.name),pc=n(P.address?.city||P.city),pa=n(P.address?.streetAddress||P.address),brand=n(S.brand||"");if(!brand.includes("prisma")&&!pn.includes("prisma"))continue;const nh=tokens.some(t=>pn.includes(t)),ch=pc===ct,sh=st.length>3&&pa.includes(st);if((nh&&ch)||(sh&&ch))a.push({id:String(S.id||""),name:P.name||"",address:pa,city:pc})}const ids=[...new Set(a.map(x=>x.id).filter(Boolean))];return{id:ids.length===1?ids[0]:null,candidates:a}}
          (async()=>{let summary={tested:0,currentWorking:0,currentZero:0,fallbackActivated:0,unresolved:0,wrongStoreAccepted:0};for(const [name,id,lat,lon,city,street] of T){summary.tested++;const cc=await prod(id),o={name,currentId:id,currentCount:cc,fallbackChecked:false};if(cc>0)summary.currentWorking++;else{summary.currentZero++;o.fallbackChecked=true;const rr=safe(await slots(lat,lon),name,city,street);o.fallbackId=rr.id;o.safeCandidates=rr.candidates.slice(0,8);o.fallbackCount=rr.id&&rr.id!==id?await prod(rr.id):0;o.activated=Boolean(rr.id&&rr.id!==id&&o.fallbackCount>0);if(o.activated)summary.fallbackActivated++;else summary.unresolved++;}console.log("\n=== V303 "+name+" ===\n"+JSON.stringify(o,null,2));await new Promise(r=>setTimeout(r,500))}console.log("\n=== V303 FINAL SUMMARY ===\n"+JSON.stringify(summary,null,2))})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
