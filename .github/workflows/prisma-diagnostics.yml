name: S-local active provider diagnostics
on:
  workflow_dispatch:
jobs:
  s-local:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: S-local campaign structure probe V273
        shell: bash
        run: |
          node <<'NODE'
          const HASH="f6d87786fda8fb5c233c4eaed08f37b0c5b87dc0d8d4c44c33c5529e446369d1";
          const CLIENT="production-14a82a5b48cd1dd42c0592db0037514ed3c84de8";
          const stores=[["Vehkoja","519941769"],["Jokela","685839110"]];
          const date=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Helsinki",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
          const stable=x=>JSON.stringify(x,Object.keys(x||{}).sort());
          async function page(name,id){
            const variables={preview:false,storeId:id,skipProducts:false,availabilityDate:date,where:{storeId:id,path:"tuotteet/kampanjat",platform:"WEB",availabilityDate:date,userConsent:{marketing:false,marketingId:"ziiply-gosta",useCustomerId:false,sessionId:"ziiply-gosta",loop54:true}}};
            const extensions={clientLibrary:{name:"@apollo/client",version:"4.2.12"},persistedQuery:{version:1,sha256Hash:HASH}};
            const u=new URL("https://api.s-kaupat.fi/"); u.searchParams.set("operationName","RemoteGetPageContent");u.searchParams.set("variables",JSON.stringify(variables));u.searchParams.set("extensions",JSON.stringify(extensions));
            const r=await fetch(u,{headers:{accept:"application/graphql-response+json,application/json;q=0.9","accept-language":"fi",origin:"https://www.s-kaupat.fi",referer:"https://www.s-kaupat.fi/","x-client-name":"skaupat-web","x-client-version":CLIENT}});
            const d=await r.json(); const pc=d?.data?.pageContent||{}; const secs=Array.isArray(pc.sections)?pc.sections:[];
            console.log("V273_PAGE "+JSON.stringify({name,id,status:r.status,pageKeys:Object.keys(pc),sectionCount:secs.length,sectionShapes:secs.map((s,i)=>({i,keys:Object.keys(s||{}),title:s?.title||s?.heading||s?.name||"",productCount:Array.isArray(s?.products)?s.products.length:0})).slice(0,60)}));
            const products=[]; for(const [si,s] of secs.entries()) for(const p of (Array.isArray(s?.products)?s.products:[])) products.push({si,p});
            const first=products[0]?.p||{}; console.log("V273_PRODUCT_KEYS "+JSON.stringify({name,keys:Object.keys(first),sample:first}));
            return {name,id,pc,secs,products};
          }
          (async()=>{
            const a=await page(...stores[0]),b=await page(...stores[1]);
            function scan(root,path=[],out=[]){if(!root||typeof root!=="object")return out;if(Array.isArray(root)){for(let i=0;i<root.length;i++)scan(root[i],path.concat(i),out);return out}for(const [k,v] of Object.entries(root)){if(/price|offer|campaign|benefit|valid|avail|store|chain|segment|scope|promotion|discount/i.test(k))out.push({path:path.concat(k).join("."),value:v});if(v&&typeof v==="object")scan(v,path.concat(k),out)}return out}
            const sa=scan(a.pc).slice(0,500),sb=scan(b.pc).slice(0,500);
            console.log("V273_HINTS_VEHKOJA "+JSON.stringify(sa,null,2));
            console.log("V273_HINTS_JOKELA "+JSON.stringify(sb,null,2));
            const amap=new Map(a.products.map(x=>[String(x.p?.ean||x.p?.eanCode||x.p?.gtin||x.p?.name||""),x.p]));
            const bmap=new Map(b.products.map(x=>[String(x.p?.ean||x.p?.eanCode||x.p?.gtin||x.p?.name||""),x.p]));
            let rawChanged=[]; for(const [k,v] of amap)if(bmap.has(k)&&JSON.stringify(v)!==JSON.stringify(bmap.get(k)))rawChanged.push(k);
            console.log("V273_RAW_PRODUCT_COMPARE "+JSON.stringify({vehkoja:amap.size,jokela:bmap.size,rawChanged:rawChanged.length,sample:rawChanged.slice(0,30)}));
            const sampleKeys=[...amap.keys()].filter(k=>bmap.has(k)).slice(0,20);
            const summarize=(p)=>({ean:p?.ean,name:p?.name,price:p?.price,storeId:p?.storeId,availability:p?.availability,pricing:p?.pricing,store:p?.store});
            console.log("V273_SAMPLE20 "+JSON.stringify(sampleKeys.map(k=>({key:k,vehkoja:summarize(amap.get(k)),jokela:summarize(bmap.get(k))})),null,2));
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
