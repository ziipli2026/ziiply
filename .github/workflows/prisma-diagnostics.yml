name: Prisma fallback diagnostics
on: { workflow_dispatch: {} }
jobs:
  prisma-fallback-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: V289 Prisma candidate IDs exact product audit
        shell: bash
        run: |
          node <<'NODE'
          const tests=[
            ["Hämeenkatu old","726413330"],["Hämeenkatu pickup","726491474"],
            ["Raksila old","516528759"],["Raksila nearby Limingantulli","726760153"],
            ["Myyrmanni old","726435566"],["Myyrmanni pickup","726452067"],
            ["Jumbo old","613761030"],["Jumbo pickup","726452067"],
            ["Lohja old","603212895"],["Lohja pickup","613759562"],
            ["Tuusula old","726753948"],["Tuusula pickup","726452067"],
            ["Limingantulli old","627829302"],["Limingantulli pickup","726760153"],
            ["Lielahti old/pickup","697940575"]
          ];
          const HASH="44ca017dddccfe49e787b483f471f26217adca807f8c71101d11e881dab9e480";
          const CLIENT="production-45c31f7a746096c6da12e16aba1887e031fbd9de";
          const today=new Date().toISOString().slice(0,10);
          async function test(label,storeId){
            const variables={availabilityDate:today,facets:[{key:"brandName",order:"asc"},{key:"category"},{key:"labels"}],filters:[{key:"labels",value:["DISCOUNTED"]}],generatedSessionId:"1d6b5de9-df99-4608-af07-7d754955df82",fetchSponsoredContent:true,limit:48,queryString:"",sortForAvailabilityLabelDate:today,storeId,useRandomId:false,marketingId:"d0bcc6e5-6130-494e-b6fb-12b5cb9c60cf",from:0,offset:0,skip:0,page:1};
            const ext={persistedQuery:{version:1,sha256Hash:HASH}};const u=new URL("https://api.s-kaupat.fi/");u.searchParams.set("operationName","RemoteFilteredProducts");u.searchParams.set("variables",JSON.stringify(variables));u.searchParams.set("extensions",JSON.stringify(ext));
            const r=await fetch(u,{headers:{accept:"application/json","content-type":"application/json","accept-language":"fi",origin:"https://www.s-kaupat.fi",referer:"https://www.s-kaupat.fi/","x-client-name":"skaupat-web","x-client-version":CLIENT,"user-agent":"Mozilla/5.0"}});
            let d={};try{d=await r.json()}catch{}
            const store=d?.data?.store||{}; const keys=Object.keys(store);
            const arrays=[]; const walk=(o,p="",depth=0)=>{if(depth>5||!o||typeof o!=="object")return;if(Array.isArray(o)){arrays.push({path:p,length:o.length});return;}for(const [k,v] of Object.entries(o))walk(v,p? p+"."+k:k,depth+1)};walk(store);
            console.log("\n=== V289 "+label+" / "+storeId+" ===");console.log(JSON.stringify({status:r.status,dataKeys:Object.keys(d?.data||{}),storeKeys:keys,arrays:arrays.filter(x=>x.length>0).slice(0,20),errors:d?.errors||[]},null,2));
          }
          (async()=>{for(const x of tests){await test(...x);await new Promise(r=>setTimeout(r,700));}})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
