name: S-local active provider diagnostics
on:
  workflow_dispatch:
jobs:
  s-local:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Store-scoped DISCOUNTED comparison V279
        shell: bash
        run: |
          node <<'NODE'
          const HASH="44ca017dddccfe49e787b483f471f26217adca807f8c71101d11e881dab9e480";
          const CLIENT="production-45c31f7a746096c6da12e16aba1887e031fbd9de";
          const date=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Helsinki",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
          const stores=[["Vehkoja","519941769"],["Jokela","685839110"]];
          function items(d){return d?.data?.store?.products?.productListItems||d?.data?.products?.productListItems||d?.data?.store?.products?.items||[]}
          function meta(d){const p=d?.data?.store?.products||d?.data?.products||{};return {from:p?.from,limit:p?.limit,total:p?.total,keys:Object.keys(p||{})}}
          function slim(x){const p=x?.product||x;return {ean:p?.ean,name:p?.name,price:p?.price,storeId:p?.storeId,availability:p?.availability,pricing:p?.pricing,store:p?.store,labels:x?.labels||p?.labels}}
          async function run(name,storeId){
            const variables={availabilityDate:date,facets:[{key:"brandName",order:"asc"},{key:"category"},{key:"labels"}],filters:[{key:"labels",value:["DISCOUNTED"]}],generatedSessionId:"1d6b5de9-df99-4608-af07-7d754955df82",fetchSponsoredContent:true,limit:48,queryString:"",sortForAvailabilityLabelDate:date,storeId,useRandomId:false,marketingId:"d0bcc6e5-6130-494e-b6fb-12b5cb9c60cf",from:0,offset:0,skip:0,page:1};
            const extensions={persistedQuery:{version:1,sha256Hash:HASH}};
            const u=new URL("https://api.s-kaupat.fi/");u.searchParams.set("operationName","RemoteFilteredProducts");u.searchParams.set("variables",JSON.stringify(variables));u.searchParams.set("extensions",JSON.stringify(extensions));
            const r=await fetch(u,{headers:{accept:"application/json","content-type":"application/json","accept-language":"fi",origin:"https://www.s-kaupat.fi",referer:"https://www.s-kaupat.fi/","x-client-name":"skaupat-web","x-client-version":CLIENT,"user-agent":"Mozilla/5.0"}});
            const d=await r.json(),a=items(d);console.log("V279_RESULT "+JSON.stringify({name,requestedStoreId:storeId,status:r.status,meta:meta(d),count:a.length,errors:d?.errors||[],sample:a.slice(0,20).map(slim)},null,2));return a;
          }
          (async()=>{const a=await run(...stores[0]),b=await run(...stores[1]);const ka=new Set(a.map(x=>(x?.product||x)?.ean).filter(Boolean)),kb=new Set(b.map(x=>(x?.product||x)?.ean).filter(Boolean));console.log("V279_COMPARE "+JSON.stringify({vehkojaCount:a.length,jokelaCount:b.length,shared:[...ka].filter(x=>kb.has(x)).length,onlyVehkoja:[...ka].filter(x=>!kb.has(x)).length,onlyJokela:[...kb].filter(x=>!ka.has(x)).length},null,2))})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
