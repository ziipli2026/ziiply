name: Prisma fallback diagnostics
on:
  workflow_dispatch:
jobs:
  prisma-fallback-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: V287 Prisma official directory storeId audit
        shell: bash
        run: |
          node <<'NODE'
          const stores=["Prisma Hämeenkatu","Prisma Raksila","Prisma Myyrmanni","Prisma Jumbo","Prisma Lohja","Prisma Tuusula","Prisma Limingantulli","Prisma Lielahti"];
          const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9åäö]+/g," ").replace(/\s+/g," ").trim();
          (async()=>{
            for(const name of stores){
              const url="https://www.s-kaupat.fi/myymalat/prisma?query="+encodeURIComponent(name);
              const r=await fetch(url,{headers:{accept:"text/html,application/xhtml+xml","accept-language":"fi","user-agent":"Mozilla/5.0 (compatible; ZiiplyDiagnostics/1.0)"}});
              const html=await r.text();
              const re=/\\?\/myymala\\?\/([a-z0-9%._~-]+)\\?\/(\d{5,})/gi;
              const wanted=norm(name); const out=[]; let m;
              while((m=re.exec(html))!==null){
                let slug="";try{slug=decodeURIComponent(m[1])}catch{slug=m[1]}
                const n=norm(slug.replace(/-/g," "));
                if(n.includes(wanted)||wanted.includes(n)||n.includes(wanted.replace(/^prisma /,""))){
                  out.push({slug,id:m[2],normalized:n});
                }
              }
              const uniq=[...new Map(out.map(x=>[x.id,x])).values()];
              console.log("\n=== V287 "+name+" ===");
              console.log(JSON.stringify({status:r.status,finalUrl:r.url,htmlLength:html.length,matches:uniq.slice(0,20),idCount:uniq.length},null,2));
              await new Promise(r=>setTimeout(r,1000));
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
