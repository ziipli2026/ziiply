name: S-local active provider diagnostics
on:
  workflow_dispatch:
jobs:
  s-local:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cross-chain campaign scope validation V281
        shell: bash
        run: |
          node <<'NODE'
          const HASH="f6d87786fda8fb5c233c4eaed08f37b0c5b87dc0d8d4c44c33c5529e446369d1",CLIENT="production-14a82a5b48cd1dd42c0592db0037514ed3c84de8";
          const date=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Helsinki",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
          const stores=[["S-market Vehkoja","519941769","s-market"],["S-market Tanelinranta","660828401","s-market"],["Alepa Pukinmäki","726261341","alepa"],["Sale Kommila","708276035","sale"]];
          const ev=s=>[s?.title,s?.description,s?.text,s?.tagTitle,s?.metadata?.entryName].filter(Boolean).join(" | ");
          const chains=t=>["prisma","s-market","alepa","sale"].filter(c=>new RegExp(c==="s-market"?"\\bs[ -]?market\\b":"\\b"+c+"\\b","i").test(t));
          async function get(name,id,expected){
            const variables={preview:false,storeId:id,skipProducts:false,availabilityDate:date,where:{storeId:id,path:"tuotteet/kampanjat",platform:"WEB",availabilityDate:date,userConsent:{marketing:false,marketingId:"ziiply-gosta",useCustomerId:false,sessionId:"ziiply-gosta",loop54:true}}};
            const extensions={clientLibrary:{name:"@apollo/client",version:"4.2.12"},persistedQuery:{version:1,sha256Hash:HASH}};
            const u=new URL("https://api.s-kaupat.fi/");u.searchParams.set("operationName","RemoteGetPageContent");u.searchParams.set("variables",JSON.stringify(variables));u.searchParams.set("extensions",JSON.stringify(extensions));
            const r=await fetch(u,{headers:{accept:"application/graphql-response+json,application/json;q=0.9","accept-language":"fi",origin:"https://www.s-kaupat.fi",referer:"https://www.s-kaupat.fi/","x-client-name":"skaupat-web","x-client-version":CLIENT}});
            const d=await r.json(),secs=d?.data?.pageContent?.sections||[];let wrong=0,explicit=0,generic=0,wrongProducts=0;
            const rows=secs.map((s,i)=>{const evidence=ev(s),cs=chains(evidence),count=(s?.products||[]).length,isWrong=cs.length>0&&!cs.includes(expected),isExplicit=cs.includes(expected);if(isWrong){wrong++;wrongProducts+=count}else if(isExplicit)explicit++;else generic++;return {i,title:s?.title||"",entry:s?.metadata?.entryName||"",count,chains:cs,class:isWrong?"WRONG_CHAIN":isExplicit?"EXPECTED_CHAIN":"GENERIC"}});
            console.log("V281_STORE "+JSON.stringify({name,id,expected,status:r.status,sections:secs.length,wrongSections:wrong,wrongProducts,expectedSections:explicit,genericSections:generic,rows:rows.filter(x=>x.count||x.class!=="GENERIC")},null,2));
          }
          (async()=>{for(const s of stores)await get(...s)})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
