name: Prisma fallback diagnostics
on: { workflow_dispatch: {} }
jobs:
  prisma-fallback-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: V297 Prisma raw-to-mapped input audit
        shell: bash
        run: |
          node <<'NODE'
          const stores=[["Limingantulli","627829302"],["Lielahti","697940575"],["Kaleva control","517609418"]];
          const H="44ca017dddccfe49e787b483f471f26217adca807f8c71101d11e881dab9e480",C="production-45c31f7a746096c6da12e16aba1887e031fbd9de",date=new Date().toISOString().slice(0,10);
          const rec=x=>x&&typeof x==="object"&&!Array.isArray(x)?x:{}, num=x=>{const n=Number(x);return Number.isFinite(n)?n:null}, str=(...xs)=>{for(const x of xs){if(typeof x==="string"&&x.trim())return x.trim();if(typeof x==="number")return String(x)}return""};
          async function get(id){const v={availabilityDate:date,facets:[{key:"brandName",order:"asc"},{key:"category"},{key:"labels"}],filters:[{key:"labels",value:["DISCOUNTED"]}],generatedSessionId:"1d6b5de9-df99-4608-af07-7d754955df82",fetchSponsoredContent:true,limit:48,queryString:"",sortForAvailabilityLabelDate:date,storeId:id,useRandomId:false,marketingId:"d0bcc6e5-6130-494e-b6fb-12b5cb9c60cf",from:0,offset:0,skip:0,page:1},u=new URL("https://api.s-kaupat.fi/");u.searchParams.set("operationName","RemoteFilteredProducts");u.searchParams.set("variables",JSON.stringify(v));u.searchParams.set("extensions",JSON.stringify({persistedQuery:{version:1,sha256Hash:H}}));const r=await fetch(u,{headers:{accept:"application/json","content-type":"application/json","accept-language":"fi",origin:"https://www.s-kaupat.fi",referer:"https://www.s-kaupat.fi/","x-client-name":"skaupat-web","x-client-version":C}});return[r.status,await r.json()]}
          (async()=>{for(const [name,id] of stores){const[status,d]=await get(id),root=rec(d?.data?.store?.products),items=Array.isArray(root.productListItems)?root.productListItems:[];let wp=0,wn=0,we=0,wc=0,wr=0,ws=0;const samples=[];for(const x of items){const li=rec(x),p=rec(li.product);if(Object.keys(p).length)wp++;const title=str(p.name,p.title,li.name,li.title),ean=str(p.ean,p.eanCode,p.gtin,li.ean),price=rec(p.price),cp=num(price.currentPrice??p.currentPrice??li.currentPrice),rp=num(price.regularPrice??p.regularPrice??li.regularPrice),blob=JSON.stringify(li).toLowerCase(),sig=blob.includes("discounted")||blob.includes("campaign")||blob.includes("lowest30day")||(cp!=null&&rp!=null&&cp<rp);if(title)wn++;if(ean)we++;if(cp!=null)wc++;if(rp!=null)wr++;if(sig)ws++;if(samples.length<4)samples.push({title,ean,currentPrice:cp,regularPrice:rp,signal:sig,topKeys:Object.keys(li),productKeys:Object.keys(p).slice(0,16)})}console.log("\n=== V297 "+name+" ===");console.log(JSON.stringify({id,status,raw:items.length,total:root.total??null,withProduct:wp,withName:wn,withEan:we,withCurrent:wc,withRegular:wr,withCampaignSignal:ws,samples},null,2));await new Promise(r=>setTimeout(r,700))}})().catch(e=>{console.error(e);process.exitCode=1});
