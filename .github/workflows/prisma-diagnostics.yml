name: Prisma fallback diagnostics
on: { workflow_dispatch: {} }
jobs:
  prisma-fallback-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: V299 Prisma store-search to offer-ID simulation
        shell: bash
        run: |
          node <<'NODE'
          const targets=["Prisma Hämeenkatu Tampere","Prisma Raksila Oulu","Prisma Myyrmanni Vantaa","Prisma Jumbo Vantaa","Prisma Lohja","Prisma Tuusula","Prisma Limingantulli Oulu","Prisma Lielahti Tampere","Prisma Kaleva Tampere"];
          const H="44ca017dddccfe49e787b483f471f26217adca807f8c71101d11e881dab9e480",C="production-45c31f7a746096c6da12e16aba1887e031fbd9de",date=new Date().toISOString().slice(0,10);
          const norm=x=>String(x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();
          async function stores(q){const r=await fetch("https://api.ruoanhinta.fi/api/stores?search="+encodeURIComponent(q),{headers:{accept:"application/json"}});const d=await r.json();return[r.status,Array.isArray(d)?d:(d.items||[])]}
          async function products(id){if(!id)return{status:null,count:null,total:null};const v={availabilityDate:date,facets:[{key:"brandName",order:"asc"},{key:"category"},{key:"labels"}],filters:[{key:"labels",value:["DISCOUNTED"]}],generatedSessionId:"1d6b5de9-df99-4608-af07-7d754955df82",fetchSponsoredContent:true,limit:48,queryString:"",sortForAvailabilityLabelDate:date,storeId:String(id),useRandomId:false,marketingId:"d0bcc6e5-6130-494e-b6fb-12b5cb9c60cf",from:0,offset:0,skip:0,page:1},u=new URL("https://api.s-kaupat.fi/");u.searchParams.set("operationName","RemoteFilteredProducts");u.searchParams.set("variables",JSON.stringify(v));u.searchParams.set("extensions",JSON.stringify({persistedQuery:{version:1,sha256Hash:H}}));const r=await fetch(u,{headers:{accept:"application/json","content-type":"application/json","accept-language":"fi",origin:"https://www.s-kaupat.fi",referer:"https://www.s-kaupat.fi/","x-client-name":"skaupat-web","x-client-version":C}});const d=await r.json(),root=d?.data?.store?.products||{},a=Array.isArray(root.productListItems)?root.productListItems:[];return{status:r.status,count:a.length,total:root.total??null}}
          (async()=>{for(const q of targets){const[status,rows]=await stores(q),qt=norm(q).split(" ").filter(x=>x!=="prisma"),prisma=rows.filter(x=>norm(x.name).includes("prisma"));let matched=prisma.find(x=>qt.every(t=>norm([x.name,x.city,x.postalCode].join(" ")).includes(t)));if(!matched)matched=prisma[0]||null;const offerId=matched&&/^\d{5,}$/.test(String(matched.externalId||""))?String(matched.externalId):matched?String(matched.id):null,p=await products(offerId);console.log("\n=== V299 "+q+" ===");console.log(JSON.stringify({searchStatus:status,candidateCount:rows.length,prismaCount:prisma.length,matched:matched?{id:matched.id,externalId:matched.externalId,name:matched.name,city:matched.city,postalCode:matched.postalCode,type:matched.type,chain:matched.chain}:null,pageTsxOfferId:offerId,products:p},null,2));await new Promise(r=>setTimeout(r,600))}})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
