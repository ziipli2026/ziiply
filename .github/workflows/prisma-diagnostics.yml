name: Prisma fallback diagnostics
on: { workflow_dispatch: {} }
jobs:
  prisma-fallback-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: V298 Prisma provider mapping end-to-end audit
        shell: bash
        run: |
          node <<'NODE'
          const stores=[["Limingantulli","627829302"],["Lielahti","697940575"],["Kaleva control","517609418"]];
          const H="44ca017dddccfe49e787b483f471f26217adca807f8c71101d11e881dab9e480",C="production-45c31f7a746096c6da12e16aba1887e031fbd9de",date=new Date().toISOString().slice(0,10);
          const rec=x=>x&&typeof x==="object"&&!Array.isArray(x)?x:{};
          const first=(...xs)=>{for(const x of xs){if(typeof x==="string"&&x.trim())return x.trim();if(typeof x==="number")return String(x)}return""};
          async function page(id,offset=0){const v={availabilityDate:date,facets:[{key:"brandName",order:"asc"},{key:"category"},{key:"labels"}],filters:[{key:"labels",value:["DISCOUNTED"]}],generatedSessionId:"1d6b5de9-df99-4608-af07-7d754955df82",fetchSponsoredContent:true,limit:48,queryString:"",sortForAvailabilityLabelDate:date,storeId:id,useRandomId:false,marketingId:"d0bcc6e5-6130-494e-b6fb-12b5cb9c60cf",from:offset,offset,skip:offset,page:Math.floor(offset/48)+1},u=new URL("https://api.s-kaupat.fi/");u.searchParams.set("operationName","RemoteFilteredProducts");u.searchParams.set("variables",JSON.stringify(v));u.searchParams.set("extensions",JSON.stringify({persistedQuery:{version:1,sha256Hash:H}}));const r=await fetch(u,{headers:{accept:"application/json","content-type":"application/json","accept-language":"fi",origin:"https://www.s-kaupat.fi",referer:"https://www.s-kaupat.fi/","x-client-name":"skaupat-web","x-client-version":C}});return[r.status,await r.json()]}
          function product(li){const r=rec(li);return Object.keys(rec(r.product)).length?rec(r.product):Object.keys(rec(r.item)).length?rec(r.item):Object.keys(rec(r.node)).length?rec(r.node):null}
          function sponsored(li,p){const blob=JSON.stringify({li,p}).toLowerCase();return blob.includes('"sponsored":true')||blob.includes('"issponsored":true')}
          function ean(p){return first(p?.ean,p?.gtin,p?.barcode,p?.id)}
          (async()=>{for(const [name,id] of stores){let offset=0,total=null,raw=0,hasProduct=0,hasTitle=0,rejectedNoProduct=0,rejectedNoTitle=0,rejectedSponsored=0,mapped=0;const keys=new Set(),samples=[];for(let guard=0;guard<12;guard++){const[status,d]=await page(id,offset),root=rec(d?.data?.store?.products),items=Array.isArray(root.productListItems)?root.productListItems:[];if(total==null)total=Number(root.total||0);for(const li of items){raw++;const p=product(li);if(!p){rejectedNoProduct++;continue}hasProduct++;const title=first(p.name);if(!title){rejectedNoTitle++;continue}hasTitle++;if(sponsored(li,p)){rejectedSponsored++;continue}mapped++;const k=ean(p)||title.toLowerCase();keys.add(k);if(samples.length<5)samples.push({title,ean:ean(p),keys:Object.keys(p).slice(0,18)})}console.log("PAGE",JSON.stringify({name,id,offset,status,count:items.length,total:root.total??null}));if(!items.length||offset+items.length>=Number(root.total||0))break;offset+=48;await new Promise(r=>setTimeout(r,350))}console.log("=== V298 "+name+" ===");console.log(JSON.stringify({id,total,raw,hasProduct,hasTitle,rejectedNoProduct,rejectedNoTitle,rejectedSponsored,mapped,deduped:keys.size,samples},null,2));await new Promise(r=>setTimeout(r,700))}})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
