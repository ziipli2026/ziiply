name: Prisma fallback diagnostics
on: { workflow_dispatch: {} }
jobs:
  prisma-fallback-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: V293 Prisma automatic fallback resolver audit
        shell: bash
        run: |
          node <<'NODE'
          const tests=[
            {name:"Hämeenkatu",city:"Tampere",lat:61.4978,lon:23.7610,expect:"726491474"},
            {name:"Myyrmanni",city:"Vantaa",lat:60.2617,lon:24.8534,expect:"726452067"},
            {name:"Jumbo",city:"Vantaa",lat:60.2925,lon:24.9628,expect:"726452067"},
            {name:"Lohja",city:"Lohja",lat:60.2486,lon:24.0653,expect:"613759562"},
            {name:"Tuusula",city:"Tuusula",lat:60.4030,lon:25.0260,expect:"726452067"},
            {name:"Limingantulli",city:"Oulu",lat:64.9990,lon:25.4650,expect:"726760153"},
            {name:"Lielahti",city:"Tampere",lat:61.5165,lon:23.6680,expect:"697940575"},
            {name:"Raksila",city:"Oulu",lat:65.0100,lon:25.4900,expect:null}
          ];
          const H="6da249b0fd87c05275a239ed490976c851d7aff90ead0f3a3978e8283f21252d",C="production-14a82a5b48cd1dd42c0592db0037514ed3c84de8",date=new Date().toISOString().slice(0,10);
          const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();
          const tokens=s=>norm(s).split(/\s+/).filter(x=>x.length>2&&!["prisma","ruoan","verkkokauppa","noutopiste","noutolokero","noutotilaus","drive","sokos"].includes(x));
          async function rows(t){const v={startDate:date,endDate:date,location:{latitude:t.lat,longitude:t.lon},limit:100},u=new URL("https://api.s-kaupat.fi/");u.searchParams.set("operationName","remotePickupSlots");u.searchParams.set("variables",JSON.stringify(v));u.searchParams.set("extensions",JSON.stringify({persistedQuery:{version:1,sha256Hash:H}}));const r=await fetch(u,{headers:{accept:"application/json","accept-language":"fi",origin:"https://www.s-kaupat.fi",referer:"https://www.s-kaupat.fi/","x-client-name":"skaupat-web","x-client-version":C}}),d=await r.json();return [r.status,d?.data?.pickupSlotsForCoordinates?.slotsInPickupPoints||[]]}
          (async()=>{for(const t of tests){const [status,all]=await rows(t),want=tokens(t.name),cand=all.filter(x=>norm(x?.store?.brand)==="prisma").map(x=>{const n=x?.pickupPoint?.name||"",a=x?.pickupPoint?.address||{},nt=norm(n),score=want.reduce((s,z)=>s+(nt.includes(z)?100:0),0)+(norm(a.city)===norm(t.city)?20:0)+(Number(x?.distance||1e9)<=1000?10:0);return{id:String(x?.store?.id||""),name:n,city:a.city,distance:Math.round(x?.distance||0),score}}).sort((a,b)=>b.score-a.score||a.distance-b.distance);const best=cand[0];const safe=best&&best.score>=110?best:null;console.log("\n=== V293 "+t.name+" ===");console.log(JSON.stringify({status,tokens:want,best,safeId:safe?.id||null,expected:t.expect,pass:(safe?.id||null)===t.expect,top:cand.slice(0,5)},null,2));await new Promise(r=>setTimeout(r,700))}})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
