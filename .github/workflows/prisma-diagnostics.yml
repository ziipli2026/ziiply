name: Prisma fallback diagnostics
on: { workflow_dispatch: {} }
jobs:
  prisma-fallback-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: V300 Prisma current-first fallback stress audit
        shell: bash
        run: |
          node <<'NODE'
          const queries=["Prisma Kaleva Tampere","Prisma Koivistonkylä Tampere","Prisma Lielahti Tampere","Prisma Linnainmaa Tampere","Prisma Pirkkala","Prisma Ylöjärvi","Prisma Limingantulli Oulu","Prisma Linnanmaa Oulu","Prisma Zeppelin Kempele","Prisma Jumbo Vantaa","Prisma Myyrmanni Vantaa","Prisma Tuusula","Prisma Lohja","Prisma Hämeenkatu Tampere","Prisma Raksila Oulu","Prisma Hyvinkää","Prisma Järvenpää","Prisma Lahti","Prisma Kuopio","Prisma Jyväskylä","Prisma Seinäjoki","Prisma Vaasa","Prisma Joensuu","Prisma Mikkeli"];
          const H="44ca017dddccfe49e787b483f471f26217adca807f8c71101d11e881dab9e480",PH="6da249b0fd87c05275a239ed490976c851d7aff90ead0f3a3978e8283f21252d",C="production-45c31f7a746096c6da12e16aba1887e031fbd9de",PC="production-14a82a5b48cd1dd42c0592db0037514ed3c84de8",date=new Date().toISOString().slice(0,10);
          const norm=x=>String(x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();
          async function stores(q){const r=await fetch("https://api.ruoanhinta.fi/api/stores?search="+encodeURIComponent(q),{headers:{accept:"application/json"}});const d=await r.json();return Array.isArray(d)?d:(d.items||[])}
          async function products(id){if(!id)return 0;const v={availabilityDate:date,facets:[{key:"brandName",order:"asc"},{key:"category"},{key:"labels"}],filters:[{key:"labels",value:["DISCOUNTED"]}],generatedSessionId:"1d6b5de9-df99-4608-af07-7d754955df82",fetchSponsoredContent:true,limit:48,queryString:"",sortForAvailabilityLabelDate:date,storeId:String(id),useRandomId:false,marketingId:"d0bcc6e5-6130-494e-b6fb-12b5cb9c60cf",from:0,offset:0,skip:0,page:1},u=new URL("https://api.s-kaupat.fi/");u.searchParams.set("operationName","RemoteFilteredProducts");u.searchParams.set("variables",JSON.stringify(v));u.searchParams.set("extensions",JSON.stringify({persistedQuery:{version:1,sha256Hash:H}}));const r=await fetch(u,{headers:{accept:"application/json","content-type":"application/json",origin:"https://www.s-kaupat.fi",referer:"https://www.s-kaupat.fi/","x-client-name":"skaupat-web","x-client-version":C}}),d=await r.json();return d?.data?.store?.products?.productListItems?.length||0}
          async function pickup(lat,lon){const v={latitude:lat,longitude:lon};const u=new URL("https://api.s-kaupat.fi/");u.searchParams.set("operationName","RemotePickupSlots");u.searchParams.set("variables",JSON.stringify(v));u.searchParams.set("extensions",JSON.stringify({persistedQuery:{version:1,sha256Hash:PH}}));const r=await fetch(u,{headers:{accept:"application/json","content-type":"application/json",origin:"https://www.s-kaupat.fi",referer:"https://www.s-kaupat.fi/","x-client-name":"skaupat-web","x-client-version":PC}}),d=await r.json();return d?.data?.pickupSlotsForCoordinates?.slotsInPickupPoints||[]}
          function coords(x){const lat=Number(x.latitude??x.lat),lon=Number(x.longitude??x.lon??x.lng);return Number.isFinite(lat)&&Number.isFinite(lon)?[lat,lon]:null}
          function resolve(rows,target){const tn=norm(target.name).replace(/^prisma /,"").split(" ").filter(Boolean),city=norm(target.city),street=norm(target.address).split(/\s+/).slice(0,-1).join(" ");const safe=[];for(const x of rows){const st=x.store||{},pp=x.pickupPoint||x,brand=norm(st.brand||st.name),name=norm(pp.name||""),addr=norm(pp.address?.streetAddress||pp.address||""),pcity=norm(pp.address?.city||pp.city||"");if(!brand.includes("prisma")&&!name.includes("prisma"))continue;const nameHit=tn.some(t=>t.length>3&&name.includes(t)),cityHit=!city||pcity===city,streetHit=street.length>3&&addr.includes(street);if((nameHit&&cityHit)||(streetHit&&cityHit))safe.push({id:String(st.id||""),name:pp.name||"",addr,city:pcity})}const ids=[...new Set(safe.map(x=>x.id).filter(Boolean))];return{safe, id:ids.length===1?ids[0]:null}}
          (async()=>{let stats={tested:0,currentWorking:0,currentZero:0,fallbackActivated:0,unresolved:0};for(const q of queries){const rs=await stores(q),pr=rs.filter(x=>norm(x.name).includes("prisma"));let m=pr.find(x=>norm(x.name)===norm(q))||pr[0];if(!m){console.log("\n=== V300 "+q+" ===\n"+JSON.stringify({storeSearch:"NOT_FOUND"}));continue}stats.tested++;const currentId=/^\d{5,}$/.test(String(m.externalId||""))?String(m.externalId):String(m.id),cc=await products(currentId);let out={name:m.name,city:m.city,id:m.id,externalId:m.externalId,currentId,currentCount:cc,fallbackChecked:false};if(cc>0){stats.currentWorking++;}else{stats.currentZero++;const co=coords(m);if(co){out.fallbackChecked=true;const rr=resolve(await pickup(...co),m),fc=rr.id&&rr.id!==currentId?await products(rr.id):0;Object.assign(out,{fallbackId:rr.id,fallbackCount:fc,safeCandidates:rr.safe.slice(0,5),activated:Boolean(rr.id&&rr.id!==currentId&&fc>0)});if(out.activated)stats.fallbackActivated++;else stats.unresolved++;}else{out.noCoordinates=true;stats.unresolved++;}}console.log("\n=== V300 "+q+" ===\n"+JSON.stringify(out,null,2));await new Promise(r=>setTimeout(r,450))}console.log("\n=== V300 SUMMARY ===\n"+JSON.stringify(stats,null,2))})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
