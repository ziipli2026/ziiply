name: S-local active provider diagnostics
on:
  workflow_dispatch:
jobs:
  s-local:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: S-local known official IDs page test V268
        shell: bash
        run: |
          node <<'NODE'
          const HASH="f6d87786fda8fb5c233c4eaed08f37b0c5b87dc0d8d4c44c33c5529e446369d1",CLIENT="production-14a82a5b48cd1dd42c0592db0037514ed3c84de8";
          const stores=[["S-market Vehkoja","519941769"],["S-market Suutarila","726666563"],["S-market Kontula","513931329"]];
          const date=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Helsinki",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
          async function page(name,id){const variables={preview:false,storeId:id,skipProducts:false,availabilityDate:date,where:{storeId:id,path:"tuotteet/kampanjat",platform:"WEB",availabilityDate:date,userConsent:{marketing:false,marketingId:"ziiply-gosta",useCustomerId:false,sessionId:"ziiply-gosta",loop54:true}}},extensions={clientLibrary:{name:"@apollo/client",version:"4.2.12"},persistedQuery:{version:1,sha256Hash:HASH}};const u=new URL("https://api.s-kaupat.fi/");u.searchParams.set("operationName","RemoteGetPageContent");u.searchParams.set("variables",JSON.stringify(variables));u.searchParams.set("extensions",JSON.stringify(extensions));const r=await fetch(u,{headers:{accept:"application/graphql-response+json,application/json;q=0.9","accept-language":"fi",origin:"https://www.s-kaupat.fi",referer:"https://www.s-kaupat.fi/","x-client-name":"skaupat-web","x-client-version":CLIENT}});const d=await r.json(),secs=d?.data?.pageContent?.sections;let products=0;if(Array.isArray(secs))for(const s of secs)products+=Array.isArray(s?.products)?s.products.length:0;return{name,id,status:r.status,sections:Array.isArray(secs)?secs.length:null,products,errors:d?.errors||[]}}
          let ok=0;for(const [n,id] of stores){const x=await page(n,id);if(x.status===200&&x.sections!==null)ok++;console.log("SLOCAL_V268_RESULT "+JSON.stringify(x))}
          console.log("SLOCAL_V268_SUMMARY "+JSON.stringify({tested:stores.length,ok}));
          NODE
