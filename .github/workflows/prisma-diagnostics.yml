name: S-local active provider diagnostics
on:
  workflow_dispatch:
jobs:
  s-local:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Exact product store comparison V275
        shell: bash
        run: |
          node <<'NODE'
          const HASH="44ca017dddccfe49e787b483f471f26217adca807f8c71101d11e881dab9e480";
          const CLIENT="production-14a82a5b48cd1dd42c0592db0037514ed3c84de8";
          const EAN="6416453034112", QUERY="Fazer Remix", SLUG="karkit-suklaat-ja-keksit";
          const stores=[["Vehkoja","519941769"],["Jokela","685839110"]];
          async function run(name,storeId){
            const variables={generatedSessionId:crypto.randomUUID(),limit:96,order:"desc",orderBy:"score",queryString:QUERY,slug:SLUG,storeId,useRandomId:false,marketingId:crypto.randomUUID()};
            const extensions={clientLibrary:{name:"@apollo/client",version:"4.2.12"},persistedQuery:{version:1,sha256Hash:HASH}};
            const u=new URL("https://api.s-kaupat.fi/");u.searchParams.set("operationName","RemoteFilteredProducts");u.searchParams.set("variables",JSON.stringify(variables));u.searchParams.set("extensions",JSON.stringify(extensions));
            const r=await fetch(u,{headers:{accept:"application/graphql-response+json,application/json;q=0.9","accept-language":"fi",origin:"https://www.s-kaupat.fi",referer:"https://www.s-kaupat.fi/","x-client-name":"skaupat-web","x-client-version":CLIENT}});
            const d=await r.json(); const items=d?.data?.store?.products?.productListItems||d?.data?.store?.products?.items||d?.data?.products?.productListItems||d?.data?.products?.items||[];
            const products=items.map(x=>x?.product||x).filter(Boolean); const p=products.find(x=>String(x?.ean||x?.id||"").replace(/\D/g,"")===EAN)||null;
            const summary=p&&{ean:p.ean,name:p.name,price:p.price,comparisonPrice:p.comparisonPrice,storeId:p.storeId,availability:p.availability,pricing:p.pricing,store:p.store};
            console.log("V275_STORE "+JSON.stringify({name,requestedStoreId:storeId,status:r.status,count:products.length,found:!!p,product:summary,errors:d?.errors||[]},null,2));
            return summary;
          }
          (async()=>{const a=await run(...stores[0]);const b=await run(...stores[1]);console.log("V275_COMPARE "+JSON.stringify({same:JSON.stringify(a)===JSON.stringify(b),vehkoja:a,jokela:b},null,2));})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
