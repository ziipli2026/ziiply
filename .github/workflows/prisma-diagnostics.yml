      - name: Prisma zero-store resolver comparison V238
        if: ${{ false }}
        shell: bash
        run: |
          node <<'NODE'
          const targets=[
            ["Prisma Hämeenkatu Tampere","726413330"],
            ["Prisma Raksila Oulu","516528759"],
            ["Prisma Myyrmanni","726435566"],
            ["Prisma Jumbo","613761030"],
            ["Prisma Lohja","603212895"],
            ["Prisma Tuusula","726753948"],
          ];
          async function storeSearch(q){
            try{const r=await fetch("https://api.ruoanhinta.fi/api/stores?search="+encodeURIComponent(q));const j=await r.json();const a=Array.isArray(j)?j:(j?.stores||j?.data||[]);return a.filter(x=>/prisma/i.test(String(x.name||""))).map(x=>({name:x.name,city:x.city,id:String(x.id||""),externalId:String(x.externalId||"")}));}catch(e){return [{error:String(e)}]}
          }
          async function official(name){
            const urls=["https://www.s-kaupat.fi/myymalat/prisma?query="+encodeURIComponent(name),"https://www.s-kaupat.fi/myymalat?query="+encodeURIComponent(name)];
            const out=[];
            for(const u of urls){try{const r=await fetch(u,{headers:{"user-agent":"Mozilla/5.0"}});const t=await r.text();out.push({url:u,http:r.status,ids:[...new Set([...t.matchAll(/\/myymala\/[^"'<>?]+\/(\d{5,})/g)].map(m=>m[1]))].slice(0,20),len:t.length})}catch(e){out.push({url:u,error:String(e)})}}
            return out;
          }
          async function pickup(name){
            // Probe Nominatim coordinates then the same public pickup resolver family used by V215/V216.
            try{
              const q=name.replace(/^Prisma\s+/i,"")+", Finland";
              const gr=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(q),{headers:{"user-agent":"ZiiplyDiagnostics/1.0"}});
              const gj=await gr.json(); if(!gj?.[0]) return {geoQuery:q,geo:null};
              return {geoQuery:q,geo:{lat:Number(gj[0].lat),lon:Number(gj[0].lon),display:gj[0].display_name}};
            }catch(e){return {error:String(e)}}
          }
          (async()=>{
            for(const [name,currentId] of targets){
              const q=name.replace(/^Prisma\s+/i,"");
              console.log("PRISMA_V238 "+JSON.stringify({name,currentId,ruoanhinta:await storeSearch(q),official:await official(name),pickupGeo:await pickup(name)}));
              await new Promise(r=>setTimeout(r,1000));
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
