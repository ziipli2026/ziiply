name: Arvo nutrition statistics tests
on:
  push:
    branches: [main]
    paths:
      - 'src/app/components/ziiply/arvo/**'
      - 'src/app/arvo-tilastot/**'
      - 'tests/arvo-statistics.test.mjs'
      - '.github/workflows/arvo-statistics-tests.yml'
  pull_request:
    paths:
      - 'src/app/components/ziiply/arvo/**'
      - 'src/app/arvo-tilastot/**'
      - 'tests/arvo-statistics.test.mjs'
      - '.github/workflows/arvo-statistics-tests.yml'
  workflow_dispatch:
jobs:
  arvo-statistics:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Arvo nutrition statistics tests
        run: node --experimental-strip-types --test tests/arvo-statistics.test.mjs
