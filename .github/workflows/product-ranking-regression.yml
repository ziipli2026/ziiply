name: Desktop preview product ranking regression

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to test"
        required: true
        default: "preview/legacy-desktop-ui"
        type: string

permissions:
  contents: read

jobs:
  product-ranking:
    name: Shared product and recipe ranking tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout selected desktop preview ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test normal product search ranking
        run: node scripts/test-normal-product-ranking.cjs

      - name: Test recipe ingredient search and ranking
        run: node scripts/test-recipe-search.cjs

      - name: TypeScript validation
        run: npx tsc --noEmit
