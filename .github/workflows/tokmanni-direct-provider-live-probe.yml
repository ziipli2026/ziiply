name: Tokmanni direct provider live probe
on:
  push:
    paths:
      - 'scripts/probe-tokmanni-provider-live-20261006.ts'
      - '.github/workflows/tokmanni-direct-provider-live-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --legacy-peer-deps --no-package-lock
      - run: npx --yes tsx scripts/probe-tokmanni-provider-live-20261006.ts

# trigger
