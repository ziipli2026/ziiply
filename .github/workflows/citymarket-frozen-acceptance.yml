name: Citymarket frozen leaflet acceptance
on:
  push:
    branches: [main]
    paths:
      - 'tests/citymarket-archive-acceptance.test.mjs'
      - 'tests/citymarket-frozen-parser-rerun.test.mjs'
      - 'tests/fixtures/citymarket/44LV.pdf-reviewed.json'
      - 'src/app/components/ziiply/offerSearch/providers/**'
      - '.github/workflows/citymarket-frozen-acceptance.yml'
      - 'src/app/components/ziiply/offerSearch/kCitymarketSpatialParserCurrent.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout immutable leaflet archive
        uses: actions/checkout@v4
        with:
          ref: archive/citymarket-publications
          path: archived-publications
      - name: Re-run current parser against frozen publisher and PDF-reviewed prices
        run: node --test tests/citymarket-frozen-parser-rerun.test.mjs
      - name: Verify historical fixture and strict 44LV acceptance
        if: always()
        run: node --test tests/citymarket-archive-acceptance.test.mjs
