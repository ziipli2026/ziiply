name: Coop EAN mass import
on:
  workflow_dispatch:
    inputs:
      store_ids:
        description: 'S-kaupat store IDs, comma separated'
        required: false
        default: '603217266,634976534,685839110'
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install standalone Neon dependency
        run: npm install --no-save --package-lock=false --ignore-scripts --prefix scripts @neondatabase/serverless@1.2.0
      - name: Import missing Coop EANs
        run: node scripts/import-coop-eans.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COOP_STORE_IDS: ${{ inputs.store_ids }}
