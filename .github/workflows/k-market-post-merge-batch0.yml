name: K-market post-merge live mass audit batches 17-20
on:
  push:
    branches: [audit/k-market-batch0-after-merge]
permissions:
  contents: read
jobs:
  live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        batch: [17, 18, 19, 20]
    steps:
      - uses: actions/checkout@v4
      - name: Extract and syntax-check production audit script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/k-market-supermarket-mass-audit.yml').read_text()
          a=s.index("          node --input-type=module <<'NODE'")+len("          node --input-type=module <<'NODE'")
          b=s.index("\n          NODE",a)
          Path('/tmp/k-market-audit.mjs').write_text("\n".join(x[10:] for x in s[a:b].splitlines())+"\n")
          PY
          node --check /tmp/k-market-audit.mjs
      - name: Run real production audit code against first 30 stores per chain
        env:
          AUDIT_BATCH: ${{ matrix.batch }}
        run: node /tmp/k-market-audit.mjs
      - name: Summarize report and assert live data integrity
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const d=JSON.parse(readFileSync('k-market-supermarket-audit.json'));
          for(const chain of ['K-Market','K-Supermarket']){
            const c=d.chains[chain];
            console.log('AUDIT',chain,JSON.stringify({discovered:c?.discovered,selected:c?.selected,...c?.totals}));
            if(!c?.discovered || !c?.totals || c.totals.errors || (c.selected>0 && (c.totals.success===0 || c.totals.priced===0)) || (c.selected===0 && c.totals.checks!==0))
              throw Error(chain+': live batch has no valid prices or contains request errors');
          }
          if(d.errors.length)throw Error('Store discovery errors: '+JSON.stringify(d.errors));
          NODE
      - name: Upload detailed audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k-market-post-merge-batch-${{ matrix.batch }}
          path: k-market-supermarket-audit.json
          if-no-files-found: warn
