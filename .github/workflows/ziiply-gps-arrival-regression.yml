name: GPS arrival regression (test branch)
on:
  push:
    branches:
      - feature/arrival-state-diagnostics-20261101
      - integrate/gps-arrival-main-20261103
      - main
    paths:
      - '.github/workflows/ziiply-gps-arrival-regression.yml'
      - 'src/app/components/location/**'
      - 'src/app/components/ziiply/location/**'
      - 'src/app/components/ziiply/mobile/ZiiplyMobileLocationBar.tsx'
      - 'src/app/components/ziiply/mobile/gostaWatchLocation.ts'
      - 'src/app/components/ziiply/cards/ZiiplyMobileScannerCard.tsx'
      - 'src/app/components/ziiply/cards/scannerCore.ts'
      - 'src/app/components/ziiply/desktop/justiina/ZiiplyDesktopScannerCard.tsx'
      - 'src/app/components/ziiply/scannerCore.ts'
      - 'src/app/components/ziiply/offerSearch/ziiplyLocationResolverCore.ts'
      - 'src/app/api/store-search/**'
      - 'scripts/test-ziiply-arrival-sequence.cjs'
      - 'scripts/test-ziiply-arrival-scenarios.cjs'
      - 'scripts/test-gps-arrival-notice.mjs'
      - 'scripts/test-gps-arrival-integration.cjs'
  workflow_dispatch:
jobs:
  gps-arrival-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Drive-by, stationary, GPS dropout, departure and ambiguous store
        run: node scripts/test-ziiply-arrival-sequence.cjs
      - name: Full GPS arrival scenario regression
        run: node scripts/test-ziiply-arrival-scenarios.cjs
      - name: Arrival notice regression
        run: node --experimental-strip-types scripts/test-gps-arrival-notice.mjs
      - name: Scanner and arrival UI integration audit
        run: node scripts/test-gps-arrival-integration.cjs
      - name: TypeScript check
        run: npx tsc --noEmit
